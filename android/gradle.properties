org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# GitHub Actions上のreleaseビルドが「Caught exception: Already watching path:
# .../flutter_tools/gradle」の後、応答なしのまま無期限にハングする既知の
# Gradleバグ（gradle/gradle#27940、flutter/flutter#157254）を回避するため、
# Gradleのファイルシステム監視（VFS watch）を無効化する。
org.gradle.vfs.watch=false
# Hosted runner上でGradle/Kotlin/CMake/R8が同時にメモリを使い切るのを避ける。
# 高並列よりも安定性を優先し、release CIのrunner shutdown / swap停滞を抑える。
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
