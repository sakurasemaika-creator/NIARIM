name: miranima
description: Hand-drawn animation creation app for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  uuid: ^4.2.1
  google_mobile_ads: ^7.0.0
  in_app_purchase: ^3.1.13
  video_player: ^2.8.2
  audioplayers: ^5.2.1
  image: ^4.1.4
  file_picker: ^6.1.1
  share_plus: ^7.2.1
  permission_handler: ^11.1.0
  archive: ^3.4.9
  # ffmpeg_kit_flutter_min_gplは配布元(arthenica/ffmpeg-kit)が2025年に
  # アーカイブされ、Mavenリポジトリから成果物が失われビルド不能になったため、
  # 保守が続いているフォークへ移行した（ビルド時にネイティブライブラリを
  # 自動ダウンロードする方式で、失われたMaven依存を回避できる）。
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo/
