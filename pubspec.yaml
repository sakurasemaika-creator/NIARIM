name: miranima
description: Hand-drawn animation creation app for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  uuid: ^4.2.1
  google_mobile_ads: ^7.0.0
  in_app_purchase: ^3.1.13
  video_player: ^2.8.2
  audioplayers: ^5.2.1
  image: ^4.1.4
  # v6系はAndroidネイティブ側がFlutter v1埋め込み(PluginRegistry.Registrar)に
  # 依存しており、最新Flutterでビルド不能（v1埋め込みは削除済み）だったため
  # 更新が必要だった。11.0.0〜11.0.3はandroid/build.gradleがKotlin Android
  # Gradleプラグインを適用しておらず、GeneratedPluginRegistrantが
  # FilePickerPluginクラスを解決できずビルド不能（上流の既知バグ、
  # miguelpruivo/flutter_file_picker#1973）。10.3.10はv2埋め込み対応済みで
  # かつこの問題が無いことを確認済みのため、バージョンを固定する。
  file_picker: 10.3.10
  share_plus: ^7.2.1
  permission_handler: ^11.1.0
  archive: ^3.4.9
  # ffmpeg_kit_flutter_min_gplは配布元(arthenica/ffmpeg-kit)が2025年に
  # アーカイブされ、Mavenリポジトリから成果物が失われビルド不能になったため、
  # 保守が続いているフォークへ移行した（ビルド時にネイティブライブラリを
  # 自動ダウンロードする方式で、失われたMaven依存を回避できる）。
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo/
  fonts:
    # アプリ全体の基本フォント（仕様書24。白光明朝：lavsic氏作、SIL Open
    # Font License 1.1、Noto Serif派生）
    - family: HakkouMincho
      fonts:
        - asset: assets/fonts/HakkouMincho.ttf
    # チュートリアル・説明・演出テキスト用フォント（くらむぼん：フロップ
    # デザイン制作、SIL Open Font License 1.1、DelaGothic派生）
    - family: Kuramubon
      fonts:
        - asset: assets/fonts/Kuramubon.otf
    # 白光明朝のフォールバック用（源ノ明朝相当。GoogleがSource Han Serifを
    # ベースにビルドしたNoto Serif JP、SIL Open Font License 1.1）。
    # テキストツールの選択肢としても使用する。
    - family: NotoSerifJP
      fonts:
        - asset: assets/fonts/NotoSerifJP.ttf
    # 以下、テキストツール用にあらかじめ同梱するフリーフォント（いずれも
    # Google Fontsのofl/配下＝SIL Open Font License、日本語対応）。
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
    - family: MPLUSRounded1c
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Regular.ttf
    - family: MochiyPopOne
      fonts:
        - asset: assets/fonts/MochiyPopOne-Regular.ttf
    - family: YuseiMagic
      fonts:
        - asset: assets/fonts/YuseiMagic-Regular.ttf
    - family: HachiMaruPop
      fonts:
        - asset: assets/fonts/HachiMaruPop-Regular.ttf
    - family: ReggaeOne
      fonts:
        - asset: assets/fonts/ReggaeOne-Regular.ttf
