name: One-shot real selection audit

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/one-shot-selection-real-audit.yml'
      - 'scripts/one_shot_selection_real_audit.py'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Patch functional test
        run: python3 scripts/one_shot_selection_real_audit.py
      - name: Wait for transformed selection mask in real async time
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/functional_audit_batch20_test.dart')
          text = p.read_text(encoding='utf-8')
          marker = "    final move2Gesture = await tester.startGesture(\n"
          insert = "    // 画素コミット後、選択マスク追従は別のui.Image非同期処理で完了する。\n    // Widget fake-asyncだけではコールバックが進まないため実時間も進める。\n    await tester.runAsync(\n      () => Future<void>.delayed(const Duration(milliseconds: 150)),\n    );\n    await tester.pump();\n"
          if text.count(marker) != 1:
              raise SystemExit('selection mask wait marker failed')
          p.write_text(text.replace(marker, insert + marker), encoding='utf-8', newline='\n')
          PY
      - name: Format
        run: dart format test/functional_audit_batch20_test.dart
      - name: Dependencies
        run: flutter pub get
      - name: Real selection functional test
        run: |
          flutter test test/functional_audit_batch20_test.dart --reporter expanded
          flutter test test/functional_audit_batch19_test.dart --reporter expanded
          flutter test test/functional_audit_batch18_test.dart --reporter expanded
      - name: Analyze changed scope
        run: flutter analyze --no-fatal-infos --no-fatal-warnings test/functional_audit_batch20_test.dart
      - name: Commit verified test
        run: |
          git config user.name "NIARIM Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/functional_audit_batch20_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "test: verify real selection transform flow"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
