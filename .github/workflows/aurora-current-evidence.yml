name: Capture Current Aurora Evidence

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/aurora-current-evidence.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run current aurora grayscale visual audit
        run: flutter test test/aurora_hologram_visual_audit_test.dart --reporter expanded
      - name: Upload current aurora evidence
        uses: actions/upload-artifact@v4
        with:
          name: aurora-current-evidence
          path: build/visual-reaudit
          if-no-files-found: error
          retention-days: 7
