# Transactional integration suite on disposable DynamoDB Local only.
# Neither live AWS nor Google Play is contacted. No real coins are granted.
# Revalidate the current dev_branch 1-item, multiple-item, and yearly Premium exchange contracts.
name: Coin Redemption DynamoDB Local Integration
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/coin-redemption-dynamodb-local.yml'
      - 'backend/src/api/routes/coinRedemption.ts'
      - 'backend/src/api/routes/rewardState.ts'
      - 'backend/src/lib/individualCoinRedemption.ts'
      - 'backend/src/lib/coinRedemption.ts'
      - 'backend/src/lib/coinRedemptionCatalog.ts'
      - 'backend/src/lib/coinBenefitProposal.ts'
      - 'backend/test/coin-redemption-dynamodb-local.test.ts'
      - 'backend/test/admob-ssv-dynamodb-local.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-coin-exchange:
    if: github.ref == 'refs/heads/dev_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:2.6.1
        ports:
          - 8000:8000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Type-check backend and DynamoDB Local integration suite
        run: npm run build
      - name: Test atomic redemptions and ECDSA-signed 10-coin ad credits
        env:
          NIARIM_DYNAMODB_LOCAL_TESTS: '1'
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_ACCESS_KEY_ID: 'localonly'
          AWS_SECRET_ACCESS_KEY: 'localonly'
          AWS_DEFAULT_REGION: 'ap-northeast-1'
        run: |
          set -euo pipefail
          sleep 5
          npx vitest run test/coin-redemption-dynamodb-local.test.ts test/admob-ssv-dynamodb-local.test.ts --reporter verbose
