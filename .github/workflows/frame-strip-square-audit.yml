name: Frame Strip Square Audit

on:
  push:
    branches: [dev_branch]
    paths:
      - 'test/frame_strip_square_ratio_test.dart'
      - 'lib/screens/canvas/widgets/frame_strip_widget.dart'
      - '.github/workflows/frame-strip-square-audit.yml'
  workflow_dispatch:

jobs:
  verify-square-frame-strip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify frame strip 1:1 contract
        run: flutter test test/frame_strip_square_ratio_test.dart --reporter expanded
