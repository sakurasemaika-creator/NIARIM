name: One-shot Gap Deep Diagnostics

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/one-shot-gap-deep-diagnostics.yml'

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get

      - name: Batch33 blur and mosaic
        id: b33
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/gap-deep-logs
          set -o pipefail
          timeout 90s flutter test test/functional_audit_batch33_test.dart --reporter expanded 2>&1 | tee build/gap-deep-logs/batch33.log

      - name: Batch34 all tones
        id: b34
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 90s flutter test test/functional_audit_batch34_test.dart --reporter expanded 2>&1 | tee build/gap-deep-logs/batch34.log

      - name: Batch35 all stamps
        id: b35
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 90s flutter test test/functional_audit_batch35_test.dart --reporter expanded 2>&1 | tee build/gap-deep-logs/batch35.log

      - name: Batch36 all rulers
        id: b36
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 90s flutter test test/functional_audit_batch36_test.dart --reporter expanded 2>&1 | tee build/gap-deep-logs/batch36.log

      - name: Batch37 onion skin
        id: b37
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 90s flutter test test/functional_audit_batch37_test.dart --reporter expanded 2>&1 | tee build/gap-deep-logs/batch37.log

      - name: Batch38 whole-layer transform
        id: b38
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 90s flutter test test/functional_audit_batch38_test.dart --reporter expanded 2>&1 | tee build/gap-deep-logs/batch38.log

      - name: Save deep diagnostic logs and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gap-deep-diagnostics
          path: |
            build/gap-deep-logs/*.log
            build/functional-visual/*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Report outcomes
        if: always()
        run: |
          echo "batch33=${{ steps.b33.outcome }}"
          echo "batch34=${{ steps.b34.outcome }}"
          echo "batch35=${{ steps.b35.outcome }}"
          echo "batch36=${{ steps.b36.outcome }}"
          echo "batch37=${{ steps.b37.outcome }}"
          echo "batch38=${{ steps.b38.outcome }}"

      - name: Fail if any deep audit failed or timed out
        if: steps.b33.outcome != 'success' || steps.b34.outcome != 'success' || steps.b35.outcome != 'success' || steps.b36.outcome != 'success' || steps.b37.outcome != 'success' || steps.b38.outcome != 'success'
        run: exit 1
