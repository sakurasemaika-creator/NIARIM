name: TMP Custom Automation Foundation

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-custom-automation-foundation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply integration patches
        run: |
          python3 scripts/tmp_custom_automation_foundation.py
          python3 scripts/tmp_custom_automation_followup.py
          python3 scripts/tmp_custom_automation_context_patch.py
      - name: Generate localization
        run: flutter gen-l10n
      - name: Format
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Custom automation tests
        run: flutter test test/custom_automation_service_test.dart --reporter expanded
      - name: Smoke affected screens
        run: flutter test test/app_smoke_test.dart --reporter compact
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git diff --cached --quiet && exit 0
          git commit -m 'feat: カスタム自動操作の記録・管理基盤を追加'
          git reset --hard HEAD
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
