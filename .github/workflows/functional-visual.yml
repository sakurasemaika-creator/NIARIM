name: Functional Visual Audit

on:
  workflow_dispatch:
  push:
    branches:
      - dev_branch
    paths:
      - 'test/functional_audit_*.dart'
      - 'test/functional_render_real_async_test.dart'
      - 'lib/engine/**'
      - '.github/workflows/functional-visual.yml'

jobs:
  functional-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v6

      - name: Flutter セットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: 依存関係取得
        run: flutter pub get

      - name: 機能監査テスト
        run: |
          flutter test test/functional_render_real_async_test.dart --reporter expanded
          flutter test test/functional_audit_batch2_test.dart --reporter expanded
          flutter test test/functional_audit_batch3_test.dart --reporter expanded
          flutter test test/functional_audit_batch4_test.dart --reporter expanded
          flutter test test/functional_audit_batch5_test.dart --reporter expanded
          flutter test test/functional_audit_batch6_test.dart --reporter expanded
          flutter test test/functional_audit_batch7_test.dart --reporter expanded
          flutter test test/functional_audit_batch8_test.dart --reporter expanded
          flutter test test/functional_audit_batch9_test.dart --reporter expanded
          flutter test test/functional_audit_batch10_test.dart --reporter expanded
          flutter test test/functional_audit_batch11_test.dart --reporter expanded
          flutter test test/functional_audit_batch12_test.dart --reporter expanded
          flutter test test/functional_audit_batch13_test.dart --reporter expanded
          flutter test test/functional_audit_batch14_test.dart --reporter expanded
          flutter test test/functional_audit_batch15_test.dart --reporter expanded
          flutter test test/functional_audit_batch16_test.dart --reporter expanded

      - name: 機能別レンダリング画像を保存
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: functional-render-screenshots
          path: build/functional-visual/*.png
          if-no-files-found: warn
          retention-days: 3
