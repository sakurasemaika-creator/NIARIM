name: Functional Visual Audit

on:
  workflow_dispatch:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/functional-visual.yml'

jobs:
  functional-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v6

      - name: Flutter セットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: 依存関係取得
        run: flutter pub get

      # 実描画結果を数値判定しつつ、各機能のPNGも保存する。
      - name: 描画機能テスト
        run: flutter test test/functional_render_real_async_test.dart --reporter expanded

      - name: 機能別レンダリング画像を保存
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: functional-render-screenshots
          path: build/functional-visual/*.png
          if-no-files-found: warn
          retention-days: 3
