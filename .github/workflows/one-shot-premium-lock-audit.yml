name: One-shot Premium Lock Audit

on:
  push:
    branches:
      - dev_branch
    paths:
      - ".github/workflows/one-shot-premium-lock-audit.yml"

jobs:
  premium-lock-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Inventory Premium gates on dev_branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/premium-lock-audit
          {
            echo '# Premium gate inventory'
            echo
            echo '## Dart references'
            grep -RInE --include='*.dart' \
              'PremiumService|PremiumFeature|PremiumLockWidget|PremiumLockState|showPremiumBanner|isFeatureAvailable|isPremium' \
              lib test || true
            echo
            echo '## Automation manager call sites'
            grep -RIn -B 8 -A 8 '_showCustomAutomationManager' lib/screens || true
            echo
            echo '## Spec references'
            grep -RInE --include='*.md' \
              'Premium|プレミアム|有料|課金|南京錠|ロック' \
              docs || true
          } | tee build/premium-lock-audit/inventory.txt
      - name: Analyze Premium entry-point surface
        shell: bash
        run: |
          flutter analyze \
            lib/services/premium_service.dart \
            lib/widgets/premium_lock_widget.dart \
            lib/screens/settings/settings_screen.dart \
            lib/screens/canvas/widgets/filter_panel.dart \
            lib/screens/canvas/canvas_screen.dart \
            lib/screens/export/export_screen.dart \
            test/premium_lock_widget_test.dart \
            test/premium_all_entry_points_test.dart \
            test/premium_production_entry_wiring_test.dart \
            --no-fatal-warnings --no-fatal-infos \
            2>&1 | tee build/premium-lock-audit/analyze.txt
      - name: Prove every Premium production entry and shared lock behavior
        shell: bash
        env:
          STEP4_EVIDENCE_DIR: build/premium-lock-audit/png
        run: |
          flutter test \
            test/premium_lock_widget_test.dart \
            test/premium_all_entry_points_test.dart \
            test/premium_production_entry_wiring_test.dart \
            --reporter expanded \
            2>&1 | tee build/premium-lock-audit/test.txt
      - name: Prove pinch, aurora hologram, and generated-filter Redo regressions
        shell: bash
        run: |
          flutter test \
            test/canvas_pinch_gesture_test.dart \
            test/filter_engine_aurora_hologram_test.dart \
            test/generated_filter_redo_test.dart \
            --reporter expanded \
            2>&1 | tee build/premium-lock-audit/focused-regressions.txt
      - name: Upload inventory, PNG evidence, and proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-lock-audit
          path: build/premium-lock-audit
          if-no-files-found: error
          retention-days: 7
