name: Straight Hair Fold Geometry Green

on:
  push:
    branches:
      - dev_branch
    paths:
      - 'lib/engine/brush_stroke_geometry.dart'
      - 'test/engine/straight_hair-fold-geometry_test.dart'
      - '.github/workflows/straight-hair-fold-geometry-green.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/engine/straight_hair_fold_geometry_test.dart --reporter expanded
      - run: flutter analyze lib/engine/brush_stroke_geometry.dart test/engine/straight_hair_fold_geometry_test.dart
