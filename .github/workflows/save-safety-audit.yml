name: Save safety candidate audit

on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/save-safety-audit.yml'
      - 'docs/product-audit/pending/save-safety.patch'
      - 'docs/product-audit/pending/project_save_safety_test.dart'

permissions:
  contents: read

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Reproduce failures before the candidate
        shell: bash
        run: |
          mkdir -p artifacts/save-safety
          cp docs/product-audit/pending/project_save_safety_test.dart test/project_save_safety_test.dart
          set +e
          flutter test --no-pub test/project_save_safety_test.dart --machine > artifacts/save-safety/red.jsonl 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = []
          for line in Path('artifacts/save-safety/red.jsonl').read_text().splitlines():
              try:
                  events.append(json.loads(line))
              except json.JSONDecodeError:
                  pass
          names = {e['test']['id']: e['test']['name'] for e in events if e.get('type') == 'testStart' and not e['test']['name'].startswith('loading ')}
          finished = [e for e in events if e.get('type') == 'testDone' and e['testID'] in names]
          failures = [names[e['testID']] for e in finished if e['result'] != 'success']
          assert len(finished) == 12, f'Tests did not execute: {len(finished)}'
          assert len(failures) >= 10, f'Expected persistence regressions: {failures}'
          print(json.dumps({'executed': len(finished), 'failures': failures}, ensure_ascii=False, indent=2))
          PY
      - name: Apply and format the isolated candidate
        run: |
          git apply --check docs/product-audit/pending/save-safety.patch
          git apply docs/product-audit/pending/save-safety.patch
          dart format lib/engine/niapro_serializer.dart lib/engine/tile_manager.dart test/project_save_safety_test.dart
      - name: Analyze candidate files
        run: flutter analyze --no-pub lib/engine/niapro_serializer.dart lib/engine/tile_manager.dart test/project_save_safety_test.dart
      - name: Verify persistence and existing save regressions
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/project_save_safety_test.dart test/tile_manager_test.dart test/save_slot_overwrite_test.dart test/save_slot_confirmation_dialog_test.dart test/save_slot_action_buttons_test.dart test/save_tree_lazy_list_test.dart 2>&1 | tee artifacts/save-safety/green.log
      - name: Export only the verified candidate
        run: |
          git add --intent-to-add test/project_save_safety_test.dart
          git diff --binary -- lib/engine/niapro_serializer.dart lib/engine/tile_manager.dart test/project_save_safety_test.dart > artifacts/save-safety/verified.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-safety-candidate-${{ github.sha }}
          path: artifacts/save-safety/
          if-no-files-found: error

  full-gates:
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: save-safety-candidate-${{ github.sha }}
          path: artifacts/save-safety/
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Prepare verified candidate
        run: |
          git apply artifacts/save-safety/verified.patch
          flutter pub get --enforce-lockfile
      - name: Global format gate
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Full analyzer gate
        if: always()
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee artifacts/save-safety/analyze.log
      - name: Full Flutter test gate
        if: always()
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee artifacts/save-safety/full-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-safety-full-gates-${{ github.sha }}
          path: artifacts/save-safety/
          if-no-files-found: error
