name: Save safety regression audit

on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/save-safety-audit.yml"
      - "lib/engine/niapro_serializer.dart"
      - "lib/engine/tile_manager.dart"
      - "lib/services/project_service.dart"
      - "lib/services/autosave_service.dart"
      - "test/project_save_safety_test.dart"
      - "test/tile_manager_test.dart"
      - "test/save_slot_*test.dart"
      - "test/save_tree_*test.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "docs/product-audit/pending/auto-lineart-repairs.patch"
      - "lib/screens/canvas/widgets/filter_panel.dart"
      - "lib/screens/canvas/widgets/auto_lineart_control_overlay.dart"
      - "test/auto_lineart_*test.dart"
      - "test/helpers/pump_real_async.dart"

permissions:
  contents: read

jobs:
  auto-lineart-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Apply pending audit candidate when present
        shell: bash
        run: |
          if [ -f docs/product-audit/pending/auto-lineart-repairs.patch ]; then
            git apply --check docs/product-audit/pending/auto-lineart-repairs.patch
            git apply docs/product-audit/pending/auto-lineart-repairs.patch
          fi
          mkdir -p artifacts/auto-lineart
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze auto line art files
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub lib/screens/canvas/widgets/filter_panel.dart lib/screens/canvas/widgets/auto_lineart_control_overlay.dart test/auto_lineart_canvas_e2e_test.dart test/auto_lineart_bulk_isolation_test.dart test/auto_lineart_panel_state_test.dart test/helpers/pump_real_async.dart 2>&1 | tee artifacts/auto-lineart/analyze.log
      - name: Verify real rendering, apply, Undo/Redo and bulk isolation
        if: always()
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/auto_lineart_canvas_e2e_test.dart test/auto_lineart_bulk_isolation_test.dart test/auto_lineart_panel_state_test.dart 2>&1 | tee artifacts/auto-lineart/test.log
      - name: Export canonical candidate formatting
        if: always()
        run: |
          dart format lib/screens/canvas/widgets/filter_panel.dart lib/screens/canvas/widgets/auto_lineart_control_overlay.dart test/auto_lineart_canvas_e2e_test.dart test/auto_lineart_bulk_isolation_test.dart test/auto_lineart_panel_state_test.dart test/helpers/pump_real_async.dart
          git add -N test/helpers/pump_real_async.dart
          git diff --binary -- lib/screens/canvas/widgets/filter_panel.dart lib/screens/canvas/widgets/auto_lineart_control_overlay.dart test/auto_lineart_canvas_e2e_test.dart test/auto_lineart_bulk_isolation_test.dart test/auto_lineart_panel_state_test.dart test/helpers/pump_real_async.dart > artifacts/auto-lineart/canonical.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-lineart-regressions-${{ github.sha }}
          path: artifacts/auto-lineart/
          if-no-files-found: error

  save-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check save file formatting
        run: dart format --output=none --set-exit-if-changed lib/engine/niapro_serializer.dart lib/engine/tile_manager.dart test/project_save_safety_test.dart
      - name: Analyze save files
        run: flutter analyze --no-pub lib/engine/niapro_serializer.dart lib/engine/tile_manager.dart test/project_save_safety_test.dart
      - name: Verify persistence and existing save regressions
        shell: bash
        run: |
          mkdir -p artifacts/save-safety
          set -o pipefail
          flutter test --no-pub --reporter expanded test/project_save_safety_test.dart test/tile_manager_test.dart test/save_slot_overwrite_test.dart test/save_slot_confirmation_dialog_test.dart test/save_slot_action_buttons_test.dart test/save_tree_lazy_list_test.dart 2>&1 | tee artifacts/save-safety/green.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-safety-regressions-${{ github.sha }}
          path: artifacts/save-safety/
          if-no-files-found: error

  full-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Apply pending audit candidate when present
        shell: bash
        run: |
          if [ -f docs/product-audit/pending/auto-lineart-repairs.patch ]; then
            git apply --check docs/product-audit/pending/auto-lineart-repairs.patch
            git apply docs/product-audit/pending/auto-lineart-repairs.patch
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Restore locked dependencies
        run: |
          mkdir -p artifacts/save-safety
          flutter pub get --enforce-lockfile
      - name: Global format gate
        shell: bash
        run: |
          set -o pipefail
          dart format --output=none --set-exit-if-changed lib test tool 2>&1 | tee artifacts/save-safety/format.log
      - name: Full analyzer gate
        if: always()
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee artifacts/save-safety/analyze.log
      - name: Full Flutter test gate
        if: always()
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee artifacts/save-safety/full-test.log
      - name: Export global canonical formatting for diagnosis
        if: always()
        run: |
          dart format lib test tool
          git add -N test/helpers/pump_real_async.dart
          git diff --binary -- lib test tool > artifacts/save-safety/canonical.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-safety-full-gates-${{ github.sha }}
          path: artifacts/save-safety/
          if-no-files-found: error

  checkpoint-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format checkpoint documents with the repository formatter
        run: |
          mkdir -p artifacts/save-safety-format
          npx --yes prettier@3.8.1 --write .github/workflows/save-safety-audit.yml docs/work-continuation.md docs/product-audit/README.md 'docs/AI設計書/12_実装チェックリスト.md'
          git diff --binary > artifacts/save-safety-format/format.patch
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-safety-format-${{ github.sha }}
          path: artifacts/save-safety-format/
          if-no-files-found: error
