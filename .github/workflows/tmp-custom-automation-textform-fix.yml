name: TMP Timeline Cut UI Runner

on:
  push:
    branches: [dev_branch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Verify RED regression before implementation
        run: |
          if grep -q "void _startClipSplitCut" lib/screens/timeline/timeline_screen.dart; then
            echo 'Timeline cut semantics already present; skipping RED prerequisite.'
          else
            set +e
            flutter test test/timeline_cut_ui_regression_test.dart --reporter expanded
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo 'Expected timeline cut UI regression to be RED before implementation.'
              exit 1
            fi
          fi
      - name: Integrate cut semantics into latest timeline screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/timeline/timeline_screen.dart')
          s = p.read_text()
          if 'void _startClipSplitCut' in s:
              print('Timeline cut semantics already integrated')
              raise SystemExit(0)
          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              s = s.replace(old, new, 1)
          replace_once("import '../../services/watermark_service.dart';\n", "import '../../services/watermark_service.dart';\nimport '../../utils/timeline_clip_split.dart';\n", 'cut utility import')
          state_anchor = "  ({String sourceSceneId, List<_TrackClip> clips, bool isCut})? _clipClipboard;\n"
          replace_once(state_anchor, state_anchor + "\n  _TrackClip? _clipCutTarget;\n  int? _clipSplitCursorFrame;\n  int? _clipRangeCutStartFrame;\n  int? _clipRangeCutEndFrameExclusive;\n", 'cut state')
          method_anchor = "  // ─── クリップの複数選択・コピー・切り取り・貼り付け ─────────\n"
          methods = r'''  void _startClipSplitCut(_TrackClip clip) {
    final initial = clampSplitCutCursorFrame(candidateFrame: _currentFrame, clipStartFrame: clip.startFrame, lengthFrames: clip.lengthFrames);
    setState(() {
      _clipCutTarget = clip;
      _clipSplitCursorFrame = initial;
      _clipRangeCutStartFrame = null;
      _clipRangeCutEndFrameExclusive = null;
    });
  }

  void _startClipRangeCut(_TrackClip clip) {
    if (clip.lengthFrames < 2) return;
    final start = (clip.startFrame + 1).clamp(clip.startFrame, clip.startFrame + clip.lengthFrames - 1);
    final end = (start + 1).clamp(start + 1, clip.startFrame + clip.lengthFrames);
    setState(() {
      _clipCutTarget = clip;
      _clipSplitCursorFrame = null;
      _clipRangeCutStartFrame = start;
      _clipRangeCutEndFrameExclusive = end;
    });
  }

  Future<void> _previewClipCutBoundary(_TrackClip clip, double boundaryFrame) async {
    final localFrame = cutPreviewFrame(boundaryFrame: boundaryFrame - clip.startFrame + clip.useStart, totalFrames: (clip.useEnd - clip.useStart + 1).clamp(1, 1 << 30));
    final project = context.read<ProjectService>().projects.where((p) => p.id == widget.projectId).firstOrNull;
    final fps = project?.fps ?? 24;
    final position = Duration(milliseconds: (localFrame * 1000 / fps).round());
    if (clip.trackType == _ClipTrackType.audio) {
      final player = _audioPlayers[clip.id];
      if (player == null) return;
      await player.seek(position);
      await player.resume();
    } else if (clip.trackType == _ClipTrackType.video) {
      final controller = _videoControllers[clip.id];
      if (controller == null || !controller.value.isInitialized) return;
      await controller.seekTo(position);
      await controller.play();
    }
  }

  Future<void> _confirmClipSplitCut() async {
    final clip = _clipCutTarget;
    final cursor = _clipSplitCursorFrame;
    final sceneId = _selectedSceneId;
    if (clip == null || cursor == null || sceneId == null) return;
    final split = splitTimelineClip(clipStartFrame: clip.startFrame, lengthFrames: clip.lengthFrames, splitFrame: cursor, sourceStartFrame: clip.useStart);
    if (split == null) return;
    final originalEnd = clip.useEnd;
    clip.lengthFrames = split.leftLengthFrames;
    clip.useEnd = split.leftSourceEndFrame;
    _persistClipUpdate(clip, sceneId);
    final right = _TrackClip(id: clip.id, label: clip.label, startFrame: split.rightStartFrame, lengthFrames: split.rightLengthFrames, color: clip.color, trackType: clip.trackType, filePath: clip.filePath, materialId: clip.materialId, volume: clip.volume, fadeIn: clip.fadeIn, fadeOut: clip.fadeOut, useStart: split.rightSourceStartFrame, useEnd: originalEnd, videoOpacity: clip.videoOpacity, trackRow: clip.trackRow);
    await _duplicateClipAt(right, split.rightStartFrame);
    if (!mounted) return;
    setState(() { _clipCutTarget = null; _clipSplitCursorFrame = null; });
  }

  Future<void> _confirmClipRangeCut() async {
    final clip = _clipCutTarget;
    final start = _clipRangeCutStartFrame;
    final end = _clipRangeCutEndFrameExclusive;
    final sceneId = _selectedSceneId;
    if (clip == null || start == null || end == null || sceneId == null) return;
    final cut = cutTimelineClipRange(clipStartFrame: clip.startFrame, lengthFrames: clip.lengthFrames, cutStartFrame: start, cutEndFrameExclusive: end, sourceStartFrame: clip.useStart);
    if (cut == null) return;
    final original = _snapshotClip(clip);
    setState(() { _audioClips.remove(clip); _videoClips.remove(clip); _imageClips.remove(clip); });
    _deletePersistedClip(clip, sceneId);
    if (cut.leftLengthFrames > 0) {
      final left = _TrackClip(id: original.id, label: original.label, startFrame: cut.leftStartFrame, lengthFrames: cut.leftLengthFrames, color: original.color, trackType: original.trackType, filePath: original.filePath, materialId: original.materialId, volume: original.volume, fadeIn: original.fadeIn, fadeOut: original.fadeOut, useStart: cut.leftSourceStartFrame, useEnd: cut.leftSourceEndFrame, videoOpacity: original.videoOpacity, trackRow: original.trackRow);
      await _duplicateClipAt(left, cut.leftStartFrame);
    }
    if (cut.rightLengthFrames > 0) {
      final right = _TrackClip(id: original.id, label: original.label, startFrame: cut.rightStartFrame, lengthFrames: cut.rightLengthFrames, color: original.color, trackType: original.trackType, filePath: original.filePath, materialId: original.materialId, volume: original.volume, fadeIn: original.fadeIn, fadeOut: original.fadeOut, useStart: cut.rightSourceStartFrame, useEnd: cut.rightSourceEndFrame, videoOpacity: original.videoOpacity, trackRow: original.trackRow);
      await _duplicateClipAt(right, cut.rightStartFrame);
    }
    if (!mounted) return;
    setState(() { _clipCutTarget = null; _clipRangeCutStartFrame = null; _clipRangeCutEndFrameExclusive = null; });
  }

'''
          replace_once(method_anchor, methods + method_anchor, 'cut methods')
          p.write_text(s)
          PY
          dart format lib/screens/timeline/timeline_screen.dart
      - name: Verify GREEN regressions
        run: |
          flutter test test/timeline_cut_ui_regression_test.dart --reporter expanded
          flutter test test/timeline_clip_split_test.dart --reporter expanded
          flutter test test/audio_source_offset_serializer_regression_test.dart --reporter expanded
      - name: Analyze affected production files
        run: flutter analyze --no-fatal-infos lib/screens/timeline/timeline_screen.dart lib/utils/timeline_clip_split.dart lib/models/audio_clip.dart lib/engine/niapro_serializer.dart
      - name: Persist verified production integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/timeline/timeline_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: integrate timeline split and range cut semantics'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
