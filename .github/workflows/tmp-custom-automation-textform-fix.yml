name: TMP Timeline Cut UI Runner

on:
  push:
    branches: [dev_branch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Verify RED regression before integration
        run: |
          set +e
          flutter test test/timeline_cut_ui_regression_test.dart --reporter expanded
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected RED before timeline cut integration.'
            exit 1
          fi
      - name: Integrate timeline cut semantics
        run: |
          python3 tool/tmp_integrate_timeline_cut.py
          dart format lib/screens/timeline/timeline_screen.dart
      - name: Verify GREEN regressions
        run: |
          flutter test test/timeline_cut_ui_regression_test.dart --reporter expanded
          flutter test test/timeline_clip_split_test.dart --reporter expanded
          flutter test test/audio_source_offset_serializer_regression_test.dart --reporter expanded
      - name: Analyze affected files
        run: flutter analyze --no-fatal-infos lib/screens/timeline/timeline_screen.dart lib/utils/timeline_clip_split.dart lib/models/audio_clip.dart lib/engine/niapro_serializer.dart
      - name: Persist verified integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/timeline/timeline_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integrate timeline split and range cut semantics'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
