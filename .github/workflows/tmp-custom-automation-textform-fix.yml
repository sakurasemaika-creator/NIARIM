name: TMP Custom Automation TextForm Fix

on:
  push:
    branches: [dev_branch]

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Apply exact TextFormField fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/widgets/custom_automation_manager_sheet.dart')
          s = p.read_text()
          old = 'child: TextField(\n                                  initialValue:'
          new = 'child: TextFormField(\n                                  initialValue:'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 frame TextField matches, found {count}')
          p.write_text(s.replace(old, new))
          PY
          dart format lib/widgets/custom_automation_manager_sheet.dart
      - name: Analyze focused file
        run: flutter analyze --no-fatal-warnings lib/widgets/custom_automation_manager_sheet.dart
      - name: Run lifecycle regression
        run: flutter test test/custom_automation_manager_dialog_lifecycle_test.dart --reporter expanded
      - name: Run automation presets regression
        run: flutter test test/custom_automation_presets_test.dart --reporter expanded
      - name: Persist verified fix
        run: |
          if git diff --quiet; then
            echo 'No changes to persist'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/custom_automation_manager_sheet.dart
          git commit -m 'fix: use form fields for automation frame range'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
