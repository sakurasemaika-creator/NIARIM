name: TMP Timeline Cut UI Runner

on:
  push:
    branches: [dev_branch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Confirm timeline regression fixture exists
        run: test -f test/timeline_cut_ui_regression_test.dart
