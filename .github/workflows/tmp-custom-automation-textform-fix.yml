name: TMP Timeline Cut UI Runner

on:
  push:
    branches: [dev_branch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Verify RED regression before implementation
        run: |
          if grep -q "void _startClipSplitCut" lib/screens/timeline/timeline_screen.dart; then
            echo 'Timeline cut semantics already present; skipping RED prerequisite.'
          else
            set +e
            flutter test test/timeline_cut_ui_regression_test.dart --reporter expanded
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo 'Expected timeline cut UI regression to be RED before implementation.'
              exit 1
            fi
          fi
      - name: Integrate cut semantics using prepared workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/tmp-timeline-cut-ui-integration.yml').read_text()
          start = source.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = source.index("\n          PY\n", start)
          code = source[start:end]
          if 'void _startClipSplitCut' in Path('lib/screens/timeline/timeline_screen.dart').read_text():
              print('Timeline cut semantics already integrated')
          else:
              exec(compile(code, 'timeline-cut-integration', 'exec'), {'__name__': '__main__'})
          PY
          dart format lib/screens/timeline/timeline_screen.dart
      - name: Verify GREEN regressions
        run: |
          flutter test test/timeline_cut_ui_regression_test.dart --reporter expanded
          flutter test test/timeline_clip_split_test.dart --reporter expanded
          flutter test test/audio_source_offset_serializer_regression_test.dart --reporter expanded
      - name: Analyze affected production files
        run: flutter analyze --no-fatal-infos lib/screens/timeline/timeline_screen.dart lib/utils/timeline_clip_split.dart lib/models/audio_clip.dart lib/engine/niapro_serializer.dart
      - name: Persist verified production integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/timeline/timeline_screen.dart
          if git diff --cached --quiet; then
            echo 'No production changes to persist'
            exit 0
          fi
          git commit -m 'feat: integrate timeline split and range cut semantics'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
