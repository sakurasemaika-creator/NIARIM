name: TMP Timeline Cut UI Runner

on:
  push:
    branches: [dev_branch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Verify timeline cut regression is RED
        run: |
          set +e
          flutter test test/timeline_cut_ui_regression_test.dart --reporter expanded
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected timeline cut UI regression to fail before production integration.'
            exit 1
          fi
          echo 'RED regression confirmed.'
