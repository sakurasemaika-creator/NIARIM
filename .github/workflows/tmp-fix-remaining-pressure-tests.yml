name: TMP Fix Remaining Pressure Tests

on:
  push:
    branches:
      - feature/brush-pressure-profiles

permissions:
  contents: write

jobs:
  fix-tests:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brush-pressure-profiles
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tool/tmp_fix_remaining_pressure_tests.py
      - name: Format targeted tests
        run: |
          dart format \
            test/final_remaining_strict_evidence_test.dart \
            test/functional_audit_batch10_test.dart \
            test/functional_audit_batch9_test.dart \
            test/functional_audit_batch12_test.dart \
            test/functional_render_real_async_test.dart \
            test/strict_visual_evidence_audit_test.dart \
            test/creative_asset_persistence_test.dart \
            test/niatra_asset_bundle_test.dart \
            test/builtin_presets_test.dart
      - name: Analyze test tree
        run: flutter analyze --no-fatal-infos test
      - name: Run affected behavior tests
        run: |
          flutter test \
            test/models/brush_pressure_profiles_test.dart \
            test/models/brush_pressure_resolver_test.dart \
            test/services/brush_pressure_profile_lifecycle_test.dart \
            test/final_remaining_strict_evidence_test.dart \
            test/functional_audit_batch10_test.dart \
            test/functional_audit_batch9_test.dart \
            test/functional_audit_batch12_test.dart \
            test/functional_render_real_async_test.dart \
            test/strict_visual_evidence_audit_test.dart \
            test/creative_asset_persistence_test.dart \
            test/niatra_asset_bundle_test.dart \
            test/builtin_presets_test.dart \
            --reporter expanded
      - name: Commit migrated tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test
          git diff --cached --check
          git commit -m "test: align remaining brush tests with pressure profiles"
          git push origin HEAD:feature/brush-pressure-profiles
