name: Pixel Art Mosaic Regression

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/pixel-art-mosaic-regression.yml'
      - 'lib/engine/pixel_art_engine.dart'
      - 'lib/engine/filter_engine.dart'
      - 'lib/engine/procedural_texture.dart'
      - 'lib/screens/canvas/widgets/canvas_area.dart'
      - 'lib/models/pixel_color_mode.dart'
      - 'lib/models/filter_def.dart'
      - 'test/engine/pixel_art_engine_test.dart'
      - 'test/engine/filter_engine_pixel_art_contract_test.dart'
      - 'test/engine/brush_pixel_art_route_test.dart'
      - 'test/engine/filter_pixel_art_route_test.dart'
      - 'test/engine/pixel_art_filter_engine_test.dart'
      - 'test/engine/stamp_pixel_art_route_test.dart'
      - 'test/engine/mosaic_draw_filter_dispatch_test.dart'
      - 'test/engine/mosaic_filter_test.dart'
      - 'test/models/mosaic_filter_def_contract_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixel-art-mosaic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run Pixel Art and Mosaic contracts
        run: |
          flutter test test/engine/pixel_art_engine_test.dart --reporter expanded
          flutter test test/engine/filter_engine_pixel_art_contract_test.dart --reporter expanded
          flutter test test/engine/brush_pixel_art_route_test.dart --reporter expanded
          flutter test test/engine/filter_pixel_art_route_test.dart --reporter expanded
          flutter test test/engine/pixel_art_filter_engine_test.dart --reporter expanded
          flutter test test/engine/stamp_pixel_art_route_test.dart --reporter expanded
          flutter test test/engine/mosaic_draw_filter_dispatch_test.dart --reporter expanded
          flutter test test/engine/mosaic_filter_test.dart --reporter expanded
          flutter test test/models/mosaic_filter_def_contract_test.dart --reporter expanded
      - name: Analyze Pixel Art and Mosaic paths
        run: |
          flutter analyze --no-fatal-infos lib/engine/pixel_art_engine.dart lib/engine/filter_engine.dart lib/engine/procedural_texture.dart lib/screens/canvas/widgets/canvas_area.dart lib/models/pixel_color_mode.dart lib/models/filter_def.dart
