name: Automation Chain Repair

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/automation-chain-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Make generated filter layer the next automation target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/canvas/canvas_screen.dart')
          s = p.read_text()
          old = '''        await RecordedFilterApplyService.apply(
          projectService: context.read<ProjectService>(),
          projectId: widget.projectId,
          sceneId: _currentSceneId,
          layerId: layerId,
          frameIndex: targetFrame,
          filterSnapshot: Map<String, Object?>.from(rawSnapshot),
        );'''
          new = '''        final generatedLayerId = await RecordedFilterApplyService.apply(
          projectService: context.read<ProjectService>(),
          projectId: widget.projectId,
          sceneId: _currentSceneId,
          layerId: layerId,
          frameIndex: targetFrame,
          filterSnapshot: Map<String, Object?>.from(rawSnapshot),
        );
        // Generated-layer filters (auto line art / ink pool / outline) form a
        // natural chain in an automation. Continue subsequent recorded steps on
        // the generated result instead of silently applying them to the old source.
        if (generatedLayerId != null && mounted) {
          setState(() => _currentLayerId = generatedLayerId);
        }'''
          if old not in s:
              raise SystemExit('expected canvas.filter automation block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          dart format lib/screens/canvas/canvas_screen.dart
      - name: Verify automation recording regressions
        run: |
          flutter test test/custom_automation_service_test.dart --reporter expanded
          flutter test test/custom_automation_discrete_step_test.dart --reporter expanded
      - name: Verify existing Canvas filter replay compiles
        run: flutter test test/auto_lineart_canvas_e2e_test.dart --reporter expanded
      - name: Commit landed repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/canvas/canvas_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: chain generated layers in canvas automation'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
