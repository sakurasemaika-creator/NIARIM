# One-shot verification of root-persistent advertising placement.
name: NIARIM persistent banner verification (one shot)
on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/niarim-persistent-ad-check-once.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Analyze app root and ad wrappers
        run: |
          flutter analyze --no-pub --no-fatal-infos \
            lib/app.dart \
            lib/widgets/ad_banner_mock_widget.dart \
            lib/widgets/ad_live_slot_widget.dart \
            lib/widgets/progress_dialog.dart \
            test/ad_mock_layout_test.dart
      - name: Verify ad layout and global-root regression tests
        run: flutter test --no-pub test/ad_mock_layout_test.dart
