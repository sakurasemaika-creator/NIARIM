name: Temp Save/Post Validation

on:
  push:
    branches: [dev_branch]
    paths:
      - 'lib/screens/community/community_post_screen.dart'
      - 'lib/screens/save_tree/save_management_screen.dart'
      - 'test/community_pending_deleted_recovery_contract_test.dart'
      - 'test/save_slot_action_buttons_test.dart'
      - '.github/workflows/temp-save-post-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze changed paths
        run: >-
          flutter analyze
          lib/screens/community/community_post_screen.dart
          lib/screens/save_tree/save_management_screen.dart
          test/community_pending_deleted_recovery_contract_test.dart
          test/save_slot_action_buttons_test.dart
          --no-fatal-infos
      - name: Test deleted pending recovery contract
        run: flutter test test/community_pending_deleted_recovery_contract_test.dart --reporter expanded
      - name: Test save slot actions
        run: flutter test test/save_slot_action_buttons_test.dart --reporter expanded
