name: One-shot Custom Automation Completion
# Retrigger with anchor-stable test-host overlay presentation around production widgets.

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-custom-automation-completion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Make production proof completion-driven and route-independent
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('test/custom_automation_production_visual_test.dart')
          s = p.read_text()

          replacements = [
            (
              "      await harness.waitForProductionAsync();\n      expect(find.byType(FilterPanel), findsOneWidget);",
              "      expect(find.byType(FilterPanel), findsOneWidget);",
            ),
            (
              "      await tester.tap(find.text(l10n.filterApplyButton));\n      await harness.waitForProductionAsync();\n      final afterApply = harness.activeLayerPixels();",
              "      await tester.tap(find.text(l10n.filterApplyButton));\n      await harness.waitForPixelChange(\n        beforeApply,\n        label: 'recorded filter apply',\n      );\n      final afterApply = harness.activeLayerPixels();",
            ),
            (
              "      await tester.tap(find.text(l10n.customAutomationYes));\n      await harness.waitForProductionAsync();\n      final afterReplay = harness.activeLayerPixels();",
              "      await tester.tap(find.text(l10n.customAutomationYes));\n      await harness.waitForPixelChange(\n        beforeReplay,\n        label: 'saved automation replay',\n      );\n      final afterReplay = harness.activeLayerPixels();",
            ),
            (
              "        await tester.tap(find.text(harness.l10n.customAutomationYes));\n        await harness.waitForProductionAsync(extraMilliseconds: 2200);\n\n        if (!createsLayer) {",
              "        await tester.tap(find.text(harness.l10n.customAutomationYes));\n        await harness.waitForAutomationResult(\n          beforePixels: beforePixels,\n          beforeLayers: beforeLayers,\n          createsLayer: createsLayer,\n          label: name,\n        );\n\n        if (!createsLayer) {",
            ),
            (
              "    final providers = await tester.runAsync(buildAppProviders);\n    ProjectService? ps;\n    StateSetter? hostSetter;\n    String? activeProjectId;\n    final rootKey = GlobalKey();",
              "    final providers = await tester.runAsync(buildAppProviders);\n    ProjectService? ps;\n    StateSetter? hostSetter;\n    String? activeProjectId;\n    Widget? testOverlay;\n    final rootKey = GlobalKey();",
            ),
            (
              "                  if (activeProjectId == null) return const SizedBox.expand();\n                  return CanvasScreen(\n                    key: ValueKey(activeProjectId),\n                    projectId: activeProjectId!,\n                  );",
              "                  if (activeProjectId == null) return const SizedBox.expand();\n                  return Stack(\n                    fit: StackFit.expand,\n                    children: [\n                      CanvasScreen(\n                        key: ValueKey(activeProjectId),\n                        projectId: activeProjectId!,\n                      ),\n                      if (testOverlay != null) testOverlay!,\n                    ],\n                  );",
            ),
            (
              "    harness._setProject = (id) {\n      activeProjectId = id;\n      harness._projectId = id;\n      hostSetter!(() {});\n    };\n    return harness;",
              "    harness._setProject = (id) {\n      activeProjectId = id;\n      harness._projectId = id;\n      hostSetter!(() {});\n    };\n    harness._setOverlay = (child) {\n      testOverlay = child;\n      hostSetter!(() {});\n    };\n    return harness;",
            ),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit('custom automation proof anchor changed:\n' + old)
            s = s.replace(old, new, 1)

          presentation_start = s.find('  void showManager() {')
          if presentation_start < 0:
            raise SystemExit('showManager start changed')
          presentation_end = s.find('\n}\n\nint _changedBytes(', presentation_start)
          if presentation_end < 0:
            raise SystemExit('production harness end changed')

          presentation = '\n'.join([
            '  late void Function(Widget? child) _setOverlay;',
            '',
            '  void _hideOverlay() => _setOverlay(null);',
            '',
            '  Widget _localNavigator(Widget page) => Navigator(',
            '    onGenerateRoute: (_) => PageRouteBuilder<void>(',
            '      pageBuilder: (_, __, ___) => page,',
            '      transitionDuration: Duration.zero,',
            '      reverseTransitionDuration: Duration.zero,',
            '    ),',
            '  );',
            '',
            '  Widget _sheetPage(Widget child) => Material(',
            '    color: Colors.black26,',
            '    child: Align(',
            '      alignment: Alignment.bottomCenter,',
            '      child: Material(child: child),',
            '    ),',
            '  );',
            '',
            '  void showManager() {',
            '    final startFrame = canvasWidget.currentFrame;',
            '    final count = projectService.frameCount(projectId, canvasWidget.sceneId);',
            '    _setOverlay(',
            '      _localNavigator(',
            '        _sheetPage(',
            '          CustomAutomationManagerSheet(',
            '            surface: CustomAutomationSurface.canvas,',
            '            recordingStartFrame: startFrame,',
            '            frameCount: count,',
            '            onRecordingStarted: _hideOverlay,',
            '            onExecute: (automation, scope, targetFrames) async {',
            '              _hideOverlay();',
            '              await _execute(automation, scope, targetFrames);',
            '            },',
            '          ),',
            '        ),',
            '      ),',
            '    );',
            '  }',
            '',
            '  void showFilterPanel() {',
            '    final canvas = canvasWidget;',
            '    _setOverlay(',
            '      _localNavigator(',
            '        _sheetPage(',
            '          Center(',
            '            child: FilterPanel(',
            '              projectId: projectId,',
            '              sceneId: canvas.sceneId,',
            '              layerId: canvas.currentLayerId,',
            '              frameIndex: canvas.currentFrame,',
            '              onClose: _hideOverlay,',
            '            ),',
            '          ),',
            '        ),',
            '      ),',
            '    );',
            '  }',
            '',
            '  void showRecordingStop() {',
            '    final service = automationService;',
            '    _setOverlay(',
            '      _localNavigator(',
            '        Material(',
            '          color: Colors.transparent,',
            '          child: Stack(',
            '            children: [',
            '              CustomAutomationRecordingStopButton(',
            '                onStop: () {',
            '                  service.stopRecording();',
            '                  _hideOverlay();',
            '                },',
            '              ),',
            '            ],',
            '          ),',
            '        ),',
            '      ),',
            '    );',
            '  }',
            '',
            '  void showDraftEditor() {',
            '    _setOverlay(',
            '      _localNavigator(',
            '        _sheetPage(',
            '          CustomAutomationDraftEditorSheet(',
            '            surface: CustomAutomationSurface.canvas,',
            '            onResumeRecording: _hideOverlay,',
            '            onSaved: _hideOverlay,',
            '          ),',
            '        ),',
            '      ),',
            '    );',
            '  }',
          ])
          s = s[:presentation_start] + presentation + s[presentation_end:]

          helper_start = s.find('  Future<void> waitForProductionAsync(')
          if helper_start < 0:
            raise SystemExit('fixed-sleep helper start changed')
          helper_end = s.find('\n\n  Future<void> _execute(', helper_start)
          if helper_end < 0:
            raise SystemExit('fixed-sleep helper end changed')

          helper = '\n'.join([
            '  Future<void> _yieldAsyncWork() async {',
            '    await tester.runAsync(() => Future<void>(() {}));',
            '    await tester.pump();',
            '  }',
            '',
            '  Future<void> waitForPixelChange(',
            '    Uint8List before, {',
            '    required String label,',
            '  }) async {',
            '    for (var attempt = 0; attempt < 600; attempt++) {',
            '      if (_changedBytes(before, activeLayerPixels()) > 100) return;',
            '      await _yieldAsyncWork();',
            '    }',
            "    throw TestFailure('$label did not change Canvas pixels');",
            '  }',
            '',
            '  Future<void> waitForAutomationResult({',
            '    required Uint8List beforePixels,',
            '    required Set<String> beforeLayers,',
            '    required bool createsLayer,',
            '    required String label,',
            '  }) async {',
            '    for (var attempt = 0; attempt < 600; attempt++) {',
            '      if (createsLayer) {',
            '        final canvas = canvasWidget;',
            '        final current = projectService',
            '            .layersOf(',
            '              projectId,',
            '              canvas.sceneId,',
            '              canvas.currentFrame,',
            '            )',
            '            .where((layer) => layer.type == model.LayerType.normal)',
            '            .map((layer) => layer.id)',
            '            .toSet();',
            '        if (current.difference(beforeLayers).isNotEmpty) return;',
            '      } else if (_changedBytes(beforePixels, activeLayerPixels()) > 100) {',
            '        return;',
            '      }',
            '      await _yieldAsyncWork();',
            '    }',
            "    throw TestFailure('$label did not reach its observable completion state');",
            '  }',
          ])
          s = s[:helper_start] + helper + s[helper_end:]
          p.write_text(s)
          PY
      - name: Format proof
        run: dart format test/custom_automation_production_visual_test.dart test/custom_automation_production_surface_visual_test.dart
      - name: Assert no fixed wall-clock sleep remains
        run: |
          if grep -nE 'Future<.*>\.delayed|sleep\(' test/custom_automation_production_visual_test.dart test/custom_automation_production_surface_visual_test.dart; then
            echo 'Fixed wall-clock sleep remains in Custom Automation proof' >&2
            exit 1
          fi
      - name: Analyze Custom Automation production proofs
        run: flutter analyze test/custom_automation_production_visual_test.dart test/custom_automation_production_surface_visual_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Run full record edit save replay PNG proof
        run: flutter test test/custom_automation_production_surface_visual_test.dart --plain-name 'record start canvas change stop edit save replay changes PNG pixels' --reporter expanded
      - name: Run production widget Custom Automation proof
        run: flutter test test/custom_automation_production_visual_test.dart --plain-name 'real Canvas widgets record -> apply -> stop -> edit -> save -> replay with PNG evidence' --reporter expanded
      - name: Upload Custom Automation PNG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-step2-png-evidence
          path: build/visual-reaudit/custom-automation-production
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified proof and clean one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-custom-automation-completion.yml
          git add test/custom_automation_production_visual_test.dart test/custom_automation_production_surface_visual_test.dart
          git commit -m 'test: await custom automation completion without fixed sleeps'
          git push origin HEAD:dev_branch
