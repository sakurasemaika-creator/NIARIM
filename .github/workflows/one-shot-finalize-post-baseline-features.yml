name: One-shot Finalize Post-baseline Features

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/scripts/finalize_post_baseline_features.py'
      - '.github/workflows/one-shot-finalize-post-baseline-features.yml'

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Scope ambiguous text-dialog patch anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/finalize_post_baseline_features.py')
          s = p.read_text()
          old = '''    if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {text.count(old)}\\n--- OLD ---\\n{old[:500]}")
              p.write_text(text.replace(old, new, 1))
          '''
          new = '''    count = text.count(old)
              if count != 1:
                  ambiguous_text_anchor = "    final l10n = AppLocalizations.of(context)!;\\n    showDialog(\\n"
                  if path == 'lib/screens/canvas/canvas_screen.dart' and old == ambiguous_text_anchor:
                      marker = "  void _showTextInputDialog(\\n"
                      start = text.find(marker)
                      if start < 0:
                          raise SystemExit(f"{path}: text dialog marker not found")
                      head, tail = text[:start], text[start:]
                      if tail.count(old) != 1:
                          raise SystemExit(f"{path}: text dialog scoped anchor count={tail.count(old)}")
                      p.write_text(head + tail.replace(old, new, 1))
                      return
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\\n--- OLD ---\\n{old[:500]}")
              p.write_text(text.replace(old, new, 1))
          '''
          if old not in s:
              raise SystemExit('replace_once helper anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply remaining feature fixes
        run: python3 .github/scripts/finalize_post_baseline_features.py
      - name: Regenerate localization
        run: flutter gen-l10n
      - name: Format changed Dart files
        run: dart format lib/models/layer.dart lib/engine/niapro_serializer.dart lib/screens/timeline/timeline_screen.dart lib/screens/canvas/canvas_screen.dart test/post_baseline_remaining_contract_test.dart
      - name: Analyze production code
        run: flutter analyze lib
      - name: Remaining feature contract tests
        run: flutter test test/post_baseline_remaining_contract_test.dart --reporter expanded
      - name: Existing strict regressions
        run: |
          flutter test test/final_remaining_strict_evidence_test.dart --reporter expanded
          flutter test test/time_change_strict_evidence_test.dart --reporter expanded
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit'
          else
            git commit -m 'fix: finalize video volume and text eyedropper'
            git push origin HEAD:dev_branch
          fi
