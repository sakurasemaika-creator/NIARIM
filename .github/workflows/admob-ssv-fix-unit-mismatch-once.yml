# One-shot surgical patch: replace the exact old AdMob SSV compatibility
# guard in the existing deployed Lambda bundle. No infrastructure changes,
# no reward-grant enablement, and no loss of other deployed API functionality.
name: NIARIM AdMob SSV mismatch fix (one-shot)
on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/admob-ssv-fix-unit-mismatch-once.yml"

permissions: {}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test signed verification and no-credit regression
        run: |
          node --check backend/scripts/admob-ssv-verify-shim.cjs
          node --test backend/scripts/admob-ssv-verify-shim.test.cjs
          node --test backend/scripts/admob-ssv-diagnostic-shim.test.cjs
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: niarim-admob-ssv-unit-fix
          aws-region: ap-northeast-1
      - name: Patch only the verified deployed SSV shim with rollback
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "368601349794"
          test "${AWS_REGION:-}" = "ap-northeast-1"
          meta="$RUNNER_TEMP/lambda.json"
          old="$RUNNER_TEMP/lambda-old.zip"
          new="$RUNNER_TEMP/lambda-new.zip"
          folder="$RUNNER_TEMP/niarim-current"
          aws lambda get-function --function-name niarim-api > "$meta"
          expected="RUKmlEl9tU+lRPvD/pMIkXrTboPB5p3+ibuFRGnco40="
          test "$(jq -r '.Configuration.CodeSha256' "$meta")" = "$expected"
          test "$(jq -r '.Configuration.State' "$meta")" = "Active"
          test "$(jq -r '.Configuration.Environment.Variables.ADMOB_REWARDED_AD_UNIT_ID' "$meta")" = "ca-app-pub-4380578821900659/6321761453"
          test "$(jq -r '.Configuration.Environment.Variables.REWARDED_AD_SSV_ENABLED' "$meta")" = "false"
          test "$(jq -r '.Configuration.Environment.Variables.REWARDED_AD_REVIEW_APPROVED' "$meta")" = "false"
          revision="$(jq -r '.Configuration.RevisionId' "$meta")"
          curl --fail --location --silent --show-error --max-time 30 \
            --output "$old" "$(jq -r '.Code.Location' "$meta")"
          python3 - "$old" "$expected" <<'PY'
          import hashlib,base64,sys
          sha=base64.b64encode(hashlib.sha256(open(sys.argv[1],'rb').read()).digest()).decode()
          if sha!=sys.argv[2]: raise SystemExit('Original Lambda ZIP checksum mismatch')
          PY
          mkdir -p "$folder"
          unzip -q "$old" -d "$folder"
          test -f "$folder/index.js"
          python3 - "$folder/index.js" backend/scripts/admob-ssv-verify-shim.cjs <<'PY'
          import sys,pathlib
          current=pathlib.Path(sys.argv[1])
          src=current.read_bytes()
          old=b"""    const configuredUnit = process.env.ADMOB_REWARDED_AD_UNIT_ID || '';
              const unit = configuredUnit.split('/')[1];
              if (!/^\\d{10}$/.test(unit || '') || single('ad_unit') !== unit ||
                  single('reward_amount') !== '10' || single('reward_item') !== 'coins' ||
                  !single('transaction_id')) return false;"""
          # Match exact source indentation as deployed, not YAML indentation.
          old=old.replace(b"              ",b"    ").replace(b"                  ",b"        ")
          patched=pathlib.Path(sys.argv[2]).read_text(encoding="utf8")
          start=patched.index("    // AdMob's \"Verify URL\" tool")
          end=patched.index("    const stamp = single('timestamp');",start)
          new=patched[start:end].encode("utf8")
          if src.count(old)!=1:
              raise SystemExit("Expected original shim once, found "+str(src.count(old))+"; refusing update")
          if src.count(new)!=0:
              raise SystemExit("Already patched or unexpected deployed bundle")
          current.write_bytes(src.replace(old,new,1))
          PY
          node --check "$folder/index.js"
          ( cd "$folder" && zip -qr "$new" . )
          patched=false
          rollback() {
            if [ "$patched" = true ]; then
              echo "::warning::Smoke test failed; restoring previous Lambda code"
              aws lambda update-function-code --function-name niarim-api \
                --zip-file "fileb://$old" > /dev/null || true
              aws lambda wait function-updated --function-name niarim-api || true
            fi
          }
          trap rollback ERR
          aws lambda update-function-code --function-name niarim-api \
            --revision-id "$revision" --zip-file "fileb://$new" > /dev/null
          patched=true
          aws lambda wait function-updated --function-name niarim-api
          http="$(curl --silent --show-error --max-time 25 \
            --output "$RUNNER_TEMP/smoke.json" --write-out '%{http_code}' \
            "https://ibjfhyoqvfanle62ltokgz6sry0fjqfh.lambda-url.ap-northeast-1.on.aws/works/latest")"
          test "$http" = "200"
          echo 'SUCCESS: only signed, no-user-data AdMob test acknowledgments changed; no coin grants.'
          trap - ERR
