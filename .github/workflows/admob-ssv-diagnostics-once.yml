# One-shot code-only diagnostic patch to existing NIARIM Lambda.
# Leaves CloudFormation resources, env vars, reward grants and all other routes untouched.
name: NIARIM AdMob SSV diagnostics (one-shot)
on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/admob-ssv-diagnostics-once.yml"
permissions: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test diagnostics have no reward side effects or sensitive logging
        run: |
          node --check backend/scripts/admob-ssv-diagnostic-shim.cjs
          node --test backend/scripts/admob-ssv-diagnostic-shim.test.cjs
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: niarim-admob-ssv-diagnostics
          aws-region: ap-northeast-1
      - name: Safely append diagnostic to existing Lambda ZIP
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "368601349794"
          test "${AWS_REGION:-}" = "ap-northeast-1"
          meta="$RUNNER_TEMP/niarim-lambda.json"
          old="$RUNNER_TEMP/niarim-original.zip"
          new="$RUNNER_TEMP/niarim-new.zip"
          folder="$RUNNER_TEMP/niarim-code"
          aws lambda get-function --function-name niarim-api > "$meta"
          expected="qFs1ohl79SHBksTGc0btUUJJ/GkxCfHZv1WX+u58hLY="
          test "$(jq -r '.Configuration.CodeSha256' "$meta")" = "$expected"
          test "$(jq -r '.Configuration.State' "$meta")" = "Active"
          test "$(jq -r '.Configuration.Environment.Variables.REWARDED_AD_SSV_ENABLED' "$meta")" = "false"
          test "$(jq -r '.Configuration.Environment.Variables.REWARDED_AD_REVIEW_APPROVED' "$meta")" = "false"
          test "$(jq -r '.Configuration.Environment.Variables.ADMOB_REWARDED_AD_UNIT_ID' "$meta")" = "ca-app-pub-4380578821900659/6321761453"
          revision="$(jq -r '.Configuration.RevisionId' "$meta")"
          curl --silent --show-error --fail --location --max-time 30 \
            --output "$old" "$(jq -r '.Code.Location' "$meta")"
          python3 - "$old" "$expected" <<'PY'
          import hashlib,base64,sys
          found=base64.b64encode(hashlib.sha256(open(sys.argv[1],'rb').read()).digest()).decode()
          if found!=sys.argv[2]: raise SystemExit('Lambda package checksum differs')
          PY
          mkdir -p "$folder"
          unzip -q "$old" -d "$folder"
          test -f "$folder/index.js"
          printf '\n' >> "$folder/index.js"
          cat backend/scripts/admob-ssv-diagnostic-shim.cjs >> "$folder/index.js"
          node --check "$folder/index.js"
          (cd "$folder" && zip -qr "$new" .)
          deployed=false
          rollback() {
            if [ "$deployed" = true ]; then
              echo "::warning::Diagnostic patch smoke test failed: restore previous code"
              aws lambda update-function-code --function-name niarim-api \
                --zip-file "fileb://$old" > /dev/null || true
              aws lambda wait function-updated --function-name niarim-api || true
            fi
          }
          trap rollback ERR
          aws lambda update-function-code --function-name niarim-api \
            --revision-id "$revision" --zip-file "fileb://$new" > /dev/null
          deployed=true
          aws lambda wait function-updated --function-name niarim-api
          status="$(curl --silent --show-error --max-time 25 \
            --output "$RUNNER_TEMP/public-api.json" --write-out '%{http_code}' \
            "https://ibjfhyoqvfanle62ltokgz6sry0fjqfh.lambda-url.ap-northeast-1.on.aws/works/latest")"
          test "$status" = "200"
          echo "Diagnostics deployed without changing the existing public API."
          trap - ERR
