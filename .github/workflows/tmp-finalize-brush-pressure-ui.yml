name: TMP Finalize Brush Pressure UI

on:
  push:
    branches:
      - feature/brush-pressure-profiles

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brush-pressure-profiles
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply approved final UI spec
        run: python tool/tmp_finalize_brush_pressure_ui.py
      - run: dart format lib/screens/canvas/widgets/brush_panel.dart
      - name: Verify brush settings UI
        run: flutter analyze --no-fatal-infos lib/screens/canvas/widgets/brush_panel.dart lib/models/brush.dart lib/services/settings_service.dart
      - name: Commit production UI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/canvas/widgets/brush_panel.dart
          git diff --cached --check
          git commit -m "feat: finalize brush pressure settings sections"
          git push origin HEAD:feature/brush-pressure-profiles
