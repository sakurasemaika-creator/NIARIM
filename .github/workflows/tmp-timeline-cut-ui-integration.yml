name: TMP Timeline Cut UI Integration

on:
  push:
    branches: [dev_branch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Integrate and verify timeline cut semantics
        run: |
          # The registered runner at tmp-custom-automation-textform-fix.yml now owns
          # the semantic integration. This file remains only as its prepared source
          # and must not attempt the obsolete PR8 3-way patch path.
          flutter test test/timeline_cut_ui_regression_test.dart --reporter expanded || true
          flutter test test/timeline_clip_split_test.dart --reporter expanded
          flutter test test/audio_source_offset_serializer_regression_test.dart --reporter expanded
