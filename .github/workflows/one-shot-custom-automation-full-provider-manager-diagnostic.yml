name: One-shot Custom Automation Full Provider Manager Diagnostic

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-custom-automation-full-provider-manager-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate full-provider isolated manager test
        run: |
          cat > test/custom_automation_full_provider_manager_diagnostic_test.dart <<'DART'
          import 'dart:io';

          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:niarim/app_bootstrap.dart';
          import 'package:niarim/l10n/app_localizations.dart';
          import 'package:niarim/models/custom_automation.dart';
          import 'package:niarim/services/theme_service.dart';
          import 'package:niarim/widgets/custom_automation_manager_sheet.dart';
          import 'package:provider/provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import 'helpers/first_use_tooltips.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();
            const pathProviderChannel = MethodChannel('plugins.flutter.io/path_provider');
            final docs = Directory('${Directory.systemTemp.path}/niarim_manager_full_provider_diag');

            setUp(() {
              docs.createSync(recursive: true);
              SharedPreferences.setMockInitialValues({
                firstUseTooltipsSeenKey: kAllFirstUseTooltipKeys,
              });
              TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                  .setMockMethodCallHandler(pathProviderChannel, (_) async => docs.path);
            });

            tearDown(() {
              TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                  .setMockMethodCallHandler(pathProviderChannel, null);
            });

            testWidgets('full app providers manager first pump completes', (tester) async {
              final providers = await tester.runAsync(buildAppProviders);
              print('DIAG providers ready');
              await tester.pumpWidget(
                MultiProvider(
                  providers: providers!,
                  child: Builder(
                    builder: (context) => MaterialApp(
                      theme: context.watch<ThemeService>().themeData,
                      locale: const Locale('ja'),
                      localizationsDelegates: AppLocalizations.localizationsDelegates,
                      supportedLocales: AppLocalizations.supportedLocales,
                      home: Scaffold(
                        body: CustomAutomationManagerSheet(
                          surface: CustomAutomationSurface.canvas,
                          recordingStartFrame: 0,
                          frameCount: 1,
                          onRecordingStarted: () {},
                          onExecute: (_, __, ___) async {},
                        ),
                      ),
                    ),
                  ),
                ),
              );
              print('DIAG pumpWidget done');
              await tester.pump();
              print('DIAG first pump done');
              expect(find.byType(CustomAutomationManagerSheet), findsOneWidget);
            }, timeout: const Timeout(Duration(seconds: 45)));
          }
          DART
          dart format test/custom_automation_full_provider_manager_diagnostic_test.dart
      - name: Run full-provider isolated manager diagnostic
        run: flutter test test/custom_automation_full_provider_manager_diagnostic_test.dart --reporter expanded
      - name: Clean diagnostic workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-custom-automation-full-provider-manager-diagnostic.yml
          git commit -m 'ci: clean full-provider automation manager diagnostic'
          git push origin HEAD:dev_branch
