name: Auto Lineart Controls Green

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/auto-lineart-controls-green.yml'
      - 'lib/engine/auto_lineart_engine.dart'
      - 'lib/screens/canvas/widgets/auto_lineart_control_overlay.dart'
      - 'lib/screens/canvas/widgets/filter_panel.dart'
      - 'test/auto_lineart_control_overlay_test.dart'
  workflow_dispatch:

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Verify control editing on current production HEAD
        run: |
          flutter test test/auto_lineart_control_overlay_test.dart --reporter expanded
          flutter analyze lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/auto_lineart_control_overlay.dart lib/screens/canvas/widgets/filter_panel.dart test/auto_lineart_control_overlay_test.dart --no-fatal-infos --no-fatal-warnings
