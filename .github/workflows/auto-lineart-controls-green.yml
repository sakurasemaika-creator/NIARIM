name: Auto Lineart Controls Green

on:
  push:
    branches:
      - dev_branch
    paths:
      - .github/workflows/auto-lineart-controls-green.yml
      - lib/engine/auto_lineart_engine.dart
      - lib/screens/canvas/widgets/auto_lineart_control_overlay.dart
      - lib/screens/canvas/widgets/filter_panel.dart
      - test/auto_lineart_control_overlay_test.dart
      - test/auto_lineart_engine_test.dart
  workflow_dispatch:

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: dev_branch
      - name: Remove stale control coupling call
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/canvas/widgets/filter_panel.dart')
          text = path.read_text()
          text = text.replace('                                                    moveCoincident: false,\n', '')
          path.write_text(text)
          PY
          if grep -R -n "moveCoincident" lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/auto_lineart_control_overlay.dart lib/screens/canvas/widgets/filter_panel.dart; then
            echo "Legacy coincident control coupling remains" >&2
            exit 1
          fi
          if ! git diff --quiet -- lib/screens/canvas/widgets/filter_panel.dart; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add lib/screens/canvas/widgets/filter_panel.dart
            git commit -m "fix: remove stale auto lineart control coupling call"
            git push origin HEAD:dev_branch
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Verify controls and engine
        run: |
          flutter test test/auto_lineart_control_overlay_test.dart --reporter expanded
          flutter test test/auto_lineart_engine_test.dart --reporter expanded
          flutter analyze lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/auto_lineart_control_overlay.dart lib/screens/canvas/widgets/filter_panel.dart test/auto_lineart_control_overlay_test.dart test/auto_lineart_engine_test.dart --no-fatal-infos --no-fatal-warnings
      - name: Reject legacy preservation markers
        run: |
          if grep -R -n -E "Multi-scale topology sampling|Preserve short paths when both ends|persistence >= 0.67|coincident junction controls together" lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/auto_lineart_control_overlay.dart lib/screens/canvas/widgets/filter_panel.dart; then
            echo "Legacy auto-lineart preservation logic remains" >&2
            exit 1
          fi
      - name: Inventory entry-exit taper references
        if: always()
        run: |
          grep -R -n -E "fadeMode|fadeCustom|FadeCustomSettings|distancePx" lib test --exclude-dir=.dart_tool || true
