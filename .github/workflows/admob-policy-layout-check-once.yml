# One-shot guarded verification of policy-screen exclusions and
# simultaneous upper-banner / debug-only processing popup layouts.
name: NIARIM AdMob policy layout verification (one shot)
on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/admob-policy-layout-check-once.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Analyze policy, app root and dialog
        run: |
          flutter analyze --no-pub --no-fatal-infos \
            lib/app.dart \
            lib/router.dart \
            lib/services/ad_modal_visibility_observer.dart \
            lib/services/ad_placement_policy.dart \
            lib/widgets/ad_banner_mock_widget.dart \
            lib/widgets/progress_dialog.dart \
            lib/widgets/ad_live_slot_widget.dart \
            test/ad_mock_layout_test.dart
      - name: Verify simultaneous ad slots, policy route gates and existing layout
        run: flutter test --no-pub test/ad_mock_layout_test.dart
