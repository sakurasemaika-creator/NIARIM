name: TMP Custom Automation Manager Verify
on:
  push:
    branches: [dev_branch]
    paths:
      - 'lib/widgets/custom_automation_manager_sheet.dart'
      - 'test/custom_automation_manager_dialog_lifecycle_test.dart'
      - '.github/workflows/tmp-custom-automation-manager-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/custom_automation_manager_dialog_lifecycle_test.dart --reporter expanded
