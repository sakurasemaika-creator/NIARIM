name: Selection Regression

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/selection-regression.yml'
      - 'lib/engine/lasso_line_snap_engine.dart'
      - 'lib/screens/canvas/canvas_screen.dart'
      - 'lib/screens/canvas/widgets/canvas_area.dart'
      - 'lib/l10n/**'
      - 'test/lasso_line_snap_engine_test.dart'
      - 'test/selection_tool_bar_test.dart'
      - 'test/selection_tool_walkthrough_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Selection regressions
        run: |
          flutter test test/lasso_line_snap_engine_test.dart --reporter expanded
          flutter test test/selection_tool_bar_test.dart --reporter expanded
          flutter test test/selection_tool_walkthrough_test.dart --reporter expanded
      - name: Analyze selection paths
        run: flutter analyze --no-fatal-infos lib/engine/lasso_line_snap_engine.dart lib/screens/canvas/canvas_screen.dart lib/screens/canvas/widgets/canvas_area.dart test/lasso_line_snap_engine_test.dart
