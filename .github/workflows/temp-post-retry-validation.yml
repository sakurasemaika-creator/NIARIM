name: Temp Post Retry Validation

on:
  push:
    branches: [dev_branch]
    paths:
      - 'backend/src/api/routes/worksCreate.ts'
      - 'backend/test/real-post-flow-contract.test.ts'
      - 'lib/services/api/niarim_api_client.dart'
      - 'lib/services/api/community_api.dart'
      - 'test/services/api/community_api_retry_test.dart'
      - '.github/workflows/temp-post-retry-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze retry path
        run: >-
          flutter analyze
          lib/services/api/niarim_api_client.dart
          lib/services/api/community_api.dart
          test/services/api/community_api_retry_test.dart
          --no-fatal-infos
      - name: Test retry path
        run: flutter test test/services/api/community_api_retry_test.dart --reporter expanded
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Test posting contract
        working-directory: backend
        run: npx vitest run test/real-post-flow-contract.test.ts
