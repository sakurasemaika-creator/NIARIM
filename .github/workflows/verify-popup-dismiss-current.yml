name: Verify Popup Close And Outside Dismiss

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/verify-popup-dismiss-current.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Focused popup contract
        run: flutter test test/panel_close_affordance_test.dart --reporter expanded
      - name: Analyze changed popup surface
        run: flutter analyze lib/screens/canvas/widgets/panel_close_bar.dart test/panel_close_affordance_test.dart
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/screens/canvas/widgets/panel_close_bar.dart test/panel_close_affordance_test.dart
      - name: Remove one-shot workflow after green verification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-popup-dismiss-current.yml
          git commit -m "ci: remove popup verification workflow"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
