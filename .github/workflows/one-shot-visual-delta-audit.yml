name: One-shot Visual Delta Audit

on:
  push:
    branches:
      - dev_branch
    paths:
      - ".github/workflows/one-shot-visual-delta-audit.yml"

jobs:
  visual-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Run new screenshot-first visual audits
        shell: bash
        run: |
          set +e
          failures=0
          for t in \
            test/visual_reaudit_filters_test.dart \
            test/visual_reaudit_export_camera_test.dart \
            test/visual_reaudit_initial_composite_test.dart \
            test/canvas_panel_screenshot_audit_test.dart
          do
            ok=0
            for attempt in 1 2; do
              echo "===== $t attempt $attempt ====="
              timeout 600s flutter test "$t" --reporter expanded
              rc=$?
              if [ $rc -eq 0 ]; then ok=1; break; fi
              sleep 10
            done
            if [ $ok -ne 1 ]; then failures=$((failures+1)); fi
          done
          exit $failures
      - name: Upload visual delta screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-delta-screenshots
          path: |
            build/functional-visual
            build/visual-reaudit
          if-no-files-found: warn
          retention-days: 7
