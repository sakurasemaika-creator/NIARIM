name: TMP Brush Pressure Current Spec

on:
  push:
    branches:
      - feature/brush-pressure-profiles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brush-pressure-profiles
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply current pressure spec
        run: python tool/tmp_brush_pressure_current_spec.py
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Format changed Dart files
        run: dart format lib/models/brush.dart lib/services/brush_service.dart lib/services/settings_service.dart lib/screens/canvas/widgets/brush_panel.dart test/models/brush_pressure_profiles_test.dart test/models/brush_pressure_resolver_test.dart test/services/brush_pressure_profile_lifecycle_test.dart
      - name: Analyze current pressure implementation
        run: flutter analyze --no-fatal-infos lib/models/brush.dart lib/models/brush_pressure_resolver.dart lib/services/brush_service.dart lib/services/settings_service.dart lib/screens/canvas/widgets/brush_panel.dart lib/engine/drawing_engine.dart lib/screens/canvas/widgets/canvas_area.dart
      - name: Run focused pressure tests
        run: flutter test test/models/brush_pressure_profiles_test.dart test/models/brush_pressure_resolver_test.dart test/services/brush_pressure_profile_lifecycle_test.dart test/services/pen_pressure_enabled_setting_test.dart --reporter expanded
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: replace legacy pressure controls with profiles"
          git push origin HEAD:feature/brush-pressure-profiles
