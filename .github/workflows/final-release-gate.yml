name: Final HEAD Release Gate

on:
  push:
    branches: [dev_branch]
    paths:
      - 'audit-dashboard/current-task.json'

concurrency:
  group: final-head-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Install dependencies
        run: flutter pub get
      - name: Verify audit closure metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('audit-dashboard/feature-audit-manifest.json').read_text(encoding='utf-8'))
          task=json.loads(Path('audit-dashboard/current-task.json').read_text(encoding='utf-8'))
          incomplete=[f['id'] for f in manifest['features'] if not f.get('final_pass', False)]
          assert not incomplete, f'incomplete audit entries: {incomplete}'
          assert task.get('status') == 'completed', task
          print(f"AUDIT_FEATURES={len(manifest['features'])}")
          print('FINAL_FALSE=0')
          print('CURRENT_TASK=completed')
          PY
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Full Flutter suite
        run: flutter test --reporter expanded
      - name: Build final release APK
        run: flutter build apk --release
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: niarim-final-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
