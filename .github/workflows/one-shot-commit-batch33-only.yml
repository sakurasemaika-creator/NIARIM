name: One-shot Commit Batch33 Only

on:
  push:
    branches:
      - dev_branch
    paths:
      - ".github/workflows/one-shot-commit-batch33-only.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix_functional_audits_33_37.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - run: dart format test/functional_audit_batch33_test.dart
      - run: flutter test test/functional_audit_batch33_test.dart --reporter expanded
      - name: Commit batch33 correction
        run: |
          git config user.name sakurasemaika-creator
          git config user.email sakurasemaika@gmail.com
          git add test/functional_audit_batch33_test.dart
          git commit -m "test: run blur mosaic PNG capture on real async" || true
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
