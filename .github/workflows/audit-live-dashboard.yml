name: Audit Live Dashboard

on:
  # dev_branch のどの変更でもHEAD/作業状態を追従する。
  # ダッシュボード自身はIssue本文だけを書き換えるためpushループにはならない。
  push:
    branches: [dev_branch]
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Audit Continuous Queue'
      - 'One-shot Strict Visual Evidence Audit'
      - 'One-shot Screenshot-first Visual Reaudit'
      - 'One-shot Resume Real Operation Audit'
      - 'One-shot Canvas Panel Screenshot Audit'
      - 'One-shot Current Coverage Census'
      - 'One-shot Known Scope Reaudit'
      - 'One-shot Current HEAD Unique Reaudit'
      - 'One-shot Filter Canvas Eyedropper'
      - 'One-shot Add Ink Pool Filter'
      - 'One-shot Refine Ink Pool Audit'
      - 'Visual Smoke Test'
      - 'Build APK'
      - 'Implement Background Acclimation V2'
      - 'One-shot Background Acclimation V2'
      - 'Final HEAD Release Gate'
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: audit-live-dashboard-dev
  cancel-in-progress: true

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'dev_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      # GitHubのActions一覧APIはcompletedイベント直後だけ旧statusを返すことがある。
      # 数秒待ってから再取得し、完了済みRunを「実行中」に残さない。
      - name: Allow completed state to settle
        if: github.event_name == 'workflow_run' && github.event.action == 'completed'
        run: sleep 8
      - name: Update dashboard once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: "3"
          BRANCH: dev_branch
        run: python3 audit-dashboard/update_dashboard.py

  automation-chain-repair:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'ci: run automation chain repair')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Patch generated filter chaining
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/canvas/canvas_screen.dart')
          s = p.read_text()
          old = '''        await RecordedFilterApplyService.apply(
          projectService: context.read<ProjectService>(),
          projectId: widget.projectId,
          sceneId: _currentSceneId,
          layerId: layerId,
          frameIndex: targetFrame,
          filterSnapshot: Map<String, Object?>.from(rawSnapshot),
        );'''
          new = '''        final generatedLayerId = await RecordedFilterApplyService.apply(
          projectService: context.read<ProjectService>(),
          projectId: widget.projectId,
          sceneId: _currentSceneId,
          layerId: layerId,
          frameIndex: targetFrame,
          filterSnapshot: Map<String, Object?>.from(rawSnapshot),
        );
        // Generated-layer filters form a natural chain in an automation. Continue
        // subsequent recorded steps on the generated result instead of the source.
        if (generatedLayerId != null && mounted) {
          setState(() => _currentLayerId = generatedLayerId);
        }'''
          if old not in s:
              raise SystemExit('expected canvas.filter automation block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          dart format lib/screens/canvas/canvas_screen.dart
      - name: Verify automation regressions
        run: |
          flutter test test/custom_automation_service_test.dart --reporter expanded
          flutter test test/custom_automation_discrete_step_test.dart --reporter expanded
          flutter test test/auto_lineart_canvas_e2e_test.dart --reporter expanded
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/canvas/canvas_screen.dart
          git commit -m 'fix: chain generated layers in canvas automation'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
