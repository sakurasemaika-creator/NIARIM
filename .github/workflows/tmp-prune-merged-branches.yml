name: Temporary Prune Merged Branches

on:
  push:
    branches: [dev_branch]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - name: Delete merged temporary branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            feature/pixel-filter-blend-refresh \
            temp-noop \
            tmp-merge-anchor \
            tmp-merge-anchor-2 \
            tmp-merge-anchor-3 \
            tmp-merge-anchor-4 \
            tmp-merge-anchor-5 \
            tmp-merge-anchor-6; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
      - name: Remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-prune-merged-branches.yml
          git commit -m "ci: remove temporary branch-prune workflow"
          git push origin HEAD:dev_branch
