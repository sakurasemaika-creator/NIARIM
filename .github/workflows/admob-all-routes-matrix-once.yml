# One-shot full-app widget-rendered captures with visible *mock* ad slots.
# Does NOT connect to actual AdMob or publish/install Android APK.
name: NIARIM AdMob all-routes 10-viewport capture (one shot)
on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/admob-all-routes-matrix-once.yml"
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Analyze screenshot-only app capture changes
        run: |
          flutter analyze --no-fatal-infos \
            lib/app.dart \
            lib/widgets/ad_banner_mock_widget.dart \
            test/admob_all_routes_visual_matrix_test.dart
      - name: Capture 10-viewport real Flutter UI matrix (mock ad regions only)
        shell: bash
        run: |
          mkdir -p build/admob-screen-matrix
          set +e
          timeout 1450s flutter test \
            test/admob_all_routes_visual_matrix_test.dart \
            --dart-define=NIARIM_AD_AUDIT_PREVIEW=true \
            --reporter expanded > build/admob-screen-matrix/test-output.txt 2>&1
          rc=$?
          tail -100 build/admob-screen-matrix/test-output.txt
          echo "$rc" > build/admob-screen-matrix/test-exit.txt
          exit 0
      - name: Log source revision and capture context
        if: always()
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "environment=Flutter widget test; mock advertising rectangles"
            echo "not_emulator=true"
            echo "not_live_admob=true"
          } > build/admob-screen-matrix/metadata.txt
          find build/admob-screen-matrix -name '*.png' | sort > build/admob-screen-matrix/screenshot-list.txt
      - name: Upload matrix screenshots for independent visual inspection
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: niarim-admob-route-viewport-screenshots
          path: build/admob-screen-matrix
          retention-days: 14
          if-no-files-found: error
      - name: Fail if Flutter audit recorded errors
        if: always()
        shell: bash
        run: |
          rc=$(cat build/admob-screen-matrix/test-exit.txt 2>/dev/null || echo 1)
          exit "$rc"
