name: TMP Feature Translation Verification

on:
  push:
    branches:
      - feature/pressure-hardness-custom-automation
    paths:
      - '.github/workflows/tmp-feature-translation-verification.yml'
      - 'tool/tmp_fill_pressure_automation_translations.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/pressure-hardness-custom-automation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fill localized messages
        run: python3 tool/tmp_fill_pressure_automation_translations.py
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Translation tone audit
        id: tone
        shell: bash
        run: |
          set +e
          python3 tools/audit_translation_tone.py > tool/tmp_translation_audit_output.txt 2>&1
          code=$?
          cat tool/tmp_translation_audit_output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit diagnostic
        if: steps.tone.outputs.exit_code != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tool/tmp_translation_audit_output.txt
          git commit -m 'chore: capture translation audit diagnostic'
          git push origin HEAD:feature/pressure-hardness-custom-automation
      - name: Fail on translation audit
        if: steps.tone.outputs.exit_code != '0'
        run: exit 1
      - name: Static analysis
        run: flutter analyze --no-fatal-infos lib/models/pressure_hardness.dart lib/screens/canvas/widgets/brush_panel.dart lib/widgets/custom_automation_manager_sheet.dart test/pressure_hardness_test.dart
      - name: Targeted tests
        run: flutter test test/pressure_hardness_test.dart test/custom_automation_service_test.dart --reporter expanded
      - name: Commit verified translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/l10n
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: localize pressure and automation management labels'
          git push origin HEAD:feature/pressure-hardness-custom-automation
