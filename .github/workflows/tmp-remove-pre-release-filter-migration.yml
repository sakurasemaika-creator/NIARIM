name: TMP Remove Pre-release Filter Migration
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-remove-pre-release-filter-migration.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove unnecessary Filter0025 migration
        env:
          OLD_BLOCK: ICAgICAgICAgIGlmIChmaWx0ZXIuaWQgPT0gJ0ZpbHRlcjAwMjUnICYmICFqc29uLmNvbnRhaW5zS2V5KCd0b25lQ3VydmVQcmVzZXQnKSkgewogICAgICAgICAgICBmaWx0ZXIgPSBmaWx0ZXIuY29weVdpdGgodG9uZUN1cnZlUHJlc2V0OiBUb25lQ3VydmVQcmVzZXQuaW52ZXJ0KTsKICAgICAgICAgICAgbWlncmF0ZWRGaWx0ZXJTdGF0ZSA9IHRydWU7CiAgICAgICAgICB9Cg==
        run: python3 -c "import os,base64,pathlib; p=pathlib.Path('lib/services/filter_service.dart'); s=p.read_text(); old=base64.b64decode(os.environ['OLD_BLOCK']).decode(); assert old in s; p.write_text(s.replace(old,'',1))"
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/services/filter_service.dart
          git commit -m 'fix: keep Filter0025 pre-release default migration-free'
          git push origin HEAD:dev_branch
