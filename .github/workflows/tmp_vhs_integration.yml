name: Temporary VHS integration

on:
  push:
    branches:
      - tmp-vhs-integration-real

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Apply integration patch
        run: python3 tooling/apply_vhs_integration.py
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Format changed Dart
        run: |
          dart format \
            lib/engine/filter_engine.dart \
            lib/engine/vhs_noise_engine.dart \
            lib/services/filter_service.dart \
            lib/screens/canvas/widgets/filter_panel.dart \
            lib/screens/timeline/timeline_screen.dart \
            test/engine/vhs_noise_engine_test.dart \
            test/engine/vhs_filter_integration_test.dart
      - name: Run VHS tests
        run: |
          flutter test test/engine/vhs_noise_engine_test.dart
          flutter test test/engine/vhs_filter_integration_test.dart
      - name: Analyze integration
        run: flutter analyze lib/engine/filter_engine.dart lib/engine/vhs_noise_engine.dart lib/services/filter_service.dart lib/screens/canvas/widgets/filter_panel.dart lib/screens/timeline/timeline_screen.dart lib/services/recorded_filter_apply_service.dart
      - name: Commit verified integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tooling/apply_vhs_integration.py .github/workflows/tmp_vhs_integration.yml
          git add -A
          git commit -m 'feat(filters): add VHS noise to drawing and effect filters'
          git push origin HEAD:tmp-vhs-integration-real
