# FCM Android build only: never publish to Play or public releases.
# This one-shot workflow must be removed after testing.
name: FCM Android smoke APK (dev_branch only)
on:
  push:
    branches: [dev_branch]
    paths: [".github/workflows/fcm-android-apk-once.yml"]
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/dev_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - name: Restore stable Android debug signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.NIARIM_DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NIARIM_DEBUG_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/niarim-ci-debug.jks"
          chmod 600 "$RUNNER_TEMP/niarim-ci-debug.jks"
          keytool -list -keystore "$RUNNER_TEMP/niarim-ci-debug.jks"             -storepass "$KEYSTORE_PASSWORD" -alias niarim_ci_debug >/dev/null
      - name: Resolve lockfile and analyze
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos
          flutter test test/push_notification_service_test.dart
      - name: Build Android debug APK with live AWS and Google login
        env:
          NIARIM_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/niarim-ci-debug.jks
          NIARIM_DEBUG_STORE_PASSWORD: ${{ secrets.NIARIM_DEBUG_STORE_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          [[ "$GOOGLE_CLIENT_ID" =~ ^[a-zA-Z0-9-]+[.]apps[.]googleusercontent[.]com$ ]]
          flutter build apk --debug             --dart-define="NIARIM_API_BASE_URL=https://ibjfhyoqvfanle62ltokgz6sry0fjqfh.lambda-url.ap-northeast-1.on.aws/"             --dart-define="NIARIM_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
      - name: Upload test-only APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: niarim-fcm-dev-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
