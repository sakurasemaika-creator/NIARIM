name: One-shot Fix Community Theme Palette

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-fix-community-theme-palette.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
      - run: python3 .github/scripts/fix_community_theme_palette_refs.py
      - name: Commit palette reference repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: use themed community placeholder palette everywhere'
          git push origin HEAD:dev_branch
