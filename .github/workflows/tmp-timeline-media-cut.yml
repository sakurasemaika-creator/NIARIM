name: TMP Timeline Media Cut

on:
  push:
    branches:
      - feat/timeline-media-cut-waveform
    paths:
      - 'lib/utils/timeline_clip_split.dart'
      - 'lib/screens/timeline/timeline_screen.dart'
      - 'test/timeline_clip_split_test.dart'
      - '.github/workflows/tmp-timeline-media-cut.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/utils/timeline_clip_split.dart test/timeline_clip_split_test.dart
        if: ${{ hashFiles('lib/utils/timeline_clip_split.dart') != '' }}
      - run: flutter test test/timeline_clip_split_test.dart
