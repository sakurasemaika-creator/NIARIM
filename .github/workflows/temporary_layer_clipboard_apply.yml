name: Apply layer clipboard patch

on:
  push:
    branches: [dev_branch]
    paths:
      - .github/workflows/temporary_layer_clipboard_apply.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python .github/patches/layer_clipboard_patch.py
      - run: dart format lib/models/text_object.dart lib/services/project_service.dart lib/services/layer_clipboard_service.dart lib/screens/canvas/widgets/layer_panel.dart lib/screens/canvas/widgets/two_finger_vertical_swipe_detector.dart lib/screens/canvas/canvas_screen.dart test/two_finger_vertical_swipe_detector_test.dart
      - run: flutter analyze lib/models/text_object.dart lib/services/project_service.dart lib/services/layer_clipboard_service.dart lib/screens/canvas/widgets/layer_panel.dart lib/screens/canvas/widgets/two_finger_vertical_swipe_detector.dart lib/screens/canvas/canvas_screen.dart
      - run: flutter test test/two_finger_vertical_swipe_detector_test.dart
      - name: Commit
        run: |
          rm -f .github/workflows/temporary_layer_clipboard_patch.yml
          rm -f .github/workflows/temporary_layer_clipboard_retry.yml
          rm -f .github/workflows/temporary_layer_clipboard_apply.yml
          rm -f .github/patches/layer_clipboard_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: add cross-frame layer copy and paste gestures"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
# validation retry after keyed gesture-surface test fix
