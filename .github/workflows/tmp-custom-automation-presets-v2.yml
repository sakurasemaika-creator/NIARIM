name: TMP Custom Automation Presets V2

on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - 'scripts/tmp_integrate_custom_automation_presets_v2.py'
      - '.github/workflows/tmp-custom-automation-presets-v2.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply integration
        run: python3 scripts/tmp_integrate_custom_automation_presets_v2.py
      - name: Format
        run: dart format lib/services/filter_service.dart lib/services/custom_automation_service.dart lib/engine/custom_automation_executor.dart lib/engine/custom_automation_filter_runner.dart lib/engine/color_trace_adjust_engine.dart lib/models/custom_automation_builtin_presets.dart
      - name: Analyze
        run: flutter analyze lib/services/filter_service.dart lib/services/custom_automation_service.dart lib/engine/custom_automation_executor.dart lib/engine/custom_automation_filter_runner.dart lib/engine/color_trace_adjust_engine.dart lib/models/custom_automation_builtin_presets.dart test/custom_automation_service_test.dart
      - name: Automation tests
        run: flutter test test/custom_automation_service_test.dart --reporter expanded
      - name: Filter regression tests
        run: flutter test test/filter_service_test.dart test/filter_engine_test.dart --reporter compact
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: 公式自動操作プリセットと色トレス工程を統合'
          git reset --hard HEAD
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
