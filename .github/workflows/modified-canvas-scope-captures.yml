name: Modified canvas scope actual Flutter screenshots
on:
  push:
    branches: [dev_branch]
    paths:
      - 'test/visual/modified_canvas_scope_capture_test.dart'
      - '.github/workflows/modified-canvas-scope-captures.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-captures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Another in-flight feature branch update currently fails to compile.
      # Capture the requested UI from this known-buildable dev_branch commit,
      # while carrying only the capture test from this workflow commit.
      - name: Select last buildable dev_branch UI revision for evidence
        run: |
          cp test/visual/modified_canvas_scope_capture_test.dart /tmp/modified_canvas_scope_capture_test.dart
          git fetch --depth=1 origin 236a342b6de127a162b8df8c43b798e23088acd6
          git checkout --detach 236a342b6de127a162b8df8c43b798e23088acd6
          cp /tmp/modified_canvas_scope_capture_test.dart test/visual/modified_canvas_scope_capture_test.dart
          git rev-parse HEAD
      - run: flutter pub get
      - name: Render affected screens using the actual Flutter app
        run: flutter test test/visual/modified_canvas_scope_capture_test.dart --reporter expanded
      - name: Upload actual screen captures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: niarim-modified-canvas-real-screens
          path: build/modified-canvas-scope
          if-no-files-found: warn
          retention-days: 7
