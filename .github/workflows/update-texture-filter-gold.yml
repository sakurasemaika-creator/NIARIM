name: Update Texture Filter Gold

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/update-texture-filter-gold.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply texture-filter naming and palettes
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          l10n_values = {
              'lib/l10n/app_ja.arb': {
                  'filterNameAuroraHologram': '質感変更フィルター',
                  'filterAuroraHologramPresetClassicHologram': 'オーロラホログラム',
              },
              'lib/l10n/app_en.arb': {
                  'filterNameAuroraHologram': 'Texture Filter',
                  'filterAuroraHologramPresetClassicHologram': 'Aurora Hologram',
              },
          }
          for path, values in l10n_values.items():
              s = read(path)
              for key, value in values.items():
                  pat = rf'("{re.escape(key)}"\s*:\s*)"[^"]*"'
                  if not re.search(pat, s):
                      raise SystemExit(f'missing l10n key {key} in {path}')
                  s = re.sub(pat, lambda m, v=value: m.group(1) + f'"{v}"', s, count=1)
              write(path, s)

          p = 'lib/models/custom_automation_presets.dart'
          s = read(p)
          s = s.replace("name: 'オーロラホログラム', filters: const [", "name: '質感変更フィルター', filters: const [")
          s = s.replace("FilterDef(id: 'Filter0019', name: 'オーロラホログラム'", "FilterDef(id: 'Filter0019', name: '質感変更フィルター'")
          write(p, s)

          p = 'lib/engine/filter_engine.dart'
          s = read(p)
          # Keep Vaporwave's dark violet anchor genuinely high-contrast while preserving
          # the requested pink/purple/blue palette identity.
          s = s.replace('(0.00, 28, 12, 67),', '(0.00, 28, 8, 67),', 1)
          replacement = '''AuroraHologramPreset.sunsetGold => const [
                (0.00, 114, 77, 17),   // #724d11 deep gold shadow
                (0.08, 223, 149, 31),  // #df951f base gold
                (0.16, 255, 190, 57),  // #ffbe39 warm highlight
                (0.24, 255, 221, 151), // #ffdd97 pearl highlight
                (0.32, 80, 53, 10),    // #50350a reflected dark
                (0.40, 114, 77, 17),   // #724d11 shadow return
                (0.48, 255, 190, 57),  // #ffbe39 bright gold
                (0.56, 255, 221, 151), // #ffdd97 specular glow
                (0.64, 251, 138, 11),  // #fb8a0b orange glow
                (0.72, 223, 149, 31),  // #df951f base return
                (0.80, 80, 53, 10),    // #50350a dark reflection
                (0.88, 255, 221, 151), // #ffdd97 reflected light
                (1.00, 255, 190, 57),  // #ffbe39 finish
              ],'''
          pat = r'AuroraHologramPreset\.sunsetGold\s*=>\s*const\s*\[(?:.|\n)*?\n\s*\],'
          s2, count = re.subn(pat, replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'expected one sunsetGold palette, replaced {count}')
          write(p, s2)

          p = 'test/texture_filter_gold_palette_test.dart'
          write(p, '''import 'dart:io';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('texture filter naming and Sunset Gold reference colors are locked', () {
              final ja = File('lib/l10n/app_ja.arb').readAsStringSync();
              final en = File('lib/l10n/app_en.arb').readAsStringSync();
              final engine = File('lib/engine/filter_engine.dart').readAsStringSync();

              expect(ja, contains('"filterNameAuroraHologram": "質感変更フィルター"'));
              expect(ja, contains('"filterAuroraHologramPresetClassicHologram": "オーロラホログラム"'));
              expect(en, contains('"filterNameAuroraHologram": "Texture Filter"'));
              expect(en, contains('"filterAuroraHologramPresetClassicHologram": "Aurora Hologram"'));

              for (final rgbTail in <String>[
                '223, 149, 31)',
                '114, 77, 17)',
                '80, 53, 10)',
                '255, 190, 57)',
                '255, 221, 151)',
                '251, 138, 11)',
              ]) {
                expect(engine, contains(rgbTail));
              }
            });
          }
          ''')
      - run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Format
        run: dart format lib/models/custom_automation_presets.dart lib/engine/filter_engine.dart test/texture_filter_gold_palette_test.dart
      - name: Analyze targeted files
        run: flutter analyze lib/models/custom_automation_presets.dart lib/engine/filter_engine.dart test/texture_filter_gold_palette_test.dart
      - name: Run focused tests
        run: |
          flutter test test/texture_filter_gold_palette_test.dart
          flutter test test/aurora_hologram_visual_audit_test.dart
      - name: Commit verified implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/l10n/app_ja.arb lib/l10n/app_en.arb lib/l10n/generated lib/models/custom_automation_presets.dart lib/engine/filter_engine.dart test/texture_filter_gold_palette_test.dart
          git commit -m 'feat: rename texture filter and retune sunset gold'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
