name: One-shot Device-adjacent Final Audit

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-device-adjacent-final-audit.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Final platform-adjacent logic
        run: flutter test test/platform_logic_final_audit_test.dart --reporter expanded
      - name: Gesture and touch simulation
        run: |
          flutter test test/canvas_pinch_gesture_test.dart --reporter expanded
          flutter test test/frame_strip_gesture_test.dart --reporter expanded
          flutter test test/gesture_settings_sheet_test.dart --reporter expanded
      - name: Font real-file lifecycle
        run: flutter test test/direct_service_coverage_batch09_test.dart --reporter expanded
      - name: Font and creative asset logic
        run: |
          flutter test test/font_coverage_test.dart --reporter expanded
          flutter test test/font_fallback_test.dart --reporter expanded
          flutter test test/font_license_test.dart --reporter expanded
          flutter test test/creative_asset_persistence_test.dart --reporter expanded
          flutter test test/asset_tags_test.dart --reporter expanded
          flutter test test/asset_tag_l10n_test.dart --reporter expanded
      - name: Community logic and backend contracts
        run: |
          flutter test test/community_api_test.dart --reporter expanded
          flutter test test/community_service_test.dart --reporter expanded
          flutter test test/community_service_backend_test.dart --reporter expanded
          flutter test test/community_preview_size_test.dart --reporter expanded
      - name: Existing app-level platform mock regression
        run: flutter test test/app_smoke_test.dart --reporter compact
