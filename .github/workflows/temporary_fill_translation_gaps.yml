name: Fill missing translations

on:
  push:
    branches: [dev_branch]
    paths:
      - .github/workflows/temporary_fill_translation_gaps.yml
      - .github/patches/fill_translation_gaps.py

permissions:
  contents: write

jobs:
  patch-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/patches/fill_translation_gaps.py
      - run: python tools/audit_translation_tone.py
      - name: Commit
        run: |
          rm -f .github/workflows/temporary_fill_translation_gaps.yml
          rm -f .github/patches/fill_translation_gaps.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: complete neutral-tone translations"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
