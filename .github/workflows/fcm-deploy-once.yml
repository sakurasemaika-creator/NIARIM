# One-shot AWS deploy, dev_branch only. Remove after inspecting the result.
name: FCM backend one-shot deploy (dev_branch only)
on:
  push:
    branches: [dev_branch]
    paths: [".github/workflows/fcm-deploy-once.yml"]
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/dev_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run synth
      - name: AWS auth via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Confirm account, region and config
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "368601349794"
          test "$AWS_REGION" = "ap-northeast-1"
          test -n "$GOOGLE_CLIENT_ID"
          test "$GOOGLE_CLIENT_ID" != "REPLACE_ME"
          test -n "$YOUTUBE_API_KEY"
          test "$YOUTUBE_API_KEY" != "REPLACE_ME"
      - name: Private CDK diff with DynamoDB change guard
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          npx cdk diff NiarimBackendStack             -c googleClientId="$GOOGLE_CLIENT_ID"             -c youtubeApiKey="$YOUTUBE_API_KEY"             > "$RUNNER_TEMP/niarim-fcm-diff.txt" 2>&1 || {
              echo "::error::CDK diff failed; private diff suppressed"
              exit 1
            }
          if grep -E 'AWS::DynamoDB::(Table|GlobalTable)' "$RUNNER_TEMP/niarim-fcm-diff.txt" > /dev/null; then
            echo "::error::DynamoDB changes detected; automatic FCM-only deployment stopped"
            exit 1
          fi
          echo "CDK diff completed; no DynamoDB table/index changes."
      - name: Deploy FCM backend
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          npx cdk deploy NiarimBackendStack --require-approval never             --outputs-file "$RUNNER_TEMP/niarim-cdk-outputs.json"             -c googleClientId="$GOOGLE_CLIENT_ID"             -c youtubeApiKey="$YOUTUBE_API_KEY"
      - name: Verify public endpoint after deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(jq -r '.NiarimBackendStack.ApiFunctionUrl // empty' "$RUNNER_TEMP/niarim-cdk-outputs.json")"
          [[ "$url" =~ ^https://[a-z0-9-]+[.]lambda-url[.]ap-northeast-1[.]on[.]aws/$ ]]
          code="$(curl --max-time 25 --silent --show-error             --output "$RUNNER_TEMP/response.json" --write-out '%{http_code}'             "${url}works/latest")"
          test "$code" = "200"
          echo "GET /works/latest -> HTTP 200"
