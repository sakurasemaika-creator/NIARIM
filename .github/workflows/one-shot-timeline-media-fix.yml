name: One-shot timeline media fix

on:
  push:
    branches:
      - dev_branch
    paths:
      - .github/workflows/one-shot-timeline-media-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev_branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev_branch
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Write regression contract test
        shell: bash
        run: |
          cat > test/timeline_media_contract_test.dart <<'DART'
          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('timeline audio import accepts video containers as audio sources', () {
              final source = File(
                'lib/screens/timeline/timeline_screen.dart',
              ).readAsStringSync();

              expect(source, contains('_ClipTrackType.audio => FileType.custom'));
              expect(source, contains("'mp4'"));
              expect(source, contains("'mov'"));
              expect(source, contains('allowedExtensions: allowedExtensions'));
            });

            test('timeline video is preview-only and always muted', () {
              final timeline = File(
                'lib/screens/timeline/timeline_screen.dart',
              ).readAsStringSync();
              final compositor = File(
                'lib/engine/layer_compositor.dart',
              ).readAsStringSync();

              expect(timeline, contains('VideoPlayer(controller)'));
              expect(timeline, contains('await controller.setVolume(0.0);'));
              expect(
                compositor,
                isNot(contains('  LayerType.timelineVideo,\n')),
              );
            });

            test('clip trim sheet exposes play pause while editing', () {
              final source = File(
                'lib/screens/timeline/timeline_screen.dart',
              ).readAsStringSync();

              expect(source, contains('final ValueGetter<bool> isPlaying;'));
              expect(source, contains('final VoidCallback onTogglePlay;'));
              expect(source, contains('widget.onTogglePlay();'));
            });
          }
          DART

      - name: Verify RED before production changes
        shell: bash
        run: |
          set +e
          flutter test test/timeline_media_contract_test.dart 2>&1 | tee /tmp/timeline_media_red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Regression test unexpectedly passed before the production fix.'
            exit 1
          fi
          grep -q 'timeline audio import accepts video containers as audio sources' /tmp/timeline_media_red.log
          echo 'RED confirmed: regression contract fails against the pre-fix source.'

      - name: Apply timeline media fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          timeline_path = Path('lib/screens/timeline/timeline_screen.dart')
          source = timeline_path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
          """    final fileType = switch (trackType) {
                _ClipTrackType.audio => FileType.audio,
                _ClipTrackType.video => FileType.video,
                _ClipTrackType.image => FileType.image,
              };
              final result = await FilePicker.platform.pickFiles(type: fileType);
          """,
          """    // 音源読み込みでは、音声ファイルだけでなく動画コンテナ内の音声も
              // 入力元として使えるようにする。動画をここから選んだ場合も素材種別は
              // audioのまま保持し、映像トラックには追加しない。
              final allowedExtensions = trackType == _ClipTrackType.audio
                  ? const <String>[
                      'mp3',
                      'wav',
                      'm4a',
                      'aac',
                      'flac',
                      'ogg',
                      'opus',
                      'aiff',
                      'wma',
                      'mp4',
                      'm4v',
                      'mov',
                      'mkv',
                      'webm',
                    ]
                  : null;
              final fileType = switch (trackType) {
                _ClipTrackType.audio => FileType.custom,
                _ClipTrackType.video => FileType.video,
                _ClipTrackType.image => FileType.image,
              };
              final result = await FilePicker.platform.pickFiles(
                type: fileType,
                allowedExtensions: allowedExtensions,
              );
          """,
          'audio picker policy',
          )

          replace_once(
          """  void _onCurrentFrameChanged() {
              if (!mounted) return;
              _maybeCenterCurrentFrame();
            }
          """,
          """  void _onCurrentFrameChanged() {
              if (!mounted) return;
              _maybeCenterCurrentFrame();
              // 停止中のスクラブやカット範囲調整でも、動画プレビューを現在位置へ
              // 追従させる。再生中もこの通知経由で各メディアを同期する。
              _syncMediaPlayback();
            }
          """,
          'frame change media sync',
          )

          # 再生タイマー側は_currentFrame更新で上のlistenerが呼ばれるため二重同期を避ける。
          old_tick = """          _currentFrame = (_currentFrame + 1) % total;
                    _syncMediaPlayback();
          """
          if source.count(old_tick) != 1:
              raise SystemExit(f'playback timer sync: expected one match, found {source.count(old_tick)}')
          source = source.replace(
              old_tick,
              """          _currentFrame = (_currentFrame + 1) % total;
          """,
              1,
          )

          replace_once(
          """                  if (newClip != null && mounted) {
                            setState(() => clips.add(newClip));
                          }
          """,
          """                  if (newClip != null && mounted) {
                            setState(() => clips.add(newClip));
                            // 停止中でも追加直後から動画の先頭フレームをプレビューする。
                            _syncMediaPlayback();
                          }
          """,
          'new clip preview sync',
          )

          replace_once(
          """    await controller.setVolume(clip.volume.clamp(0.0, 1.0));
          """,
          """    // 動画素材は映像プレビュー専用。動画ファイル内の音声は再生せず、
              // 音が必要な場合は音源トラックから同じファイルを読み込む。
              await controller.setVolume(0.0);
          """,
          'video mute',
          )

          # 動画レイヤーに音量を永続化しない。既存プロジェクトを読み込む場合も常に無音。
          source = source.replace(
              "videoVolume: clip.volume.clamp(0.0, 1.0)",
              "videoVolume: 0.0",
          )
          replace_once(
          """          volume: layer.type == LayerType.timelineVideo
                      ? layer.videoVolume.clamp(0.0, 1.0)
                      : 1.0,
          """,
          """          volume: layer.type == LayerType.timelineVideo ? 0.0 : 1.0,
          """,
          'loaded video mute',
          )

          replace_once(
          """    setState(() {
              _audioClips
                ..clear()
                ..addAll(audio);
              _videoClips
                ..clear()
                ..addAll(video);
              _imageClips
                ..clear()
                ..addAll(image);
            });
          """,
          """    setState(() {
              _audioClips
                ..clear()
                ..addAll(audio);
              _videoClips
                ..clear()
                ..addAll(video);
              _imageClips
                ..clear()
                ..addAll(image);
            });
            WidgetsBinding.instance.addPostFrameCallback((_) {
              if (mounted) _syncMediaPlayback();
            });
          """,
          'loaded clip preview sync',
          )

          preview_marker = """  /// プレビュー本体（プレビュー画像＋全画面化ボタン）。PC/DeXモードでは
          """
          if source.count(preview_marker) != 1:
              raise SystemExit('preview insertion marker not found exactly once')
          helper = """  /// 現在フレームの通常レイヤー合成に、動画素材だけをネイティブ動画として
            /// 重ねる。動画素材はTileManagerへ焼き込まず、編集プレビュー専用とする。
            Widget _buildPreviewFrame(
              ProjectService ps,
              String sceneId,
              int frameIndex,
            ) {
              final basePreview = _TimelinePreview(
                tileManager: ps.tileManagerOf(widget.projectId),
                layers: ps
                    .layersOf(widget.projectId, sceneId, frameIndex)
                    .where((layer) => layer.type != LayerType.timelineVideo)
                    .toList(),
                sceneId: sceneId,
                frameIndex: frameIndex,
                cameraKeyframes: ps.cameraKeyframesOf(widget.projectId, sceneId),
                effectFilters: ps.effectFiltersOf(widget.projectId, sceneId),
                layerHomes: ps.layerHomesOf(widget.projectId),
                groups: ps.layerGroupsOf(widget.projectId, sceneId),
              );
              final overlays = <Widget>[];
              for (final clip in _videoClips) {
                final inRange = frameIndex >= clip.startFrame &&
                    frameIndex < clip.startFrame + clip.lengthFrames;
                if (!inRange) continue;
                final controller = _videoControllers[clip.id];
                if (controller == null || !controller.value.isInitialized) continue;
                overlays.add(
                  Positioned.fill(
                    child: IgnorePointer(
                      child: Opacity(
                        opacity: clip.videoOpacity.clamp(0.0, 1.0),
                        child: Center(
                          child: AspectRatio(
                            aspectRatio: controller.value.aspectRatio > 0
                                ? controller.value.aspectRatio
                                : 1.0,
                            child: VideoPlayer(controller),
                          ),
                        ),
                      ),
                    ),
                  ),
                );
              }
              if (overlays.isEmpty) return basePreview;
              return Stack(
                fit: StackFit.expand,
                children: [basePreview, ...overlays],
              );
            }

          """
          source = source.replace(preview_marker, helper + preview_marker, 1)

          old_preview_builder = """                    builder: (context, frameIndex, _) => _TimelinePreview(
                                  tileManager: ps.tileManagerOf(widget.projectId),
                                  layers: ps.layersOf(
                                    widget.projectId,
                                    sceneId,
                                    frameIndex,
                                  ),
                                  sceneId: sceneId,
                                  frameIndex: frameIndex,
                                  cameraKeyframes: ps.cameraKeyframesOf(
                                    widget.projectId,
                                    sceneId,
                                  ),
                                  effectFilters: ps.effectFiltersOf(
                                    widget.projectId,
                                    sceneId,
                                  ),
                                  layerHomes: ps.layerHomesOf(widget.projectId),
                                  groups: ps.layerGroupsOf(widget.projectId, sceneId),
                                ),
          """
          new_preview_builder = """                    builder: (context, frameIndex, _) =>
                                  _buildPreviewFrame(ps, sceneId, frameIndex),
          """
          replace_once(old_preview_builder, new_preview_builder, 'video preview overlay builder')

          replace_once(
          """        onDuplicate: () => _duplicateClip(clip),
                  onChanged: () => setState(() {}),
          """,
          """        onDuplicate: () => _duplicateClip(clip),
                  onChanged: () => setState(() {}),
                  isPlaying: () => _isPlaying,
                  onTogglePlay: _togglePlay,
          """,
          'clip sheet playback callbacks',
          )

          replace_once(
          """  final VoidCallback onDuplicate;
            final VoidCallback onChanged;
            const _ClipDetailSheet({
              required this.clip,
              required this.totalFrames,
              required this.onDelete,
              required this.onDuplicate,
              required this.onChanged,
            });
          """,
          """  final VoidCallback onDuplicate;
            final VoidCallback onChanged;
            final ValueGetter<bool> isPlaying;
            final VoidCallback onTogglePlay;
            const _ClipDetailSheet({
              required this.clip,
              required this.totalFrames,
              required this.onDelete,
              required this.onDuplicate,
              required this.onChanged,
              required this.isPlaying,
              required this.onTogglePlay,
            });
          """,
          'clip sheet playback fields',
          )

          replace_once(
          """                IconButton(
                          icon: const Icon(Icons.copy),
                          tooltip: l10n.themeDuplicateAction,
          """,
          """                if (_c.trackType == _ClipTrackType.video ||
                        _c.trackType == _ClipTrackType.audio)
                      IconButton(
                        icon: Icon(
                          widget.isPlaying() ? Icons.pause : Icons.play_arrow,
                        ),
                        tooltip: widget.isPlaying()
                            ? l10n.commonPause
                            : l10n.commonPlay,
                        onPressed: () {
                          widget.onTogglePlay();
                          setState(() {});
                        },
                      ),
                    IconButton(
                          icon: const Icon(Icons.copy),
                          tooltip: l10n.themeDuplicateAction,
          """,
          'clip sheet play button',
          )

          video_volume_row = """                  _row(
                        l10n.timelineClipVolumeLabel,
                        _c.volume,
                        0,
                        1,
                        100,
                        (v) {
                          _c.volume = v;
                          _notify();
                        },
                        '${(_c.volume * 100).round()}%',
                        step: 0.01,
                      ),
          """
          # There are two volume rows (audio and video). Remove only the second occurrence,
          # which is inside the video section.
          first = source.find(video_volume_row)
          second = source.find(video_volume_row, first + 1) if first >= 0 else -1
          if first < 0 or second < 0:
              raise SystemExit('video volume row: expected two matching rows')
          source = source[:second] + source[second + len(video_volume_row):]

          timeline_path.write_text(source)

          compositor_path = Path('lib/engine/layer_compositor.dart')
          compositor = compositor_path.read_text()
          old = """  LayerType.timelineImage,
            LayerType.timelineVideo,
            LayerType.watermark,
          """
          new = """  LayerType.timelineImage,
            // timelineVideoは編集プレビュー専用。実ピクセルとして合成・書き出し
            // しない（タイムライン上の位置・長さ等のメタデータだけ保持する）。
            LayerType.watermark,
          """
          if compositor.count(old) != 1:
              raise SystemExit(f'pixelLayerTypes video entry: expected one match, found {compositor.count(old)}')
          compositor_path.write_text(compositor.replace(old, new, 1))
          PY

      - name: Format changed Dart files
        run: dart format lib/screens/timeline/timeline_screen.dart lib/engine/layer_compositor.dart test/timeline_media_contract_test.dart

      - name: Verify GREEN regression test
        run: flutter test test/timeline_media_contract_test.dart

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Diff sanity check
        run: git diff --check

      - name: Commit verified fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-timeline-media-fix.yml
          git config user.name 'NIARIM automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: improve timeline media import and preview'
          git push origin HEAD:dev_branch
