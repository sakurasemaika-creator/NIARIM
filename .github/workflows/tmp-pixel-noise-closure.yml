name: Temporary Pixel Noise Closure

on:
  push:
    branches: [dev_branch]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Verify scoped contracts
        run: |
          flutter test test/engine/pixel_art_engine_test.dart --reporter expanded
          flutter test test/engine/filter_pixel_art_route_test.dart --reporter expanded
          if [ -f test/engine/stamp_pixel_art_route_test.dart ]; then flutter test test/engine/stamp_pixel_art_route_test.dart --reporter expanded; fi
          flutter test test/engine/mosaic_filter_test.dart --reporter expanded
          if [ -f test/engine/noise_filter_distinction_test.dart ]; then flutter test test/engine/noise_filter_distinction_test.dart --reporter expanded; fi
          if [ -f test/engine/analog_filter_distinction_test.dart ]; then flutter test test/engine/analog_filter_distinction_test.dart --reporter expanded; fi
          flutter analyze lib/engine/pixel_art_engine.dart lib/engine/filter_engine.dart lib/services/filter_service.dart --no-fatal-infos --no-fatal-warnings
