name: Automation Preset Discovery

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/automation-preset-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - name: Discover exact operation implementations
        shell: bash
        run: |
          set -euo pipefail
          out=docs/product-audit/automation-preset-discovery.txt
          mkdir -p "$(dirname "$out")"
          : > "$out"
          for term in '明度で透過' '明度' '全統合' '表示中' '下のレイヤーと結合' '下と結合' '色トレス' 'color trace' 'mergeDown' 'duplicateLayer' 'flatten' 'luminance' 'brightnessToAlpha' 'alpha'; do
            printf '\n===== %s =====\n' "$term" >> "$out"
            grep -RIn -C 8 --exclude-dir=.git --exclude='automation-preset-discovery.txt' "$term" lib test 2>/dev/null | head -n 220 >> "$out" || true
          done
          printf '\n===== automation recording calls =====\n' >> "$out"
          grep -RIn -C 5 --exclude-dir=.git "recordStep\|_recordCanvasAutomation" lib/screens lib/widgets 2>/dev/null | head -n 700 >> "$out" || true
          printf '\n===== layer APIs =====\n' >> "$out"
          grep -RIn -C 5 --exclude-dir=.git "duplicateLayer\|merge.*Layer\|composite.*visible\|isVisible" lib/services lib/screens/canvas 2>/dev/null | head -n 1000 >> "$out" || true
      - name: Commit discovery report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-audit/automation-preset-discovery.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: capture automation preset implementation discovery'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
