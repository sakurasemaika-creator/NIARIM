name: Persistence Regression

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/persistence-regression.yml'
      - 'lib/engine/niapro_serializer.dart'
      - 'lib/engine/niatra_serializer.dart'
      - 'lib/engine/niatra_asset_bundle.dart'
      - 'lib/services/brush_service.dart'
      - 'lib/models/brush.dart'
      - 'lib/models/brush_presets_extension.dart'
      - 'pubspec.yaml'
      - 'assets/brushes/**'
      - 'test/brush_asset_bundle_contract_test.dart'
      - 'lib/models/layer.dart'
      - 'test/creative_asset_persistence_test.dart'
      - 'test/niatra_serializer_test.dart'
      - 'test/niatra_asset_bundle_test.dart'
      - 'test/niapro_blend_mode_roundtrip_test.dart'
      - 'lib/engine/layer_compositor.dart'
      - 'lib/screens/canvas/widgets/filter_panel.dart'
      - 'test/blend_mode_math_fixture_test.dart'
      - 'test/models/blend_mode_refresh_contract_test.dart'
      - 'test/prism_filter_completion_test.dart'
      - 'test/prism_integration_regression_test.dart'
      - 'test/engine/blur_filter_distinction_test.dart'
      - 'test/engine/noise_filter_distinction_test.dart'
      - 'test/engine/analog_filter_distinction_test.dart'
      - 'test/engine/vhs_filter_integration_test.dart'
      - 'test/autofill_preset_selection_sheet_test.dart'
      - 'lib/widgets/autofill_preset_selection_sheet.dart'
      - 'lib/screens/canvas/widgets/layer_panel.dart'
      - 'lib/engine/autofill_batch_runner.dart'
      - 'test/autofill_batch_runner_integration_test.dart'
      - 'test/autofill_engine_smart_update_test.dart'
      - 'test/autofill_check_mode_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run persistence regressions
        run: |
          flutter test test/creative_asset_persistence_test.dart --reporter expanded
          flutter test test/brush_asset_bundle_contract_test.dart --reporter expanded
          flutter test test/niatra_serializer_test.dart --reporter expanded
          flutter test test/niatra_asset_bundle_test.dart --reporter expanded
          flutter test test/niapro_blend_mode_roundtrip_test.dart --reporter expanded
          flutter test test/blend_mode_math_fixture_test.dart --reporter expanded
          flutter test test/models/blend_mode_refresh_contract_test.dart --reporter expanded
          flutter test test/prism_filter_completion_test.dart --reporter expanded
          flutter test test/prism_integration_regression_test.dart --reporter expanded
          flutter test test/engine/blur_filter_distinction_test.dart --reporter expanded
          flutter test test/engine/noise_filter_distinction_test.dart --reporter expanded
          flutter test test/engine/analog_filter_distinction_test.dart --reporter expanded
          flutter test test/engine/vhs_filter_integration_test.dart --reporter expanded
          flutter test test/autofill_preset_selection_sheet_test.dart --reporter expanded
          flutter test test/autofill_batch_runner_integration_test.dart --reporter expanded
          flutter test test/autofill_engine_smart_update_test.dart --reporter expanded
          flutter test test/autofill_check_mode_test.dart --reporter expanded
      - name: Analyze persistence paths
        run: |
          flutter analyze --no-fatal-infos lib/engine/niapro_serializer.dart lib/engine/niatra_serializer.dart lib/engine/niatra_asset_bundle.dart lib/services/brush_service.dart lib/models/brush.dart lib/models/brush_presets_extension.dart test/brush_asset_bundle_contract_test.dart test/creative_asset_persistence_test.dart test/niatra_serializer_test.dart test/niatra_asset_bundle_test.dart test/niapro_blend_mode_roundtrip_test.dart lib/engine/layer_compositor.dart test/blend_mode_math_fixture_test.dart test/models/blend_mode_refresh_contract_test.dart test/prism_filter_completion_test.dart test/prism_integration_regression_test.dart test/engine/blur_filter_distinction_test.dart test/engine/noise_filter_distinction_test.dart test/engine/analog_filter_distinction_test.dart test/engine/vhs_filter_integration_test.dart test/autofill_preset_selection_sheet_test.dart test/autofill_batch_runner_integration_test.dart test/autofill_engine_smart_update_test.dart test/autofill_check_mode_test.dart lib/engine/autofill_batch_runner.dart lib/screens/canvas/widgets/layer_panel.dart
