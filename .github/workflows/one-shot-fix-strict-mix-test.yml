name: One-shot fix strict mix test

on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/one-shot-fix-strict-mix-test.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - name: Patch mix evidence test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/strict_visual_evidence_audit_test.dart')
          s=p.read_text()
          old="""      engine.beginStroke(const StrokePoint(x: 30, y: 128), _layer);\n      engine.continueStroke(const StrokePoint(x: 226, y: 128), _layer);\n      engine.endStroke();\n\n      final image = await tm.compositeLayerToImage(_layer);\n      final rgba = await _rgba(image);\n      final p = _pixel(rgba, _w, 128, 128);\n"""
          new="""      // 1回のdabで率そのものを検証する。長いストロークでは同じ画素へ\n      // 複数stampが重なり、各stampが直前結果を再び混色するため、単純な1回分の\n      // 線形補間値との比較にはならない。機能の率追従を見るfixtureとして単発dabを使う。\n      engine.beginStroke(const StrokePoint(x: 128, y: 128), _layer);\n      engine.endStroke();\n\n      final image = await tm.compositeLayerToImage(_layer);\n      final rgba = await _rgba(image);\n      final p = _pixel(rgba, _w, 128, 128);\n"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit patch
        run: |
          git config user.name 'NIARIM Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/strict_visual_evidence_audit_test.dart
          git commit -m '混色率テストを単発dabで厳密比較できるfixtureへ修正'
          git push origin HEAD:dev_branch
