name: Repair Pinch 1 Percent
on:
  push:
    branches: [dev_branch]
    paths: [.github/workflows/repair-pinch-1pct.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Patch production minimum
        run: python3 -c "from pathlib import Path; p=Path('lib/screens/canvas/widgets/canvas_area.dart'); s=p.read_text(); old='/// キャンバス表示の縮小下限。等倍表示時の1/5まで縮小できる。\\nconst double kCanvasMinScale = 0.2;'; new='/// キャンバス表示の縮小下限。等倍表示時の1/100まで縮小できる。\\n/// 0にはせず、逆行列・座標変換が特異にならない最小の正倍率を維持する。\\nconst double kCanvasMinScale = 0.01;'; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Replace pinch regression test
        run: echo '' | base64 -d > /tmp/pinch_prefix && python3 - <<'PY'
          from pathlib import Path
          import base64
          data = '''${PINCH_TEST_B64}'''
          Path('test/canvas_pinch_gesture_test.dart').write_bytes(base64.b64decode(data))
          PY
        env:
          PINCH_TEST_B64: "REPLACE_ME"
      - name: Format and test
        run: |
          dart format lib/screens/canvas/widgets/canvas_area.dart test/canvas_pinch_gesture_test.dart
          flutter test test/canvas_pinch_gesture_test.dart
      - name: Commit verified repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-pinch-1pct.yml
          git add lib/screens/canvas/widgets/canvas_area.dart test/canvas_pinch_gesture_test.dart
          git commit -m 'fix: allow canvas pinch zoom out to one percent'
          git push origin HEAD:dev_branch
