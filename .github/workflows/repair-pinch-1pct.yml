name: Repair Pinch 1 Percent

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/repair-pinch-1pct.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Patch production minimum and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          canvas = Path('lib/screens/canvas/widgets/canvas_area.dart')
          s = canvas.read_text()
          old = '''/// キャンバス表示の縮小下限。等倍表示時の1/5まで縮小できる。\nconst double kCanvasMinScale = 0.2;'''
          new = '''/// キャンバス表示の縮小下限。等倍表示時の1/100まで縮小できる。\n/// 0にはせず、逆行列・座標変換が特異にならない最小の正倍率を維持する。\nconst double kCanvasMinScale = 0.01;'''
          if old not in s:
              raise SystemExit('canvas min-scale anchor not found')
          canvas.write_text(s.replace(old, new, 1))

          test = Path('test/canvas_pinch_gesture_test.dart')
          t = test.read_text()
          old_lower = '''  testWidgets('下限未満の縮小要求は0.2倍へ正確にクランプされる', (tester) async {\n    final scaleOf = await pumpCanvas(tester);\n    final center = tester.getCenter(find.byType(CanvasArea));\n    // CanvasAreaは指間4px未満を角度計算の不安定域として無視する。\n    // その有効域の端（4px）でも要求倍率は4/200=0.02で十分に下限未満。\n    await pinch(tester, center, from: 200, to: 4);\n    expect(tester.takeException(), isNull);\n    expect(\n      scaleOf(),\n      closeTo(kCanvasMinScale, 0.001),\n      reason: '下限未満を要求しても1/5より小さくならず、境界値へ到達すること',\n    );\n  });'''
          new_lower = '''  testWidgets('下限未満の縮小要求は0.01倍へ正確にクランプされる', (tester) async {\n    final scaleOf = await pumpCanvas(tester);\n    final center = tester.getCenter(find.byType(CanvasArea));\n    // 極端に近い2本指へ一気に縮めるのではなく、実操作と同じ安全な指間距離で\n    // 20%ピンチを重ねる。3回目は0.008倍を要求するため0.01へクランプされる。\n    for (var i = 0; i < 3; i++) {\n      await pinch(tester, center, from: 200, to: 40);\n    }\n    expect(tester.takeException(), isNull);\n    expect(\n      scaleOf(),\n      closeTo(kCanvasMinScale, 0.001),\n      reason: '連続ピンチで1/100まで縮小でき、それ未満にはならないこと',\n    );\n  });'''
          if old_lower not in t:
              raise SystemExit('pinch lower-bound test anchor not found')
          t = t.replace(old_lower, new_lower, 1)

          old_rotation = '''  testWidgets('0.2倍へ到達する同一ジェスチャーでも45度回転は保持される', (tester) async {\n    await pumpCanvas(tester);\n    final center = tester.getCenter(find.byType(CanvasArea));\n    final anchor = center - const Offset(60, 0);\n    final movingStart = center + const Offset(60, 0);\n    final atMinScale = anchor + const Offset(24, 0);\n    final rotatedAtMinScale = anchor + Offset.fromDirection(math.pi / 4, 24);\n\n    final fixed = await tester.startGesture(\n      anchor,\n      kind: PointerDeviceKind.touch,\n    );\n    final moving = await tester.startGesture(\n      movingStart,\n      kind: PointerDeviceKind.touch,\n    );\n    await tester.pump();\n    // 実際の連続ピンチと同様、まず下限へ到達してから同じ2本指を離さず回す。\n    await moving.moveTo(atMinScale);\n    await tester.pump();\n    await moving.moveTo(rotatedAtMinScale);\n    await tester.pump();\n    await moving.up();\n    await fixed.up();\n    await tester.pump();\n\n    expect(tester.takeException(), isNull);\n    final matrix = _viewMatrix(tester);\n    expect(canvasViewScaleOf(matrix), closeTo(kCanvasMinScale, 0.001));\n    final angle = math.atan2(matrix.entry(1, 0), matrix.entry(0, 0));\n    expect(\n      _angleDelta(angle, math.pi / 4).abs(),\n      lessThan(0.02),\n      reason: '最小倍率へのクランプで同時入力された回転を捨てないこと',\n    );\n  });'''
          new_rotation = '''  testWidgets('0.01倍へ到達する同一ジェスチャーでも45度回転は保持される', (tester) async {\n    await pumpCanvas(tester);\n    final center = tester.getCenter(find.byType(CanvasArea));\n    // まず通常の2回のピンチで0.02倍まで縮小する。\n    await pinch(tester, center, from: 200, to: 40);\n    await pinch(tester, center, from: 200, to: 100);\n\n    final anchor = center - const Offset(60, 0);\n    final movingStart = center + const Offset(60, 0);\n    final atMinScale = anchor + const Offset(60, 0);\n    final rotatedAtMinScale = anchor + Offset.fromDirection(math.pi / 4, 60);\n\n    final fixed = await tester.startGesture(\n      anchor,\n      kind: PointerDeviceKind.touch,\n    );\n    final moving = await tester.startGesture(\n      movingStart,\n      kind: PointerDeviceKind.touch,\n    );\n    await tester.pump();\n    // 最後の同一ジェスチャーで0.02→0.01へ到達し、その2本指を離さず45度回す。\n    await moving.moveTo(atMinScale);\n    await tester.pump();\n    await moving.moveTo(rotatedAtMinScale);\n    await tester.pump();\n    await moving.up();\n    await fixed.up();\n    await tester.pump();\n\n    expect(tester.takeException(), isNull);\n    final matrix = _viewMatrix(tester);\n    expect(canvasViewScaleOf(matrix), closeTo(kCanvasMinScale, 0.001));\n    final angle = math.atan2(matrix.entry(1, 0), matrix.entry(0, 0));\n    expect(\n      _angleDelta(angle, math.pi / 4).abs(),\n      lessThan(0.02),\n      reason: '最小倍率へのクランプで同時入力された回転を捨てないこと',\n    );\n  });'''
          if old_rotation not in t:
              raise SystemExit('pinch rotation test anchor not found')
          t = t.replace(old_rotation, new_rotation, 1)
          test.write_text(t)
          PY
      - name: Format
        run: dart format lib/screens/canvas/widgets/canvas_area.dart test/canvas_pinch_gesture_test.dart
      - name: Targeted pinch tests
        run: flutter test test/canvas_pinch_gesture_test.dart
      - name: Commit verified repair and remove one-shot
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-pinch-1pct.yml
          git add lib/screens/canvas/widgets/canvas_area.dart test/canvas_pinch_gesture_test.dart
          git commit -m 'fix: allow canvas pinch zoom out to one percent'
          git push origin HEAD:dev_branch
