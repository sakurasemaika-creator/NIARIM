name: Apply pixel grid patch

on:
  push:
    branches: [dev_branch]
    paths:
      - .github/workflows/temporary_pixel_grid_apply.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python .github/patches/pixel_grid_patch.py
      - run: dart format lib/screens/canvas/widgets/canvas_area.dart test/pixel_mode_grid_test.dart
      - run: flutter analyze lib/screens/canvas/widgets/canvas_area.dart
      - run: flutter test test/pixel_mode_grid_test.dart
      - name: Commit
        run: |
          rm -f .github/workflows/temporary_pixel_grid_patch.yml
          rm -f .github/workflows/temporary_pixel_grid_apply.yml
          rm -f .github/patches/pixel_grid_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: show pixel grid for pixel-mode brushes"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
# validation trigger
