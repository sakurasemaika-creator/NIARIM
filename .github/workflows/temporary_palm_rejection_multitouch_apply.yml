name: Apply palm rejection multitouch fix

on:
  push:
    branches: [dev_branch]
    paths:
      - .github/workflows/temporary_palm_rejection_multitouch_apply.yml
      - .github/patches/palm_rejection_multitouch_patch.py
      - lib/engine/multi_touch_tap_tracker.dart
      - test/multi_touch_tap_tracker_test.dart

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python .github/patches/palm_rejection_multitouch_patch.py
      - run: flutter gen-l10n
      - run: dart format lib/engine/input_handler.dart lib/engine/multi_touch_tap_tracker.dart lib/services/settings_service.dart lib/screens/settings/pen_settings_screen.dart lib/screens/canvas/widgets/canvas_area.dart test/multi_touch_tap_tracker_test.dart
      - run: flutter test test/multi_touch_tap_tracker_test.dart
      - run: flutter analyze lib/engine/input_handler.dart lib/engine/multi_touch_tap_tracker.dart lib/services/settings_service.dart lib/screens/settings/pen_settings_screen.dart lib/screens/canvas/widgets/canvas_area.dart test/multi_touch_tap_tracker_test.dart
      - name: Commit
        run: |
          rm -f .github/workflows/temporary_palm_rejection_multitouch_apply.yml
          rm -f .github/patches/palm_rejection_multitouch_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: keep multitouch gestures with palm rejection"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
