name: Focus mode menu verification

# Covers initial placement, drag/resize geometry, collapse layout and editor-state retention.

on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/focus-mode-menu-verify.yml"
      - "lib/screens/canvas/canvas_screen.dart"
      - "lib/screens/canvas/widgets/focus_mode_menu.dart"
      - "lib/screens/canvas/widgets/color_adjust_sheet.dart"
      - "lib/screens/canvas/widgets/filter_panel.dart"
      - "test/focus_mode_menu_test.dart"
      - "test/selection_tool_bar_test.dart"

permissions:
  contents: read

jobs:
  focus-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test movable menu behavior
        run: flutter test test/focus_mode_menu_test.dart --reporter expanded
      - name: Test selection controls in the shared menu
        run: flutter test test/selection_tool_bar_test.dart --reporter expanded
      - name: Analyze changed canvas and test files
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/screens/canvas/widgets/focus_mode_menu.dart \
            lib/screens/canvas/widgets/color_adjust_sheet.dart \
            lib/screens/canvas/widgets/filter_panel.dart \
            lib/screens/canvas/canvas_screen.dart \
            test/focus_mode_menu_test.dart \
            test/selection_tool_bar_test.dart
