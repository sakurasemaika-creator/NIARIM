name: One-shot timeline media finalize

on:
  push:
    branches: [tmp/timeline-media-finalize]
    paths:
      - .github/workflows/one-shot-timeline-media-finalize.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/timeline-media-finalize
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Add RED contract
        run: |
          cat > test/timeline_media_contract_test.dart <<'DART'
          import 'dart:io';
          import 'package:flutter_test/flutter_test.dart';
          void main() {
            test('audio import accepts audio and video containers but stays audio-only', () {
              final s = File('lib/screens/timeline/timeline_screen.dart').readAsStringSync();
              expect(s, contains('_ClipTrackType.audio => FileType.custom'));
              expect(s, contains("'mp3'"));
              expect(s, contains("'mp4'"));
              expect(s, contains("'mov'"));
              expect(s, contains('allowedExtensions: allowedExtensions'));
            });
            test('video path keeps embedded audio enabled', () {
              final s = File('lib/screens/timeline/timeline_screen.dart').readAsStringSync();
              expect(s, contains('_ClipTrackType.video => FileType.video'));
              expect(s, contains('await controller.setVolume(clip.volume.clamp(0.0, 1.0));'));
              expect(s, contains('videoVolume: clip.trackType == _ClipTrackType.video'));
            });
            test('audio and video clip editor exposes play pause', () {
              final s = File('lib/screens/timeline/timeline_screen.dart').readAsStringSync();
              expect(s, contains('final ValueGetter<bool> isPlaying;'));
              expect(s, contains('final VoidCallback onTogglePlay;'));
              expect(s, contains('isPlaying: () => _isPlaying'));
              expect(s, contains('onTogglePlay: _togglePlay'));
              expect(s, contains('widget.onTogglePlay();'));
            });
          }
          DART
          set +e
          flutter test test/timeline_media_contract_test.dart
          status=$?
          set -e
          test "$status" -ne 0
      - name: Patch production source
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/screens/timeline/timeline_screen.dart')
          s = p.read_text()

          old = """    final fileType = switch (trackType) {
      _ClipTrackType.audio => FileType.audio,
      _ClipTrackType.video => FileType.video,
      _ClipTrackType.image => FileType.image,
    };
    final result = await FilePicker.platform.pickFiles(type: fileType);"""
          new = """    final allowedExtensions = trackType == _ClipTrackType.audio
        ? const <String>[
            'mp3',
            'wav',
            'm4a',
            'aac',
            'flac',
            'ogg',
            'opus',
            'aiff',
            'wma',
            'mp4',
            'm4v',
            'mov',
            'mkv',
            'webm',
          ]
        : null;
    final fileType = switch (trackType) {
      _ClipTrackType.audio => FileType.custom,
      _ClipTrackType.video => FileType.video,
      _ClipTrackType.image => FileType.image,
    };
    final result = await FilePicker.platform.pickFiles(
      type: fileType,
      allowedExtensions: allowedExtensions,
    );"""
          if s.count(old) != 1:
              raise SystemExit(f'audio picker marker count={s.count(old)}')
          s = s.replace(old, new, 1)

          cb = re.compile(r'(?P<i>\s*)onDuplicate: \(\) => _duplicateClip\(clip\),\s*onChanged: \(\) => setState\(\(\) \{\}\),')
          m = cb.search(s)
          if not m:
              raise SystemExit('clip callback block not found')
          i = m.group('i')
          repl = (f"{i}onDuplicate: () => _duplicateClip(clip),\n"
                  f"{i}onChanged: () {{\n"
                  f"{i}  setState(() {{}});\n"
                  f"{i}  _syncMediaPlayback();\n"
                  f"{i}}},\n"
                  f"{i}isPlaying: () => _isPlaying,\n"
                  f"{i}onTogglePlay: _togglePlay,")
          s = s[:m.start()] + repl + s[m.end():]

          at = s.find('class _ClipDetailSheet extends StatefulWidget')
          if at < 0:
              raise SystemExit('clip detail sheet not found')
          head, tail = s[:at], s[at:]
          tail, n = re.subn(r'(\s*final VoidCallback onChanged;)', r'\1\n  final ValueGetter<bool> isPlaying;\n  final VoidCallback onTogglePlay;', tail, count=1)
          if n != 1:
              raise SystemExit('clip detail fields marker failed')
          tail, n = re.subn(r'required this\.onChanged,', 'required this.onChanged,\n    required this.isPlaying,\n    required this.onTogglePlay,', tail, count=1)
          if n != 1:
              raise SystemExit('clip detail constructor marker failed')
          mark = re.search(r'(?P<i>\s*)IconButton\(\s*icon: const Icon\(Icons\.copy\),', tail)
          if not mark:
              raise SystemExit('copy action marker not found')
          i = mark.group('i')
          play = f"""{i}if (_c.trackType == _ClipTrackType.audio ||
{i}    _c.trackType == _ClipTrackType.video)
{i}  IconButton(
{i}    icon: Icon(widget.isPlaying() ? Icons.pause : Icons.play_arrow),
{i}    tooltip: widget.isPlaying() ? l10n.commonPause : l10n.commonPlay,
{i}    onPressed: () {{
{i}      widget.onTogglePlay();
{i}      setState(() {{}});
{i}    }},
{i}  ),
"""
          tail = tail[:mark.start()] + play + tail[mark.start():]
          p.write_text(head + tail)
          PY
      - run: dart format lib/screens/timeline/timeline_screen.dart test/timeline_media_contract_test.dart
      - run: flutter test test/timeline_media_contract_test.dart --reporter expanded
      - run: flutter analyze --no-fatal-infos
      - run: git diff --check
      - name: Commit verified production change
        run: |
          rm -f .github/workflows/one-shot-timeline-media-finalize.yml
          git config user.name 'NIARIM automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/screens/timeline/timeline_screen.dart test/timeline_media_contract_test.dart .github/workflows/one-shot-timeline-media-finalize.yml
          git commit -m 'feat: finalize timeline audio and video cut playback'
          git push origin HEAD:tmp/timeline-media-finalize
