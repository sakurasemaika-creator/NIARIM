name: TMP PR5 Diagnostic

on:
  push:
    branches:
      - feature/brush-pressure-profiles

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brush-pressure-profiles
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture translation tone output
        shell: bash
        run: |
          set +e
          python tools/audit_translation_tone.py > /tmp/tone.log 2>&1
          echo $? > /tmp/tone.exit
          exit 0
      - name: Capture analyzer output
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos lib test > /tmp/analyze.log 2>&1
          echo $? > /tmp/analyze.exit
          exit 0
      - name: Persist diagnostics
        shell: bash
        run: |
          mkdir -p .github/pr5-diagnostics
          {
            echo '=== Translation Tone ==='
            echo "exit=$(cat /tmp/tone.exit)"
            cat /tmp/tone.log
            echo
            echo '=== Flutter Analyze ==='
            echo "exit=$(cat /tmp/analyze.exit)"
            cat /tmp/analyze.log
          } > .github/pr5-diagnostics/latest.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/pr5-diagnostics/latest.txt
          git commit -m "ci: capture pr5 diagnostics"
          git push origin HEAD:feature/brush-pressure-profiles
