name: One-shot Canvas Boundary Visual Operation Final2

# trigger: asymmetric marker for zoomed edge visual audit
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-canvas-boundary-visual-operation-final2.yml'

permissions:
  contents: read

jobs:
  visual-operation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build independent scenarios robustly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap,re
          src = Path('.github/workflows/one-shot-canvas-boundary-visual-operation.yml').read_text(encoding='utf-8')
          start = "cat > test/canvas_boundary_visual_operation_test.dart <<'DART'\n"
          body = textwrap.dedent(src.split(start, 1)[1].split("\n          DART", 1)[0])
          body = body.replace('writeAsBytes(bytes),', 'writeAsBytes(bytes!),')
          new = r'''              Future<void> resetCanvas() async {
                appRouter.go('/home');
                await tester.pump(const Duration(milliseconds: 100));
                appRouter.go('/canvas/${project.id}');
                for (var i = 0; i < 8; i++) {
                  await tester.pump(const Duration(milliseconds: 100));
                  await tester.runAsync(
                    () => Future<void>.delayed(const Duration(milliseconds: 60)),
                  );
                }
                expect(find.byType(CanvasArea), findsOneWidget);
              }

              Future<void> drawAsymmetricMarker(int pointer) async {
                final c = canvasCenter();
                final g = await tester.startGesture(
                  c + const Offset(-105, -55),
                  pointer: pointer,
                );
                await tester.pump();
                await g.moveTo(c + const Offset(20, -10));
                await tester.pump();
                await g.moveTo(c + const Offset(85, 45));
                await tester.pump();
                await g.up();
                for (var i = 0; i < 4; i++) {
                  await tester.pump(const Duration(milliseconds: 80));
                }
              }

              await capture('00_initial');

              await resetCanvas();
              await pinchToMinScale();
              await capture('01_min_scale_center');

              await resetCanvas();
              await pinchToMinScale();
              await rotateAtMinScale();
              await capture('02_min_scale_rotated');

              await resetCanvas();
              await pinchToMinScale();
              await rotateAtMinScale();
              await middleDrag(const Offset(5000, 0), 41);
              await capture('03_min_scale_drag_far_right');

              await resetCanvas();
              await pinchToMinScale();
              await rotateAtMinScale();
              await middleDrag(const Offset(-5000, -5000), 41);
              await capture('04_min_scale_drag_far_left_top');

              await resetCanvas();
              await pinchToMinScale();
              await rotateAtMinScale();
              await middleDrag(const Offset(5000, 5000), 41);
              await capture('05_min_scale_drag_far_right_bottom');

              await resetCanvas();
              await drawAsymmetricMarker(91);
              await zoomIn();
              await middleDrag(const Offset(5000, 5000), 41);
              await capture('06_zoomed_drag_far_right_bottom');

              await resetCanvas();
              await drawAsymmetricMarker(92);
              await zoomIn();
              await middleDrag(const Offset(-5000, -5000), 41);
              await capture('07_zoomed_drag_far_left_top');

              expect(out.listSync().whereType<File>().length, 8);'''
          pattern = re.compile(r"\s+await capture\('00_initial'\);.*?expect\(out\.listSync\(\)\.whereType<File>\(\)\.length, 8\);", re.S)
          body2,n = pattern.subn('\n'+new, body, count=1)
          assert n == 1, f'replacement count={n}'
          Path('test/canvas_boundary_visual_operation_test.dart').write_text(body2, encoding='utf-8')
          PY
          dart format test/canvas_boundary_visual_operation_test.dart
      - name: Run independent real-operation visual audit
        run: flutter test test/canvas_boundary_visual_operation_test.dart --reporter expanded
      - name: Verify capture diversity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(Path('build/canvas-boundary-visual').glob('*.png'))
          assert len(files) == 8, len(files)
          hashes = [hashlib.sha256(f.read_bytes()).hexdigest() for f in files]
          for f,h in zip(files,hashes): print(f.name,h)
          assert len(set(hashes)) == 8, f'expected 8 unique captures, got {len(set(hashes))}'
          PY
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-boundary-visual-operation-final2
          path: build/canvas-boundary-visual/*.png
          if-no-files-found: error
