name: Community YouTube official player Android build

on:
  push:
    branches: [dev_branch]
    paths:
      - .github/workflows/community-youtube-android-build.yml
      - pubspec.yaml
      - pubspec.lock
      - android/app/src/main/AndroidManifest.xml
      - lib/screens/community/widgets/community_youtube_player.dart
      - lib/screens/community/widgets/community_floating_preview.dart
      - lib/screens/community/widgets/community_shorts_viewer.dart
      - lib/screens/community/community_work_detail_screen.dart
      - test/community_shorts_youtube_playback_test.dart
      - test/community_playback_privacy_actions_test.dart
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-youtube-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/dev_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve exactly locked player dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze actual project without suppressing warnings
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run player privacy and shorts tests
        run: |
          flutter test --no-pub \
            test/community_playback_privacy_actions_test.dart \
            test/community_shorts_youtube_playback_test.dart \
            test/community_shorts_live_state_test.dart
      - name: Compile Android APK with the real YouTube WebView
        run: |
          flutter build apk --debug --no-pub
          test -s build/app/outputs/flutter-apk/app-debug.apk
