name: Brush Extension UI Green

on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - '.github/scripts/integrate_brush_extension_ui.py'
      - '.github/workflows/brush-extension-ui-green.yml'
      - 'lib/screens/canvas/widgets/brush_extension_settings.dart'
      - 'lib/screens/canvas/widgets/brush_panel.dart'
      - 'lib/l10n/app_*.arb'
      - 'test/brush_extension_settings_test.dart'
      - 'test/brush_panel_extension_integration_test.dart'

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Apply focused Task 4 integration
        run: |
          python3 .github/scripts/integrate_brush_extension_ui.py
          flutter gen-l10n
          dart format lib/screens/canvas/widgets/brush_extension_settings.dart lib/screens/canvas/widgets/brush_panel.dart test/brush_extension_settings_test.dart test/brush_panel_extension_integration_test.dart
      - name: Verify Task 4 UI
        run: |
          flutter test test/brush_extension_settings_test.dart --reporter expanded
          flutter test test/brush_panel_extension_integration_test.dart --reporter expanded
          flutter analyze lib/screens/canvas/widgets/brush_extension_settings.dart lib/screens/canvas/widgets/brush_panel.dart test/brush_extension_settings_test.dart test/brush_panel_extension_integration_test.dart --no-fatal-infos --no-fatal-warnings
      - name: Persist verified Task 4 integration
        run: |
          if git diff --quiet -- lib/screens/canvas/widgets/brush_extension_settings.dart lib/screens/canvas/widgets/brush_panel.dart lib/l10n; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/canvas/widgets/brush_extension_settings.dart lib/screens/canvas/widgets/brush_panel.dart lib/l10n
          git commit -m 'feat: integrate localized brush extension settings'
          git fetch origin dev_branch
          git rebase origin/dev_branch
          git push origin HEAD:dev_branch
