name: One-shot undo order fix

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/one-shot-undo-order-fix.yml'
      - 'scripts/one_shot_undo_order_fix.py'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev_branch
        uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Apply guarded patch
        run: python3 scripts/one_shot_undo_order_fix.py

      - name: Format changed files
        run: dart format lib/engine/undo_manager.dart lib/services/project_service.dart test/functional_audit_batch18_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Functional undo onion tests
        run: |
          flutter test test/functional_audit_batch18_test.dart --reporter expanded
          flutter test test/duplicate_layer_test.dart --reporter expanded

      - name: Analyze changed scope
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/engine/undo_manager.dart lib/services/project_service.dart test/functional_audit_batch18_test.dart

      - name: Commit verified patch
        run: |
          git config user.name "NIARIM Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/engine/undo_manager.dart lib/services/project_service.dart test/functional_audit_batch18_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve layer order across undo redo"
          git push origin HEAD:dev_branch
