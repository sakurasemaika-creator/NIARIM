name: Diagnose skipped Flutter tests

on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/diagnose-flutter-skips.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/dev_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Record skip metadata for the four affected test files
        shell: bash
        run: |
          mkdir -p reports
          set +e
          flutter test --no-pub --reporter json --concurrency=3 \
            test/button_label_room_test.dart \
            test/dialog_text_scale_audit_test.dart \
            test/app_tutorial_test.dart \
            test/home_matrix2_loading_test.dart \
            > reports/skip-diagnostics.jsonl \
            2> reports/flutter-stderr.log
          result=$?
          echo "Flutter exit code: $result" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Upload machine-readable test events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-skip-diagnostics-${{ github.sha }}
          path: reports/
          retention-days: 7
          if-no-files-found: warn
