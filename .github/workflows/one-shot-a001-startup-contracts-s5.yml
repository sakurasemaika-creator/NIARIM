name: One-shot A001 Startup Contracts S5

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-a001-startup-contracts-s5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - run: git pull --rebase origin dev_branch
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Record recoverable project startup failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/services/project_service.dart')
          s = p.read_text()
          import_anchor = "import '../engine/undo_manager.dart';\n"
          if "../utils/app_error_reporter.dart" not in s:
              if import_anchor not in s:
                  raise SystemExit('project import anchor changed')
              s = s.replace(import_anchor, import_anchor + "import '../utils/app_error_reporter.dart';\n", 1)
          old = """        } catch (_) {
                    // 破損ファイルはスキップ
                  }
          """
          if old not in s:
              old = """        } catch (_) {
                    // 破損ファイルはスキップ
                  }
          """.replace('          ', '', 1)
          # Use exact compact replacements independent of outer YAML indentation.
          needle = "        } catch (_) {\n          // 破損ファイルはスキップ\n        }"
          repl = "        } catch (error, stackTrace) {\n          AppErrorReporter.record(error, stackTrace);\n          // 破損ファイルはスキップ\n        }"
          if needle not in s:
              raise SystemExit('project corrupt-file catch anchor changed')
          s = s.replace(needle, repl, 1)
          needle = "    } catch (_) {\n      // ストレージアクセス失敗時は空状態で起動\n    }"
          repl = "    } catch (error, stackTrace) {\n      AppErrorReporter.record(error, stackTrace);\n      // ストレージアクセス失敗時は空状態で起動\n    }"
          if needle not in s:
              raise SystemExit('project outer startup catch anchor changed')
          p.write_text(s.replace(needle, repl, 1))
          PY
      - name: Add targeted idempotence tests
        run: |
          cat > test/startup_service_contract_test.dart <<'DART'
          import 'dart:ui';

          import 'package:flutter/foundation.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:niarim/services/advertising_service.dart';
          import 'package:niarim/services/premium_service.dart';
          import 'package:niarim/utils/app_error_reporter.dart';

          class _CountingPremiumService extends PremiumService {
            int addListenerCalls = 0;
            int removeListenerCalls = 0;

            @override
            void addListener(VoidCallback listener) {
              addListenerCalls++;
              super.addListener(listener);
            }

            @override
            void removeListener(VoidCallback listener) {
              removeListenerCalls++;
              super.removeListener(listener);
            }
          }

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            test('AdvertisingService init is idempotent', () async {
              final premium = _CountingPremiumService();
              final service = AdvertisingService(premiumService: premium);
              await service.init();
              await service.init();
              expect(premium.addListenerCalls, 1);
              service.dispose();
              expect(premium.removeListenerCalls, 1);
              premium.dispose();
            });

            test('AppErrorReporter install does not wrap handlers twice', () {
              final beforeFlutter = FlutterError.onError;
              final beforePlatform = PlatformDispatcher.instance.onError;
              addTearDown(() {
                FlutterError.onError = beforeFlutter;
                PlatformDispatcher.instance.onError = beforePlatform;
              });

              AppErrorReporter.install();
              final firstFlutter = FlutterError.onError;
              final firstPlatform = PlatformDispatcher.instance.onError;
              AppErrorReporter.install();

              expect(identical(FlutterError.onError, firstFlutter), isTrue);
              expect(identical(PlatformDispatcher.instance.onError, firstPlatform), isTrue);
            });
          }
          DART
      - name: Format S5 files
        run: dart format lib/utils/app_error_reporter.dart lib/services/advertising_service.dart lib/services/project_service.dart test/startup_service_contract_test.dart
      - name: Verify S5 targeted contracts
        run: flutter test --no-pub --reporter expanded test/startup_service_contract_test.dart
      - name: Analyze S5 touched files
        run: flutter analyze lib/utils/app_error_reporter.dart lib/services/advertising_service.dart lib/services/project_service.dart test/startup_service_contract_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Commit verified S5 evidence code
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-a001-startup-contracts-s5.yml
          git add lib/services/project_service.dart test/startup_service_contract_test.dart lib/utils/app_error_reporter.dart lib/services/advertising_service.dart
          git commit -m 'test: enforce startup initialization contracts'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
