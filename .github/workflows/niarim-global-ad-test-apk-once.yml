# Dev-branch only test APK; official Google test ads. No live ads, no public release.
name: NIARIM global-banner Galaxy test APK (one shot)
on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/niarim-global-ad-test-apk-once.yml"
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Analyze app
        run: flutter analyze --no-fatal-infos
      - name: Validate persistent banner and popup layout
        run: flutter test test/ad_mock_layout_test.dart
      - name: Restore the fixed NIARIM debug signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NIARIM_DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NIARIM_DEBUG_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/niarim-ci-debug.jks"
          chmod 600 "$RUNNER_TEMP/niarim-ci-debug.jks"
          keytool -list -keystore "$RUNNER_TEMP/niarim-ci-debug.jks" -storepass "$KEYSTORE_PASSWORD" -alias niarim_ci_debug >/dev/null
      - name: Build Galaxy APK with test ads and development Google auth
        env:
          NIARIM_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/niarim-ci-debug.jks
          NIARIM_DEBUG_STORE_PASSWORD: ${{ secrets.NIARIM_DEBUG_STORE_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$GOOGLE_CLIENT_ID" =~ ^[a-zA-Z0-9-]+[.]apps[.]googleusercontent[.]com$ ]]; then
            echo "::error::GOOGLE_CLIENT_ID is not configured"
            exit 1
          fi
          flutter build apk --debug \
            --dart-define=NIARIM_API_BASE_URL=https://ibjfhyoqvfanle62ltokgz6sry0fjqfh.lambda-url.ap-northeast-1.on.aws/ \
            --dart-define="NIARIM_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
      - name: Upload private Galaxy APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: niarim-global-banner-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          if-no-files-found: error
