name: One-shot Custom Automation Checkpoint Diagnostic

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-custom-automation-checkpoint-diagnostic.yml'
  workflow_dispatch:

jobs:
  locate-production-widget-stall:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Patch production proof to in-tree overlay host
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/custom_automation_production_visual_test.dart')
          s = p.read_text()

          old_fields = """  final StateSetter rebuildHost;\n  String? _projectId;\n\n  _ProductionHarness({\n    required this.tester,\n    required this.out,\n    required this.projectService,\n    required this.rootKey,\n    required this.rebuildHost,\n  });"""
          new_fields = """  final StateSetter rebuildHost;\n  String? _projectId;\n  late void Function(Widget? overlay) _setOverlay;\n\n  _ProductionHarness({\n    required this.tester,\n    required this.out,\n    required this.projectService,\n    required this.rootKey,\n    required this.rebuildHost,\n  });"""
          if old_fields not in s:
            raise SystemExit('harness field anchor changed')
          s = s.replace(old_fields, new_fields, 1)

          old_locals = """    StateSetter? hostSetter;\n    String? activeProjectId;\n    final rootKey = GlobalKey();"""
          new_locals = """    StateSetter? hostSetter;\n    String? activeProjectId;\n    Widget? activeOverlay;\n    final rootKey = GlobalKey();"""
          if old_locals not in s:
            raise SystemExit('create local anchor changed')
          s = s.replace(old_locals, new_locals, 1)

          old_home = """              home: StatefulBuilder(\n                builder: (context, setState) {\n                  ps ??= context.read<ProjectService>();\n                  hostSetter = setState;\n                  if (activeProjectId == null) return const SizedBox.expand();\n                  return CanvasScreen(\n                    key: ValueKey(activeProjectId),\n                    projectId: activeProjectId!,\n                  );\n                },\n              ),"""
          new_home = """              home: StatefulBuilder(\n                builder: (context, setState) {\n                  ps ??= context.read<ProjectService>();\n                  hostSetter = setState;\n                  return Stack(\n                    fit: StackFit.expand,\n                    children: [\n                      if (activeProjectId == null)\n                        const SizedBox.expand()\n                      else\n                        CanvasScreen(\n                          key: ValueKey(activeProjectId),\n                          projectId: activeProjectId!,\n                        ),\n                      if (activeOverlay != null) activeOverlay!,\n                    ],\n                  );\n                },\n              ),"""
          if old_home not in s:
            raise SystemExit('home anchor changed')
          s = s.replace(old_home, new_home, 1)

          old_set_project = """    harness._setProject = (id) {\n      activeProjectId = id;\n      harness._projectId = id;\n      hostSetter!(() {});\n    };\n    return harness;"""
          new_set_project = """    harness._setProject = (id) {\n      activeProjectId = id;\n      harness._projectId = id;\n      hostSetter!(() {});\n    };\n    harness._setOverlay = (overlay) {\n      hostSetter!(() => activeOverlay = overlay);\n    };\n    return harness;"""
          if old_set_project not in s:
            raise SystemExit('setProject anchor changed')
          s = s.replace(old_set_project, new_set_project, 1)

          old_manager = """  void showManager() {\n    final context = canvasContext;\n    unawaited(\n      showModalBottomSheet<void>(\n        context: context,\n        isScrollControlled: true,\n        builder: (_) => CustomAutomationManagerSheet(\n          surface: CustomAutomationSurface.canvas,\n          recordingStartFrame: canvasWidget.currentFrame,\n          frameCount: projectService.frameCount(\n            projectId,\n            canvasWidget.sceneId,\n          ),\n          onRecordingStarted: () {},\n          onExecute: _execute,\n        ),\n      ),\n    );\n  }"""
          new_manager = """  void showManager() {\n    final startFrame = canvasWidget.currentFrame;\n    final count = projectService.frameCount(projectId, canvasWidget.sceneId);\n    _setOverlay(\n      Material(\n        type: MaterialType.transparency,\n        child: ColoredBox(\n          color: Colors.black54,\n          child: Align(\n            alignment: Alignment.bottomCenter,\n            child: CustomAutomationManagerSheet(\n              surface: CustomAutomationSurface.canvas,\n              recordingStartFrame: startFrame,\n              frameCount: count,\n              onRecordingStarted: () => _setOverlay(null),\n              onExecute: _execute,\n            ),\n          ),\n        ),\n      ),\n    );\n  }"""
          if old_manager not in s:
            raise SystemExit('manager anchor changed')
          s = s.replace(old_manager, new_manager, 1)

          checkpoint = """      await harness.capture('00_canvas_before_recording');\n      harness.showManager();\n      await tester.pump(const Duration(milliseconds: 300));\n      await harness.capture('01_manager_open');"""
          checkpoint_new = """      await harness.capture('00_canvas_before_recording');\n      print('CHECKPOINT capture 00 done');\n      harness.showManager();\n      print('CHECKPOINT in-tree showManager returned');\n      await tester.pump();\n      print('CHECKPOINT in-tree manager first pump done');\n      expect(find.byType(CustomAutomationManagerSheet), findsOneWidget);\n      await harness.capture('01_manager_open');\n      print('CHECKPOINT in-tree capture 01 done');"""
          if checkpoint not in s:
            raise SystemExit('checkpoint anchor changed')
          s = s.replace(checkpoint, checkpoint_new, 1)

          s = s.replace(
            "    timeout: const Timeout(Duration(minutes: 4)),",
            "    timeout: const Timeout(Duration(seconds: 60)),",
            1,
          )
          p.write_text(s)
          PY
      - run: dart format test/custom_automation_production_visual_test.dart
      - name: Analyze in-tree overlay proof
        run: flutter analyze test/custom_automation_production_visual_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Run Canvas plus in-tree manager diagnostic
        run: flutter test test/custom_automation_production_visual_test.dart --plain-name 'real Canvas widgets record -> apply -> stop -> edit -> save -> replay with PNG evidence' --reporter expanded
      - name: Upload diagnostic checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-step2-checkpoint-diagnostic
          path: build/visual-reaudit/custom-automation-production
          if-no-files-found: warn
          retention-days: 1
