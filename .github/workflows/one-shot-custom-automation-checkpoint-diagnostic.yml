name: One-shot Custom Automation Checkpoint Diagnostic

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-custom-automation-checkpoint-diagnostic.yml'
  workflow_dispatch:

jobs:
  locate-production-widget-stall:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Patch production proof to nested overlay host
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/custom_automation_production_visual_test.dart')
          s = p.read_text()

          old_fields = """  final StateSetter rebuildHost;\n  String? _projectId;\n\n  _ProductionHarness({\n    required this.tester,\n    required this.out,\n    required this.projectService,\n    required this.rootKey,\n    required this.rebuildHost,\n  });"""
          new_fields = """  final StateSetter rebuildHost;\n  final GlobalKey<NavigatorState> overlayNavigatorKey;\n  String? _projectId;\n\n  _ProductionHarness({\n    required this.tester,\n    required this.out,\n    required this.projectService,\n    required this.rootKey,\n    required this.rebuildHost,\n    required this.overlayNavigatorKey,\n  });"""
          if old_fields not in s:
            raise SystemExit('harness field anchor changed')
          s = s.replace(old_fields, new_fields, 1)

          old_create = """    final rootKey = GlobalKey();\n\n    await tester.pumpWidget(\n      RepaintBoundary(\n        key: rootKey,\n        child: MultiProvider(\n          providers: providers!,\n          child: Builder(\n            builder: (themeContext) => MaterialApp(\n              theme: themeContext.watch<ThemeService>().themeData,\n              locale: const Locale('ja'),\n              localizationsDelegates: AppLocalizations.localizationsDelegates,\n              supportedLocales: AppLocalizations.supportedLocales,\n              home: StatefulBuilder(\n                builder: (context, setState) {\n                  ps ??= context.read<ProjectService>();\n                  hostSetter = setState;\n                  if (activeProjectId == null) return const SizedBox.expand();\n                  return CanvasScreen(\n                    key: ValueKey(activeProjectId),\n                    projectId: activeProjectId!,\n                  );\n                },\n              ),\n            ),\n          ),\n        ),\n      ),\n    );"""
          new_create = """    final rootKey = GlobalKey();\n    final overlayNavigatorKey = GlobalKey<NavigatorState>();\n\n    await tester.pumpWidget(\n      RepaintBoundary(\n        key: rootKey,\n        child: MultiProvider(\n          providers: providers!,\n          child: Builder(\n            builder: (themeContext) => MaterialApp(\n              theme: themeContext.watch<ThemeService>().themeData,\n              locale: const Locale('ja'),\n              localizationsDelegates: AppLocalizations.localizationsDelegates,\n              supportedLocales: AppLocalizations.supportedLocales,\n              home: StatefulBuilder(\n                builder: (context, setState) {\n                  ps ??= context.read<ProjectService>();\n                  hostSetter = setState;\n                  return Stack(\n                    fit: StackFit.expand,\n                    children: [\n                      if (activeProjectId == null)\n                        const SizedBox.expand()\n                      else\n                        CanvasScreen(\n                          key: ValueKey(activeProjectId),\n                          projectId: activeProjectId!,\n                        ),\n                      IgnorePointer(\n                        ignoring: activeProjectId == null,\n                        child: Navigator(\n                          key: overlayNavigatorKey,\n                          onGenerateRoute: (_) => PageRouteBuilder<void>(\n                            opaque: false,\n                            barrierColor: Colors.transparent,\n                            transitionDuration: Duration.zero,\n                            reverseTransitionDuration: Duration.zero,\n                            pageBuilder: (_, __, ___) => const SizedBox.shrink(),\n                          ),\n                        ),\n                      ),\n                    ],\n                  );\n                },\n              ),\n            ),\n          ),\n        ),\n      ),\n    );"""
          if old_create not in s:
            raise SystemExit('create host anchor changed')
          s = s.replace(old_create, new_create, 1)

          old_ctor = """      rebuildHost: (fn) {\n        hostSetter!(fn);\n        harness._projectId = activeProjectId;\n      },\n    );"""
          new_ctor = """      rebuildHost: (fn) {\n        hostSetter!(fn);\n        harness._projectId = activeProjectId;\n      },\n      overlayNavigatorKey: overlayNavigatorKey,\n    );"""
          if old_ctor not in s:
            raise SystemExit('constructor anchor changed')
          s = s.replace(old_ctor, new_ctor, 1)

          old_manager = """  void showManager() {\n    final context = canvasContext;\n    unawaited(\n      showModalBottomSheet<void>(\n        context: context,\n        isScrollControlled: true,\n        builder: (_) => CustomAutomationManagerSheet(\n          surface: CustomAutomationSurface.canvas,\n          recordingStartFrame: canvasWidget.currentFrame,\n          frameCount: projectService.frameCount(\n            projectId,\n            canvasWidget.sceneId,\n          ),\n          onRecordingStarted: () {},\n          onExecute: _execute,\n        ),\n      ),\n    );\n  }"""
          new_manager = """  void showManager() {\n    final startFrame = canvasWidget.currentFrame;\n    final count = projectService.frameCount(projectId, canvasWidget.sceneId);\n    unawaited(\n      overlayNavigatorKey.currentState!.push(\n        PageRouteBuilder<void>(\n          opaque: false,\n          barrierColor: Colors.black54,\n          transitionDuration: Duration.zero,\n          reverseTransitionDuration: Duration.zero,\n          pageBuilder: (_, __, ___) => Material(\n            type: MaterialType.transparency,\n            child: Align(\n              alignment: Alignment.bottomCenter,\n              child: CustomAutomationManagerSheet(\n                surface: CustomAutomationSurface.canvas,\n                recordingStartFrame: startFrame,\n                frameCount: count,\n                onRecordingStarted: () {},\n                onExecute: _execute,\n              ),\n            ),\n          ),\n        ),\n      ),\n    );\n  }"""
          if old_manager not in s:
            raise SystemExit('manager anchor changed')
          s = s.replace(old_manager, new_manager, 1)

          checkpoint = """      await harness.capture('00_canvas_before_recording');\n      harness.showManager();\n      await tester.pump(const Duration(milliseconds: 300));\n      await harness.capture('01_manager_open');"""
          checkpoint_new = """      await harness.capture('00_canvas_before_recording');\n      print('CHECKPOINT capture 00 done');\n      harness.showManager();\n      print('CHECKPOINT nested showManager returned');\n      await tester.pump();\n      print('CHECKPOINT nested manager first pump done');\n      expect(find.byType(CustomAutomationManagerSheet), findsOneWidget);\n      await harness.capture('01_manager_open');\n      print('CHECKPOINT nested capture 01 done');"""
          if checkpoint not in s:
            raise SystemExit('checkpoint anchor changed')
          s = s.replace(checkpoint, checkpoint_new, 1)

          s = s.replace(
            "    timeout: const Timeout(Duration(minutes: 4)),",
            "    timeout: const Timeout(Duration(seconds: 60)),",
            1,
          )
          p.write_text(s)
          PY
      - run: dart format test/custom_automation_production_visual_test.dart
      - name: Analyze nested overlay proof
        run: flutter analyze test/custom_automation_production_visual_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Run Canvas plus nested manager diagnostic
        run: flutter test test/custom_automation_production_visual_test.dart --plain-name 'real Canvas widgets record -> apply -> stop -> edit -> save -> replay with PNG evidence' --reporter expanded
      - name: Upload diagnostic checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-step2-checkpoint-diagnostic
          path: build/visual-reaudit/custom-automation-production
          if-no-files-found: warn
          retention-days: 1
