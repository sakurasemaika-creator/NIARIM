name: Chat Flutter Targeted Verification

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/chat-flutter-verify.yml'
      - '.github/scripts/apply_drawing_engine_brush_extensions.py'
      - '.github/scripts/complete_screen_space_fold_integration.py'
      - '.github/scripts/complete_mosaic_integration.py'
      - 'lib/models/brush.dart'
      - 'lib/models/brush_extension_defaults.dart'
      - 'lib/models/brush_presets_extension.dart'
      - 'lib/models/ruler.dart'
      - 'lib/models/filter_def.dart'
      - 'lib/services/brush_service.dart'
      - 'lib/services/filter_service.dart'
      - 'lib/engine/drawing_engine.dart'
      - 'lib/engine/brush_stroke_geometry.dart'
      - 'lib/engine/brush_render_plan.dart'
      - 'lib/engine/outlined_stroke_compositor.dart'
      - 'lib/engine/ruler_engine.dart'
      - 'lib/engine/filter_engine.dart'
      - 'lib/screens/canvas/widgets/filter_panel.dart'
      - 'test/models/brush_extensions_test.dart'
      - 'test/models/brush_extension_defaults_test.dart'
      - 'test/models/brush_extension_presets_test.dart'
      - 'test/models/mosaic_filter_def_contract_test.dart'
      - 'test/services/brush_service_extension_presets_test.dart'
      - 'test/engine/drawing_engine_brush_extensions_test.dart'
      - 'test/engine/brush_stroke_geometry_test.dart'
      - 'test/engine/drawing_engine_wave_fold_contract_test.dart'
      - 'test/engine/brush_render_plan_test.dart'
      - 'test/engine/outlined_stroke_compositor_test.dart'
      - 'test/engine/ruler_snap_toggle_test.dart'
      - 'test/engine/mosaic_filter_test.dart'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Targeted brush, ruler, and mosaic tests
        run: |
          flutter test test/models/brush_extensions_test.dart --reporter expanded
          flutter test test/models/brush_extension_defaults_test.dart --reporter expanded
          flutter test test/models/brush_extension_presets_test.dart --reporter expanded
          flutter test test/models/mosaic_filter_def_contract_test.dart --reporter expanded
          flutter test test/services/brush_service_extension_presets_test.dart --reporter expanded
          flutter test test/engine/brush_stroke_geometry_test.dart --reporter expanded
          flutter test test/engine/drawing_engine_wave_fold_contract_test.dart --reporter expanded
          flutter test test/engine/brush_render_plan_test.dart --reporter expanded
          flutter test test/engine/outlined_stroke_compositor_test.dart --reporter expanded
          flutter test test/engine/ruler_snap_toggle_test.dart --reporter expanded
          flutter test test/engine/drawing_engine_brush_extensions_test.dart --reporter expanded
          flutter test test/engine/mosaic_filter_test.dart --reporter expanded
          if [ -f test/engine/pixel_art_engine_test.dart ]; then flutter test test/engine/pixel_art_engine_test.dart --reporter expanded; fi
          if [ -f test/engine/filter_pixel_art_route_test.dart ]; then flutter test test/engine/filter_pixel_art_route_test.dart --reporter expanded; fi
          if [ -f test/engine/stamp_pixel_art_route_test.dart ]; then flutter test test/engine/stamp_pixel_art_route_test.dart --reporter expanded; fi
          if [ -f test/engine/noise_filter_distinction_test.dart ]; then flutter test test/engine/noise_filter_distinction_test.dart --reporter expanded; fi
          if [ -f test/engine/analog_filter_distinction_test.dart ]; then flutter test test/engine/analog_filter_distinction_test.dart --reporter expanded; fi
      - name: Targeted analyze
        run: flutter analyze lib/models/brush.dart lib/models/brush_extension_defaults.dart lib/models/brush_presets_extension.dart lib/models/ruler.dart lib/models/filter_def.dart lib/services/brush_service.dart lib/services/filter_service.dart lib/engine/drawing_engine.dart lib/engine/brush_stroke_geometry.dart lib/engine/brush_render_plan.dart lib/engine/outlined_stroke_compositor.dart lib/engine/ruler_engine.dart lib/engine/filter_engine.dart lib/engine/pixel_art_engine.dart lib/screens/canvas/widgets/filter_panel.dart test/engine/drawing_engine_wave_fold_contract_test.dart --no-fatal-infos --no-fatal-warnings
