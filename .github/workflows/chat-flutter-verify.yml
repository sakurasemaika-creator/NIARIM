name: Chat Flutter Targeted Verification

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/chat-flutter-verify.yml'
      - '.github/chat-integration-trigger.txt'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - name: Merge feature history while preserving current dev conflicts
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feature/pixel-filter-blend-refresh
          git merge --no-ff -X ours -m 'merge: preserve pixel filter refresh history on dev_branch' origin/feature/pixel-filter-blend-refresh
      - name: Verify integrated production tree
        run: |
          set -euxo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze lib/models/filter_def.dart lib/engine/pixel_art_engine.dart lib/engine/filter_engine.dart lib/engine/prism_filter_engine.dart lib/services/filter_service.dart lib/screens/canvas/widgets/filter_panel.dart --no-fatal-infos --no-fatal-warnings
          tests=()
          for t in \
            test/engine/pixel_art_engine_test.dart \
            test/engine/filter_engine_pixel_art_contract_test.dart \
            test/engine/filter_pixel_art_route_test.dart \
            test/engine/stamp_pixel_art_route_test.dart \
            test/engine/mosaic_filter_contract_test.dart \
            test/models/mosaic_filter_def_contract_test.dart \
            test/mosaic_filter_test.dart \
            test/engine/noise_filter_distinction_test.dart \
            test/engine/analog_filter_distinction_test.dart; do
            [ -f "$t" ] && tests+=("$t")
          done
          if [ ${#tests[@]} -gt 0 ]; then flutter test "${tests[@]}" --reporter expanded; fi
      - name: Persist verified merge
        run: |
          set -euxo pipefail
          git fetch origin dev_branch
          git rebase origin/dev_branch
          git push origin HEAD:dev_branch
