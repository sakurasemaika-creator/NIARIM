name: Chat Flutter Targeted Verification

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/chat-flutter-verify.yml'
      - 'lib/models/brush.dart'
      - 'lib/models/brush_extension_defaults.dart'
      - 'lib/models/brush_presets_extension.dart'
      - 'lib/models/ruler.dart'
      - 'lib/engine/brush_stroke_geometry.dart'
      - 'lib/engine/brush_render_plan.dart'
      - 'lib/engine/outlined_stroke_compositor.dart'
      - 'lib/engine/ruler_engine.dart'
      - 'test/models/brush_extensions_test.dart'
      - 'test/models/brush_extension_defaults_test.dart'
      - 'test/models/brush_extension_presets_test.dart'
      - 'test/engine/brush_stroke_geometry_test.dart'
      - 'test/engine/brush_render_plan_test.dart'
      - 'test/engine/outlined_stroke_compositor_test.dart'
      - 'test/engine/ruler_snap_toggle_test.dart'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Apply approved default fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/models/brush.dart')
          s = p.read_text()
          s = s.replace('this.outlineWidth = 1.0,', 'this.outlineWidth = 1.5,')
          s = s.replace('this.yBranchWidthRatio = 0.12,', 'this.yBranchWidthRatio = 0.08,')
          s = s.replace("outlineWidth: (j['outlineWidth'] as num?)?.toDouble() ?? 1.0,", "outlineWidth: (j['outlineWidth'] as num?)?.toDouble() ?? 1.5,")
          s = s.replace("(j['yBranchWidthRatio'] as num?)?.toDouble() ?? 0.12,", "(j['yBranchWidthRatio'] as num?)?.toDouble() ?? 0.08,")
          p.write_text(s)
          PY
      - name: Targeted brush and ruler tests
        run: |
          flutter test test/models/brush_extensions_test.dart --reporter expanded
          flutter test test/models/brush_extension_defaults_test.dart --reporter expanded
          flutter test test/models/brush_extension_presets_test.dart --reporter expanded
          flutter test test/engine/brush_stroke_geometry_test.dart --reporter expanded
          flutter test test/engine/brush_render_plan_test.dart --reporter expanded
          flutter test test/engine/outlined_stroke_compositor_test.dart --reporter expanded
          flutter test test/engine/ruler_snap_toggle_test.dart --reporter expanded
      - name: Targeted analyze
        run: flutter analyze lib/models/brush.dart lib/models/brush_extension_defaults.dart lib/models/brush_presets_extension.dart lib/models/ruler.dart lib/engine/brush_stroke_geometry.dart lib/engine/brush_render_plan.dart lib/engine/outlined_stroke_compositor.dart lib/engine/ruler_engine.dart test/models/brush_extensions_test.dart test/models/brush_extension_defaults_test.dart test/models/brush_extension_presets_test.dart test/engine/brush_stroke_geometry_test.dart test/engine/brush_render_plan_test.dart test/engine/outlined_stroke_compositor_test.dart test/engine/ruler_snap_toggle_test.dart --no-fatal-infos
      - name: Persist verified default fix
        run: |
          if git diff --quiet -- lib/models/brush.dart; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/models/brush.dart
          git commit -m 'fix: align brush extension defaults with approved spec'
          git push origin HEAD:dev_branch
