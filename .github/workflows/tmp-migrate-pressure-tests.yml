name: TMP Migrate Pressure Tests

on:
  push:
    branches:
      - feature/brush-pressure-profiles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brush-pressure-profiles
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Migrate fixed-value Brush test fixtures
        run: python tool/tmp_migrate_pressure_tests.py
      - name: Format migrated tests
        run: dart format test
      - name: Commit migrated fixtures
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test
          git diff --cached --check
          git commit -m "test: migrate brush fixtures to pressure profiles"
          git push origin HEAD:feature/brush-pressure-profiles
