name: Refine Aurora Hologram Palettes

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/refine-aurora-hologram-palettes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Replace standard hologram palettes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/engine/filter_engine.dart')
          s = p.read_text()
          palettes = {
          'aurora': '''    AuroraHologramPreset.aurora => const [
                (0.00, 10, 58, 112),
                (0.06, 0, 168, 255),
                (0.12, 44, 242, 210),
                (0.18, 171, 255, 205),
                (0.24, 226, 255, 239),
                (0.30, 255, 255, 255),
                (0.36, 191, 235, 255),
                (0.43, 62, 191, 242),
                (0.50, 92, 83, 222),
                (0.57, 202, 185, 255),
                (0.64, 247, 240, 255),
                (0.70, 43, 238, 194),
                (0.77, 188, 255, 215),
                (0.84, 35, 160, 235),
                (0.91, 118, 89, 225),
                (0.96, 229, 215, 255),
                (1.00, 255, 255, 255),
              ],''',
          'soapBubble': '''    AuroraHologramPreset.soapBubble => const [
                (0.00, 244, 252, 255),
                (0.06, 255, 255, 255),
                (0.12, 210, 242, 255),
                (0.18, 255, 221, 241),
                (0.24, 255, 42, 188),
                (0.30, 240, 220, 255),
                (0.36, 221, 255, 235),
                (0.42, 255, 245, 211),
                (0.48, 255, 255, 255),
                (0.55, 215, 239, 255),
                (0.62, 247, 220, 255),
                (0.69, 255, 224, 231),
                (0.76, 226, 255, 238),
                (0.83, 255, 244, 215),
                (0.91, 226, 233, 255),
                (1.00, 255, 255, 255),
              ],''',
          'cyberNeon': '''    AuroraHologramPreset.cyberNeon => const [
                (0.00, 18, 11, 62),
                (0.06, 28, 32, 142),
                (0.12, 0, 129, 255),
                (0.18, 0, 245, 255),
                (0.24, 55, 255, 160),
                (0.30, 199, 255, 42),
                (0.36, 255, 33, 151),
                (0.42, 255, 57, 223),
                (0.49, 142, 44, 255),
                (0.55, 222, 235, 255),
                (0.61, 255, 255, 255),
                (0.67, 255, 219, 244),
                (0.73, 0, 255, 216),
                (0.80, 171, 255, 47),
                (0.87, 255, 37, 170),
                (0.94, 176, 57, 255),
                (1.00, 28, 65, 210),
              ],''',
          'pastelDream': '''    AuroraHologramPreset.pastelDream => const [
                (0.00, 223, 236, 255),
                (0.07, 242, 233, 255),
                (0.14, 255, 225, 240),
                (0.21, 255, 226, 211),
                (0.28, 255, 244, 199),
                (0.35, 225, 250, 221),
                (0.42, 34, 224, 255),
                (0.49, 255, 255, 255),
                (0.56, 219, 232, 255),
                (0.63, 239, 222, 255),
                (0.70, 255, 217, 235),
                (0.77, 255, 230, 205),
                (0.84, 247, 245, 204),
                (0.91, 218, 247, 227),
                (0.97, 240, 247, 255),
                (1.00, 255, 255, 255),
              ],''',
          'sunsetGold': '''    AuroraHologramPreset.sunsetGold => const [
                (0.00, 91, 35, 58),
                (0.06, 145, 51, 74),
                (0.12, 221, 73, 103),
                (0.18, 255, 70, 92),
                (0.24, 255, 149, 88),
                (0.30, 255, 202, 92),
                (0.36, 255, 238, 154),
                (0.42, 255, 246, 211),
                (0.48, 255, 255, 255),
                (0.54, 244, 213, 255),
                (0.60, 255, 116, 159),
                (0.66, 255, 151, 83),
                (0.72, 255, 205, 82),
                (0.78, 255, 241, 145),
                (0.84, 255, 222, 197),
                (0.91, 222, 190, 255),
                (1.00, 255, 247, 226),
              ],''',
          }
          for name, replacement in palettes.items():
              pattern = rf'    AuroraHologramPreset\.{name} => const \[.*?^    \],'
              s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S | re.M)
              if n != 1:
                  raise SystemExit(f'palette anchor failed: {name} ({n})')
              s = s2
          p.write_text(s)
          PY
      - run: dart format lib/engine/filter_engine.dart test/aurora_hologram_visual_audit_test.dart
      - name: Verify palette contract and PNG generation
        run: flutter test test/aurora_hologram_visual_audit_test.dart --reporter expanded
      - name: Analyze touched implementation and test
        run: flutter analyze lib/engine/filter_engine.dart test/aurora_hologram_visual_audit_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Commit verified palette refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refine-aurora-hologram-palettes.yml
          git add lib/engine/filter_engine.dart test/aurora_hologram_visual_audit_test.dart
          git commit -m 'fix: rebalance standard aurora hologram palettes'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
