name: One-shot Project Tag Search
on:
  push:
    branches: [dev_branch]
    paths:
      - 'tool/patch_project_tag_search.py'
      - '.github/workflows/one-shot-project-tag-search.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply project tag search implementation
        run: python3 tool/patch_project_tag_search.py
      - name: Format focused files
        run: dart format lib/screens/home/home_screen.dart lib/screens/home/widgets/project_list_widget.dart lib/screens/project/project_detail_screen.dart
      - run: flutter pub get
      - name: Static analysis
        run: flutter analyze lib/screens/home/home_screen.dart lib/screens/home/widgets/project_list_widget.dart lib/screens/project/project_detail_screen.dart
      - name: Run project/tag focused tests
        run: |
          if [ -f test/services/project_service_test.dart ]; then
            flutter test test/services/project_service_test.dart
          else
            echo 'No focused project_service_test.dart; static analysis completed.'
          fi
      - name: Verify implementation markers
        run: |
          grep -q "searchByTag: _searchByTag" lib/screens/home/home_screen.dart
          grep -q "p.tags.any" lib/screens/home/widgets/project_list_widget.dart
          grep -q "project.tags.isNotEmpty" lib/screens/project/project_detail_screen.dart
      - name: Commit implementation
        run: |
          if git diff --quiet -- lib/screens/home/home_screen.dart lib/screens/home/widgets/project_list_widget.dart lib/screens/project/project_detail_screen.dart; then
            echo 'No implementation diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/home/home_screen.dart lib/screens/home/widgets/project_list_widget.dart lib/screens/project/project_detail_screen.dart
          git commit -m 'feat: show and search project tags'
          git push origin HEAD:dev_branch
