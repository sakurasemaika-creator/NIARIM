name: Temporary Mosaic UI Connect

on:
  push:
    branches:
      - feature/pixel-filter-blend-refresh
    paths:
      - .github/workflows/tmp-mosaic-ui-connect.yml

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-filter-blend-refresh
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Verify RED contract before UI connection
        run: |
          set +e
          flutter test test/mosaic_filter_test.dart > /tmp/mosaic-red.log 2>&1
          status=$?
          cat /tmp/mosaic-red.log
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Mosaic engine contract is already GREEN; continuing with UI-only connection."
          else
            echo "Mosaic contract currently RED as expected before completing integration."
          fi
      - name: Connect Mosaic UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/canvas/widgets/filter_panel.dart')
          s = p.read_text()
          replacements = [
            (
              "      case FilterKind.pixelate:\n        return Column(\n",
              "      case FilterKind.mosaic:\n        return _paramSlider(\n          l10n.filterPixelateBlockSize,\n          current.strength,\n          1,\n          64,\n          (v) => service.updateFilterParams(current.id, strength: v),\n        );\n      case FilterKind.pixelate:\n        return Column(\n",
            ),
            (
              "      FilterKind.pixelate => l10n.filterNamePixelate,\n",
              "      FilterKind.pixelate => l10n.filterNamePixelate,\n      FilterKind.mosaic => filter.name,\n",
            ),
            (
              "      FilterKind.pixelate => Icons.grid_view,\n",
              "      FilterKind.pixelate => Icons.grid_view,\n      FilterKind.mosaic => Icons.grid_4x4,\n",
            ),
            (
              "      case FilterKind.pixelate:\n        return _engine.applyPixelate(\n",
              "      case FilterKind.mosaic:\n        return _engine.applyMosaic(\n          data,\n          width,\n          height,\n          blockSize: filter.strength.round().clamp(1, 64),\n        );\n      case FilterKind.pixelate:\n        return _engine.applyPixelate(\n",
            ),
          ]
          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          dart format lib/screens/canvas/widgets/filter_panel.dart
      - name: Verify Mosaic integration
        run: |
          flutter test test/mosaic_filter_test.dart test/models/mosaic_filter_def_contract_test.dart
          flutter analyze lib/models/filter_def.dart lib/services/filter_service.dart lib/engine/filter_engine.dart lib/screens/canvas/widgets/filter_panel.dart test/mosaic_filter_test.dart test/models/mosaic_filter_def_contract_test.dart
      - name: Commit UI connection and remove temporary workflow
        run: |
          rm .github/workflows/tmp-mosaic-ui-connect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/canvas/widgets/filter_panel.dart .github/workflows/tmp-mosaic-ui-connect.yml
          git commit -m "feat: connect mosaic filter UI and preview"
          git push origin HEAD:feature/pixel-filter-blend-refresh
