name: Apply configurable four-plus-finger gesture

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/patches/four_plus_finger_gesture_patch.py'
      - '.github/workflows/temporary_four_plus_finger_gesture_apply.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python .github/patches/four_plus_finger_gesture_patch.py
      - run: flutter gen-l10n
      - run: dart format lib/engine/multi_touch_tap_tracker.dart lib/services/settings_service.dart lib/screens/settings/gesture_settings_screen.dart lib/screens/canvas/widgets/canvas_area.dart test/multi_touch_tap_tracker_test.dart
      - run: flutter test test/multi_touch_tap_tracker_test.dart
      - run: flutter analyze lib/engine/multi_touch_tap_tracker.dart lib/services/settings_service.dart lib/screens/settings/gesture_settings_screen.dart lib/screens/canvas/widgets/canvas_area.dart test/multi_touch_tap_tracker_test.dart
      - name: Commit
        run: |
          rm -f .github/patches/four_plus_finger_gesture_patch.py
          rm -f .github/workflows/temporary_four_plus_finger_gesture_apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: configure four-plus-finger tap gesture"
          git push origin HEAD:dev_branch
