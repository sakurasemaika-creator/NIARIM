name: Legal screens typography and compact-layout verification

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/legal-screens-ui-capture.yml'
      - 'lib/screens/settings/privacy_policy_screen.dart'
      - 'lib/screens/settings/license_screen.dart'
      - 'lib/screens/settings/error_log_screen.dart'
      - 'test/legal_screens_readability_capture_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib/screens/settings/privacy_policy_screen.dart lib/screens/settings/license_screen.dart lib/screens/settings/error_log_screen.dart test/legal_screens_readability_capture_test.dart
      - name: Capture and test legal screens at compact width and 200% text
        run: flutter test test/legal_screens_readability_capture_test.dart --reporter expanded
      - name: Existing privacy and font-license regressions
        run: |
          flutter test test/privacy_policy_ai_clause_test.dart --reporter expanded
          flutter test test/font_license_test.dart --reporter expanded
      - name: Analyze changed Dart files
        run: flutter analyze --no-pub lib/screens/settings/privacy_policy_screen.dart lib/screens/settings/license_screen.dart lib/screens/settings/error_log_screen.dart test/legal_screens_readability_capture_test.dart --no-fatal-infos --no-fatal-warnings
      - name: Confirm visual captures were produced
        run: test -n "$(find build/legal-ui-captures -type f -name '*.png' -print -quit)"
      - name: Upload compact-screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-screens-ui-captures-${{ github.sha }}
          path: build/legal-ui-captures/*.png
          retention-days: 7
          if-no-files-found: warn
