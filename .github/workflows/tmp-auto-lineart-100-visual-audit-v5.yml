name: TMP Auto Lineart 100 Visual Audit v5
on:
  push:
    branches: [dev_branch]
    paths: ['.github/workflows/tmp-auto-lineart-100-visual-audit-v5.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {ref: dev_branch, fetch-depth: 0}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Patch production and interaction tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/screens/canvas/widgets/filter_panel.dart'); s=p.read_text()
          s,n=re.subn(r'final smoothingLevel = \(filter\.autoLineartSmoothing / 10\)\.round\(\)\.clamp\(\s*0,\s*10,\s*\);','final smoothingLevel = filter.autoLineartSmoothing.round().clamp(0, 100);',s); assert n==1,n
          s,n=re.subn(r'\(current\.autoLineartSmoothing / 10\)\.round\(\)\.clamp\(\s*0,\s*10,?\s*\),\s*0,\s*10,','current.autoLineartSmoothing.round().clamp(0, 100),\n                    0,\n                    100,',s); assert n==1,n
          s,n=re.subn(r'autoLineartSmoothing: \(v \* 10\)\.toDouble\(\),','autoLineartSmoothing: v.toDouble(),',s); assert n==1,n
          p.write_text(s)

          p=Path('lib/engine/auto_lineart_engine.dart'); s=p.read_text()
          s=s.replace('(0..10): higher levels smooth the control polygon and retain fewer points.','(0..100): higher levels smooth the control polygon and retain fewer points.')
          s,n=re.subn(r'final level = smoothingLevel\.clamp\(0, 10\);\s*if \(level == 0 \|\| source\.paths\.isEmpty\) return source;','final level = smoothingLevel.clamp(0, 100);\n    if (level == 0 || source.paths.isEmpty) return source;\n    final legacyLevel = level / 10.0;',s); assert n==1,n
          s,n=re.subn(r'final passes = math\.max\(1, level\);\s*final amount = 0\.12 \+ level \* 0\.025;','final passes = math.max(1, legacyLevel.ceil());\n      final amount = 0.12 + legacyLevel * 0.025;',s); assert n==1,n
          assert 'level * 0.08' in s
          s=s.replace('level * 0.08','legacyLevel * 0.08')
          p.write_text(s)

          p=Path('lib/screens/canvas/widgets/auto_lineart_control_overlay.dart'); s=p.read_text()
          s,n=re.subn(r'const radius = 13\.0;','const radius = 22.0;',s); assert n==1,n
          p.write_text(s)

          p=Path('test/auto_lineart_filter_test.dart'); s=p.read_text()
          s=s.replace("test('ten-level smoothing reduces editable control points', () {", "test('100-level smoothing reduces editable control points', () {")
          old='''      final low = AutoLineartEngine.prepareEditableGraph(\n        base,\n        smoothingLevel: 1,\n      );\n      final high = AutoLineartEngine.prepareEditableGraph(\n        base,\n        smoothingLevel: 10,\n      );'''
          new='''      final low = AutoLineartEngine.prepareEditableGraph(\n        base,\n        smoothingLevel: 10,\n      );\n      final high = AutoLineartEngine.prepareEditableGraph(\n        base,\n        smoothingLevel: 100,\n      );'''
          assert old in s
          p.write_text(s.replace(old,new))

          p=Path('test/auto_lineart_control_overlay_test.dart'); s=p.read_text()
          anchor='''    expect(movedTo!.y, lessThan(50));\n    image.dispose();\n  });'''
          replacement='''    expect(movedTo!.y, lessThan(50));\n    image.dispose();\n  });\n\n  testWidgets('SP-sized transparent hit target reaches 20px from a control point', (tester) async {\n    final recorder = ui.PictureRecorder();\n    final canvas = Canvas(recorder);\n    canvas.drawRect(const Rect.fromLTWH(0, 0, 100, 100), Paint());\n    final image = await recorder.endRecording().toImage(100, 100);\n    AutoLineartPoint? movedTo;\n    const graph = AutoLineartGraph(\n      width: 100,\n      height: 100,\n      paths: [\n        AutoLineartPath(\n          points: [AutoLineartPoint(50, 50), AutoLineartPoint(80, 50)],\n          startIsJunction: false,\n          endIsJunction: false,\n          persistence: 1,\n        ),\n      ],\n    );\n    await tester.pumpWidget(MaterialApp(home: Center(child: SizedBox(\n      width: 200, height: 200,\n      child: AutoLineartControlOverlay(\n        image: image, graph: graph,\n        onPointMoved: (_, __, point) => movedTo = point,\n      ),\n    ))));\n    final box = tester.getRect(find.byType(AutoLineartControlOverlay));\n    final point = Offset(box.left + box.width * .5, box.top + box.height * .5);\n    await tester.dragFrom(point + const Offset(20, 0), const Offset(15, -20));\n    await tester.pump();\n    expect(movedTo, isNotNull);\n    image.dispose();\n  });'''
          assert anchor in s
          p.write_text(s.replace(anchor,replacement))
          PY
          dart format lib/screens/canvas/widgets/filter_panel.dart lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/auto_lineart_control_overlay.dart test/auto_lineart_filter_test.dart test/auto_lineart_control_overlay_test.dart
      - name: Create deterministic production-widget visual audit
        run: |
          cat > test/auto_lineart_filter_panel_visual_audit_test.dart <<'DART'
          import 'dart:math' as math;
          import 'dart:ui' as ui;

          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:niarim/app_bootstrap.dart';
          import 'package:niarim/engine/auto_lineart_engine.dart';
          import 'package:niarim/l10n/app_localizations.dart';
          import 'package:niarim/screens/canvas/widgets/auto_lineart_control_overlay.dart';
          import 'package:niarim/screens/canvas/widgets/filter_panel.dart';
          import 'package:niarim/services/filter_service.dart';
          import 'package:niarim/services/theme_service.dart';
          import 'package:provider/provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import 'helpers/load_app_fonts.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            Future<ui.Image> makePreview() async {
              final recorder = ui.PictureRecorder();
              final canvas = Canvas(recorder);
              canvas.drawRect(
                const Rect.fromLTWH(0, 0, 220, 220),
                Paint()..color = const Color(0xFFF7F7F7),
              );
              final rough = Paint()
                ..color = const Color(0xFF242424)
                ..strokeWidth = 8
                ..strokeCap = StrokeCap.round
                ..style = PaintingStyle.stroke;
              final path = Path()..moveTo(18, 118);
              for (var x = 18; x <= 195; x += 3) {
                final y = 112 + 34 * math.sin((x - 18) / 19) + 9 * math.sin((x - 18) / 5.5);
                path.lineTo(x.toDouble(), y);
              }
              canvas.drawPath(path, rough);
              canvas.drawLine(const Offset(105, 116), const Offset(184, 42), rough);
              canvas.drawLine(const Offset(105, 116), const Offset(185, 186), rough);
              return recorder.endRecording().toImage(220, 220);
            }

            AutoLineartGraph baseGraph() {
              final main = <AutoLineartPoint>[];
              for (var x = 18; x <= 195; x += 3) {
                final y = 112 + 34 * math.sin((x - 18) / 19) + 9 * math.sin((x - 18) / 5.5);
                main.add(AutoLineartPoint(x.toDouble(), y));
              }
              final up = <AutoLineartPoint>[];
              final down = <AutoLineartPoint>[];
              for (var i = 0; i <= 24; i++) {
                final t = i / 24.0;
                up.add(AutoLineartPoint(105 + 79 * t, 116 - 74 * t));
                down.add(AutoLineartPoint(105 + 80 * t, 116 + 70 * t));
              }
              return AutoLineartGraph(
                width: 220,
                height: 220,
                paths: [
                  AutoLineartPath(points: main, startIsJunction: false, endIsJunction: false, persistence: 1),
                  AutoLineartPath(points: up, startIsJunction: true, endIsJunction: false, persistence: 1),
                  AutoLineartPath(points: down, startIsJunction: true, endIsJunction: false, persistence: 1),
                ],
              );
            }

            Future<void> pumpAudit(
              WidgetTester tester, {
              required Size physicalSize,
              required double dpr,
              required int smoothing,
              required String golden,
            }) async {
              tester.view.physicalSize = physicalSize;
              tester.view.devicePixelRatio = dpr;
              addTearDown(tester.view.resetPhysicalSize);
              addTearDown(tester.view.resetDevicePixelRatio);
              SharedPreferences.setMockInitialValues({});
              await loadAppFonts(tester);
              final providers = (await tester.runAsync(buildAppProviders))!;
              final image = await makePreview();
              addTearDown(image.dispose);
              final graph = AutoLineartEngine.prepareEditableGraph(
                baseGraph(),
                smoothingLevel: smoothing,
              );
              final rootKey = GlobalKey();

              await tester.pumpWidget(
                MultiProvider(
                  providers: providers,
                  child: Builder(
                    builder: (context) {
                      final fs = context.read<FilterService>();
                      fs.selectFilter('Filter0023');
                      fs.updateFilterParams('Filter0023', autoLineartSmoothing: smoothing.toDouble());
                      return MaterialApp(
                        theme: context.watch<ThemeService>().themeData,
                        locale: const Locale('ja'),
                        localizationsDelegates: AppLocalizations.localizationsDelegates,
                        supportedLocales: AppLocalizations.supportedLocales,
                        home: RepaintBoundary(
                          key: rootKey,
                          child: Scaffold(
                            backgroundColor: const Color(0xFFE8E8E8),
                            body: Stack(
                              fit: StackFit.expand,
                              children: [
                                Padding(
                                  padding: const EdgeInsets.fromLTRB(8, 8, 8, 8),
                                  child: AutoLineartControlOverlay(
                                    image: image,
                                    graph: graph,
                                    onPointMoved: (_, __, ___) {},
                                  ),
                                ),
                                Align(
                                  alignment: Alignment.centerLeft,
                                  child: FilterPanel(
                                    projectId: 'visual-audit',
                                    sceneId: 'scene',
                                    layerId: null,
                                    frameIndex: 0,
                                    onClose: () {},
                                  ),
                                ),
                                Positioned(
                                  right: 8,
                                  top: 8,
                                  child: DecoratedBox(
                                    decoration: BoxDecoration(
                                      color: Theme.of(context).colorScheme.surface.withValues(alpha: .92),
                                      borderRadius: BorderRadius.circular(6),
                                    ),
                                    child: Padding(
                                      padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                                      child: Text('なめらか補正 $smoothing / 100'),
                                    ),
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      );
                    },
                  ),
                ),
              );
              await tester.pump(const Duration(milliseconds: 400));
              expect(find.byType(FilterPanel), findsOneWidget);
              expect(find.byType(AutoLineartControlOverlay), findsOneWidget);
              expect(tester.takeException(), isNull);
              await expectLater(find.byKey(rootKey), matchesGoldenFile(golden));
            }

            testWidgets('SP actual FilterPanel + production overlay smoothing 45', (tester) async {
              await pumpAudit(
                tester,
                physicalSize: const Size(1170, 2532),
                dpr: 3,
                smoothing: 45,
                golden: 'goldens/auto_lineart_sp_45.png',
              );
            });

            testWidgets('SP actual FilterPanel + production overlay smoothing 85', (tester) async {
              await pumpAudit(
                tester,
                physicalSize: const Size(1170, 2532),
                dpr: 3,
                smoothing: 85,
                golden: 'goldens/auto_lineart_sp_85.png',
              );
            });

            testWidgets('desktop actual FilterPanel + production overlay smoothing 45', (tester) async {
              await pumpAudit(
                tester,
                physicalSize: const Size(1200, 800),
                dpr: 1,
                smoothing: 45,
                golden: 'goldens/auto_lineart_desktop_45.png',
              );
            });
          }
          DART
          dart format test/auto_lineart_filter_panel_visual_audit_test.dart
      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/filter_panel.dart lib/screens/canvas/widgets/auto_lineart_control_overlay.dart test/auto_lineart_filter_test.dart test/auto_lineart_control_overlay_test.dart test/auto_lineart_filter_panel_visual_audit_test.dart
      - name: Test production behavior
        run: flutter test test/auto_lineart_filter_test.dart test/auto_lineart_control_overlay_test.dart
      - name: Capture production widgets
        run: flutter test --update-goldens test/auto_lineart_filter_panel_visual_audit_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-lineart-panel-audit-v5
          path: test/goldens/*.png
          if-no-files-found: warn
      - name: Land
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/filter_panel.dart lib/screens/canvas/widgets/auto_lineart_control_overlay.dart test/auto_lineart_filter_test.dart test/auto_lineart_control_overlay_test.dart test/auto_lineart_filter_panel_visual_audit_test.dart
          git commit -m 'feat: restore 100-step auto lineart smoothing and improve touch targets'
          git reset --hard HEAD
          git clean -fd
          git fetch origin dev_branch
          git rebase origin/dev_branch
          git push origin HEAD:dev_branch
