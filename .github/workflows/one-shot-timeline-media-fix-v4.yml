name: One-shot timeline media fix v4

on:
  push:
    branches: [dev_branch]
    paths:
      - .github/workflows/one-shot-timeline-media-fix-v4.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev_branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - name: Get dependencies
        run: flutter pub get
      - name: Write regression contract test
        run: |
          cat > test/timeline_media_contract_test.dart <<'DART'
          import 'dart:io';
          import 'package:flutter_test/flutter_test.dart';
          void main() {
            test('audio import accepts video containers as audio-only material', () {
              final s = File('lib/screens/timeline/timeline_screen.dart').readAsStringSync();
              expect(s, contains('_ClipTrackType.audio => FileType.custom'));
              expect(s, contains("'mp4'"));
              expect(s, contains("'mov'"));
              expect(s, contains('allowedExtensions: allowedExtensions'));
            });
            test('video import keeps normal video plus embedded audio behavior', () {
              final s = File('lib/screens/timeline/timeline_screen.dart').readAsStringSync();
              expect(s, contains('_ClipTrackType.video => FileType.video'));
              expect(s, contains('await controller.setVolume(clip.volume.clamp(0.0, 1.0));'));
              expect(s, contains('videoVolume: clip.trackType == _ClipTrackType.video'));
            });
            test('audio and video cut editing exposes playback', () {
              final s = File('lib/screens/timeline/timeline_screen.dart').readAsStringSync();
              expect(s, contains('final ValueGetter<bool> isPlaying;'));
              expect(s, contains('final VoidCallback onTogglePlay;'));
              expect(s, contains('widget.onTogglePlay();'));
              expect(s, contains('isPlaying: () => _isPlaying'));
              expect(s, contains('onTogglePlay: _togglePlay'));
            });
          }
          DART
      - name: Verify RED
        shell: bash
        run: |
          set +e
          flutter test test/timeline_media_contract_test.dart
          status=$?
          set -e
          test "$status" -ne 0
      - name: Apply source patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/screens/timeline/timeline_screen.dart')
          s=p.read_text()
          pat=re.compile(r"(?P<i>\s*)final fileType = switch \(trackType\) \{\s*_ClipTrackType\.audio => FileType\.audio,\s*_ClipTrackType\.video => FileType\.video,\s*_ClipTrackType\.image => FileType\.image,\s*\};\s*final result = await FilePicker\.platform\.pickFiles\(type: fileType\);")
          m=pat.search(s)
          if not m: raise SystemExit('audio picker block not found')
          i=m.group('i')
          repl=f"""{i}final allowedExtensions = trackType == _ClipTrackType.audio
          ? const <String>[
              'mp3', 'wav', 'm4a', 'aac', 'flac', 'ogg', 'opus', 'aiff', 'wma',
              'mp4', 'm4v', 'mov', 'mkv', 'webm',
            ]
          : null;
      final fileType = switch (trackType) {{
        _ClipTrackType.audio => FileType.custom,
        _ClipTrackType.video => FileType.video,
        _ClipTrackType.image => FileType.image,
      }};
      final result = await FilePicker.platform.pickFiles(
        type: fileType,
        allowedExtensions: allowedExtensions,
      );"""
          s=s[:m.start()]+repl+s[m.end():]
          cb=re.compile(r"(?P<i>\s*)onDuplicate: \(\) => _duplicateClip\(clip\),\s*onChanged: \(\) => setState\(\(\) \{\}\),")
          m=cb.search(s)
          if not m: raise SystemExit('clip callback block not found')
          i=m.group('i')
          repl=(f"{i}onDuplicate: () => _duplicateClip(clip),\n{i}onChanged: () {{\n{i}  setState(() {{}});\n{i}  _syncMediaPlayback();\n{i}}},\n{i}isPlaying: () => _isPlaying,\n{i}onTogglePlay: _togglePlay,")
          s=s[:m.start()]+repl+s[m.end():]
          at=s.find('class _ClipDetailSheet extends StatefulWidget')
          if at<0: raise SystemExit('sheet not found')
          head,tail=s[:at],s[at:]
          tail,n=re.subn(r"(\s*final VoidCallback onChanged;)",r"\1\n  final ValueGetter<bool> isPlaying;\n  final VoidCallback onTogglePlay;",tail,count=1)
          if n!=1: raise SystemExit('sheet fields failed')
          tail,n=re.subn(r"required this\.onChanged,",'required this.onChanged,\n    required this.isPlaying,\n    required this.onTogglePlay,',tail,count=1)
          if n!=1: raise SystemExit('sheet constructor failed')
          mark=re.search(r"(?P<i>\s*)IconButton\(\s*icon: const Icon\(Icons\.copy\),",tail)
          if not mark: raise SystemExit('copy icon marker not found')
          i=mark.group('i')
          play=f"""{i}if (_c.trackType == _ClipTrackType.audio || _c.trackType == _ClipTrackType.video)
        IconButton(
          icon: Icon(widget.isPlaying() ? Icons.pause : Icons.play_arrow),
          tooltip: widget.isPlaying() ? l10n.commonPause : l10n.commonPlay,
          onPressed: () {{ widget.onTogglePlay(); setState(() {{}}); }},
        ),
"""
          tail=tail[:mark.start()]+play+tail[mark.start():]
          p.write_text(head+tail)
          PY
      - name: Format
        run: dart format lib/screens/timeline/timeline_screen.dart test/timeline_media_contract_test.dart
      - name: Verify GREEN
        run: flutter test test/timeline_media_contract_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Diff check
        run: git diff --check
      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-timeline-media-fix.yml .github/workflows/one-shot-timeline-media-fix-v2.yml .github/workflows/one-shot-timeline-media-fix-v3.yml .github/workflows/one-shot-timeline-media-fix-v4.yml
          git config user.name 'NIARIM automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: support video as audio-only timeline material'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
