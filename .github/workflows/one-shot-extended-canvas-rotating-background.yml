name: One-shot Extended Canvas Rotating Background

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-extended-canvas-rotating-background.yml'

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Implement transformed overscan background for extended drawing area
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/canvas/widgets/canvas_area.dart')
          s = p.read_text()
          anchor = '''const double kCanvasMaxScale = 10.0;\n'''
          insert = '''const double kCanvasMaxScale = 10.0;\n\n/// 拡張描画範囲ON時にキャンバスと一緒に変形させる背面背景の矩形。\n/// 最小倍率[kCanvasMinScale]まで縮小して任意角度へ回転しても背景の外周が\n/// ビューポートへ入らないよう、画面長辺を基準に十分なオーバースキャンを持つ。\nRect extendedCanvasBackdropRectFor(Size viewportSize) {\n  final longest = math.max(viewportSize.width, viewportSize.height);\n  if (longest <= 0 || !longest.isFinite) return Rect.zero;\n  final halfExtent = longest * 4.0 / kCanvasMinScale;\n  return Rect.fromCenter(\n    center: Offset(viewportSize.width / 2, viewportSize.height / 2),\n    width: halfExtent * 2,\n    height: halfExtent * 2,\n  );\n}\n'''
          if 'Rect extendedCanvasBackdropRectFor(Size viewportSize)' not in s:
              if anchor not in s: raise SystemExit('scale anchor not found')
              s = s.replace(anchor, insert, 1)
          old = '''    // 「枠外」の塗りつぶしは、この描画全体を包む親側（canvas_screen.dart）が\n    // 固定背景（kCanvasOutsideColor）として1枚だけ敷いている。ここで\n    // 重ねて塗ると背景が二重になり、ピンチズームでキャンバス内容ごと\n    // 縮小されるこの塗りの方だけが一緒に縮んで見た目がちぐはぐになるため、\n    // ここでは描画内容（drawingRect）だけを塗り、枠外は透明のままにして\n    // 親の固定背景をそのまま透過させる。\n    _paintBackground(canvas, drawingRect);\n'''
          new = '''    // 通常モードは親側の固定背景を使う。拡張描画範囲ON時だけ、\n    // 背面背景もCanvasAreaのTransform内へ入れてパン・ズーム・回転に追従させる。\n    // 巨大なオーバースキャン面なので最小20%＋斜め回転でも外周は露出しない。\n    if (project?.hasExtendedDrawingArea ?? false) {\n      canvas.drawRect(\n        extendedCanvasBackdropRectFor(size),\n        Paint()..color = kCanvasOutsideColor,\n      );\n    }\n    _paintBackground(canvas, drawingRect);\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'extendedCanvasBackdropRectFor(size)' not in s:
              raise SystemExit('paint anchor not found')
          p.write_text(s)
          PY
          cat > test/canvas_extended_background_transform_test.dart <<'DART'
          import 'dart:math' as math;
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:niarim/screens/canvas/widgets/canvas_area.dart';

          void main() {
            test('拡張背景は1/5＋斜め回転＋境界パンでもviewportを覆う', () {
              const viewport = Size(1080, 1920);
              final backdrop = extendedCanvasBackdropRectFor(viewport);
              final center = viewport.center(Offset.zero);
              for (final degrees in <double>[0,30,45,60,90,-30,-45,-60,-90,135]) {
                final rad = degrees * math.pi / 180;
                final m = Matrix4.identity()
                  ..translateByDouble(center.dx, center.dy, 0, 1)
                  ..rotateZ(rad)
                  ..scaleByDouble(kCanvasMinScale, kCanvasMinScale, 1, 1)
                  ..translateByDouble(-center.dx, -center.dy, 0, 1);
                final transformed = MatrixUtils.transformRect(m, backdrop);
                for (final d in <Offset>[
                  Offset.zero, const Offset(1920,0), const Offset(-1920,0),
                  const Offset(0,1920), const Offset(0,-1920),
                  const Offset(1920,1920), const Offset(-1920,-1920),
                ]) {
                  final r = transformed.shift(d);
                  expect(r.left, lessThanOrEqualTo(0), reason: '$degrees $d left');
                  expect(r.top, lessThanOrEqualTo(0), reason: '$degrees $d top');
                  expect(r.right, greaterThanOrEqualTo(viewport.width), reason: '$degrees $d right');
                  expect(r.bottom, greaterThanOrEqualTo(viewport.height), reason: '$degrees $d bottom');
                }
              }
            });
          }
          DART
          dart format lib/screens/canvas/widgets/canvas_area.dart test/canvas_extended_background_transform_test.dart
      - name: Static analysis
        run: flutter analyze
      - name: Extended background regression
        run: flutter test test/canvas_extended_background_transform_test.dart --reporter expanded
      - name: Existing canvas boundary regressions
        run: |
          set -e
          for f in test/*canvas*bound*.dart test/*canvas*view*transform*.dart test/*canvas*drawing*rect*.dart; do
            [ -f "$f" ] || continue
            flutter test "$f" --reporter expanded
          done
      - name: Commit implementation and test
        run: |
          git config user.name "NIARIM Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/canvas/widgets/canvas_area.dart test/canvas_extended_background_transform_test.dart
          if git diff --cached --quiet; then
            echo "No code changes to commit"
          else
            git commit -m "fix: rotate extended canvas background with canvas"
            git push origin HEAD:dev_branch
          fi
