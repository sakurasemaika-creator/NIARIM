# Prism completion proof; rerun after native compositor async isolation.
name: One-shot Prism Completion

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-prism-completion.yml'

permissions:
  contents: write

jobs:
  prism-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply direct FilterPanel linear-dodge behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/screens/canvas/widgets/filter_panel.dart')
          s = p.read_text()
          pattern = re.compile(
              r"(?m)^(\s*)layer: layer,\s*$"
          )
          matches = list(pattern.finditer(s))
          if not matches:
              raise SystemExit('FilterPanel layer update anchor changed')
          s = pattern.sub(
              lambda m: "\n".join([
                  f"{m.group(1)}layer: _isPrism(filter)",
                  f"{m.group(1)}    ? layer.copyWith(blendMode: model.LayerBlendMode.addition)",
                  f"{m.group(1)}    : layer,",
              ]),
              s,
              count=1,
          )
          old_hint = '参照レイヤーの不透明部分を6色で直接塗り替え → ガウスぼかし'
          new_hint = '参照レイヤーのα領域を6等分で着色 → ガウスぼかし → 覆い焼きリニア'
          if old_hint not in s:
              raise SystemExit('Prism help text anchor changed')
          s = s.replace(old_hint, new_hint, 1)
          p.write_text(s)
          PY
      - name: Format prism changes
        run: dart format lib/screens/canvas/widgets/filter_panel.dart lib/engine/prism_filter_engine.dart lib/engine/custom_automation_filter_runner.dart test/prism_filter_completion_test.dart
      - name: Analyze prism changes
        run: flutter analyze lib/screens/canvas/widgets/filter_panel.dart lib/engine/prism_filter_engine.dart lib/engine/custom_automation_filter_runner.dart test/prism_filter_completion_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Run prism completion proof
        run: flutter test test/prism_filter_completion_test.dart --reporter expanded
      - name: Upload prism PNG proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-completion-png-proof
          path: build/visual-reaudit/prism
          if-no-files-found: warn
          retention-days: 7
      - name: Commit proven FilterPanel integration
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/canvas/widgets/filter_panel.dart lib/engine/prism_filter_engine.dart lib/engine/custom_automation_filter_runner.dart test/prism_filter_completion_test.dart
          git commit -m 'fix(prism): complete alpha bands and linear dodge integration' || true
          git push origin HEAD:dev_branch
