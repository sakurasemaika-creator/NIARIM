name: One-shot All Routes Screenshot Audit

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/one-shot-all-routes-screenshot-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Run all-route production screenshot audit
        run: flutter test test/all_routes_screenshot_audit_test.dart --reporter expanded
      - name: Upload all route screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-route-screenshot-audit
          path: build/all-route-screenshots
          if-no-files-found: warn
          retention-days: 7
