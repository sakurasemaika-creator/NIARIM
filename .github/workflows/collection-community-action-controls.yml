name: Community collection action controls

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/collection-community-action-controls.yml'
      - 'lib/screens/community/widgets/community_work_card.dart'
      - 'lib/screens/community/widgets/community_ranking_work_list.dart'
      - 'lib/widgets/collection_action_controls.dart'
      - 'test/community_work_card_layout_test.dart'
      - 'test/community_ranking_layout_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze community action controls
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/screens/community/widgets/community_work_card.dart lib/screens/community/widgets/community_ranking_work_list.dart lib/widgets/collection_action_controls.dart test/community_work_card_layout_test.dart
      - name: Exercise responsive community cards and ranking views
        run: flutter test --no-pub --reporter expanded test/community_work_card_layout_test.dart test/community_ranking_layout_test.dart
