name: Temp Posting Auth Validation

on:
  push:
    branches: [dev_branch]
    paths:
      - 'lib/services/google_auth_service.dart'
      - 'lib/screens/community/community_post_screen.dart'
      - '.github/workflows/temp-post-auth-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze posting and auth changes
        run: flutter analyze lib/services/google_auth_service.dart lib/screens/community/community_post_screen.dart --no-fatal-infos
      - name: Run Flutter tests with captured output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee flutter-test.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Print failure summary
        if: steps.tests.outputs.exit_code != '0'
        shell: bash
        run: |
          echo '=== FAILURE MATCHES ==='
          grep -n -E 'FAILED|Expected:|Actual:|Exception|Some tests failed|Test failed|Error:|\[E\]' flutter-test.log | tail -300 || true
          echo '=== LOG TAIL ==='
          tail -400 flutter-test.log || true
      - name: Upload Flutter test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posting-auth-flutter-test-log
          path: flutter-test.log
          if-no-files-found: warn
          retention-days: 1
      - name: Fail if Flutter tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
