name: One-shot Canvas Angle Boundary Audit

# retry trigger: corrected one-finger-anchor rotation input
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-canvas-angle-boundary-audit.yml'

permissions:
  contents: read

jobs:
  angled-boundary-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Create angled real-operation audit test
        run: |
          cat > test/canvas_angle_boundary_visual_test.dart <<'DART'
          import 'dart:io';
          import 'dart:math' as math;
          import 'dart:ui' as ui;

          import 'package:flutter/gestures.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/rendering.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:niarim/app.dart';
          import 'package:niarim/app_bootstrap.dart';
          import 'package:niarim/router.dart';
          import 'package:niarim/screens/canvas/widgets/canvas_area.dart';
          import 'package:niarim/services/project_service.dart';
          import 'package:provider/provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import 'helpers/load_app_fonts.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            testWidgets('斜め回転を複数角度・複数方向で実操作しPNG監査する', (tester) async {
              SharedPreferences.setMockInitialValues({});
              final tempDir = Directory.systemTemp.createTempSync('niarim_angle_boundary_');
              const pathChannel = MethodChannel('plugins.flutter.io/path_provider');
              TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                  .setMockMethodCallHandler(pathChannel, (call) async => tempDir.path);
              addTearDown(() {
                TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                    .setMockMethodCallHandler(pathChannel, null);
                if (tempDir.existsSync()) tempDir.deleteSync(recursive: true);
              });

              tester.view.physicalSize = const Size(1080, 1920);
              tester.view.devicePixelRatio = 2.5;
              addTearDown(tester.view.resetPhysicalSize);
              addTearDown(tester.view.resetDevicePixelRatio);

              await loadAppFonts(tester);
              final providers = await tester.runAsync(buildAppProviders);
              final boundaryKey = GlobalKey();
              await tester.pumpWidget(
                RepaintBoundary(
                  key: boundaryKey,
                  child: MultiProvider(providers: providers!, child: const NiarimApp()),
                ),
              );
              await tester.pumpAndSettle();

              final context = tester.element(find.byType(MaterialApp).first);
              final ps = context.read<ProjectService>();
              final project = await tester.runAsync(
                () => ps.createProject(
                  name: 'canvas-angle-boundary-audit',
                  fps: 12,
                  durationSeconds: 1,
                  backgroundColor: 0xFFFFFFFF,
                  exportWidth: 640,
                  exportHeight: 480,
                ),
              );
              expect(project, isNotNull);

              Future<void> openCanvas() async {
                appRouter.go('/home');
                await tester.pump(const Duration(milliseconds: 100));
                appRouter.go('/canvas/${project!.id}');
                for (var i = 0; i < 10; i++) {
                  await tester.pump(const Duration(milliseconds: 100));
                  await tester.runAsync(
                    () => Future<void>.delayed(const Duration(milliseconds: 60)),
                  );
                }
                expect(find.byType(CanvasArea), findsOneWidget);
                expect(tester.takeException(), isNull);
              }

              final out = Directory('build/canvas-angle-boundary')
                ..createSync(recursive: true);

              Future<void> capture(String name) async {
                await tester.pump(const Duration(milliseconds: 120));
                final exception = tester.takeException();
                expect(exception, isNull, reason: '$name でFlutter例外');
                final boundary = boundaryKey.currentContext!.findRenderObject()
                    as RenderRepaintBoundary;
                final bytes = await tester.runAsync(() async {
                  final image = await boundary.toImage(pixelRatio: 1);
                  final data = await image.toByteData(format: ui.ImageByteFormat.png);
                  image.dispose();
                  return data!.buffer.asUint8List();
                });
                await tester.runAsync(
                  () => File('${out.path}/$name.png').writeAsBytes(bytes!),
                );
              }

              Offset canvasCenter() => tester.getCenter(find.byType(CanvasArea));

              Future<void> pinchToMinScale() async {
                final c = canvasCenter();
                final g1 = await tester.startGesture(c + const Offset(-160, 0), pointer: 11);
                final g2 = await tester.startGesture(c + const Offset(160, 0), pointer: 12);
                await tester.pump();
                await g1.moveTo(c + const Offset(-32, 0));
                await g2.moveTo(c + const Offset(32, 0));
                await tester.pump();
                await g1.up();
                await g2.up();
                await tester.pump();
              }

              Future<void> rotateDegrees(double degrees) async {
                final c = canvasCenter();
                const r = 70.0;
                final anchor = c + const Offset(-r, 0);
                final rad = degrees * math.pi / 180.0;
                final movingStart = c + const Offset(r, 0);
                final movingEnd = anchor + Offset.fromDirection(rad, r * 2);
                final g1 = await tester.startGesture(anchor, pointer: 21);
                final g2 = await tester.startGesture(movingStart, pointer: 22);
                await tester.pump();
                await g2.moveTo(movingEnd);
                await tester.pump();
                await g1.up();
                await g2.up();
                await tester.pump();
              }

              Future<void> middleDrag(Offset delta) async {
                final c = canvasCenter();
                final g = await tester.startGesture(
                  c,
                  pointer: 41,
                  kind: PointerDeviceKind.mouse,
                  buttons: kMiddleMouseButton,
                );
                await tester.pump();
                await g.moveTo(c + delta);
                await tester.pump();
                await g.up();
                await tester.pump();
              }

              final scenarios = <(double, Offset, String)>[
                (30, const Offset(5000, 5000), 'p030_right_bottom'),
                (45, const Offset(-5000, -5000), 'p045_left_top'),
                (60, const Offset(5000, 0), 'p060_right'),
                (90, const Offset(0, 5000), 'p090_bottom'),
                (-30, const Offset(-5000, 5000), 'm030_left_bottom'),
                (-45, const Offset(5000, -5000), 'm045_right_top'),
                (-60, const Offset(-5000, 0), 'm060_left'),
                (-90, const Offset(0, -5000), 'm090_top'),
              ];

              for (final scenario in scenarios) {
                await openCanvas();
                await pinchToMinScale();
                await rotateDegrees(scenario.$1);
                await middleDrag(scenario.$2);
                await capture(scenario.$3);
              }

              expect(out.listSync().whereType<File>().length, scenarios.length);
            });
          }
          DART
          dart format test/canvas_angle_boundary_visual_test.dart
      - name: Run angled real-operation audit
        run: flutter test test/canvas_angle_boundary_visual_test.dart --reporter expanded
      - name: Verify capture diversity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(Path('build/canvas-angle-boundary').glob('*.png'))
          assert len(files) == 8, len(files)
          hashes = {f.name: hashlib.sha256(f.read_bytes()).hexdigest() for f in files}
          print('\n'.join(f'{k} {v}' for k,v in hashes.items()))
          assert len(set(hashes.values())) == 8, 'all 8 angled scenarios must produce distinct captures'
          PY
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-angle-boundary-audit
          path: build/canvas-angle-boundary/*.png
          if-no-files-found: error
