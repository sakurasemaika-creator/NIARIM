name: One-shot Audit 33 37 Fix V2
on:
  push:
    branches: [dev_branch]
    paths: ['.github/workflows/one-shot-audit-33-37-fix-v2.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch audit async and initial frame assumptions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('test/functional_audit_batch33_test.dart')
          s=p.read_text()
          s=s.replace("await _save(r.after, 96, 80, '${out.path}/canvas_blur_real.png');", "await tester.runAsync(() => _save(r.after, 96, 80, '${out.path}/canvas_blur_real.png'));")
          s=s.replace("await _save(r.after, 96, 80, '${out.path}/canvas_mosaic_real.png');", "await tester.runAsync(() => _save(r.after, 96, 80, '${out.path}/canvas_mosaic_real.png'));")
          p.write_text(s,newline='\n')

          p=Path('test/functional_audit_batch37_test.dart')
          s=p.read_text()
          s=s.replace('    await ps.init();','    await tester.runAsync(() => ps.init());')
          s=s.replace('    ps.addFrame(p.id, sceneId);\n    ps.addFrame(p.id, sceneId);\n    expect(ps.frameCount(p.id, sceneId), 3);','    expect(ps.frameCount(p.id, sceneId), 3);')
          s=s.replace('final off = await _capture(boundaryKey);','final off = (await tester.runAsync(() => _capture(boundaryKey)))!;')
          s=s.replace('final on = await _capture(boundaryKey);','final on = (await tester.runAsync(() => _capture(boundaryKey)))!;')
          s=s.replace("await File('${out.path}/onion_canvas_real.png').writeAsBytes(on.png);", "await tester.runAsync(() => File('${out.path}/onion_canvas_real.png').writeAsBytes(on.png));")
          p.write_text(s,newline='\n')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - run: dart format test/functional_audit_batch33_test.dart test/functional_audit_batch37_test.dart
      - name: Verify blur mosaic
        run: flutter test test/functional_audit_batch33_test.dart --reporter expanded
      - name: Verify onion skin
        run: flutter test test/functional_audit_batch37_test.dart --reporter expanded
      - name: Commit verified audit corrections
        run: |
          git config user.name sakurasemaika-creator
          git config user.email sakurasemaika@gmail.com
          git add test/functional_audit_batch33_test.dart test/functional_audit_batch37_test.dart
          git commit -m "test: fix real async canvas audits" || true
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
