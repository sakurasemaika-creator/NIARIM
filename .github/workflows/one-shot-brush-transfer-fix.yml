name: One-shot brush transfer verification

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/one-shot-brush-transfer-fix.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev_branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev_branch
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Brush dynamics and transfer tests
        run: flutter test test/brush_rotation_density_scatter_test.dart test/niatra_asset_bundle_test.dart test/niatra_serializer_test.dart test/creative_asset_persistence_test.dart

      - name: Static analysis
        run: flutter analyze --no-fatal-infos
