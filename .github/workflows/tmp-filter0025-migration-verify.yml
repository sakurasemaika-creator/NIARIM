name: TMP Filter0025 Migration Verify
on:
  push:
    branches: [dev_branch]
    paths:
      - 'lib/services/filter_service.dart'
      - 'test/filter_service_legacy_inversion_migration_test.dart'
      - '.github/workflows/tmp-filter0025-migration-verify.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Format focused files
        run: |
          dart format lib/services/filter_service.dart test/filter_service_legacy_inversion_migration_test.dart
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add lib/services/filter_service.dart test/filter_service_legacy_inversion_migration_test.dart
            git commit -m "style: format Filter0025 migration"
            git push origin HEAD:dev_branch
          fi
      - run: flutter analyze --no-fatal-warnings lib/services/filter_service.dart test/filter_service_legacy_inversion_migration_test.dart
      - run: flutter test test/filter_service_legacy_inversion_migration_test.dart --reporter expanded
      - run: flutter test test/filter_color_inversion_test.dart --reporter expanded
