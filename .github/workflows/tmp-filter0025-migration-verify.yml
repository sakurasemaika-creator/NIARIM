name: TMP Filter0025 Migration Verify
on:
  push:
    branches: [dev_branch]
    paths:
      - 'lib/services/filter_service.dart'
      - 'test/filter_service_legacy_inversion_migration_test.dart'
      - '.github/workflows/tmp-filter0025-migration-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib/services/filter_service.dart test/filter_service_legacy_inversion_migration_test.dart
      - run: flutter analyze --no-fatal-warnings lib/services/filter_service.dart test/filter_service_legacy_inversion_migration_test.dart
      - run: flutter test test/filter_service_legacy_inversion_migration_test.dart --reporter expanded
      - run: flutter test test/filter_color_inversion_test.dart --reporter expanded
