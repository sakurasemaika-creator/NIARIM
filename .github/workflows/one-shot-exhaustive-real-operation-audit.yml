name: One-shot Exhaustive Real Operation Audit

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/one-shot-exhaustive-real-operation-audit.yml'

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Analyze current source
        run: flutter analyze
      - name: Run every Flutter test file independently with timeout and retry
        shell: bash
        run: |
          set +e
          mkdir -p build/audit-logs build/functional-visual build/visual-smoke build/reference-captures build/all-route-screenshots
          mapfile -t tests < <(find test -type f -name '*_test.dart' -print | sort)
          printf '%s\n' "${tests[@]}" > build/audit-logs/discovered-tests.txt
          echo "DISCOVERED_TEST_COUNT=${#tests[@]}" | tee build/audit-logs/summary.txt
          failed=0
          for t in "${tests[@]}"; do
            safe=$(echo "$t" | tr '/.' '__')
            ok=0
            for attempt in 1 2; do
              echo "=== $t attempt $attempt ===" | tee -a build/audit-logs/summary.txt
              timeout 300s flutter test "$t" --reporter expanded >"build/audit-logs/${safe}.attempt${attempt}.log" 2>&1
              rc=$?
              if [ $rc -eq 0 ]; then
                echo "PASS $t attempt=$attempt" | tee -a build/audit-logs/summary.txt
                ok=1
                break
              fi
              if [ $rc -eq 124 ]; then
                echo "TIMEOUT $t attempt=$attempt" | tee -a build/audit-logs/summary.txt
              else
                echo "FAIL $t attempt=$attempt rc=$rc" | tee -a build/audit-logs/summary.txt
              fi
              sleep 10
            done
            if [ $ok -ne 1 ]; then failed=1; fi
          done
          pass_count=$(grep -c '^PASS ' build/audit-logs/summary.txt || true)
          fail_count=$(grep -Ec '^(FAIL|TIMEOUT|MISSING) ' build/audit-logs/summary.txt || true)
          echo "PASS_COUNT=$pass_count" | tee -a build/audit-logs/summary.txt
          echo "FAIL_EVENT_COUNT=$fail_count" | tee -a build/audit-logs/summary.txt
          cat build/audit-logs/summary.txt
          exit $failed
      - name: Upload all audit screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-real-operation-audit
          path: |
            build/audit-logs
            build/functional-visual
            build/visual-smoke
            build/reference-captures
            build/all-route-screenshots
            build/**/*.png
          if-no-files-found: warn
          retention-days: 7
