name: One-shot Final Remaining Audit

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-final-remaining-audit.yml'

jobs:
  final-remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Verify project persistence and service evidence
        run: |
          flutter test test/direct_service_coverage_batch02_test.dart --reporter expanded
          flutter test test/direct_service_coverage_batch10_test.dart --reporter expanded
      - name: Verify remaining functional behavior
        run: |
          flutter test test/functional_render_real_async_test.dart --reporter expanded
          for n in $(seq 2 26); do
            flutter test "test/functional_audit_batch${n}_test.dart" --reporter expanded
          done
      - name: Verify camera interpolation and fade visual evidence
        run: flutter test test/visual_reaudit_export_camera_test.dart --reporter expanded
      - name: Upload remaining evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-remaining-evidence
          path: |
            build/functional-visual
            build/visual-reaudit
          if-no-files-found: warn
          retention-days: 7
