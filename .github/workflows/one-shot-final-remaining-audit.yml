name: One-shot Final Remaining Audit

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-final-remaining-audit.yml'

jobs:
  final-strict-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - run: flutter test test/final_remaining_strict_evidence_test.dart --reporter expanded
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-strict-gap-evidence
          path: build/final-remaining-strict
          if-no-files-found: warn
          retention-days: 7
