name: One-shot Known Scope Reaudit

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-known-scope-reaudit.yml'
      - 'test/final_remaining_strict_evidence_test.dart'
      - 'test/time_change_strict_evidence_test.dart'
      - 'lib/screens/premium/premium_screen.dart'
      - 'lib/screens/canvas/widgets/frame_strip_widget.dart'
      - 'lib/screens/community/community_work_detail_screen.dart'
      - 'lib/screens/community/widgets/community_floating_preview.dart'
      - 'lib/screens/community/widgets/community_shorts_viewer.dart'
      - 'lib/screens/community/widgets/community_work_card.dart'

# Final deliberate one-shot verification after the community palette selector repair. No self-dispatch.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze
      - name: Strict remaining evidence must compile and pass
        id: strict
        continue-on-error: true
        run: flutter test test/final_remaining_strict_evidence_test.dart --reporter expanded
      - name: Time-change strict evidence
        id: timechange
        continue-on-error: true
        run: flutter test test/time_change_strict_evidence_test.dart --reporter expanded
      - name: Frame strip / Premium regression tests
        id: regressions
        continue-on-error: true
        run: |
          if [ -f test/frame_strip_widget_test.dart ]; then flutter test test/frame_strip_widget_test.dart --reporter expanded; fi
          if [ -f test/premium_screen_test.dart ]; then flutter test test/premium_screen_test.dart --reporter expanded; fi
      - name: Audit fixed UI colors in app screens
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots=[Path('lib/screens'),Path('lib/widgets')]
          pats=[r'Colors\.(black|white|grey|gray|amber|pink|red|blue|green|orange|purple|yellow|brown|cyan|teal|indigo|lime)\b',r'Color\(0x[0-9A-Fa-f]{8}\)']
          hits=[]
          for root in roots:
            if not root.exists(): continue
            for p in root.rglob('*.dart'):
              for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                if any(re.search(x,line) for x in pats): hits.append(f'{p}:{n}:{line.strip()}')
          Path('build').mkdir(exist_ok=True)
          Path('build/ui-fixed-colors.txt').write_text('\n'.join(hits),encoding='utf-8')
          print('\n'.join(hits)); print('FIXED_UI_COLOR_HITS=',len(hits))
          PY
      - name: Audit emoji-like UI literals
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          hits=[]; rx=re.compile(r'[\U0001F000-\U0001FAFF\u2600-\u27BF]')
          for root in [Path('lib/screens'),Path('lib/widgets')]:
            if not root.exists(): continue
            for p in root.rglob('*.dart'):
              for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                if rx.search(line): hits.append(f'{p}:{n}:{line.strip()}')
          Path('build/emoji-ui-literals.txt').write_text('\n'.join(hits),encoding='utf-8')
          print('\n'.join(hits)); print('EMOJI_UI_HITS=',len(hits))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: known-scope-reaudit
          path: |
            build/final-remaining-strict/**
            build/time-change-strict/**
            build/ui-fixed-colors.txt
            build/emoji-ui-literals.txt
          if-no-files-found: warn
      - name: Final gate
        if: always()
        run: |
          test '${{ steps.analyze.outcome }}' = 'success'
          test '${{ steps.strict.outcome }}' = 'success'
          test '${{ steps.timechange.outcome }}' = 'success'
          test '${{ steps.regressions.outcome }}' = 'success'
