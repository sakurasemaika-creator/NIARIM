name: Prepare rewarded ad country data

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/prepare-reward-country-layer.yml'
      - 'backend/lib/niarim-backend-stack.ts'
      - 'backend/scripts/prepare-reward-country-layer.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/dev_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Download and verify the country database
        run: bash scripts/prepare-reward-country-layer.sh "$RUNNER_TEMP/reward-country-layer"
      - name: Verify the collection-only stack
        run: |
          npx cdk synth --quiet -c googleClientId=ci-dummy -c youtubeApiKey=ci-dummy \
            -c rewardedAdCountryDataDirectory="$RUNNER_TEMP/reward-country-layer"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: niarim-reward-country-layer
          path: '${{ runner.temp }}/reward-country-layer/'
          if-no-files-found: error
          retention-days: 7

  stage:
    if: >-
      github.ref == 'refs/heads/dev_branch' && github.event_name == 'push' &&
      github.event.head_commit.message == 'Stage the verified NIARIM AdMob country assets'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Build the verified API and country layer assets
        run: |
          set -euo pipefail
          bash scripts/prepare-reward-country-layer.sh "$RUNNER_TEMP/reward-country-layer"
          npx cdk synth --quiet -c googleClientId=ci-dummy -c youtubeApiKey=ci-dummy \
            -c rewardedAdCountryDataDirectory="$RUNNER_TEMP/reward-country-layer"
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Publish only the two assets to the private CDK bucket
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = '368601349794'
          target='cdk-hnb659fds-assets-368601349794-ap-northeast-1'
          creds="$(aws sts assume-role \
            --role-arn arn:aws:iam::368601349794:role/cdk-hnb659fds-file-publishing-role-368601349794-ap-northeast-1 \
            --role-session-name niarim-regional-country-assets --query Credentials --output json)"
          export AWS_ACCESS_KEY_ID="$(jq -r .AccessKeyId <<<"$creds")"
          export AWS_SECRET_ACCESS_KEY="$(jq -r .SecretAccessKey <<<"$creds")"
          export AWS_SESSION_TOKEN="$(jq -r .SessionToken <<<"$creds")"
          unset creds
          template=cdk.out/NiarimBackendStack.template.json
          api_key="$(jq -er '.Resources.ApiFunctionCE271BD4.Properties.Code.S3Key' "$template")"
          layer_key="$(jq -er '.Resources[] | select(.Type == "AWS::Lambda::LayerVersion") | .Properties.Content.S3Key' "$template")"
          for key in "$api_key" "$layer_key"; do
            [[ "$key" =~ ^[a-f0-9]{64}\.zip$ ]]
            source="$(realpath "cdk.out/asset.${key%.zip}")"
            archive="$RUNNER_TEMP/$key"
            (cd "$source" && zip -Xqr "$archive" .)
            aws s3 cp --only-show-errors "$archive" "s3://$target/$key"
            printf '%s %s\n' "$key" "$(sha256sum "$archive" | cut -d ' ' -f 1)"
          done
          printf 'API asset %s\nCountry layer asset %s\n' "$api_key" "$layer_key"
