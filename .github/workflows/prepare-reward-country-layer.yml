name: Prepare rewarded ad country data

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/prepare-reward-country-layer.yml'
      - 'backend/lib/niarim-backend-stack.ts'
      - 'backend/scripts/prepare-reward-country-layer.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/dev_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Download and verify the country database
        run: bash scripts/prepare-reward-country-layer.sh "$RUNNER_TEMP/reward-country-layer"
      - name: Verify the collection-only stack
        run: |
          npx cdk synth --quiet -c googleClientId=ci-dummy -c youtubeApiKey=ci-dummy \
            -c rewardedAdCountryDataDirectory="$RUNNER_TEMP/reward-country-layer"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: niarim-reward-country-layer
          path: '${{ runner.temp }}/reward-country-layer/'
          if-no-files-found: error
          retention-days: 7
