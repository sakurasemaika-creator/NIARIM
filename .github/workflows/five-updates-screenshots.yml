name: Five Updated UI Screenshots

on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/five-updates-screenshots.yml'
      - 'test/five_fixes_screenshot_test.dart'
      - 'lib/screens/community/community_screen.dart'
      - 'lib/screens/community/community_my_works_screen.dart'
      - 'lib/screens/community/community_work_settings_screen.dart'
      - 'lib/services/community_service.dart'
      - 'lib/l10n/**'
      - 'pubspec.yaml'
      - 'test/community_my_works_controls_test.dart'
      - 'test/community_back_navigation_test.dart'
      - 'test/community_content_filter_dialog_test.dart'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Verify plaza controls, mute editing, layout and wording
        run: |
          flutter test test/community_content_filter_dialog_test.dart --reporter expanded
          flutter test test/community_filter_dialog_layout_test.dart --reporter expanded
          flutter test test/community_header_quality_test.dart --reporter expanded
          flutter test test/community_mute_wording_l10n_test.dart --reporter expanded
          flutter test test/community_back_navigation_test.dart --reporter expanded
          flutter test test/community_my_works_controls_test.dart --reporter expanded
      - name: Capture updated real Flutter screens and post flow
        env:
          NIARIM_FIVE_FIXES_CAPTURE: build/five-fixes
        run: flutter test test/five_fixes_screenshot_test.dart --reporter expanded
      - name: Ensure all eight captures exist
        run: |
          for name in 01_mute_words 02_mute_tags 03_selected_favorites_white 04_compact_tag_search 05_french_tab_alignment 06_work_plaza_post_button 07_my_works_after_button 08_after_post_action; do
            test -s "build/five-fixes/${name}.png"
          done
      - name: Upload updated screenshots and post-flow captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-updates-real-flutter-screenshots
          path: build/five-fixes/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload resolved Flutter dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: ignore
          retention-days: 2
