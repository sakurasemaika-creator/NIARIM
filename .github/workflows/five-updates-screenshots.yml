name: Five Updated UI Screenshots

on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/five-updates-screenshots.yml'
      - 'test/five_fixes_screenshot_test.dart'
      - 'lib/screens/community/community_screen.dart'
      - 'lib/screens/community/community_my_works_screen.dart'
      - 'lib/screens/community/community_author_works_screen.dart'
      - 'lib/screens/community/community_work_settings_screen.dart'
      - 'lib/screens/home/home_screen.dart'
      - 'lib/screens/home/widgets/project_list_widget.dart'
      - 'lib/services/community_service.dart'
      - 'lib/services/theme_service.dart'
      - 'lib/l10n/**'
      - 'pubspec.yaml'
      - 'test/community_my_works_controls_test.dart'
      - 'test/community_back_navigation_test.dart'
      - 'test/community_content_filter_dialog_test.dart'
      - 'test/community_filter_dialog_layout_test.dart'
      - 'test/community_search_tabs_test.dart'
      - 'test/community_work_card_layout_test.dart'
      - 'test/community_mute_wording_l10n_test.dart'
      - 'test/community_content_filter_l10n_contract_test.dart'
      - 'lib/screens/community/widgets/community_work_card.dart'
      - 'lib/screens/community/widgets/community_floating_preview.dart'
      - 'lib/screens/community/widgets/community_playback_status_view.dart'
      - 'lib/screens/community/community_work_detail_screen.dart'
      - 'lib/services/api/community_api.dart'
      - 'test/community_playback_status_capture_test.dart'
      - 'test/community_milestone_store_test.dart'
      - 'test/community_service_test.dart'
      - 'lib/services/community_milestone_store.dart'
      - 'lib/screens/community/community_follow_notifications_screen.dart'
      - 'test/home_entry_navigation_test.dart'
      - 'test/community_header_matrix_test.dart'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Verify plaza controls, mute editing, layout and wording
        run: |
          flutter test test/community_content_filter_dialog_test.dart --reporter expanded
          flutter test test/community_search_tabs_test.dart --reporter expanded
          flutter test test/community_work_card_layout_test.dart --plain-name 'thumbnail uses the right-side menu and a bookmark by counts' --reporter expanded
          flutter test test/community_mute_wording_l10n_test.dart --reporter expanded
          flutter test test/community_content_filter_l10n_contract_test.dart --reporter expanded
          flutter test test/community_playback_status_capture_test.dart --reporter expanded
          flutter test test/community_milestone_store_test.dart --reporter expanded
          flutter test test/community_service_test.dart --reporter expanded
          flutter test test/community_filter_dialog_layout_test.dart --reporter expanded
          flutter test test/community_header_quality_test.dart --reporter expanded
          flutter test test/community_mute_wording_l10n_test.dart --reporter expanded
          flutter test test/community_back_navigation_test.dart --reporter expanded
          flutter test test/community_my_works_controls_test.dart --reporter expanded
          flutter test test/home_entry_navigation_test.dart --plain-name 'home back arrow, right drawer and scroll-to-top obey layout' --reporter expanded
          flutter test test/home_scroll_continuity_test.dart --reporter expanded
          NIARIM_AUDIT_SMOKE=1 flutter test test/community_header_matrix_test.dart --plain-name 'plaza header matrix: new' --reporter expanded
      - name: Capture updated real Flutter screens and post flow
        env:
          NIARIM_FIVE_FIXES_CAPTURE: build/five-fixes
        run: |
          flutter test test/five_fixes_screenshot_test.dart --reporter expanded
          flutter test test/community_playback_status_capture_test.dart --reporter expanded
      - name: Ensure all fourteen captures exist
        run: |
          for name in 00_advanced_content_filters 01_mute_words 02_mute_tags 03_selected_favorites_white 04_compact_tag_search 05_french_tab_alignment 06_work_plaza_post_button 07_my_works_after_button 08_after_post_action 09_my_works_bulk_selection 10_individual_work_settings 11_individual_delete_confirmation 12_my_public_works_page 13_other_creator_mute_button 14_search_history_expanded 15_saved_search_expanded 16_deleted_video_preview 17_private_video_preview 18_unavailable_video_preview 19_playback_check_failed 20_updated_plaza_card_layout; do
            test -s "build/five-fixes/${name}.png"
          done
      - name: Upload updated screenshots and post-flow captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-updates-real-flutter-screenshots
          path: build/five-fixes/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload resolved Flutter dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: ignore
          retention-days: 2
