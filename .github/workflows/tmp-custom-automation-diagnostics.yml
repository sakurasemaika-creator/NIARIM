name: TMP Custom Automation Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-custom-automation-diagnostics.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 scripts/tmp_integrate_custom_automation_presets_v2.py
      - run: dart format lib/services/filter_service.dart lib/services/custom_automation_service.dart lib/engine/custom_automation_executor.dart lib/engine/custom_automation_filter_runner.dart lib/engine/color_trace_adjust_engine.dart lib/models/custom_automation_builtin_presets.dart
      - name: Capture analyze diagnostics
        run: |
          set +e
          flutter analyze lib/services/filter_service.dart lib/services/custom_automation_service.dart lib/engine/custom_automation_executor.dart lib/engine/custom_automation_filter_runner.dart lib/engine/color_trace_adjust_engine.dart lib/models/custom_automation_builtin_presets.dart test/custom_automation_service_test.dart > scripts/tmp_custom_automation_analyze.txt 2>&1
          code=$?
          cat scripts/tmp_custom_automation_analyze.txt
          echo "exit_code=$code" >> scripts/tmp_custom_automation_analyze.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/tmp_custom_automation_analyze.txt
          git commit -m 'ci: capture custom automation analyze diagnostics'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
