name: Temporary Pixel Art GREEN
on:
  push:
    branches: [dev_branch]
permissions:
  contents: write
jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
      - name: Patch applyPixelate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/engine/filter_engine.dart')
          s = p.read_text()
          old = '''    final mosaic = applyMosaic(data, width, height, mosaicSize);
    return quantizeColors(
      mosaic,
      colorMode: colorMode,
      colorLevels: colorLevels,
      paletteColors: paletteColors,
    );'''
          new = '''    final size = mosaicSize.clamp(1, 64);
    final result = Uint8List.fromList(data);
    for (int y = 0; y < height; y += size) {
      for (int x = 0; x < width; x += size) {
        int weightedR = 0, weightedG = 0, weightedB = 0, alphaWeight = 0;
        for (int dy = 0; dy < size && y + dy < height; dy++) {
          for (int dx = 0; dx < size && x + dx < width; dx++) {
            final i = ((y + dy) * width + (x + dx)) * 4;
            final a = data[i + 3];
            if (a == 0) continue;
            weightedR += data[i] * a;
            weightedG += data[i + 1] * a;
            weightedB += data[i + 2] * a;
            alphaWeight += a;
          }
        }
        if (alphaWeight == 0) continue;
        final cell = Uint8List.fromList([
          (weightedR / alphaWeight).round().clamp(0, 255),
          (weightedG / alphaWeight).round().clamp(0, 255),
          (weightedB / alphaWeight).round().clamp(0, 255),
          255,
        ]);
        final quantized = quantizeColors(
          cell,
          colorMode: colorMode,
          colorLevels: colorLevels,
          paletteColors: paletteColors,
        );
        for (int dy = 0; dy < size && y + dy < height; dy++) {
          for (int dx = 0; dx < size && x + dx < width; dx++) {
            final i = ((y + dy) * width + (x + dx)) * 4;
            if (data[i + 3] == 0) continue;
            result[i] = quantized[0];
            result[i + 1] = quantized[1];
            result[i + 2] = quantized[2];
          }
        }
      }
    }
    return result;'''
          if old not in s:
              raise SystemExit('expected applyPixelate implementation not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/engine/pixel_art_filter_engine_test.dart --reporter expanded
      - name: Commit green implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/engine/filter_engine.dart
          git commit -m 'fix: separate true pixel art from mosaic'
          git push origin HEAD:dev_branch
