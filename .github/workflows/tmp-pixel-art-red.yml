name: Temporary Pixel Art RED
on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - 'test/engine/pixel_art_filter_engine_test.dart'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/engine/pixel_art_filter_engine_test.dart --reporter expanded
