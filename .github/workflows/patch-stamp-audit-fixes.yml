name: Apply Stamp Audit Fixes

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/patch-stamp-audit-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0

      - name: Apply narrowly-scoped fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          # 1) Stamp edit UI: expose the opacity required by spec.
          replace_once(
              'lib/screens/canvas/widgets/stamp_panel.dart',
              """          SwitchListTile(\n            title: Text(l10n.stampRotationLabel),\n            value: _stamp.rotation,\n            onChanged: (v) => setState(() => _stamp = _stamp.copyWith(rotation: v)),\n          ),\n          // ピクセルモード：ONにするとスタンプ\n""",
              """          SwitchListTile(\n            title: Text(l10n.stampRotationLabel),\n            value: _stamp.rotation,\n            onChanged: (v) => setState(() => _stamp = _stamp.copyWith(rotation: v)),\n          ),\n          _intSliderRow(\n            l10n.brushSettingsOpacityLabel,\n            _stamp.opacity,\n            1,\n            100,\n            (v) => setState(() => _stamp = _stamp.copyWith(opacity: v)),\n          ),\n          // ピクセルモード：ONにするとスタンプ\n""",
          )
          replace_once(
              'lib/screens/canvas/widgets/stamp_panel.dart',
              """  Widget _sliderRow(String label, double value, double min, double max, ValueChanged<double> onChanged) {\n""",
              """  Widget _intSliderRow(\n    String label,\n    int value,\n    int min,\n    int max,\n    ValueChanged<int> onChanged,\n  ) {\n    return Row(\n      children: [\n        SizedBox(width: 60, child: Text(label, style: const TextStyle(fontSize: 12))),\n        Expanded(\n          child: SteppedSlider(\n            min: min.toDouble(),\n            max: max.toDouble(),\n            value: value.toDouble().clamp(min.toDouble(), max.toDouble()),\n            step: 1,\n            onChanged: (v) => onChanged(v.round()),\n          ),\n        ),\n        SizedBox(\n          width: 40,\n          child: EditableSliderValue(\n            text: value.toString(),\n            style: const TextStyle(fontSize: 12),\n            value: value.toDouble(),\n            min: min.toDouble(),\n            max: max.toDouble(),\n            isInt: true,\n            onChanged: (v) => onChanged(v.round()),\n          ),\n        ),\n      ],\n    );\n  }\n\n  Widget _sliderRow(String label, double value, double min, double max, ValueChanged<double> onChanged) {\n""",
          )

          # 2) Stamp bundle import must not drop opacity.
          replace_once(
              'lib/services/stamp_service.dart',
              """      density: imported.density,\n      scatter: imported.scatter,\n      pixelMode: imported.pixelMode,\n""",
              """      density: imported.density,\n      scatter: imported.scatter,\n      opacity: imported.opacity,\n      pixelMode: imported.pixelMode,\n""",
          )

          # 3) Apply Stamp.opacity to the texture alpha after optional pixelation.
          replace_once(
              'lib/engine/procedural_texture.dart',
              """  if (stamp.pixelMode) {\n    texture = FilterEngine().applyPixelate(texture, size, size);\n  }\n  return texture;\n}\n""",
              """  if (stamp.pixelMode) {\n    texture = FilterEngine().applyPixelate(texture, size, size);\n  }\n  final opacityScale = stamp.opacity.clamp(1, 100) / 100.0;\n  if (opacityScale < 1.0) {\n    final adjusted = Uint8List.fromList(texture);\n    for (int i = 3; i < adjusted.length; i += 4) {\n      adjusted[i] = (adjusted[i] * opacityScale).round().clamp(0, 255);\n    }\n    texture = adjusted;\n  }\n  return texture;\n}\n""",
          )

          # 4) StampEngine now owns path-distance sampling. Passing an already-thinned
          # point list loses short turns and makes real drawing depend on pointer rate.
          replace_once(
              'lib/screens/canvas/widgets/canvas_area.dart',
              """    // ストローク点をスタンプ間隔で間引く（密度が高すぎるとほぼ塗りつぶしになるため）\n    final spacing = math.max(stampSize * 0.6, 4.0);\n    final sampled = <ui.Offset>[];\n    Offset? last;\n    for (final p in _subToolStrokePoints) {\n      if (last == null || (p - last).distance >= spacing) {\n        sampled.add(ui.Offset(p.dx, p.dy));\n        last = p;\n      }\n    }\n    if (sampled.isEmpty) {\n      sampled.add(\n        ui.Offset(_subToolStrokePoints.first.dx, _subToolStrokePoints.first.dy),\n      );\n    }\n\n""",
              """    // StampEngine側でパス長に沿った再サンプリングを行うため、ここでは\n    // 生の入力点を保持する。事前に間引くと短い折れ返し・曲線が失われ、\n    // 入力イベント密度によってスタンプ形状が変化してしまう。\n    final stampPoints = _subToolStrokePoints\n        .map((p) => ui.Offset(p.dx, p.dy))\n        .toList(growable: false);\n\n""",
          )
          replace_once(
              'lib/screens/canvas/widgets/canvas_area.dart',
              """      points: sampled,\n      stampSize: stampSize,\n""",
              """      points: stampPoints,\n      stampSize: stampSize,\n""",
          )
          PY

      - name: Verify changed files
        run: |
          git diff --check
          git diff --stat

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/models/stamp.dart lib/screens/canvas/widgets/stamp_panel.dart lib/services/stamp_service.dart lib/engine/procedural_texture.dart lib/screens/canvas/widgets/canvas_area.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix stamp opacity and raw path wiring"
          git push origin HEAD:dev_branch
