name: One-shot Fix Final Analyzer Warning

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-fix-final-analyzer-warning.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Remove only the unused helper
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('test/custom_automation_production_surface_visual_test.dart')
          text = path.read_text()
          pattern = r"\nint _nonTransparentPixels\(Uint8List pixels\) \{\n  var count = 0;\n  for \(var i = 3; i < pixels\.length; i \+= 4\) \{\n    if \(pixels\[i\] != 0\) count\+\+;\n  \}\n  return count;\n\}\n?$"
          updated, count = re.subn(pattern, '\n', text)
          if count != 1:
              raise SystemExit(f'expected one unused helper, removed {count}')
          path.write_text(updated)
      - run: dart format test/custom_automation_production_surface_visual_test.dart
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Focused regression
        run: flutter test test/custom_automation_production_surface_visual_test.dart --reporter expanded
      - name: Persist verified cleanup and remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/custom_automation_production_surface_visual_test.dart
          git commit -m "test: remove unused automation proof helper"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
          git rm .github/workflows/one-shot-fix-final-analyzer-warning.yml
          git commit -m "ci: remove final analyzer warning one-shot"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
