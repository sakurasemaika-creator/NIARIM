name: TMP Auto Lineart Finish Core

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/tmp-auto-lineart-finish-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply specification
        run: python3 scripts/tmp_auto_lineart_finish_core.py
      - name: Format
        run: dart format lib/models/filter_def.dart lib/services/filter_service.dart lib/engine/auto_lineart_engine.dart lib/engine/filter_engine.dart lib/screens/canvas/widgets/filter_panel.dart test/auto_lineart_filter_test.dart
      - name: Analyze production changes
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/models/filter_def.dart lib/services/filter_service.dart lib/engine/auto_lineart_engine.dart lib/engine/filter_engine.dart lib/screens/canvas/widgets/filter_panel.dart
      - name: Test auto line art core and control gestures
        run: flutter test test/auto_lineart_filter_test.dart test/auto_lineart_control_overlay_test.dart
      - name: Test drawing filter regressions
        run: flutter test test/filter_engine_aurora_hologram_test.dart test/filter_engine_ink_pool_test.dart test/drawing_filters_strict_test.dart
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/models/filter_def.dart lib/services/filter_service.dart lib/engine/auto_lineart_engine.dart lib/engine/filter_engine.dart lib/screens/canvas/widgets/filter_panel.dart test/auto_lineart_filter_test.dart
          git diff --cached --quiet && exit 0
          git commit -m 'feat: finish auto lineart editable preview behavior'
          git reset --hard HEAD
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
