name: One-shot Current Coverage Census

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/one-shot-current-coverage-census.yml'

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Run complete Flutter suite with coverage
        run: timeout 2400s flutter test --coverage --reporter compact
      - name: Build production coverage census
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lcov = Path('coverage/lcov.info').read_text(encoding='utf-8', errors='ignore')
          records = []
          for block in lcov.split('end_of_record'):
              sf = re.search(r'^SF:(.+)$', block, re.M)
              if not sf: continue
              path = sf.group(1)
              marker = '/lib/'
              if marker in path:
                  rel = 'lib/' + path.split(marker, 1)[1]
              elif path.startswith('lib/'):
                  rel = path
              else:
                  continue
              if rel.startswith('lib/l10n/app_localizations_') and rel != 'lib/l10n/app_localizations.dart':
                  kind = 'generated-localization'
              else:
                  kind = 'production'
              lf = re.search(r'^LF:(\d+)$', block, re.M)
              lh = re.search(r'^LH:(\d+)$', block, re.M)
              lines = int(lf.group(1)) if lf else 0
              hit = int(lh.group(1)) if lh else 0
              pct = (100.0 * hit / lines) if lines else 100.0
              records.append((rel, kind, lines, hit, pct))

          production = [r for r in records if r[1] == 'production']
          zeros = [r for r in production if r[2] > 0 and r[3] == 0]
          low = sorted([r for r in production if r[2] > 0 and r[3] > 0 and r[4] < 50], key=lambda r:(r[4], r[0]))
          total_lines = sum(r[2] for r in production)
          total_hit = sum(r[3] for r in production)
          total_pct = 100.0 * total_hit / total_lines if total_lines else 100.0

          out = [
              '# Current production coverage census', '',
              f'- Production files represented in LCOV: **{len(production)}**',
              f'- Executable lines: **{total_lines}**',
              f'- Hit lines: **{total_hit}**',
              f'- Aggregate line coverage: **{total_pct:.2f}%**',
              f'- Zero-hit production files: **{len(zeros)}**',
              f'- Partially hit production files below 50%: **{len(low)}**', '',
              '## Zero-hit production files',
          ]
          out += [f'- `{p}` ({lf} executable lines)' for p,_,lf,lh,pct in sorted(zeros)] or ['- None']
          out += ['', '## Below 50% production files']
          out += [f'- `{p}` — {lh}/{lf} ({pct:.2f}%)' for p,_,lf,lh,pct in low] or ['- None']
          out += ['', '## All production files']
          out += [f'- `{p}` — {lh}/{lf} ({pct:.2f}%)' for p,_,lf,lh,pct in sorted(production)]
          Path('build').mkdir(exist_ok=True)
          Path('build/current-coverage-census.md').write_text('\n'.join(out), encoding='utf-8')
          print('\n'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: current-coverage-census
          path: |
            build/current-coverage-census.md
            coverage/lcov.info
          retention-days: 7

