name: Temporary Retro CRT VHS Distinction

on:
  push:
    branches:
      - feature/pixel-filter-blend-refresh
    paths:
      - .github/workflows/tmp-retro-crt-vhs-distinction.yml
      - .github/tmp_retro_crt_vhs_repair.py
      - test/engine/analog_filter_distinction_test.dart

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-filter-blend-refresh
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply bounded production change
        run: python3 .github/tmp_retro_crt_vhs_repair.py
      - name: Format
        run: dart format lib/engine/filter_engine_legacy.dart test/engine/analog_filter_distinction_test.dart
      - name: Test
        run: flutter test test/engine/analog_filter_distinction_test.dart test/engine/noise_filter_distinction_test.dart test/mosaic_filter_test.dart test/engine/pixel_art_engine_test.dart test/engine/pixel_art_filter_engine_test.dart
      - name: Analyze
        run: flutter analyze lib/engine/filter_engine.dart lib/engine/filter_engine_legacy.dart lib/engine/vhs_noise_engine.dart test/engine/analog_filter_distinction_test.dart
      - name: Commit verified production change
        run: |
          rm .github/workflows/tmp-retro-crt-vhs-distinction.yml
          rm .github/tmp_retro_crt_vhs_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: distinguish retro anime CRT and VHS effects"
          git push origin HEAD:feature/pixel-filter-blend-refresh
