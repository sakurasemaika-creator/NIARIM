name: Temporary Retro CRT VHS Distinction
on:
  push:
    branches: [feature/pixel-filter-blend-refresh]
    paths: ['.github/workflows/tmp-retro-crt-vhs-distinction.yml']
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-filter-blend-refresh
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Clarify retro anime implementation and add regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/engine/filter_engine_legacy.dart'); s=p.read_text()
          old='''  /// レトロアニメ風：暖色寄りのカラーグレーディング・彩度低下・粒状ノイズを
  /// 組み合わせた、昔のセルアニメ・VHS録画のような質感。1画素あたりの
  /// 色変換とノイズ処理1回分のみで、既存のanimeStyle（ポスタリゼーション＋
  /// Sobelエッジ検出）より軽い。
  Uint8List applyRetroAnime(
    Uint8List data,
    int width,
    int height,
    double strength,
  ) {'''
          new='''  /// レトロアニメ風：暖色寄りのカラーグレーディング・彩度低下・
  /// ニュートラルなフィルムグレインを組み合わせ、古いセル画をフィルム撮影
  /// したような質感にする。CRTの走査線・周辺減光やVHSのトラッキングずれ・
  /// 色にじみは含めないため、表示機器／テープ由来の効果とは明確に分離する。
  /// [seed]はテスト・再現可能なプレビュー用。通常利用では省略できる。
  Uint8List applyRetroAnime(
    Uint8List data,
    int width,
    int height,
    double strength, {
    int? seed,
  }) {'''
          if s.count(old)!=1: raise SystemExit('retro signature anchor mismatch')
          s=s.replace(old,new,1)
          old2='''    return applyNoise(result, width, height, amount * 0.15, NoiseType.gaussian);'''
          new2='''    return applyFilmGrain(
      result,
      width,
      height,
      amount * 0.15,
      seed: seed,
    );'''
          if s.count(old2)!=1: raise SystemExit('retro noise anchor mismatch')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          cat > test/engine/analog_filter_distinction_test.dart <<'DART'
          import 'dart:typed_data';

          import 'package:flutter_test/flutter_test.dart';
          import 'package:niarim/engine/filter_engine.dart';
          import 'package:niarim/engine/vhs_noise_engine.dart';

          void main() {
            test('retro anime adds grading while film grain alone preserves channel deltas', () {
              final engine = FilterEngine();
              final input = Uint8List.fromList(List<int>.generate(16, (i) {
                const px = <int>[120, 100, 80, 255];
                return px[i % 4];
              }));
              final grain = engine.applyFilmGrain(input, 2, 2, 0.15, seed: 7);
              final retro = engine.applyRetroAnime(input, 2, 2, 100, seed: 7);
              for (var i = 0; i < input.length; i += 4) {
                expect(grain[i] - grain[i + 1], 20);
                expect(grain[i + 1] - grain[i + 2], 20);
              }
              expect(retro, isNot(equals(grain)));
            });

            test('CRT produces static alternating scanlines without changing alpha', () {
              final engine = FilterEngine();
              final input = Uint8List(4 * 4 * 4);
              for (var i = 0; i < input.length; i += 4) {
                input[i] = 140; input[i + 1] = 140; input[i + 2] = 140; input[i + 3] = 200;
              }
              final out = engine.applyCrt(input, 4, 4, 100);
              final row0 = out[0];
              final row1 = out[4 * 4];
              expect(row0, lessThan(row1));
              for (var i = 3; i < out.length; i += 4) {
                expect(out[i], 200);
              }
            });

            test('VHS tracking is frame-dependent while CRT is static', () {
              final engine = FilterEngine();
              const w = 24, h = 24;
              final input = Uint8List(w * h * 4);
              for (var y = 0; y < h; y++) {
                for (var x = 0; x < w; x++) {
                  final i = (y * w + x) * 4;
                  input[i] = x * 10; input[i + 1] = y * 10; input[i + 2] = 80; input[i + 3] = 255;
                }
              }
              final crtA = engine.applyCrt(input, w, h, 80);
              final crtB = engine.applyCrt(input, w, h, 80);
              expect(crtA, equals(crtB));
              final vhsA = VhsNoiseEngine.apply(input, w, h, noiseStrength: 0, scanlineStrength: 0, colorBleed: 0, tracking: 100, seed: 1984, frameIndex: 0);
              final vhsB = VhsNoiseEngine.apply(input, w, h, noiseStrength: 0, scanlineStrength: 0, colorBleed: 0, tracking: 100, seed: 1984, frameIndex: 1);
              expect(vhsA, isNot(equals(vhsB)));
              for (var i = 3; i < vhsA.length; i += 4) {
                expect(vhsA[i], 255);
                expect(vhsB[i], 255);
              }
            });
          }
          DART
          dart format lib/engine/filter_engine_legacy.dart test/engine/analog_filter_distinction_test.dart
      - name: Verify
        shell: bash
        run: |
          flutter test test/engine/analog_filter_distinction_test.dart test/engine/noise_filter_distinction_test.dart test/mosaic_filter_test.dart test/engine/pixel_art_engine_test.dart test/engine/pixel_art_filter_engine_test.dart
          flutter analyze lib/engine/filter_engine.dart lib/engine/filter_engine_legacy.dart lib/engine/vhs_noise_engine.dart test/engine/analog_filter_distinction_test.dart
      - name: Commit and clean temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-retro-crt-vhs-distinction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/engine/filter_engine_legacy.dart test/engine/analog_filter_distinction_test.dart .github/workflows/tmp-retro-crt-vhs-distinction.yml
          git commit -m 'refactor: distinguish retro anime CRT and VHS effects'
          git push origin HEAD:feature/pixel-filter-blend-refresh