name: Temporary Normal Task Closure Verify

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-normal-task-closure-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze affected production surfaces
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/screens/timeline/timeline_screen.dart lib/utils/timeline_clip_split.dart lib/models/audio_clip.dart lib/models/media_clip.dart lib/screens/canvas/widgets/filter_panel.dart lib/engine/custom_automation_executor.dart lib/services/custom_automation_service.dart
      - name: Timeline Cut regression
        shell: bash
        run: |
          mapfile -t tests < <(find test -type f -name '*_test.dart' | grep -E 'timeline.*(cut|clip|offset|overflow)|source_offset' | sort)
          printf 'Timeline closure tests:\n%s\n' "${tests[*]}"
          test ${#tests[@]} -gt 0
          flutter test "${tests[@]}" --reporter expanded
      - name: Automation regression
        run: flutter test test/custom_automation_executor_test.dart test/services/custom_automation_builtin_migration_test.dart test/custom_automation_service_test.dart test/custom_automation_frame_scope_test.dart test/custom_automation_discrete_step_test.dart test/generated_filter_redo_test.dart test/filter_panel_production_ui_contract_test.dart --reporter expanded
      - name: Re-run all requested production UI operations
        run: flutter test test/visual/feature_operation_capture_test.dart --reporter expanded
