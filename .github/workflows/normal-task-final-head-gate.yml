name: Normal Task Final HEAD Gate

# Rerun after verified analyzer cleanup.
# Normal-task rerun anchor: verify the current dev_branch after Step 2-4 proofs.
# 2026-09-11 rerun anchor: verify latest dev_branch after subsequent app fixes.
# 2026-09-12 rerun anchor: verify latest dev_branch after stale-test alignment fixes.
# 2026-09-13 rerun anchor: verify latest dev_branch after confirmed final-gate regressions.
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/normal-task-final-head-gate.yml'
  workflow_dispatch:

concurrency:
  group: normal-task-final-head-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Full Flutter suite
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/full-flutter-suite.log
          test_exit=${PIPESTATUS[0]}
          echo "$test_exit" > /tmp/full-flutter-suite.exit
          exit "$test_exit"
      - name: Upload Full Flutter suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normal-task-full-flutter-suite-log
          path: |
            /tmp/full-flutter-suite.log
            /tmp/full-flutter-suite.exit
          if-no-files-found: error
          retention-days: 7
      - name: Release APK build
        run: flutter build apk --release --target-platform android-arm64 --no-pub
