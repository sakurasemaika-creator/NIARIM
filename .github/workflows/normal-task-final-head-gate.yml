name: Normal Task Final HEAD Gate

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/normal-task-final-head-gate.yml'
  workflow_dispatch:

concurrency:
  group: normal-task-final-head-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Full Flutter suite
        run: flutter test --reporter expanded
      - name: Release APK build
        run: flutter build apk --release --target-platform android-arm64 --no-pub
