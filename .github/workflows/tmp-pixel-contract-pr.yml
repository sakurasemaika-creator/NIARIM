name: Temporary Pixel Contract PR
on:
  pull_request:
    branches: [dev_branch]
    paths:
      - 'lib/engine/**'
      - 'test/engine/**'
      - '.github/workflows/tmp-pixel-contract-pr.yml'
permissions:
  contents: read
jobs:
  pixel-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run pixel-art contract tests
        run: |
          flutter test test/engine/pixel_art_engine_test.dart test/engine/pixel_art_filter_engine_test.dart test/engine/filter_engine_pixel_art_contract_test.dart test/engine/stamp_pixel_art_route_test.dart --reporter expanded
