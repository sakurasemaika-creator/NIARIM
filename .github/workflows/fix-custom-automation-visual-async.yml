name: Repair Custom Automation Visual Pixel Reads

on:
  push:
    branches:
      - tmp-automation-visual-repair6
    paths:
      - '.github/workflows/fix-custom-automation-visual-async.yml'
      - '.github/scripts/repair_custom_automation_visual.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-automation-visual-repair6
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply automation visual audit repair
        run: python3 .github/scripts/repair_custom_automation_visual.py
      - run: dart format test/custom_automation_visual_audit_test.dart
      - name: Analyze custom automation visual audit
        run: flutter analyze test/custom_automation_visual_audit_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Run custom automation pixel-changing visual audit
        run: flutter test test/custom_automation_visual_audit_test.dart --reporter expanded
      - name: Upload repaired automation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-repaired-evidence
          path: build/visual-reaudit/custom-automation
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified repair on temp branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/custom_automation_visual_audit_test.dart
          git commit -m 'test: prove automation changes raw Canvas pixels'
          git push origin HEAD:tmp-automation-visual-repair6
