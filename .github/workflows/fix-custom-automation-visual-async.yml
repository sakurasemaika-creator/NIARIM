name: Repair Custom Automation Visual Pixel Reads

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/fix-custom-automation-visual-async.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Snapshot raw Canvas tiles and drive async filter work
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/custom_automation_visual_audit_test.dart')
          s = p.read_text()
          if "import 'dart:async';" not in s:
              s = s.replace("import 'dart:io';\n", "import 'dart:async';\nimport 'dart:io';\n", 1)
          if "package:niarim/engine/tile_manager.dart" not in s:
              s = s.replace(
                  "import 'package:niarim/engine/custom_automation_filter_runner.dart';\n",
                  "import 'package:niarim/engine/custom_automation_filter_runner.dart';\nimport 'package:niarim/engine/tile_manager.dart';\n",
                  1,
              )
          old = '''      Future<Uint8List> activeLayerPixels() async {
                final canvas = canvasWidget();
                final layerId = canvas.currentLayerId;
                expect(layerId, isNotNull, reason: 'Canvas must expose an active layer');
                final tm = ps!.tileManagerOf(project.id);
                final key = ps!.tileKeyFor(
                  project.id,
                  canvas.sceneId,
                  canvas.currentFrame,
                  layerId!,
                );
                final image = await tm.compositeLayerToImage(key);
                final data = await image.toByteData(format: ui.ImageByteFormat.rawRgba);
                image.dispose();
                expect(data, isNotNull);
                return Uint8List.fromList(data!.buffer.asUint8List());
              }
'''
          if old not in s:
              # dart format in source uses six-space indentation; normalize via a looser slice.
              start = s.find('      Future<Uint8List> activeLayerPixels() async {')
              end = s.find('\n      int changedBytes(', start)
              if start < 0 or end < 0:
                  raise SystemExit('activeLayerPixels anchor changed')
              old = s[start:end] + '\n'
          new = '''      Uint8List activeLayerPixels() {
        final canvas = canvasWidget();
        final layerId = canvas.currentLayerId;
        expect(layerId, isNotNull, reason: 'Canvas must expose an active layer');
        final tm = ps!.tileManagerOf(project.id);
        final key = ps!.tileKeyFor(
          project.id,
          canvas.sceneId,
          canvas.currentFrame,
          layerId!,
        );
        const tileBytes = TileManager.tileSize * TileManager.tileSize * 4;
        final snapshot = Uint8List(tm.tilesX * tm.tilesY * tileBytes);
        var offset = 0;
        for (var ty = 0; ty < tm.tilesY; ty++) {
          for (var tx = 0; tx < tm.tilesX; tx++) {
            final tile = tm.getTile(key, tx, ty);
            if (tile != null) {
              snapshot.setRange(offset, offset + tileBytes, tile);
            }
            offset += tileBytes;
          }
        }
        return snapshot;
      }

      Future<T> driveAsync<T>(Future<T> future) async {
        T? value;
        Object? error;
        StackTrace? stack;
        var done = false;
        future.then(
          (result) {
            value = result;
            done = true;
          },
          onError: (Object e, StackTrace st) {
            error = e;
            stack = st;
            done = true;
          },
        );
        for (var i = 0; i < 600 && !done; i++) {
          await tester.pump(const Duration(milliseconds: 16));
          await Future<void>.delayed(Duration.zero);
        }
        if (!done) {
          throw TimeoutException('Canvas automation async operation did not finish');
        }
        if (error != null) {
          Error.throwWithStackTrace(error!, stack!);
        }
        return value as T;
      }
'''
          s = s.replace(old, new, 1)
          s = s.replace('await tester.runAsync(activeLayerPixels)', 'activeLayerPixels()')
          old_runner = '''      await tester.runAsync(
        () => CustomAutomationFilterRunner.apply(
          projectService: ps!,
          projectId: project.id,
          sceneId: canvasAtRecord.sceneId,
          frameIndex: canvasAtRecord.currentFrame,
          sourceLayerId: sourceLayerId!,
          filter: recordedFilter,
        ),
      );'''
          direct_runner = '''      await driveAsync(
        CustomAutomationFilterRunner.apply(
          projectService: ps!,
          projectId: project.id,
          sceneId: canvasAtRecord.sceneId,
          frameIndex: canvasAtRecord.currentFrame,
          sourceLayerId: sourceLayerId!,
          filter: recordedFilter,
        ),
      );'''
          if old_runner in s:
              s = s.replace(old_runner, direct_runner, 1)
          else:
              old_direct = '''      await CustomAutomationFilterRunner.apply(
        projectService: ps!,
        projectId: project.id,
        sceneId: canvasAtRecord.sceneId,
        frameIndex: canvasAtRecord.currentFrame,
        sourceLayerId: sourceLayerId!,
        filter: recordedFilter,
      );'''
              if old_direct not in s:
                  raise SystemExit('filter runner anchor changed')
              s = s.replace(old_direct, direct_runner, 1)
          s = s.replace(
              "      await tester.pump(const Duration(milliseconds: 900));\n      final afterReplay =",
              "      for (var i = 0; i < 120; i++) {\n        await tester.pump(const Duration(milliseconds: 16));\n        await Future<void>.delayed(Duration.zero);\n      }\n      final afterReplay =",
              1,
          )
          p.write_text(s)
          PY
      - run: dart format test/custom_automation_visual_audit_test.dart
      - name: Analyze custom automation visual audit
        run: flutter analyze test/custom_automation_visual_audit_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Run custom automation pixel-changing visual audit
        run: flutter test test/custom_automation_visual_audit_test.dart --reporter expanded
      - name: Upload repaired automation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-repaired-evidence
          path: build/visual-reaudit/custom-automation
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified repair
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-custom-automation-visual-async.yml
          git add test/custom_automation_visual_audit_test.dart
          git commit -m 'test: prove automation changes raw Canvas pixels'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
