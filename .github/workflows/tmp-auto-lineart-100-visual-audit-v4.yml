name: TMP Auto Lineart 100 Visual Audit v4
on:
  push:
    branches: [dev_branch]
    paths: ['.github/workflows/tmp-auto-lineart-100-visual-audit-v4.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {ref: dev_branch, fetch-depth: 0}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Patch production to 100-step smoothing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/screens/canvas/widgets/filter_panel.dart'); s=p.read_text()
          s,n=re.subn(r'final smoothingLevel = \(filter\.autoLineartSmoothing / 10\)\.round\(\)\.clamp\(\s*0,\s*10,\s*\);','final smoothingLevel = filter.autoLineartSmoothing.round().clamp(0, 100);',s); assert n==1,n
          s,n=re.subn(r'\(current\.autoLineartSmoothing / 10\)\.round\(\)\.clamp\(\s*0,\s*10,?\s*\),\s*0,\s*10,','current.autoLineartSmoothing.round().clamp(0, 100),\n                    0,\n                    100,',s); assert n==1,n
          s,n=re.subn(r'autoLineartSmoothing: \(v \* 10\)\.toDouble\(\),','autoLineartSmoothing: v.toDouble(),',s); assert n==1,n
          p.write_text(s)
          p=Path('lib/engine/auto_lineart_engine.dart'); s=p.read_text()
          s=s.replace('(0..10): higher levels smooth the control polygon and retain fewer points.','(0..100): higher levels smooth the control polygon and retain fewer points.')
          s,n=re.subn(r'final level = smoothingLevel\.clamp\(0, 10\);\s*if \(level == 0 \|\| source\.paths\.isEmpty\) return source;','final level = smoothingLevel.clamp(0, 100);\n    if (level == 0 || source.paths.isEmpty) return source;\n    final legacyLevel = level / 10.0;',s); assert n==1,n
          s,n=re.subn(r'final passes = math\.max\(1, level\);\s*final amount = 0\.12 \+ level \* 0\.025;','final passes = math.max(1, legacyLevel.ceil());\n      final amount = 0.12 + legacyLevel * 0.025;',s); assert n==1,n
          assert 'level * 0.08' in s
          s=s.replace('level * 0.08','legacyLevel * 0.08')
          p.write_text(s)

          p=Path('test/auto_lineart_filter_test.dart'); s=p.read_text()
          s=s.replace("test('ten-level smoothing reduces editable control points', () {", "test('100-level smoothing reduces editable control points', () {")
          old='''      final low = AutoLineartEngine.prepareEditableGraph(\n        base,\n        smoothingLevel: 1,\n      );\n      final high = AutoLineartEngine.prepareEditableGraph(\n        base,\n        smoothingLevel: 10,\n      );'''
          new='''      final low = AutoLineartEngine.prepareEditableGraph(\n        base,\n        smoothingLevel: 10,\n      );\n      final high = AutoLineartEngine.prepareEditableGraph(\n        base,\n        smoothingLevel: 100,\n      );'''
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          dart format lib/screens/canvas/widgets/filter_panel.dart lib/engine/auto_lineart_engine.dart test/auto_lineart_filter_test.dart
      - name: Create stable real FilterPanel capture test
        run: |
          cat > test/auto_lineart_filter_panel_visual_audit_test.dart <<'DART'
          import 'dart:io';
          import 'dart:math' as math;
          import 'dart:ui' as ui;

          import 'package:flutter/material.dart';
          import 'package:flutter/rendering.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:niarim/app_bootstrap.dart';
          import 'package:niarim/l10n/app_localizations.dart';
          import 'package:niarim/screens/canvas/widgets/auto_lineart_control_overlay.dart';
          import 'package:niarim/screens/canvas/widgets/filter_panel.dart';
          import 'package:niarim/services/filter_service.dart';
          import 'package:niarim/services/project_service.dart';
          import 'package:niarim/services/theme_service.dart';
          import 'package:provider/provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import 'helpers/load_app_fonts.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();
            final out = Directory('build/auto-lineart-panel-audit');
            final appDocs = Directory('${Directory.systemTemp.path}/niarim_auto_lineart_panel_docs_v4');
            const channel = MethodChannel('plugins.flutter.io/path_provider');

            setUpAll(() {
              out.createSync(recursive: true);
              appDocs.createSync(recursive: true);
            });
            setUp(() {
              SharedPreferences.setMockInitialValues({});
              TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                  .setMockMethodCallHandler(channel, (_) async => appDocs.path);
            });
            tearDown(() {
              TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                  .setMockMethodCallHandler(channel, null);
            });

            Future<void> runPanelAudit(
              WidgetTester tester, {
              required Size physicalSize,
              required double dpr,
              required bool captureTwoLevels,
              required String prefix,
            }) async {
              tester.view.physicalSize = physicalSize;
              tester.view.devicePixelRatio = dpr;
              addTearDown(tester.view.resetPhysicalSize);
              addTearDown(tester.view.resetDevicePixelRatio);
              await loadAppFonts(tester);

              final providers = (await tester.runAsync(buildAppProviders))!;
              ProjectService? ps;
              FilterService? fs;
              StateSetter? rebuildHost;
              String? projectId;
              String? sceneId;
              String? layerId;
              final rootKey = GlobalKey();

              await tester.pumpWidget(
                RepaintBoundary(
                  key: rootKey,
                  child: MultiProvider(
                    providers: providers,
                    child: Builder(
                      builder: (themeContext) => MaterialApp(
                        theme: themeContext.watch<ThemeService>().themeData,
                        locale: const Locale('ja'),
                        localizationsDelegates: AppLocalizations.localizationsDelegates,
                        supportedLocales: AppLocalizations.supportedLocales,
                        home: StatefulBuilder(
                          builder: (context, setState) {
                            ps ??= context.read<ProjectService>();
                            fs ??= context.read<FilterService>();
                            rebuildHost = setState;
                            if (projectId == null || sceneId == null || layerId == null) {
                              return const Scaffold(body: SizedBox.expand());
                            }
                            return Scaffold(
                              body: Stack(
                                children: [
                                  const Positioned.fill(child: ColoredBox(color: Color(0xFFE8E8E8))),
                                  Align(
                                    alignment: Alignment.centerLeft,
                                    child: FilterPanel(
                                      projectId: projectId!,
                                      sceneId: sceneId!,
                                      layerId: layerId!,
                                      frameIndex: 0,
                                      onClose: () {},
                                    ),
                                  ),
                                ],
                              ),
                            );
                          },
                        ),
                      ),
                    ),
                  ),
                ),
              );
              await tester.pump();
              expect(ps, isNotNull);
              expect(fs, isNotNull);

              final project = (await tester.runAsync(
                () => ps!.createProject(
                  name: 'auto-lineart-panel-$prefix',
                  fps: 24,
                  durationSeconds: 1,
                  backgroundColor: 0xFFFFFFFF,
                  exportWidth: 320,
                  exportHeight: 320,
                ),
              ))!;
              final scene = ps!.scenesOf(project.id).first;
              final layer = ps!.layersOf(project.id, scene.id, 0).first;
              final key = ps!.tileKeyFor(project.id, scene.id, 0, layer.id);
              final tm = ps!.tileManagerOf(project.id);
              final tile = tm.getOrCreateTile(key, 0, 0);

              void dot(int x, int y, int radius) {
                for (var yy = y - radius; yy <= y + radius; yy++) {
                  for (var xx = x - radius; xx <= x + radius; xx++) {
                    final dx = xx - x;
                    final dy = yy - y;
                    if (dx * dx + dy * dy <= radius * radius) {
                      tm.setPixel(tile, xx, yy, 25, 25, 25, 255);
                    }
                  }
                }
              }

              for (var x = 28; x <= 220; x++) {
                final y = 118 +
                    48 * math.sin((x - 28) / 26.0) +
                    14 * math.sin((x - 28) / 7.0);
                dot(x, y.round(), 5);
              }
              for (var i = 0; i < 78; i++) {
                dot(124 + i, 120 - i, 4);
              }
              tm.invalidateTile(key, 0, 0);
              tm.markDirty(key, 0, 0);

              fs!.selectFilter('Filter0023');
              fs!.updateFilterParams('Filter0023', autoLineartSmoothing: 45);
              projectId = project.id;
              sceneId = scene.id;
              layerId = layer.id;
              rebuildHost!(() {});

              Future<void> settlePreview() async {
                for (var i = 0; i < 30; i++) {
                  await tester.runAsync(
                    () => Future<void>.delayed(const Duration(milliseconds: 35)),
                  );
                  await tester.pump(const Duration(milliseconds: 25));
                  if (find.byType(AutoLineartControlOverlay).evaluate().isNotEmpty &&
                      find.byType(CircularProgressIndicator).evaluate().isEmpty) {
                    break;
                  }
                }
                expect(find.byType(FilterPanel), findsOneWidget);
                expect(find.byType(AutoLineartControlOverlay), findsOneWidget);
                expect(tester.takeException(), isNull);
              }

              Future<void> capture(String file) async {
                final boundary = rootKey.currentContext!.findRenderObject()! as RenderRepaintBoundary;
                final image = await boundary.toImage(pixelRatio: 1);
                final data = await image.toByteData(format: ui.ImageByteFormat.png);
                await File('${out.path}/$file.png').writeAsBytes(data!.buffer.asUint8List());
                image.dispose();
              }

              await settlePreview();
              await capture('${prefix}_smoothing_45');

              if (captureTwoLevels) {
                fs!.updateFilterParams('Filter0023', autoLineartSmoothing: 85);
                await settlePreview();
                await capture('${prefix}_smoothing_85');
              }
            }

            testWidgets('SP actual FilterPanel capture at smoothing 45 and 85', (tester) async {
              await runPanelAudit(
                tester,
                physicalSize: const Size(1170, 2532),
                dpr: 3,
                captureTwoLevels: true,
                prefix: 'sp',
              );
            }, timeout: const Timeout(Duration(minutes: 2)));

            testWidgets('desktop actual FilterPanel capture at smoothing 45', (tester) async {
              await runPanelAudit(
                tester,
                physicalSize: const Size(1200, 800),
                dpr: 1,
                captureTwoLevels: false,
                prefix: 'desktop',
              );
            }, timeout: const Timeout(Duration(minutes: 2)));
          }
          DART
          dart format test/auto_lineart_filter_panel_visual_audit_test.dart
      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/filter_panel.dart lib/screens/canvas/widgets/auto_lineart_control_overlay.dart test/auto_lineart_filter_test.dart test/auto_lineart_filter_panel_visual_audit_test.dart
      - name: Test and capture
        run: flutter test test/auto_lineart_filter_test.dart test/auto_lineart_control_overlay_test.dart test/auto_lineart_filter_panel_visual_audit_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-lineart-panel-audit-v4
          path: build/auto-lineart-panel-audit/*.png
          if-no-files-found: warn
      - name: Land
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/filter_panel.dart test/auto_lineart_filter_test.dart test/auto_lineart_filter_panel_visual_audit_test.dart
          git commit -m 'feat: restore 100-step auto lineart smoothing and visual audit'
          git reset --hard HEAD
          git clean -fd
          git fetch origin dev_branch
          git rebase origin/dev_branch
          git push origin HEAD:dev_branch
