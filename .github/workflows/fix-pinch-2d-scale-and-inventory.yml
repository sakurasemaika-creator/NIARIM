name: Repair pinch 2D scale and inventory expectation

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/fix-pinch-2d-scale-and-inventory.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get --enforce-lockfile

      - name: Apply narrowly-scoped repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          canvas = Path('lib/screens/canvas/widgets/canvas_area.dart')
          text = canvas.read_text()

          helper = '''/// 2Dキャンバス表示の実倍率を取得する。
          ///
          /// Matrix4.getMaxScaleOnAxis() はZ軸も比較するため、XYだけを0.2倍などへ
          /// 縮小してもZ=1が最大になり「1.0」と誤認する。キャンバス変換はXYの
          /// 一様拡大縮小＋回転なので、第1列のXY成分の長さが実際の表示倍率になる。
          double canvasViewScaleOf(Matrix4 viewTransform) {
            final x = viewTransform.entry(0, 0);
            final y = viewTransform.entry(1, 0);
            final scale = math.sqrt(x * x + y * y);
            return scale.isFinite && scale > 0 ? scale : 1.0;
          }
          '''
          if 'double canvasViewScaleOf(Matrix4 viewTransform)' not in text:
              anchor = '''double boundedCanvasScaleFactor(double currentScale, double requestedFactor) {
            if (currentScale <= 0 ||
                !currentScale.isFinite ||
                !requestedFactor.isFinite) {
              return 1.0;
            }
            final target = (currentScale * requestedFactor).clamp(
              kCanvasMinScale,
              kCanvasMaxScale,
            );
            return target / currentScale;
          }
          '''
              if text.count(anchor) != 1:
                  raise SystemExit('boundedCanvasScaleFactor anchor changed; refusing blind patch')
              text = text.replace(anchor, anchor + '\n' + helper, 1)

          old = 'final currentScale = _transformController.value.getMaxScaleOnAxis();'
          new = 'final currentScale = canvasViewScaleOf(_transformController.value);'
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count not in (0, 2) or (old_count == 0 and new_count != 2):
              raise SystemExit(f'unexpected production scale reads old={old_count} new={new_count}')
          if old_count == 2:
              text = text.replace(old, new)
          canvas.write_text(text)

          pinch = Path('test/canvas_pinch_gesture_test.dart')
          text = pinch.read_text()
          old = 'double currentScale() => _viewMatrix(tester).getMaxScaleOnAxis();'
          new = 'double currentScale() => canvasViewScaleOf(_viewMatrix(tester));'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('pinch currentScale anchor changed')
          old = 'expect(matrix.getMaxScaleOnAxis(), closeTo(kCanvasMinScale, 0.001));'
          new = 'expect(canvasViewScaleOf(matrix), closeTo(kCanvasMinScale, 0.001));'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('pinch min-scale assertion anchor changed')

          patterns = [
              (
                  r'(?m)^(?P<i>\s*)while \(d > math\.pi\) d -= math\.pi \* 2;$',
                  'while (d > math.pi)',
                  'd -= math.pi * 2;',
              ),
              (
                  r'(?m)^(?P<i>\s*)while \(d < -math\.pi\) d \+= math\.pi \* 2;$',
                  'while (d < -math.pi)',
                  'd += math.pi * 2;',
              ),
          ]
          for pattern, condition, statement in patterns:
              match = re.search(pattern, text)
              if match:
                  i = match.group('i')
                  replacement = f'{i}{condition} {{\n{i}  {statement}\n{i}}}'
                  text = text[:match.start()] + replacement + text[match.end():]
              elif f'{condition} {{' not in text:
                  raise SystemExit(f'angle-delta loop anchor changed: {condition}')
          pinch.write_text(text)

          smoke = Path('test/app_smoke_test.dart')
          text = smoke.read_text()
          if "tagMode.selected" not in text:
              pattern = re.compile(
                  r"(?P<i>[ \t]*)expect\(\n"
                  r"(?P=i)  find\.byIcon\(Icons\.sell\),\n"
                  r"(?P=i)  findsOneWidget,\n"
                  r"(?P=i)  reason: 'タグ検索モードに切り替わっていない',\n"
                  r"(?P=i)\);"
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit('community tag-mode assertion anchor changed; refusing blind patch')
              i = match.group('i')
              replacement = (
                  f"{i}final tagModeFinder = find.byType(SegmentedButton<bool>);\n"
                  f"{i}expect(tagModeFinder, findsOneWidget);\n"
                  f"{i}final tagMode = tester.widget<SegmentedButton<bool>>(tagModeFinder);\n"
                  f"{i}expect(\n"
                  f"{i}  tagMode.selected,\n"
                  f"{i}  contains(true),\n"
                  f"{i}  reason: 'タグ検索モードに切り替わっていない',\n"
                  f"{i});"
              )
              text = text[:match.start()] + replacement + text[match.end():]
              smoke.write_text(text)

          gesture = Path('test/gesture_settings_sheet_test.dart')
          text = gesture.read_text()
          if 'await tester.ensureVisible(noneAction);' not in text:
              pattern = re.compile(
                  r"(?P<i>\s*)// scrollUntilVisibleのscrollable引数はScrollView本体ではなく、その内部の\n"
                  r"(?P=i)// Scrollableを要求する。Flutter 3\.47ではSingleChildScrollViewを渡すと\n"
                  r"(?P=i)// ScrollableへのcastでTypeErrorになるため、モーダル所有のScrollableへ\n"
                  r"(?P=i)// 明示的に絞り込む。\n"
                  r"(?P=i)final sheetScrollView = find\.byType\(SingleChildScrollView\);\n"
                  r"(?P=i)expect\(sheetScrollView, findsOneWidget\);\n"
                  r"(?P=i)final sheetScrollable = find\.descendant\(\n"
                  r"(?P=i)  of: sheetScrollView,\n"
                  r"(?P=i)  matching: find\.byType\(Scrollable\),\n"
                  r"(?P=i)\);\n"
                  r"(?P=i)expect\(sheetScrollable, findsOneWidget\);\n"
                  r"(?P=i)await tester\.scrollUntilVisible\(\n"
                  r"(?P=i)  find\.text\(l10n\.gestureActionNone\),\n"
                  r"(?P=i)  120,\n"
                  r"(?P=i)  scrollable: sheetScrollable,\n"
                  r"(?P=i)\);"
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit('gesture scroll helper anchor changed; refusing blind patch')
              i = match.group('i')
              replacement = (
                  f"{i}// SingleChildScrollViewは全選択肢を同じ要素木に保持するため、\n"
                  f"{i}// 動的に再評価されるScrollable Finderではなく、最終項目そのものを\n"
                  f"{i}// ensureVisibleして到達可能性を検証する。\n"
                  f"{i}final noneAction = find.text(l10n.gestureActionNone).last;\n"
                  f"{i}await tester.ensureVisible(noneAction);\n"
                  f"{i}await tester.pumpAndSettle();"
              )
              text = text[:match.start()] + replacement + text[match.end():]
              gesture.write_text(text)
          PY

      - name: Format changed Dart files
        run: dart format lib/screens/canvas/widgets/canvas_area.dart test/canvas_pinch_gesture_test.dart test/app_smoke_test.dart test/gesture_settings_sheet_test.dart

      - name: Analyze changed implementation and regressions
        run: flutter analyze lib/screens/canvas/widgets/canvas_area.dart test/canvas_pinch_gesture_test.dart test/gesture_settings_sheet_test.dart

      - name: Verify all pinch gestures including exact minimum and rotation
        run: flutter test test/canvas_pinch_gesture_test.dart

      - name: Verify save safety
        run: flutter test test/project_save_safety_test.dart

      - name: Verify gesture settings restore sheet
        run: flutter test test/gesture_settings_sheet_test.dart

      - name: Verify full app operation smoke inventory
        run: flutter test test/app_smoke_test.dart

      - name: Commit verified repairs without overwriting concurrent work
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-pinch-2d-scale-and-inventory.yml
          git add lib/screens/canvas/widgets/canvas_area.dart test/canvas_pinch_gesture_test.dart test/app_smoke_test.dart test/gesture_settings_sheet_test.dart
          git commit -m 'fix: use true 2D scale for canvas pinch bounds'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
