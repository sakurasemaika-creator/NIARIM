name: TMP Custom Automation Lifecycle Fix
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-custom-automation-lifecycle-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Delay controller disposal until dialog route is detached
        run: python3 -c "from pathlib import Path; p=Path('lib/widgets/custom_automation_manager_sheet.dart'); s=p.read_text(); pairs=[('controller.dispose();','WidgetsBinding.instance.addPostFrameCallback((_) => controller.dispose());'),('fromController.dispose();','WidgetsBinding.instance.addPostFrameCallback((_) => fromController.dispose());'),('toController.dispose();','WidgetsBinding.instance.addPostFrameCallback((_) => toController.dispose());')]; counts=[s.count(a) for a,b in pairs]; assert counts==[2,2,2], counts; s=s.replace(pairs[0][0],pairs[0][1]).replace(pairs[1][0],pairs[1][1]).replace(pairs[2][0],pairs[2][1]); p.write_text(s)"
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/widgets/custom_automation_manager_sheet.dart
          git commit -m 'fix: dispose automation dialog controllers safely'
          git push origin HEAD:dev_branch
