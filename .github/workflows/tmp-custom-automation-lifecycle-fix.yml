name: TMP Custom Automation Lifecycle Fix
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-custom-automation-lifecycle-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use form fields for value-backed frame inputs
        run: python3 -c "from pathlib import Path; p=Path('lib/widgets/custom_automation_manager_sheet.dart'); s=p.read_text(); old='child: TextField(\n                                  initialValue:'; assert s.count(old)==2,s.count(old); p.write_text(s.replace(old,'child: TextFormField(\n                                  initialValue:',2))"
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/widgets/custom_automation_manager_sheet.dart
          git commit -m 'fix: use value-backed automation frame fields'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
