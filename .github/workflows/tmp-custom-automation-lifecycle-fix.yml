name: TMP Custom Automation Lifecycle Fix
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-custom-automation-lifecycle-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Replace route-external controllers with value state
        env:
          PAT1: ICBGdXR1cmU8dm9pZD4gX3N0YXJ0TmV3XChcKSBhc3luYyBcey4qP1xuICBGdXR1cmU8dm9pZD4gX3JlbmFtZQ==
          NEW1: 
          PAT2: ICBGdXR1cmU8dm9pZD4gX3JlbmFtZVwoQ3VzdG9tQXV0b21hdGlvbiBpdGVtXCkgYXN5bmMgXHsuKj9cbiAgRnV0dXJlPHZvaWQ+IF9jb25maXJtRGVsZXRl
          NEW2: 
          PAT3: ICBGdXR1cmU8X0V4ZWN1dGlvbkNob2ljZVw/PiBfY29uZmlybUV4ZWN1dGVcKEN1c3RvbUF1dG9tYXRpb24gaXRlbVwpIGFzeW5jIFx7Lio/XG4gIEZ1dHVyZTx2b2lkPiBfc2hvd0FjdGlvbnM=
          NEW3: 
        run: python3 -c "import os,base64,pathlib,re; p=pathlib.Path('lib/widgets/custom_automation_manager_sheet.dart'); s=p.read_text(); d=lambda k:base64.b64decode(os.environ[k]).decode(); s,n1=re.subn(d('PAT1'),d('NEW1'),s,count=1,flags=re.S); s,n2=re.subn(d('PAT2'),d('NEW2'),s,count=1,flags=re.S); s,n3=re.subn(d('PAT3'),d('NEW3'),s,count=1,flags=re.S); assert (n1,n2,n3)==(1,1,1),(n1,n2,n3); p.write_text(s)"
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/widgets/custom_automation_manager_sheet.dart
          git commit -m 'fix: own automation dialog input values safely'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
