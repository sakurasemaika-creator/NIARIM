name: Continue Hologram Lineart Prism

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/continue-hologram-lineart-prism.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply corrected implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)

          def replace_braced_function(text, signature, replacement):
              start = text.index(signature)
              brace = text.index('{', start)
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None: raise SystemExit(f'unclosed function: {signature}')
              return text[:start] + replacement + text[end:]

          # The temporary eighth enum is redundant: original Pastel Dream becomes Pearl 2.
          p = 'lib/models/filter_def.dart'
          s = read(p).replace('  pearl2,\n', '')
          write(p, s)

          # Visible preset names.
          locale_values = {
            'lib/l10n/app_ja.arb': {
              'filterAuroraHologramPresetSoapBubble': 'パール1',
              'filterAuroraHologramPresetCyberNeon': 'ヴェイパーウェイヴ',
              'filterAuroraHologramPresetPastelDream': 'パール2',
              'filterAuroraHologramPresetClassicHologram': 'シャボン玉',
            },
            'lib/l10n/app_en.arb': {
              'filterAuroraHologramPresetSoapBubble': 'Pearl 1',
              'filterAuroraHologramPresetCyberNeon': 'Vaporwave',
              'filterAuroraHologramPresetPastelDream': 'Pearl 2',
              'filterAuroraHologramPresetClassicHologram': 'Soap Bubble',
            },
          }
          for p, values in locale_values.items():
              s = read(p)
              for key, value in values.items():
                  pat = rf'("{re.escape(key)}"\s*:\s*)"[^"]*"'
                  if re.search(pat, s):
                      s = re.sub(pat, lambda m, v=value: m.group(1) + f'"{v}"', s, count=1)
                  else:
                      anchor = '"filterAuroraHologramPresetSilverFoil"'
                      i = s.index(anchor)
                      eol = s.index('\n', i)
                      if s[eol - 1] != ',': s = s[:eol] + ',' + s[eol:]; eol += 1
                      s = s[:eol] + f'  "{key}": "{value}",\n' + s[eol:]
              write(p, s)

          # UI labels and prism blend mode.
          p = 'lib/screens/canvas/widgets/filter_panel.dart'
          s = read(p)
          a = s.index('  String _auroraPresetLabel(')
          b = s.index('\n  IconData _iconForFilter', a)
          labels = '''  String _auroraPresetLabel(
            AppLocalizations l10n,
            AuroraHologramPreset preset,
          ) => switch (preset) {
            AuroraHologramPreset.aurora => l10n.filterAuroraHologramPresetAurora,
            AuroraHologramPreset.soapBubble => l10n.filterAuroraHologramPresetSoapBubble,
            AuroraHologramPreset.cyberNeon => l10n.filterAuroraHologramPresetCyberNeon,
            AuroraHologramPreset.pastelDream => l10n.filterAuroraHologramPresetPastelDream,
            AuroraHologramPreset.sunsetGold => l10n.filterAuroraHologramPresetSunsetGold,
            AuroraHologramPreset.silverFoil => l10n.filterAuroraHologramPresetSilverFoil,
            AuroraHologramPreset.classicHologram => l10n.filterAuroraHologramPresetClassicHologram,
          };
          '''
          s = s[:a] + labels + s[b:]
          s = s.replace('model.LayerBlendMode.colorDodge)', 'model.LayerBlendMode.addition)')
          s = s.replace('ガウスぼかし → 覆い焼き', 'ガウスぼかし → 覆い焼きリニア')
          s = s.replace('覆い焼きリニアリニア', '覆い焼きリニア')
          write(p, s)

          # Hologram palettes: Pearl 1, Vaporwave, Pearl 2 (pink+rainbow),
          # and Soap Bubble (cyan+rainbow).
          p = 'lib/engine/filter_engine.dart'
          s = read(p)
          palette_fn = '''List<(double, int, int, int)> auroraHologramStops(AuroraHologramPreset preset) {
            return switch (preset) {
              AuroraHologramPreset.aurora => const [
                (0.00, 22, 86, 156), (0.10, 72, 196, 255), (0.20, 157, 241, 255),
                (0.30, 228, 252, 255), (0.40, 142, 220, 255), (0.50, 124, 165, 255),
                (0.60, 195, 188, 255), (0.70, 235, 223, 255), (0.80, 128, 232, 245),
                (0.90, 80, 181, 255), (1.00, 247, 253, 255),
              ],
              AuroraHologramPreset.soapBubble => const [
                (0.00, 244, 252, 255), (0.07, 255, 255, 255), (0.14, 210, 242, 255),
                (0.21, 255, 225, 242), (0.28, 235, 220, 255), (0.35, 220, 255, 241),
                (0.42, 255, 245, 211), (0.49, 255, 255, 255), (0.58, 218, 239, 255),
                (0.67, 247, 224, 255), (0.76, 230, 255, 242), (0.86, 255, 247, 221),
                (1.00, 255, 255, 255),
              ],
              AuroraHologramPreset.cyberNeon => const [
                (0.00, 28, 12, 67), (0.08, 78, 34, 160), (0.16, 151, 42, 244),
                (0.24, 245, 43, 210), (0.32, 255, 83, 180), (0.40, 182, 61, 255),
                (0.48, 82, 65, 255), (0.56, 42, 137, 255), (0.64, 44, 215, 255),
                (0.72, 145, 80, 255), (0.80, 255, 55, 198), (0.90, 108, 46, 219),
                (1.00, 37, 21, 101),
              ],
              AuroraHologramPreset.pastelDream => const [
                (0.00, 255, 214, 237), (0.07, 255, 238, 248), (0.14, 255, 190, 225),
                (0.21, 246, 198, 255), (0.28, 214, 207, 255), (0.35, 190, 232, 255),
                (0.42, 202, 255, 244), (0.49, 249, 255, 214), (0.56, 255, 232, 194),
                (0.63, 255, 199, 212), (0.70, 255, 174, 220), (0.77, 231, 190, 255),
                (0.84, 197, 220, 255), (0.91, 220, 255, 242), (1.00, 255, 229, 243),
              ],
              AuroraHologramPreset.sunsetGold => const [
                (0.00, 102, 61, 0), (0.08, 181, 112, 0), (0.16, 255, 174, 0),
                (0.24, 255, 215, 0), (0.32, 255, 244, 62), (0.40, 255, 255, 192),
                (0.48, 255, 255, 255), (0.56, 255, 238, 90), (0.64, 255, 196, 0),
                (0.72, 255, 226, 35), (0.80, 255, 250, 150), (0.90, 212, 142, 0),
                (1.00, 255, 244, 116),
              ],
              AuroraHologramPreset.silverFoil => const [
                (0.00, 54, 59, 70), (0.12, 156, 171, 186), (0.23, 255, 255, 255),
                (0.36, 111, 129, 148), (0.49, 248, 246, 255), (0.62, 233, 242, 245),
                (0.75, 170, 184, 202), (0.90, 244, 247, 251), (1.00, 103, 113, 130),
              ],
              AuroraHologramPreset.classicHologram => const [
                (0.00, 174, 235, 255), (0.07, 207, 249, 255), (0.14, 146, 223, 255),
                (0.21, 183, 255, 244), (0.28, 232, 255, 205), (0.35, 255, 242, 187),
                (0.42, 255, 209, 211), (0.49, 255, 205, 244), (0.56, 230, 206, 255),
                (0.63, 198, 218, 255), (0.70, 163, 235, 255), (0.77, 190, 255, 239),
                (0.84, 245, 255, 207), (0.91, 255, 220, 227), (1.00, 190, 239, 255),
              ],
            };
          }'''
          s = replace_braced_function(s, 'List<(double, int, int, int)> auroraHologramStops(', palette_fn)
          write(p, s)

          # Analog line extraction is strictly existing Color Adjust -> Threshold.
          write('lib/models/custom_automation_presets.dart', '''import 'custom_automation.dart';
          import 'filter_def.dart';

          const auroraHologramAutomationPresetId = 'preset_aurora_hologram';
          const lineExtractionAutomationPresetId = 'preset_line_extraction';
          const lineCreationAutomationPresetId = 'preset_line_creation';
          final DateTime _presetTimestamp = DateTime.utc(2026, 1, 1);

          List<CustomAutomation> builtInCanvasAutomationPresets() => [
            _filterPreset(id: auroraHologramAutomationPresetId, name: 'オーロラホログラム', filters: const [
              FilterDef(id: 'Filter0019', name: 'オーロラホログラム', kind: FilterKind.auroraHologram, strength: 60),
            ]),
            _filterPreset(id: lineExtractionAutomationPresetId, name: '線画抽出', filters: const [
              FilterDef(id: 'automation_color_adjust', name: '色調調整', kind: FilterKind.colorAdjust, caBrightness: 35, caContrast: 55),
              FilterDef(id: 'Filter0014', name: '二値化', kind: FilterKind.threshold, thresholdValue: 190),
            ]),
            _filterPreset(id: lineCreationAutomationPresetId, name: '線画作成', filters: const [
              FilterDef(id: 'Filter0006', name: '縁取り', kind: FilterKind.outline, outlineColor: 0xFF000000, outlineWidth: 6),
            ]),
          ];

          CustomAutomation _filterPreset({required String id, required String name, required List<FilterDef> filters}) {
            return CustomAutomation(
              id: id, name: name, recordingStartFrame: 0,
              createdAt: _presetTimestamp, updatedAt: _presetTimestamp,
              steps: [for (var i = 0; i < filters.length; i++) CustomAutomationStep(
                id: '${id}_filter_${i + 1}', surface: CustomAutomationSurface.canvas,
                command: 'canvas.filterApply', label: filters[i].name,
                args: {'filter': filters[i].toJson()}, recordedFrame: 0,
              )],
            );
          }
          ''')

          # Lock the line extraction preset to the two requested production filters.
          p = 'test/custom_automation_presets_test.dart'
          s = read(p)
          s = s.replace(
            "expect(item.steps, hasLength(1));\n      expect(item.steps.single.command, 'canvas.filterApply');",
            "expect(item.steps, hasLength(item.id == lineExtractionAutomationPresetId ? 2 : 1));\n      expect(item.steps.every((step) => step.command == 'canvas.filterApply'), isTrue);",
          )
          s = re.sub(
            r"FilterDef filterOf\(String name\) \{\s*final raw = presets\[name\]!\.steps\.single\.args\['filter'\] as Map;\s*return FilterDef\.fromJson\(raw\.cast<String, dynamic>\(\)\);\s*\}",
            "FilterDef filterOf(String name, [int step = 0]) {\n      final raw = presets[name]!.steps[step].args['filter'] as Map;\n      return FilterDef.fromJson(raw.cast<String, dynamic>());\n    }",
            s,
          )
          s = s.replace(
            "expect(filterOf('線画抽出').kind, FilterKind.autoLineart);\n    expect(filterOf('線画抽出').id, 'Filter0023');",
            "expect(filterOf('線画抽出', 0).kind, FilterKind.colorAdjust);\n    expect(filterOf('線画抽出', 0).caBrightness, greaterThan(0));\n    expect(filterOf('線画抽出', 0).caContrast, greaterThan(0));\n    expect(filterOf('線画抽出', 1).kind, FilterKind.threshold);\n    expect(filterOf('線画抽出', 1).id, 'Filter0014');",
          )
          write(p, s)
      - run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Format
        run: dart format lib/models/filter_def.dart lib/engine/filter_engine.dart lib/models/custom_automation_presets.dart lib/screens/canvas/widgets/filter_panel.dart test/custom_automation_presets_test.dart
      - name: Analyze targeted files
        run: flutter analyze lib/models/filter_def.dart lib/engine/filter_engine.dart lib/models/custom_automation_presets.dart lib/engine/prism_filter_engine.dart lib/screens/canvas/widgets/filter_panel.dart --no-fatal-warnings --no-fatal-infos
      - name: Run targeted tests
        run: flutter test test/filter_engine_aurora_hologram_test.dart test/custom_automation_presets_test.dart --reporter expanded
      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/models/filter_def.dart lib/engine/filter_engine.dart lib/models/custom_automation_presets.dart lib/screens/canvas/widgets/filter_panel.dart lib/l10n/app_ja.arb lib/l10n/app_en.arb lib/l10n/app_localizations*.dart test/custom_automation_presets_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat: correct holograms prism blend and line extraction"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
