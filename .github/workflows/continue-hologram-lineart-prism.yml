name: Correct Pearl2 Pastel Dream Split

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/continue-hologram-lineart-prism.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Split Pearl 2 and Pastel Dream
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_braced_function(text, signature, replacement):
              start = text.index(signature)
              brace = text.index('{', start)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return text[:start] + replacement + text[i + 1:]
              raise SystemExit(f'unclosed function: {signature}')

          # Pearl 2 is a separate preset. Pastel Dream remains the newer pink-rainbow preset.
          p = 'lib/models/filter_def.dart'
          s = read(p)
          if '  pearl2,\n' not in s:
              s = s.replace(
                  '  classicHologram,\n}',
                  '  classicHologram,\n  pearl2,\n}',
                  1,
              )
          write(p, s)

          # Restore the visible Pastel Dream name and give Pearl 2 its own label.
          for path, pastel_name, pearl_name in [
              ('lib/l10n/app_ja.arb', 'パステルドリーム', 'パール2'),
              ('lib/l10n/app_en.arb', 'Pastel Dream', 'Pearl 2'),
          ]:
              s = read(path)
              pastel_pat = r'("filterAuroraHologramPresetPastelDream"\s*:\s*)"[^"]*"'
              s = re.sub(
                  pastel_pat,
                  lambda m: m.group(1) + f'"{pastel_name}"',
                  s,
                  count=1,
              )
              key = 'filterAuroraHologramPresetPearl2'
              pearl_pat = rf'("{key}"\s*:\s*)"[^"]*"'
              if re.search(pearl_pat, s):
                  s = re.sub(
                      pearl_pat,
                      lambda m: m.group(1) + f'"{pearl_name}"',
                      s,
                      count=1,
                  )
              else:
                  anchor = '"filterAuroraHologramPresetPastelDream"'
                  i = s.index(anchor)
                  eol = s.index('\n', i)
                  if s[eol - 1] != ',':
                      s = s[:eol] + ',' + s[eol:]
                      eol += 1
                  s = s[:eol] + f'  "{key}": "{pearl_name}",\n' + s[eol:]
              write(path, s)

          # Keep Pearl 2 and Pastel Dream as separate choices in the panel.
          p = 'lib/screens/canvas/widgets/filter_panel.dart'
          s = read(p)
          a = s.index('  String _auroraPresetLabel(')
          b = s.index('\n  IconData _iconForFilter', a)
          labels = '''  String _auroraPresetLabel(
            AppLocalizations l10n,
            AuroraHologramPreset preset,
          ) => switch (preset) {
            AuroraHologramPreset.aurora => l10n.filterAuroraHologramPresetAurora,
            AuroraHologramPreset.soapBubble => l10n.filterAuroraHologramPresetSoapBubble,
            AuroraHologramPreset.cyberNeon => l10n.filterAuroraHologramPresetCyberNeon,
            AuroraHologramPreset.pastelDream => l10n.filterAuroraHologramPresetPastelDream,
            AuroraHologramPreset.sunsetGold => l10n.filterAuroraHologramPresetSunsetGold,
            AuroraHologramPreset.silverFoil => l10n.filterAuroraHologramPresetSilverFoil,
            AuroraHologramPreset.classicHologram => l10n.filterAuroraHologramPresetClassicHologram,
            AuroraHologramPreset.pearl2 => l10n.filterAuroraHologramPresetPearl2,
          };
          '''
          s = s[:a] + labels + s[b:]
          write(p, s)

          # Preserve all current palettes. Pearl 2 receives the exact earlier Pastel Dream palette
          # that produced the attached lavender/cream/mint pearlescent reference.
          p = 'lib/engine/filter_engine.dart'
          s = read(p)
          palette_fn = '''List<(double, int, int, int)> auroraHologramStops(AuroraHologramPreset preset) {
            return switch (preset) {
              AuroraHologramPreset.aurora => const [
                (0.00, 22, 86, 156), (0.10, 72, 196, 255), (0.20, 157, 241, 255),
                (0.30, 228, 252, 255), (0.40, 142, 220, 255), (0.50, 124, 165, 255),
                (0.60, 195, 188, 255), (0.70, 235, 223, 255), (0.80, 128, 232, 245),
                (0.90, 80, 181, 255), (1.00, 247, 253, 255),
              ],
              AuroraHologramPreset.soapBubble => const [
                (0.00, 244, 252, 255), (0.07, 255, 255, 255), (0.14, 210, 242, 255),
                (0.21, 255, 225, 242), (0.28, 235, 220, 255), (0.35, 220, 255, 241),
                (0.42, 255, 245, 211), (0.49, 255, 255, 255), (0.58, 218, 239, 255),
                (0.67, 247, 224, 255), (0.76, 230, 255, 242), (0.86, 255, 247, 221),
                (1.00, 255, 255, 255),
              ],
              AuroraHologramPreset.cyberNeon => const [
                (0.00, 28, 12, 67), (0.08, 78, 34, 160), (0.16, 151, 42, 244),
                (0.24, 245, 43, 210), (0.32, 255, 83, 180), (0.40, 182, 61, 255),
                (0.48, 82, 65, 255), (0.56, 42, 137, 255), (0.64, 44, 215, 255),
                (0.72, 145, 80, 255), (0.80, 255, 55, 198), (0.90, 108, 46, 219),
                (1.00, 37, 21, 101),
              ],
              AuroraHologramPreset.pastelDream => const [
                (0.00, 255, 214, 237), (0.07, 255, 238, 248), (0.14, 255, 190, 225),
                (0.21, 246, 198, 255), (0.28, 214, 207, 255), (0.35, 190, 232, 255),
                (0.42, 202, 255, 244), (0.49, 249, 255, 214), (0.56, 255, 232, 194),
                (0.63, 255, 199, 212), (0.70, 255, 174, 220), (0.77, 231, 190, 255),
                (0.84, 197, 220, 255), (0.91, 220, 255, 242), (1.00, 255, 229, 243),
              ],
              AuroraHologramPreset.sunsetGold => const [
                (0.00, 102, 61, 0), (0.08, 181, 112, 0), (0.16, 255, 174, 0),
                (0.24, 255, 215, 0), (0.32, 255, 244, 62), (0.40, 255, 255, 192),
                (0.48, 255, 255, 255), (0.56, 255, 238, 90), (0.64, 255, 196, 0),
                (0.72, 255, 226, 35), (0.80, 255, 250, 150), (0.90, 212, 142, 0),
                (1.00, 255, 244, 116),
              ],
              AuroraHologramPreset.silverFoil => const [
                (0.00, 54, 59, 70), (0.12, 156, 171, 186), (0.23, 255, 255, 255),
                (0.36, 111, 129, 148), (0.49, 248, 246, 255), (0.62, 233, 242, 245),
                (0.75, 170, 184, 202), (0.90, 244, 247, 251), (1.00, 103, 113, 130),
              ],
              AuroraHologramPreset.classicHologram => const [
                (0.00, 174, 235, 255), (0.07, 207, 249, 255), (0.14, 146, 223, 255),
                (0.21, 183, 255, 244), (0.28, 232, 255, 205), (0.35, 255, 242, 187),
                (0.42, 255, 209, 211), (0.49, 255, 205, 244), (0.56, 230, 206, 255),
                (0.63, 198, 218, 255), (0.70, 163, 235, 255), (0.77, 190, 255, 239),
                (0.84, 245, 255, 207), (0.91, 255, 220, 227), (1.00, 190, 239, 255),
              ],
              AuroraHologramPreset.pearl2 => const [
                (0.00, 223, 236, 255), (0.07, 242, 233, 255), (0.14, 255, 225, 240),
                (0.21, 255, 226, 211), (0.28, 255, 244, 199), (0.35, 225, 250, 221),
                (0.42, 34, 224, 255), (0.49, 255, 255, 255), (0.56, 219, 232, 255),
                (0.63, 239, 222, 255), (0.70, 255, 217, 235), (0.77, 255, 230, 205),
                (0.84, 247, 245, 204), (0.91, 218, 247, 227), (0.97, 240, 247, 255),
                (1.00, 255, 255, 255),
              ],
            };
          }'''
          s = replace_braced_function(
              s,
              'List<(double, int, int, int)> auroraHologramStops(',
              palette_fn,
          )
          write(p, s)

          write('test/hologram_palette_mapping_test.dart', '''import 'package:flutter_test/flutter_test.dart';
          import 'package:niarim/engine/filter_engine.dart';
          import 'package:niarim/models/filter_def.dart';

          void main() {
            test('Pearl 2 keeps earlier Pastel Dream while Pastel Dream is pink-rainbow', () {
              expect(
                auroraHologramStops(AuroraHologramPreset.pearl2),
                equals(const [
                  (0.00, 223, 236, 255), (0.07, 242, 233, 255), (0.14, 255, 225, 240),
                  (0.21, 255, 226, 211), (0.28, 255, 244, 199), (0.35, 225, 250, 221),
                  (0.42, 34, 224, 255), (0.49, 255, 255, 255), (0.56, 219, 232, 255),
                  (0.63, 239, 222, 255), (0.70, 255, 217, 235), (0.77, 255, 230, 205),
                  (0.84, 247, 245, 204), (0.91, 218, 247, 227), (0.97, 240, 247, 255),
                  (1.00, 255, 255, 255),
                ]),
              );

              final pastel = auroraHologramStops(AuroraHologramPreset.pastelDream);
              expect(
                pastel,
                isNot(equals(auroraHologramStops(AuroraHologramPreset.pearl2))),
              );
              expect(
                pastel,
                containsAll(const [
                  (0.00, 255, 214, 237),
                  (0.28, 214, 207, 255),
                  (0.42, 202, 255, 244),
                  (0.56, 255, 232, 194),
                  (0.70, 255, 174, 220),
                ]),
              );
            });
          }
          ''')
      - run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Format
        run: dart format lib/models/filter_def.dart lib/engine/filter_engine.dart lib/screens/canvas/widgets/filter_panel.dart test/hologram_palette_mapping_test.dart
      - name: Analyze targeted files
        run: flutter analyze lib/models/filter_def.dart lib/engine/filter_engine.dart lib/screens/canvas/widgets/filter_panel.dart --no-fatal-warnings --no-fatal-infos
      - name: Run targeted tests
        run: flutter test test/filter_engine_aurora_hologram_test.dart test/hologram_palette_mapping_test.dart --reporter expanded
      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/models/filter_def.dart lib/engine/filter_engine.dart lib/screens/canvas/widgets/filter_panel.dart lib/l10n/app_ja.arb lib/l10n/app_en.arb lib/l10n/app_localizations*.dart test/hologram_palette_mapping_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix: split pearl2 from pastel dream palette"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
