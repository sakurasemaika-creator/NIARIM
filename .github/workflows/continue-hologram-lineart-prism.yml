name: Continue Hologram Lineart Prism

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/continue-hologram-lineart-prism.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply requested implementation changes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text();
              if old not in s: raise SystemExit(f'missing patch anchor: {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new))

          # User-facing preset labels: pearl rename + two newly requested variants.
          for path in ['lib/l10n/app_ja.arb']:
              replace(path, '"filterAuroraHologramPresetSoapBubble": "シャボン玉"', '"filterAuroraHologramPresetSoapBubble": "パール"')
              replace(path, '"filterAuroraHologramPresetSilverFoil": "シルバーホイル",', '"filterAuroraHologramPresetSilverFoil": "シルバーホイル",\n  "filterAuroraHologramPresetClassicHologram": "クラシックホログラム",\n  "filterAuroraHologramPresetPearl2": "パール2",')
          for path in ['lib/l10n/app_en.arb']:
              replace(path, '"filterAuroraHologramPresetSoapBubble": "Soap Bubble"', '"filterAuroraHologramPresetSoapBubble": "Pearl"')
              replace(path, '"filterAuroraHologramPresetSilverFoil": "Silver Foil",', '"filterAuroraHologramPresetSilverFoil": "Silver Foil",\n  "filterAuroraHologramPresetClassicHologram": "Classic Hologram",\n  "filterAuroraHologramPresetPearl2": "Pearl 2",')

          # Exhaustive UI labels for the enum values already landed at HEAD.
          replace('lib/screens/canvas/widgets/filter_panel.dart',
              'AuroraHologramPreset.silverFoil =>\n      l10n.filterAuroraHologramPresetSilverFoil,\n  };',
              'AuroraHologramPreset.silverFoil =>\n      l10n.filterAuroraHologramPresetSilverFoil,\n    AuroraHologramPreset.classicHologram =>\n      l10n.filterAuroraHologramPresetClassicHologram,\n    AuroraHologramPreset.pearl2 => l10n.filterAuroraHologramPresetPearl2,\n  };')

          # Prism must use Color Dodge, not additive blending.
          replace('lib/screens/canvas/widgets/filter_panel.dart',
              '? layer.copyWith(blendMode: model.LayerBlendMode.addition)',
              '? layer.copyWith(blendMode: model.LayerBlendMode.colorDodge)')
          replace('lib/screens/canvas/widgets/filter_panel.dart',
              '参照レイヤーのα領域を6等分で着色 → ガウスぼかし → 覆い焼きリニア',
              '参照レイヤーのα領域を6等分で着色 → ガウスぼかし → 覆い焼き')

          # Retune existing hologram families per visual feedback and add classic/pearl2.
          p=Path('lib/engine/filter_engine.dart'); s=p.read_text()
          start=s.index('List<(double, int, int, int)> auroraHologramStops(')
          end=s.index('\n/// 画素の色を指定方式で減色する', start)
          fn='''List<(double, int, int, int)> auroraHologramStops(AuroraHologramPreset preset) {
            return switch (preset) {
              AuroraHologramPreset.aurora => const [
                (0.00, 22, 86, 156), (0.10, 72, 196, 255), (0.20, 157, 241, 255),
                (0.30, 228, 252, 255), (0.40, 142, 220, 255), (0.50, 124, 165, 255),
                (0.60, 195, 188, 255), (0.70, 235, 223, 255), (0.80, 128, 232, 245),
                (0.90, 80, 181, 255), (1.00, 247, 253, 255),
              ],
              AuroraHologramPreset.soapBubble => const [
                (0.00, 210, 247, 255), (0.09, 238, 253, 255), (0.18, 255, 228, 247),
                (0.27, 230, 218, 255), (0.36, 201, 236, 255), (0.45, 220, 255, 241),
                (0.54, 255, 245, 206), (0.63, 255, 220, 236), (0.72, 220, 212, 255),
                (0.81, 188, 239, 255), (0.90, 225, 255, 245), (1.00, 255, 255, 255),
              ],
              AuroraHologramPreset.cyberNeon => const [
                (0.00, 25, 14, 74), (0.10, 73, 36, 194), (0.20, 145, 43, 255),
                (0.30, 255, 36, 205), (0.40, 255, 72, 177), (0.50, 123, 56, 255),
                (0.60, 44, 105, 255), (0.70, 0, 207, 255), (0.80, 93, 83, 255),
                (0.90, 239, 55, 255), (1.00, 82, 37, 211),
              ],
              AuroraHologramPreset.pastelDream => const [
                (0.00, 223, 236, 255), (0.14, 242, 233, 255), (0.28, 255, 225, 240),
                (0.42, 255, 226, 211), (0.56, 255, 244, 199), (0.70, 225, 250, 221),
                (0.84, 239, 222, 255), (1.00, 255, 255, 255),
              ],
              AuroraHologramPreset.sunsetGold => const [
                (0.00, 102, 61, 0), (0.08, 181, 112, 0), (0.16, 255, 174, 0),
                (0.24, 255, 215, 0), (0.32, 255, 244, 62), (0.40, 255, 255, 192),
                (0.48, 255, 255, 255), (0.56, 255, 238, 90), (0.64, 255, 196, 0),
                (0.72, 255, 226, 35), (0.80, 255, 250, 150), (0.90, 212, 142, 0),
                (1.00, 255, 244, 116),
              ],
              AuroraHologramPreset.silverFoil => const [
                (0.00, 54, 59, 70), (0.12, 156, 171, 186), (0.23, 255, 255, 255),
                (0.36, 111, 129, 148), (0.49, 248, 246, 255), (0.62, 233, 242, 245),
                (0.75, 170, 184, 202), (0.90, 244, 247, 251), (1.00, 103, 113, 130),
              ],
              AuroraHologramPreset.classicHologram => const [
                (0.00, 208, 245, 255), (0.08, 183, 238, 255), (0.16, 203, 255, 248),
                (0.24, 244, 255, 221), (0.32, 255, 235, 202), (0.40, 255, 213, 231),
                (0.48, 235, 209, 255), (0.56, 202, 219, 255), (0.64, 173, 244, 255),
                (0.72, 201, 255, 238), (0.80, 255, 248, 205), (0.88, 255, 218, 238),
                (1.00, 230, 221, 255),
              ],
              AuroraHologramPreset.pearl2 => const [
                (0.00, 230, 242, 255), (0.14, 246, 231, 255), (0.28, 255, 232, 245),
                (0.42, 232, 255, 249), (0.56, 255, 247, 224), (0.70, 224, 239, 255),
                (0.84, 246, 226, 255), (1.00, 255, 255, 255),
              ],
            };
          }
          '''
          p.write_text(s[:start]+fn+s[end:])
      - run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Format
        run: dart format lib/models/filter_def.dart lib/engine/filter_engine.dart lib/screens/canvas/widgets/filter_panel.dart
      - name: Analyze targeted files
        run: flutter analyze lib/models/filter_def.dart lib/engine/filter_engine.dart lib/engine/auto_lineart_engine.dart lib/engine/prism_filter_engine.dart lib/screens/canvas/widgets/filter_panel.dart --no-fatal-warnings --no-fatal-infos
      - name: Run targeted tests
        run: flutter test test/filter_engine_aurora_hologram_test.dart test/auto_lineart_engine_test.dart test/prism_filter_test.dart --reporter expanded
      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/models/filter_def.dart lib/engine/filter_engine.dart lib/screens/canvas/widgets/filter_panel.dart lib/l10n/app_ja.arb lib/l10n/app_en.arb lib/l10n/app_localizations*.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat: refine hologram palettes and prism dodge"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
