name: Timeline Preview Export Parity Verification

on:
  pull_request:
    branches: [dev_branch]
    paths:
      - '.github/workflows/timeline-preview-export-parity.yml'
      - 'lib/engine/export_audio.dart'
      - 'lib/engine/export_engine.dart'
      - 'lib/engine/layer_compositor.dart'
      - 'lib/engine/timeline_stack.dart'
      - 'lib/engine/timeline_output_viewport.dart'
      - 'lib/engine/timeline_video_time.dart'
      - 'lib/engine/video_material_snapshot.dart'
      - 'lib/engine/video_frame_timeline.dart'
      - 'lib/engine/video_frame_decoder.dart'
      - 'lib/engine/video_frame_provider.dart'
      - 'lib/engine/timeline_video_layer_pixels.dart'
      - 'lib/services/material_service.dart'
      - 'lib/screens/timeline/timeline_screen.dart'
      - 'test/export_audio_test.dart'
      - 'test/timeline_media_contract_test.dart'
      - 'test/timeline_output_viewport_test.dart'
      - 'test/timeline_video_time_test.dart'
      - 'test/video_material_snapshot_test.dart'
      - 'test/video_frame_timeline_test.dart'
      - 'test/video_frame_provider_test.dart'
      - 'test/video_frame_ffmpeg_decoder_test.dart'
      - 'test/layer_compositor_pixel_source_test.dart'
      - 'test/layer_compositor_test.dart'
      - 'docs/AI設計書/26_タイムライン編集操作仕様.md'
      - 'docs/AI設計書/27_プレビュー書き出し一致性監査.md'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

concurrency:
  group: timeline-preview-export-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audio-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - name: Install FFmpeg for real video frame decoding tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test shared preview/export audio envelope
        run: flutter test test/export_audio_test.dart --reporter expanded
      - name: Test timeline media contracts
        run: flutter test test/timeline_media_contract_test.dart --reporter expanded
      - name: Test shared output viewport geometry
        run: flutter test test/timeline_output_viewport_test.dart --reporter expanded
      - name: Test shared video source time mapping
        run: flutter test test/timeline_video_time_test.dart --reporter expanded
      - name: Test immutable video material snapshots
        run: flutter test test/video_material_snapshot_test.dart --reporter expanded
      - name: Test shared video frame selection rule
        run: flutter test test/video_frame_timeline_test.dart --reporter expanded
      - name: Test video frame cache, ownership, seek races and cancellation
        run: flutter test test/video_frame_provider_test.dart --reporter expanded
      - name: Test real FFmpeg video frame decoding and preview/export RGBA parity
        env:
          NIARIM_VIDEO_FRAME_FFMPEG_TESTS: '1'
        run: flutter test test/video_frame_ffmpeg_decoder_test.dart --reporter expanded
      - name: Test decoded video frames through every layer compositing path
        run: flutter test test/layer_compositor_pixel_source_test.dart test/layer_compositor_test.dart --reporter expanded
      - name: Analyze touched Dart files
        run: >-
          flutter analyze
          lib/engine/export_audio.dart
          lib/engine/export_engine.dart
          lib/engine/timeline_output_viewport.dart
          lib/engine/timeline_video_time.dart
          lib/engine/video_material_snapshot.dart
          lib/engine/video_frame_timeline.dart
          lib/engine/video_frame_decoder.dart
          lib/engine/video_frame_provider.dart
          lib/engine/timeline_video_layer_pixels.dart
          lib/engine/layer_compositor.dart
          lib/services/material_service.dart
          lib/screens/timeline/widgets/material_gizmo.dart
          lib/screens/timeline/timeline_screen.dart
          test/export_audio_test.dart
          test/timeline_media_contract_test.dart
          test/timeline_output_viewport_test.dart
          test/timeline_video_time_test.dart
          test/video_material_snapshot_test.dart
          test/video_frame_timeline_test.dart
          test/video_frame_provider_test.dart
          test/video_frame_ffmpeg_decoder_test.dart
          test/layer_compositor_pixel_source_test.dart
          --no-fatal-infos
