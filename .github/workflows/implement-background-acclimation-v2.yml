                            _lastBgBlendAnalysis?.reflectionColor ?? _resolvedBgBlendColor(current),
                            (v) => filterService.updateFilterParams(current.id, bgBlendReflectionColor: v),
                          ),
                          SwitchListTile.adaptive(
