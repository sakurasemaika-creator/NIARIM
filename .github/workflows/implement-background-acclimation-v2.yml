          replace_once('lib/screens/canvas/widgets/filter_panel.dart', ui_anchor, ui_replacement)

          helper_anchor = '''  Widget _levelSlider(
    FilterService service,'''
          helpers = '''  Widget _bgBlendColorControl(
    FilterService service,
    FilterDef current,
    String label,
    int value,
    int autoColor,
    ValueChanged<int> onChanged,
  ) {
    final shown = value == -1 ? autoColor : value;
    return Padding(
      padding: const EdgeInsets.symmetric(vertical: 2),
      child: Row(
        children: [
          Expanded(child: Text(label, style: const TextStyle(fontSize: 11))),
          GestureDetector(
            onTap: () => showDialog(
              context: context,
              builder: (ctx) => Dialog(
                backgroundColor: Colors.transparent,
                child: ColorPickerPanel(
                  currentColor: Color(shown),
                  onColorChanged: (c) {
                    onChanged(c.toARGB32());
                    _updatePreview();
                  },
                  onClose: () => Navigator.of(ctx).pop(),
