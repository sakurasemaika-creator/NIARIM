name: Implement Background Acclimation V2

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/implement-background-acclimation-v2.yml'

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: implement-background-acclimation-v2
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Patch v2 engine integration, UI, persistence, audit dashboard and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone, timedelta

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # ---- background_acclimation_engine.dart: compatibility + safe integer packing ----
          p = Path('lib/engine/background_acclimation_engine.dart')
          s = p.read_text()
          s = s.replace(
              "final ambientColor = filter.bgBlendAmbientColor == -1\n        ? ambient.color\n        : filter.bgBlendAmbientColor;",
              "final ambientColor = filter.bgBlendAmbientColor != -1\n        ? filter.bgBlendAmbientColor\n        : (filter.bgBlendColor != -1 ? filter.bgBlendColor : ambient.color);",
          )
          s = s.replace(
              "  static int _argb(int r, int g, int b) =>\n      0xFF000000 |\n      (r.clamp(0, 255) << 16) |\n      (g.clamp(0, 255) << 8) |\n      b.clamp(0, 255);",
              "  static int _argb(int r, int g, int b) {\n    final rr = r < 0 ? 0 : (r > 255 ? 255 : r);\n    final gg = g < 0 ? 0 : (g > 255 ? 255 : g);\n    final bb = b < 0 ? 0 : (b > 255 ? 255 : b);\n    return 0xFF000000 | (rr << 16) | (gg << 8) | bb;\n  }",
          )
          p.write_text(s)

          # ---- FilterDef: all v2 knobs persisted and backward-compatible ----
          replace_once(
              'lib/models/filter_def.dart',
              "  final double bgBlendBlur;\n  // 墨溜まり",
              "  final double bgBlendBlur;\n"
              "  // 背景馴染ませ v2：方向自動推定、光/影/環境光/地面反射、局所色移り、\n"
              "  // 副光源、柔らかさ、素材保護、環境サンプリング帯。色の-1は自動。\n"
              "  final bool bgBlendAutoLight;\n"
              "  final double bgBlendStrength;\n"
              "  final double bgBlendLightStrength;\n"
              "  final double bgBlendShadowStrength;\n"
              "  final double bgBlendAmbientStrength;\n"
              "  final double bgBlendReflectionStrength;\n"
              "  final double bgBlendColorBleed;\n"
              "  final double bgBlendSoftness;\n"
              "  final double bgBlendSecondaryStrength;\n"
              "  final double bgBlendMaterialProtection;\n"
              "  final double bgBlendSamplingBand;\n"
              "  final int bgBlendLightColor;\n"
              "  final int bgBlendAmbientColor;\n"
              "  final int bgBlendShadowColor;\n"
              "  final int bgBlendReflectionColor;\n"
              "  final bool bgBlendShowAnalysis;\n"
              "  // 墨溜まり",
          )
          replace_once(
              'lib/models/filter_def.dart',
              "    this.bgBlendBlur = 6,\n    this.inkPoolColor",
              "    this.bgBlendBlur = 6,\n"
              "    this.bgBlendAutoLight = true,\n"
              "    this.bgBlendStrength = 70,\n"
              "    this.bgBlendLightStrength = 65,\n"
              "    this.bgBlendShadowStrength = 45,\n"
              "    this.bgBlendAmbientStrength = 18,\n"
              "    this.bgBlendReflectionStrength = 22,\n"
              "    this.bgBlendColorBleed = 35,\n"
              "    this.bgBlendSoftness = 55,\n"
              "    this.bgBlendSecondaryStrength = 35,\n"
              "    this.bgBlendMaterialProtection = 75,\n"
              "    this.bgBlendSamplingBand = 28,\n"
              "    this.bgBlendLightColor = -1,\n"
              "    this.bgBlendAmbientColor = -1,\n"
              "    this.bgBlendShadowColor = -1,\n"
              "    this.bgBlendReflectionColor = -1,\n"
              "    this.bgBlendShowAnalysis = true,\n"
              "    this.inkPoolColor",
          )
          replace_once(
              'lib/models/filter_def.dart',
              "    double? bgBlendBlur,\n    int? inkPoolColor,",
              "    double? bgBlendBlur,\n"
              "    bool? bgBlendAutoLight,\n"
              "    double? bgBlendStrength,\n"
              "    double? bgBlendLightStrength,\n"
              "    double? bgBlendShadowStrength,\n"
              "    double? bgBlendAmbientStrength,\n"
              "    double? bgBlendReflectionStrength,\n"
              "    double? bgBlendColorBleed,\n"
              "    double? bgBlendSoftness,\n"
              "    double? bgBlendSecondaryStrength,\n"
              "    double? bgBlendMaterialProtection,\n"
              "    double? bgBlendSamplingBand,\n"
              "    int? bgBlendLightColor,\n"
              "    int? bgBlendAmbientColor,\n"
              "    int? bgBlendShadowColor,\n"
              "    int? bgBlendReflectionColor,\n"
              "    bool? bgBlendShowAnalysis,\n"
              "    int? inkPoolColor,",
          )
          replace_once(
              'lib/models/filter_def.dart',
              "      bgBlendBlur: bgBlendBlur ?? this.bgBlendBlur,\n      inkPoolColor:",
              "      bgBlendBlur: bgBlendBlur ?? this.bgBlendBlur,\n"
              "      bgBlendAutoLight: bgBlendAutoLight ?? this.bgBlendAutoLight,\n"
              "      bgBlendStrength: bgBlendStrength ?? this.bgBlendStrength,\n"
              "      bgBlendLightStrength: bgBlendLightStrength ?? this.bgBlendLightStrength,\n"
              "      bgBlendShadowStrength: bgBlendShadowStrength ?? this.bgBlendShadowStrength,\n"
              "      bgBlendAmbientStrength: bgBlendAmbientStrength ?? this.bgBlendAmbientStrength,\n"
              "      bgBlendReflectionStrength: bgBlendReflectionStrength ?? this.bgBlendReflectionStrength,\n"
              "      bgBlendColorBleed: bgBlendColorBleed ?? this.bgBlendColorBleed,\n"
              "      bgBlendSoftness: bgBlendSoftness ?? this.bgBlendSoftness,\n"
              "      bgBlendSecondaryStrength: bgBlendSecondaryStrength ?? this.bgBlendSecondaryStrength,\n"
              "      bgBlendMaterialProtection: bgBlendMaterialProtection ?? this.bgBlendMaterialProtection,\n"
              "      bgBlendSamplingBand: bgBlendSamplingBand ?? this.bgBlendSamplingBand,\n"
              "      bgBlendLightColor: bgBlendLightColor ?? this.bgBlendLightColor,\n"
              "      bgBlendAmbientColor: bgBlendAmbientColor ?? this.bgBlendAmbientColor,\n"
              "      bgBlendShadowColor: bgBlendShadowColor ?? this.bgBlendShadowColor,\n"
              "      bgBlendReflectionColor: bgBlendReflectionColor ?? this.bgBlendReflectionColor,\n"
              "      bgBlendShowAnalysis: bgBlendShowAnalysis ?? this.bgBlendShowAnalysis,\n"
              "      inkPoolColor:",
          )
          replace_once(
              'lib/models/filter_def.dart',
              "    'bgBlendBlur': bgBlendBlur,\n    'inkPoolColor':",
              "    'bgBlendBlur': bgBlendBlur,\n"
              "    'bgBlendAutoLight': bgBlendAutoLight,\n"
              "    'bgBlendStrength': bgBlendStrength,\n"
              "    'bgBlendLightStrength': bgBlendLightStrength,\n"
              "    'bgBlendShadowStrength': bgBlendShadowStrength,\n"
              "    'bgBlendAmbientStrength': bgBlendAmbientStrength,\n"
              "    'bgBlendReflectionStrength': bgBlendReflectionStrength,\n"
              "    'bgBlendColorBleed': bgBlendColorBleed,\n"
              "    'bgBlendSoftness': bgBlendSoftness,\n"
              "    'bgBlendSecondaryStrength': bgBlendSecondaryStrength,\n"
              "    'bgBlendMaterialProtection': bgBlendMaterialProtection,\n"
              "    'bgBlendSamplingBand': bgBlendSamplingBand,\n"
              "    'bgBlendLightColor': bgBlendLightColor,\n"
              "    'bgBlendAmbientColor': bgBlendAmbientColor,\n"
              "    'bgBlendShadowColor': bgBlendShadowColor,\n"
              "    'bgBlendReflectionColor': bgBlendReflectionColor,\n"
              "    'bgBlendShowAnalysis': bgBlendShowAnalysis,\n"
              "    'inkPoolColor':",
          )
          replace_once(
              'lib/models/filter_def.dart',
              "    bgBlendBlur: (j['bgBlendBlur'] as num?)?.toDouble() ?? 6,\n    inkPoolColor:",
              "    bgBlendBlur: (j['bgBlendBlur'] as num?)?.toDouble() ?? 6,\n"
              "    bgBlendAutoLight: j['bgBlendAutoLight'] as bool? ?? true,\n"
              "    bgBlendStrength: (j['bgBlendStrength'] as num?)?.toDouble() ?? 70,\n"
              "    bgBlendLightStrength: (j['bgBlendLightStrength'] as num?)?.toDouble() ?? 65,\n"
              "    bgBlendShadowStrength: (j['bgBlendShadowStrength'] as num?)?.toDouble() ?? 45,\n"
              "    bgBlendAmbientStrength: (j['bgBlendAmbientStrength'] as num?)?.toDouble() ?? 18,\n"
              "    bgBlendReflectionStrength: (j['bgBlendReflectionStrength'] as num?)?.toDouble() ?? 22,\n"
              "    bgBlendColorBleed: (j['bgBlendColorBleed'] as num?)?.toDouble() ?? 35,\n"
              "    bgBlendSoftness: (j['bgBlendSoftness'] as num?)?.toDouble() ?? 55,\n"
              "    bgBlendSecondaryStrength: (j['bgBlendSecondaryStrength'] as num?)?.toDouble() ?? 35,\n"
              "    bgBlendMaterialProtection: (j['bgBlendMaterialProtection'] as num?)?.toDouble() ?? 75,\n"
              "    bgBlendSamplingBand: (j['bgBlendSamplingBand'] as num?)?.toDouble() ?? 28,\n"
              "    bgBlendLightColor: j['bgBlendLightColor'] as int? ?? -1,\n"
              "    bgBlendAmbientColor: j['bgBlendAmbientColor'] as int? ?? -1,\n"
              "    bgBlendShadowColor: j['bgBlendShadowColor'] as int? ?? -1,\n"
              "    bgBlendReflectionColor: j['bgBlendReflectionColor'] as int? ?? -1,\n"
              "    bgBlendShowAnalysis: j['bgBlendShowAnalysis'] as bool? ?? true,\n"
              "    inkPoolColor:",
          )

          # ---- FilterService: expose all settings to UI ----
          replace_once(
              'lib/services/filter_service.dart',
              "    double? bgBlendBlur,\n    int? inkPoolColor,",
              "    double? bgBlendBlur,\n"
              "    bool? bgBlendAutoLight,\n"
              "    double? bgBlendStrength,\n"
              "    double? bgBlendLightStrength,\n"
              "    double? bgBlendShadowStrength,\n"
              "    double? bgBlendAmbientStrength,\n"
              "    double? bgBlendReflectionStrength,\n"
              "    double? bgBlendColorBleed,\n"
              "    double? bgBlendSoftness,\n"
              "    double? bgBlendSecondaryStrength,\n"
              "    double? bgBlendMaterialProtection,\n"
              "    double? bgBlendSamplingBand,\n"
              "    int? bgBlendLightColor,\n"
              "    int? bgBlendAmbientColor,\n"
              "    int? bgBlendShadowColor,\n"
              "    int? bgBlendReflectionColor,\n"
              "    bool? bgBlendShowAnalysis,\n"
              "    int? inkPoolColor,",
          )
          replace_once(
              'lib/services/filter_service.dart',
              "      bgBlendBlur: bgBlendBlur,\n      inkPoolColor:",
              "      bgBlendBlur: bgBlendBlur,\n"
              "      bgBlendAutoLight: bgBlendAutoLight,\n"
              "      bgBlendStrength: bgBlendStrength,\n"
              "      bgBlendLightStrength: bgBlendLightStrength,\n"
              "      bgBlendShadowStrength: bgBlendShadowStrength,\n"
              "      bgBlendAmbientStrength: bgBlendAmbientStrength,\n"
              "      bgBlendReflectionStrength: bgBlendReflectionStrength,\n"
              "      bgBlendColorBleed: bgBlendColorBleed,\n"
              "      bgBlendSoftness: bgBlendSoftness,\n"
              "      bgBlendSecondaryStrength: bgBlendSecondaryStrength,\n"
              "      bgBlendMaterialProtection: bgBlendMaterialProtection,\n"
              "      bgBlendSamplingBand: bgBlendSamplingBand,\n"
              "      bgBlendLightColor: bgBlendLightColor,\n"
              "      bgBlendAmbientColor: bgBlendAmbientColor,\n"
              "      bgBlendShadowColor: bgBlendShadowColor,\n"
              "      bgBlendReflectionColor: bgBlendReflectionColor,\n"
              "      bgBlendShowAnalysis: bgBlendShowAnalysis,\n"
              "      inkPoolColor:",
          )

          # ---- FilterEngine isolate entry: pass full background RGBA, not one modal color ----
          replace_once(
              'lib/engine/filter_engine.dart',
              "import '../models/pixel_color_mode.dart';\n",
              "import '../models/pixel_color_mode.dart';\nimport 'background_acclimation_engine.dart';\n",
          )
          replace_once(
              'lib/engine/filter_engine.dart',
              "    FilterKind.backgroundBlend => engine.applyBackgroundBlend(\n      data,\n      width,\n      height,\n      filter.bgBlendColor == -1 ? 0xFF808080 : filter.bgBlendColor,\n      filter.bgBlendDirection,\n      filter.bgBlendLength,\n      filter.bgBlendBlur,\n    ),",
              "    FilterKind.backgroundBlend => BackgroundAcclimationEngine.apply(\n      data,\n      maskData,\n      width,\n      height,\n      filter,\n    ),",
          )

          # ---- FilterPanel: preserve the real background and use v2 analysis in preview/apply ----
          replace_once(
              'lib/screens/canvas/widgets/filter_panel.dart',
              "import '../../../engine/filter_engine.dart';\n",
              "import '../../../engine/filter_engine.dart';\nimport '../../../engine/background_acclimation_engine.dart';\n",
          )
          replace_once(
              'lib/screens/canvas/widgets/filter_panel.dart',
              "  int? _autoBlendColorArgb;\n",
              "  int? _autoBlendColorArgb;\n"
              "  Uint8List? _previewBackgroundBytes;\n"
              "  BackgroundAcclimationAnalysis? _lastBgBlendAnalysis;\n",
          )
          replace_once(
              'lib/screens/canvas/widgets/filter_panel.dart',
              "    _autoBlendColorArgb = otherBytes == null\n        ? null\n        : FilterEngine.mostFrequentOpaqueColor(otherBytes);\n",
              "    _previewBackgroundBytes = otherBytes;\n"
              "    _autoBlendColorArgb = otherBytes == null\n"
              "        ? null\n"
              "        : FilterEngine.mostFrequentOpaqueColor(otherBytes);\n",
          )
          replace_once(
              'lib/screens/canvas/widgets/filter_panel.dart',
              "      case FilterKind.backgroundBlend:\n        // lensDistortionのlensCenterOffsetと同じ理由で、長さ・ぼかし半径\n        // （いずれもフル解像度px単位で保存）を_previewScaleで縮小プレビュー用に\n        // 換算する（向きは角度なので換算不要）。\n        return _engine.applyBackgroundBlend(\n          data,\n          width,\n          height,\n          _resolvedBgBlendColor(filter),\n          filter.bgBlendDirection,\n          filter.bgBlendLength * _previewScale,\n          filter.bgBlendBlur * _previewScale,\n        );",
              "      case FilterKind.backgroundBlend:\n"
              "        final background = _previewBackgroundBytes;\n"
              "        if (background == null) return Uint8List.fromList(data);\n"
              "        final previewFilter = filter.copyWith(\n"
              "          bgBlendLength: filter.bgBlendLength * _previewScale,\n"
              "          bgBlendSamplingBand: filter.bgBlendSamplingBand * _previewScale,\n"
              "        );\n"
              "        final analysis = BackgroundAcclimationEngine.analyze(\n"
              "          data, background, width, height, previewFilter,\n"
              "        );\n"
              "        _lastBgBlendAnalysis = analysis;\n"
              "        return BackgroundAcclimationEngine.apply(\n"
              "          data, background, width, height, previewFilter, analysis: analysis,\n"
              "        );",
          )

          old_apply = '''    // 背景馴染ませフィルター用：このフレームの選択レイヤー以外を全てフル
    // 解像度で合成し、最頻色を自動検出する（ユーザーが手動指定していない
    // 場合のみ使う）。大量処理（複数フレーム一括適用）ではフレームごとに
    // 周囲のレイヤー内容が変わり得るため、プレビュー時の自動検出結果
    // （_autoBlendColorArgb）を使い回さず、フレームごとに都度検出し直す。
    // isolateへ渡すFilterDefのbgBlendColorへ解決済みの具体色を書き込んで
    // おくことで、applyDrawFilterInIsolate側は常に確定済みの色だけを
    // 扱えばよくなる（-1＝自動、を意識する必要がない）。
    var effectiveFilter = filter;
    if (filter.kind == FilterKind.backgroundBlend &&
        filter.bgBlendColor == -1) {
      final allLayers = ps.layersOf(
        widget.projectId,
        widget.sceneId,
        frameIndex,
      );
      final otherImg = await LayerCompositor.composite(
        tm,
        allLayers,
        (l) =>
            ps.tileKeyFor(widget.projectId, widget.sceneId, frameIndex, l.id),
        tm.canvasWidth,
        tm.canvasHeight,
        shouldRender: (l, i) => l.id != layerId,
      );
      final otherByteData = await otherImg.toByteData(
        format: ui.ImageByteFormat.rawRgba,
      );
      otherImg.dispose();
      final otherBytes = otherByteData?.buffer.asUint8List();
      final autoColor = otherBytes == null
          ? null
          : FilterEngine.mostFrequentOpaqueColor(otherBytes);
      effectiveFilter = filter.copyWith(bgBlendColor: autoColor ?? 0xFF808080);
    }
'''
          new_apply = '''    // 背景馴染ませ v2：選択レイヤー以外の表示中レイヤーをRGBAのまま
    // isolateへ渡す。代表1色へ潰さないので方向別の光・影・反射・局所色移りを
    // フレームごとに実背景から推定できる。
    if (filter.kind == FilterKind.backgroundBlend) {
      final allLayers = ps.layersOf(
        widget.projectId,
        widget.sceneId,
        frameIndex,
      );
      final otherImg = await LayerCompositor.composite(
        tm,
        allLayers,
        (l) =>
            ps.tileKeyFor(widget.projectId, widget.sceneId, frameIndex, l.id),
        tm.canvasWidth,
        tm.canvasHeight,
        shouldRender: (l, i) => l.id != layerId,
      );
      final otherByteData = await otherImg.toByteData(
        format: ui.ImageByteFormat.rawRgba,
      );
      otherImg.dispose();
      maskData = otherByteData?.buffer.asUint8List();
    }
    final effectiveFilter = filter;
'''
          replace_once('lib/screens/canvas/widgets/filter_panel.dart', old_apply, new_apply)

          # UI: keep legacy direction/length/blur and append full v2 controls.
          ui_anchor = '''                          _paramSlider(
                            filterService,
