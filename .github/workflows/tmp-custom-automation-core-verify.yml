name: TMP Custom Automation Core Verify

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-custom-automation-core-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib/models/custom_automation.dart lib/services/custom_automation_service.dart lib/engine/custom_automation_filter_runner.dart lib/engine/custom_automation_executor.dart test/custom_automation_service_test.dart
      - name: Analyze automation core
        run: flutter analyze lib/models/custom_automation.dart lib/services/custom_automation_service.dart lib/engine/custom_automation_filter_runner.dart lib/engine/custom_automation_executor.dart test/custom_automation_service_test.dart
      - name: Service/model tests
        run: flutter test test/custom_automation_service_test.dart --reporter expanded
