name: TMP Automation Source Diagnose
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-automation-source-diagnose.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Trace automation and brightness-alpha commands
        run: |
          grep -RniE 'brightness.*alpha|alpha.*brightness|明度|透過|canvas\.filterApply|filterApply' lib | head -n 500
          exit 1
