name: One-shot Custom Automation Condition Wait Repair

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-custom-automation-condition-wait-repair.yml'

permissions:
  contents: read

jobs:
  diagnose-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate condition-driven record/edit/replay proof
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/one-shot-custom-automation-record-edit-replay.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'record-edit-replay-rewrite', 'exec'))

          p = Path('test/custom_automation_production_surface_visual_test.dart')
          s = p.read_text()
          replacement = "\n".join([
              "  Future<void> waitUntil(",
              "    bool Function() condition, {",
              "    required String label,",
              "    Duration timeout = const Duration(seconds: 20),",
              "  }) async {",
              "    final stopwatch = Stopwatch()..start();",
              "    while (!condition()) {",
              "      if (stopwatch.elapsed >= timeout) {",
              "        fail('Timed out waiting for $label');",
              "      }",
              "      await tester.pump(const Duration(milliseconds: 16));",
              "      await tester.runAsync(",
              "        () => Future<void>.delayed(const Duration(milliseconds: 10)),",
              "      );",
              "    }",
              "    stopwatch.stop();",
              "    await tester.pump();",
              "  }",
              "",
              "  Future<void> captureCanvas",
          ])
          pattern = re.compile(
              r"(?ms)^\s*Future<void> waitUntil\(.*?^\s*Future<void> captureCanvas",
          )
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('generated waitUntil block anchor changed')
          p.write_text(s)
          PY
      - name: Diagnostic only - bypass compute inside the two production filter paths
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          panel = Path('lib/screens/canvas/widgets/filter_panel.dart')
          s = panel.read_text()
          old = """      result = await compute(applyDrawFilterInIsolate, (\n        data,\n        tm.canvasWidth,\n        tm.canvasHeight,\n        filter,\n        maskData,\n      ));"""
          new = """      // Diagnostic workflow only: execute the identical top-level filter\n      // function synchronously to distinguish widget-test isolate scheduling from\n      // production filter semantics. This file is never committed by this workflow.\n      result = applyDrawFilterInIsolate((\n        data,\n        tm.canvasWidth,\n        tm.canvasHeight,\n        filter,\n        maskData,\n      ));"""
          if old not in s:
              raise SystemExit('FilterPanel generic compute anchor changed')
          panel.write_text(s.replace(old, new, 1))

          runner = Path('lib/engine/custom_automation_filter_runner.dart')
          s = runner.read_text()
          old = """      result = await compute(applyDrawFilterInIsolate, (\n        data,\n        tm.canvasWidth,\n        tm.canvasHeight,\n        filter,\n        auxiliary,\n      ));"""
          new = """      // Diagnostic workflow only; see FilterPanel patch above.\n      result = applyDrawFilterInIsolate((\n        data,\n        tm.canvasWidth,\n        tm.canvasHeight,\n        filter,\n        auxiliary,\n      ));"""
          if old not in s:
              raise SystemExit('automation runner generic compute anchor changed')
          runner.write_text(s.replace(old, new, 1))
          PY
      - name: Format diagnostic tree
        run: dart format test/custom_automation_production_surface_visual_test.dart lib/screens/canvas/widgets/filter_panel.dart lib/engine/custom_automation_filter_runner.dart
      - name: Analyze diagnostic tree
        run: flutter analyze test/custom_automation_production_surface_visual_test.dart lib/screens/canvas/widgets/filter_panel.dart lib/engine/custom_automation_filter_runner.dart --no-fatal-warnings --no-fatal-infos
      - name: Prove record edit save replay pixels without isolate scheduling
        run: flutter test test/custom_automation_production_surface_visual_test.dart --plain-name 'production UI records a real Canvas change, edits, saves, replays, and changes PNG pixels' --reporter expanded
      - name: Upload diagnostic PNG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-compute-diagnostic-png-evidence
          path: build/visual-reaudit/custom-automation-production
          if-no-files-found: warn
          retention-days: 7
      - name: Verify diagnostic production patches were not persisted
        if: always()
        run: |
          git diff -- lib/screens/canvas/widgets/filter_panel.dart lib/engine/custom_automation_filter_runner.dart
          echo 'Diagnostic workflow intentionally does not commit or push production patches.'
