name: One-shot Custom Automation Condition Wait Repair

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-custom-automation-condition-wait-repair.yml'

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate real-async production proof
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/one-shot-custom-automation-record-edit-replay.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'record-edit-replay-rewrite', 'exec'))

          p = Path('test/custom_automation_production_surface_visual_test.dart')
          s = p.read_text()

          helper = r'''  Future<void> waitUntil(
            bool Function() condition, {
            required String label,
            Duration timeout = const Duration(seconds: 20),
          }) async {
            final stopwatch = Stopwatch()..start();
            while (!condition()) {
              if (stopwatch.elapsed >= timeout) {
                fail('Timed out waiting for $label');
              }
              await tester.pump(const Duration(milliseconds: 16));
              await tester.runAsync(
                () => Future<void>.delayed(const Duration(milliseconds: 10)),
              );
            }
            stopwatch.stop();
            await tester.pump();
          }

          Future<void> tapAndWaitRealAsync(
            Finder finder,
            bool Function() condition, {
            required String label,
            Duration timeout = const Duration(seconds: 20),
          }) async {
            await tester.runAsync(() async {
              await tester.tap(finder);
              final stopwatch = Stopwatch()..start();
              while (!condition()) {
                if (stopwatch.elapsed >= timeout) {
                  fail('Timed out waiting for $label');
                }
                await Future<void>.delayed(const Duration(milliseconds: 10));
              }
              stopwatch.stop();
            });
            await tester.pump();
          }

          Future<void> captureCanvas'''
          wait_pattern = re.compile(
              r"(?ms)^\s*Future<void> waitUntil\(.*?^\s*Future<void> captureCanvas",
          )
          s, count = wait_pattern.subn(helper, s, count=1)
          if count != 1:
              raise SystemExit('generated waitUntil block anchor changed')

          first = re.compile(
              r"(?ms)^(\s*)await tester\.tap\(find\.text\(l10n\.filterApplyButton\)\);\n"
              r"\1await harness\.waitUntil\(\n"
              r"\1  \(\) =>\n"
              r"\1      automation\.draft\?\.steps\.length == 1 &&\n"
              r"\1      _changedBytes\(beforeFirstApply, harness\.activeLayerPixels\(\)\) > 100,\n"
              r"\1  label: 'first recorded Canvas filter change',\n"
              r"\1\);"
          )
          first_repl = r'''\1await harness.tapAndWaitRealAsync(
\1  find.text(l10n.filterApplyButton),
\1  () =>
\1      automation.draft?.steps.length == 1 &&
\1      _changedBytes(beforeFirstApply, harness.activeLayerPixels()) > 100,
\1  label: 'first recorded Canvas filter change',
\1);'''
          s, count = first.subn(first_repl, s, count=1)
          if count != 1:
              raise SystemExit('first apply/wait block anchor changed')

          second = re.compile(
              r"(?ms)^(\s*)await tester\.tap\(find\.text\(l10n\.filterApplyButton\)\);\n"
              r"\1await harness\.waitUntil\(\n"
              r"\1  \(\) =>\n"
              r"\1      automation\.draft\?\.steps\.length == 2 &&\n"
              r"\1      _changedBytes\(beforeSecondApply, harness\.activeLayerPixels\(\)\) > 100,\n"
              r"\1  label: 'second recorded Canvas filter change',\n"
              r"\1\);"
          )
          second_repl = r'''\1await harness.tapAndWaitRealAsync(
\1  find.text(l10n.filterApplyButton),
\1  () =>
\1      automation.draft?.steps.length == 2 &&
\1      _changedBytes(beforeSecondApply, harness.activeLayerPixels()) > 100,
\1  label: 'second recorded Canvas filter change',
\1);'''
          s, count = second.subn(second_repl, s, count=1)
          if count != 1:
              raise SystemExit('second apply/wait block anchor changed')

          replay = re.compile(
              r"(?ms)^(\s*)await tester\.tap\(find\.text\(l10n\.customAutomationYes\)\);\n"
              r"\1await harness\.waitUntil\(\n"
              r"\1  \(\) => _changedBytes\(beforeReplay, harness\.activeLayerPixels\(\)\) > 100,\n"
              r"\1  label: 'saved automation replay pixel change',\n"
              r"\1\);"
          )
          replay_repl = r'''\1await harness.tapAndWaitRealAsync(
\1  find.text(l10n.customAutomationYes),
\1  () => _changedBytes(beforeReplay, harness.activeLayerPixels()) > 100,
\1  label: 'saved automation replay pixel change',
\1);'''
          s, count = replay.subn(replay_repl, s, count=1)
          if count != 1:
              raise SystemExit('replay tap/wait block anchor changed')

          if 'waitForProductionAsync' in s:
              raise SystemExit('fixed production wait remains')
          p.write_text(s)
          PY
      - name: Format proof
        run: dart format test/custom_automation_production_surface_visual_test.dart
      - name: Analyze proof
        run: flutter analyze test/custom_automation_production_surface_visual_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Prove record edit save replay pixels
        run: flutter test test/custom_automation_production_surface_visual_test.dart --plain-name 'production UI records a real Canvas change, edits, saves, replays, and changes PNG pixels' --reporter expanded
      - name: Upload PNG pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-record-edit-replay-png-evidence
          path: build/visual-reaudit/custom-automation-production
          if-no-files-found: warn
          retention-days: 7
      - name: Commit proven test repair
        if: success()
        shell: bash
        run: |
          rm .github/workflows/one-shot-custom-automation-record-edit-replay.yml
          rm .github/workflows/one-shot-custom-automation-condition-wait-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/custom_automation_production_surface_visual_test.dart .github/workflows/custom-automation-production-visual-proof.yml .github/workflows/one-shot-custom-automation-record-edit-replay.yml .github/workflows/one-shot-custom-automation-condition-wait-repair.yml
          git commit -m 'test: prove automation replay with real async UI actions'
          git push origin HEAD:dev_branch
