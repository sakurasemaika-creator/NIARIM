name: One-shot Custom Automation Condition Wait Repair

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-custom-automation-condition-wait-repair.yml'

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate condition-driven production proof
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/one-shot-custom-automation-record-edit-replay.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'record-edit-replay-rewrite', 'exec'))

          p = Path('test/custom_automation_production_surface_visual_test.dart')
          s = p.read_text()

          apply_pattern = re.compile(
              r"(?m)^(\s*)await tester\.tap\(find\.text\(l10n\.filterApplyButton\)\);\s*$"
          )
          apply_matches = list(apply_pattern.finditer(s))
          if len(apply_matches) < 2:
              raise SystemExit(f'filter Apply tap anchors changed: found {len(apply_matches)}')
          s = apply_pattern.sub(
              lambda m: "\n".join([
                  f"{m.group(1)}await tester.runAsync(() async {{",
                  f"{m.group(1)}  await tester.tap(find.text(l10n.filterApplyButton));",
                  f"{m.group(1)}}});",
              ]),
              s,
              count=2,
          )

          replay_pattern = re.compile(
              r"(?m)^(\s*)await tester\.tap\(find\.text\(l10n\.customAutomationYes\)\);\s*$"
          )
          replay_matches = list(replay_pattern.finditer(s))
          if not replay_matches:
              raise SystemExit('replay confirmation tap anchor changed')
          s = replay_pattern.sub(
              lambda m: "\n".join([
                  f"{m.group(1)}await tester.runAsync(() async {{",
                  f"{m.group(1)}  await tester.tap(find.text(l10n.customAutomationYes));",
                  f"{m.group(1)}}});",
              ]),
              s,
              count=1,
          )

          wait_pattern = re.compile(
              r"(?ms)^(\s*)final deadline = DateTime\.now\(\)\.add\(timeout\);\n"
              r"\1while \(!condition\(\)\) \{\n"
              r"\1  if \(DateTime\.now\(\)\.isAfter\(deadline\)\) \{\n"
              r"\1    fail\('Timed out waiting for \$label'\);\n"
              r"\1  \}\n"
              r"\1  await tester\.pump\(const Duration\(milliseconds: 16\)\);\n"
              r"\1  await tester\.runAsync\(\(\) => Future<void>\.delayed\(Duration\.zero\)\);\n"
              r"\1\}\n"
              r"\1await tester\.pump\(\);"
          )
          wait_matches = list(wait_pattern.finditer(s))
          if len(wait_matches) != 1:
              raise SystemExit(f'condition wait helper anchor changed: found {len(wait_matches)}')
          def wait_repl(m):
              i = m.group(1)
              return "\n".join([
                  f"{i}final stopwatch = Stopwatch()..start();",
                  f"{i}while (!condition()) {{",
                  f"{i}  if (stopwatch.elapsed >= timeout) {{",
                  f"{i}    fail('Timed out waiting for $label');",
                  f"{i}  }}",
                  f"{i}  await tester.pump(const Duration(milliseconds: 16));",
                  f"{i}  await tester.runAsync(",
                  f"{i}    () => Future<void>.delayed(const Duration(milliseconds: 10)),",
                  f"{i}  );",
                  f"{i}}}",
                  f"{i}stopwatch.stop();",
                  f"{i}await tester.pump();",
              ])
          s = wait_pattern.sub(wait_repl, s, count=1)

          if 'waitForProductionAsync' in s:
              raise SystemExit('fixed production wait remains')
          p.write_text(s)
          PY
      - name: Format proof
        run: dart format test/custom_automation_production_surface_visual_test.dart
      - name: Analyze proof
        run: flutter analyze test/custom_automation_production_surface_visual_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Prove record edit save replay pixels
        run: flutter test test/custom_automation_production_surface_visual_test.dart --plain-name 'production UI records a real Canvas change, edits, saves, replays, and changes PNG pixels' --reporter expanded
      - name: Upload PNG pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-record-edit-replay-png-evidence
          path: build/visual-reaudit/custom-automation-production
          if-no-files-found: warn
          retention-days: 7
      - name: Commit proven test repair
        if: success()
        shell: bash
        run: |
          rm .github/workflows/one-shot-custom-automation-record-edit-replay.yml
          rm .github/workflows/one-shot-custom-automation-condition-wait-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/custom_automation_production_surface_visual_test.dart .github/workflows/custom-automation-production-visual-proof.yml .github/workflows/one-shot-custom-automation-record-edit-replay.yml .github/workflows/one-shot-custom-automation-condition-wait-repair.yml
          git commit -m 'test: prove automation replay with real async UI taps'
          git push origin HEAD:dev_branch
