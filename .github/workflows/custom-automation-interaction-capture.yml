name: Custom Automation Interaction Capture

on:
  push:
    branches: [dev_branch]
    paths:
      - 'test/custom_automation_interaction_capture_test.dart'
      - '.github/workflows/custom-automation-interaction-capture.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed test/custom_automation_interaction_capture_test.dart
      - name: Analyze capture test
        run: flutter analyze test/custom_automation_interaction_capture_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Run interaction capture
        run: flutter test test/custom_automation_interaction_capture_test.dart --reporter expanded
      - name: Upload interaction captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-interaction-captures
          path: build/visual-reaudit/custom-automation-interactions
          if-no-files-found: warn
          retention-days: 7
