name: TMP Brush Pressure Final Verify

on:
  push:
    branches:
      - feature/brush-pressure-profiles

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brush-pressure-profiles
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Remove stale pressure-mode comment
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/services/settings_service.dart')
          s = p.read_text()
          old = '''  // ─── ペン入力設定（筆圧カーブ・ペンボタン） ─────────────────\n  // 注：筆圧の「無効／サイズ／不透明度／両方」反映モードは\n  // アプリ全体の筆圧入力ON/OFF。ブラシごとのON/OFFプロファイルとは独立して保持する。\n  // のみで管理する（グローバル設定としては持たない）。\n  // 筆圧カーブのみアプリ全体に適用される設定としてここで管理する。\n'''
          new = '''  // ─── ペン入力設定（筆圧ON/OFF・筆圧カーブ・ペンボタン） ─────────────\n  // 筆圧ON/OFFはアプリ全体の入力状態。各ブラシはON/OFF両プロファイルを\n  // 常に保持し、この設定によって描画時に使用する側だけを切り替える。\n  // 筆圧カーブもアプリ全体に適用される。\n'''
          if old not in s:
            raise SystemExit('stale comment block not found')
          p.write_text(s.replace(old, new, 1))
      - name: Remove obsolete pressure keys and fill missing translations
        shell: python
        run: |
          import json
          from pathlib import Path
          arb_dir = Path('lib/l10n')
          legacy = {
            'brushSettingsPressureModeTitle',
            'brushSettingsPressureOff',
            'brushSettingsPressureSize',
            'brushSettingsPressureOpacity',
            'brushSettingsPressureSizeAndOpacity',
            'brushSettingsPressureHardnessLabel',
          }
          translations = {
            'app_es.arb': {
              'filterAuroraHologramPresetClassicHologram': 'Holograma aurora',
              'filterAuroraHologramPresetPearl2': 'Perla 2',
            },
            'app_fr.arb': {
              'filterAuroraHologramPresetClassicHologram': 'Hologramme aurore',
              'filterAuroraHologramPresetPearl2': 'Perle 2',
            },
            'app_ko.arb': {
              'filterAuroraHologramPresetClassicHologram': '오로라 홀로그램',
              'filterAuroraHologramPresetPearl2': '펄 2',
            },
            'app_zh.arb': {
              'filterAuroraHologramPresetClassicHologram': '极光全息',
              'filterAuroraHologramPresetPearl2': '珍珠2',
            },
            'app_zh_Hant.arb': {
              'filterAuroraHologramPresetClassicHologram': '極光全息',
              'filterAuroraHologramPresetPearl2': '珍珠2',
              'customAutomationSpecifiedFrames': '在指定影格執行',
              'customAutomationFrameFrom': '開始影格',
              'customAutomationFrameTo': '結束影格',
              'customAutomationFrameRangeInvalid': '請輸入有效的影格範圍。',
              'filterNamePrism': '稜鏡',
            },
          }
          for p in arb_dir.glob('app_*.arb'):
            data = json.loads(p.read_text())
            for key in legacy:
              data.pop(key, None)
              data.pop('@' + key, None)
            data.update(translations.get(p.name, {}))
            p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          template = json.loads((arb_dir / 'app_ja.arb').read_text())
          required = {k for k in template if not k.startswith('@')}
          failures = []
          for p in sorted(arb_dir.glob('app_*.arb')):
            if p.name == 'app_ja.arb':
              continue
            data = json.loads(p.read_text())
            missing = sorted(required - {k for k in data if not k.startswith('@')})
            if missing:
              failures.append((p.name, missing))
              print(f'{p.name}: missing {missing}')
          if failures:
            raise SystemExit(2)
      - name: Regenerate localization files
        run: flutter gen-l10n
      - name: Verify no legacy pressure implementation references
        run: |
          echo '=== legacy pressure symbols ==='
          matches=$(grep -R -n -E 'PressureMode|pressureMode|pressureStrength|pressureHardness|pressure_hardness' lib test || true)
          echo "$matches"
          bad=$(printf '%s\n' "$matches" | grep -v "containsKey('pressureMode')" | grep -v "containsKey('pressureStrength')" || true)
          if [ -n "$bad" ]; then
            echo 'Legacy pressure references remain:'
            echo "$bad"
            exit 1
          fi
      - name: Format check
        run: |
          dart format lib/services/settings_service.dart
          git diff --check
      - name: Analyze production and tests
        run: flutter analyze --no-fatal-infos lib test
      - name: Focused pressure tests
        run: |
          flutter test \
            test/models/brush_pressure_profiles_test.dart \
            test/models/brush_pressure_resolver_test.dart \
            test/services/brush_pressure_profile_lifecycle_test.dart \
            test/services/pen_pressure_enabled_setting_test.dart \
            --reporter expanded
      - name: Full regression suite
        run: flutter test --reporter compact
      - name: Commit verified pressure cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/services/settings_service.dart lib/l10n
          if git diff --cached --quiet; then
            echo 'No production cleanup changes to commit.'
          else
            git commit -m "chore: remove obsolete pressure localization"
            git push origin HEAD:feature/brush-pressure-profiles
          fi
