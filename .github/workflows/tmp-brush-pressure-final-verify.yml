name: TMP Brush Pressure Final Verify

on:
  push:
    branches:
      - feature/brush-pressure-profiles

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brush-pressure-profiles
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply final pressure integration cleanup
        shell: python
        run: |
          import json
          from pathlib import Path

          # Keep the pressure-setting comment idempotently aligned with the new model.
          p = Path('lib/services/settings_service.dart')
          s = p.read_text()
          old = '''  // ─── ペン入力設定（筆圧カーブ・ペンボタン） ─────────────────\n  // 注：筆圧の「無効／サイズ／不透明度／両方」反映モードは\n  // アプリ全体の筆圧入力ON/OFF。ブラシごとのON/OFFプロファイルとは独立して保持する。\n  // のみで管理する（グローバル設定としては持たない）。\n  // 筆圧カーブのみアプリ全体に適用される設定としてここで管理する。\n'''
          new = '''  // ─── ペン入力設定（筆圧ON/OFF・筆圧カーブ・ペンボタン） ─────────────\n  // 筆圧ON/OFFはアプリ全体の入力状態。各ブラシはON/OFF両プロファイルを\n  // 常に保持し、この設定によって描画時に使用する側だけを切り替える。\n  // 筆圧カーブもアプリ全体に適用される。\n'''
          if old in s:
            s = s.replace(old, new, 1)
            p.write_text(s)
          elif new not in s:
            raise SystemExit('pressure setting comment contract not found')

          # Synchronize the Aurora preset switch with the latest dev_branch implementation.
          p = Path('lib/screens/timeline/timeline_screen.dart')
          s = p.read_text()
          anchor = '''    AuroraHologramPreset.silverFoil =>\n      l10n.filterAuroraHologramPresetSilverFoil,\n  };'''
          replacement = '''    AuroraHologramPreset.silverFoil =>\n      l10n.filterAuroraHologramPresetSilverFoil,\n\n    AuroraHologramPreset.classicHologram =>\n      l10n.filterAuroraHologramPresetClassicHologram,\n\n    AuroraHologramPreset.pearl2 => l10n.filterAuroraHologramPresetPearl2,\n  };'''
          if anchor in s:
            s = s.replace(anchor, replacement, 1)
            p.write_text(s)
          elif 'AuroraHologramPreset.classicHologram =>' not in s or 'AuroraHologramPreset.pearl2 =>' not in s:
            raise SystemExit('Aurora preset switch anchor not found')

          arb_dir = Path('lib/l10n')
          legacy = {
            'brushSettingsPressureModeTitle',
            'brushSettingsPressureOff',
            'brushSettingsPressureSize',
            'brushSettingsPressureOpacity',
            'brushSettingsPressureSizeAndOpacity',
            'brushSettingsPressureHardnessLabel',
          }
          translations = {
            'app_es.arb': {
              'filterAuroraHologramPresetClassicHologram': 'Holograma aurora',
              'filterAuroraHologramPresetPearl2': 'Perla 2',
            },
            'app_fr.arb': {
              'filterAuroraHologramPresetClassicHologram': 'Hologramme aurore',
              'filterAuroraHologramPresetPearl2': 'Perle 2',
            },
            'app_ko.arb': {
              'filterAuroraHologramPresetClassicHologram': '오로라 홀로그램',
              'filterAuroraHologramPresetPearl2': '펄 2',
            },
            'app_zh.arb': {
              'filterAuroraHologramPresetClassicHologram': '极光全息',
              'filterAuroraHologramPresetPearl2': '珍珠2',
            },
            'app_zh_Hant.arb': {
              'filterAuroraHologramPresetClassicHologram': '極光全息',
              'filterAuroraHologramPresetPearl2': '珍珠2',
              'customAutomationSpecifiedFrames': '在指定影格執行',
              'customAutomationFrameFrom': '開始影格',
              'customAutomationFrameTo': '結束影格',
              'customAutomationFrameRangeInvalid': '請輸入有效的影格範圍。',
              'filterNamePrism': '稜鏡',
            },
          }
          zh_hant_orphans = {
            'communityPostComingSoonBody',
            'communityPostComingSoonTitle',
            'communityPostInfoBody',
            'communityPostInfoTitle',
            'communityTagSearchModeOffTooltip',
            'communityTagSearchModeOnTooltip',
            'customAutomationPremiumHint',
            'customAutomationStopConfirmQuit',
            'filterBackgroundBlendAutoLabel',
            'filterBackgroundBlendAutoReset',
            'filterBackgroundBlendColorLabel',
            'filterCustomMenuDuplicate',
            'filterCustomMenuFavoriteBlockBody',
            'filterCustomMenuFavoriteBlockTitle',
          }
          for arb in arb_dir.glob('app_*.arb'):
            data = json.loads(arb.read_text())
            for key in legacy:
              data.pop(key, None)
              data.pop('@' + key, None)
            if arb.name == 'app_zh_Hant.arb':
              for key in zh_hant_orphans:
                data.pop(key, None)
                data.pop('@' + key, None)
            data.update(translations.get(arb.name, {}))
            arb.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
      - name: Regenerate localization files
        run: flutter gen-l10n
      - name: Format and validate diff
        run: |
          dart format lib/services/settings_service.dart lib/screens/timeline/timeline_screen.dart
          git diff --check
      - name: Verify translation tone
        run: python tools/audit_translation_tone.py
      - name: Verify analyzer
        run: flutter analyze --no-fatal-infos lib test
      - name: Commit verified cleanup inputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/services/settings_service.dart lib/screens/timeline/timeline_screen.dart lib/l10n
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
          else
            git commit -m "fix: finalize brush pressure integration cleanup"
            git push origin HEAD:feature/brush-pressure-profiles
          fi
      - name: Focused pressure tests
        run: |
          flutter test \
            test/models/brush_pressure_profiles_test.dart \
            test/models/brush_pressure_resolver_test.dart \
            test/services/brush_pressure_profile_lifecycle_test.dart \
            test/services/pen_pressure_enabled_setting_test.dart \
            --reporter expanded
      - name: Full regression suite
        run: flutter test --reporter compact
