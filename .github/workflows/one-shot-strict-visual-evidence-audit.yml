name: One-shot strict visual evidence audit

on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/one-shot-strict-visual-evidence-audit.yml"
      - "test/strict_visual_evidence_audit_test.dart"

permissions:
  contents: read

jobs:
  strict-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Run strict visual evidence tests
        run: flutter test test/strict_visual_evidence_audit_test.dart --reporter expanded
      - name: Upload strict visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-visual-evidence
          path: build/strict-visual-evidence
          if-no-files-found: warn
          retention-days: 14
