name: TMP Feature Pressure Hardness Custom Automation

on:
  push:
    branches:
      - feature/pressure-hardness-custom-automation
    paths:
      - '.github/workflows/tmp-feature-pressure-hardness-custom-automation.yml'
      - 'tool/tmp_apply_pressure_hardness_custom_automation.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/pressure-hardness-custom-automation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Apply minimal feature patch
        run: python3 tool/tmp_apply_pressure_hardness_custom_automation.py
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Format changed Dart
        run: dart format lib/models/pressure_hardness.dart lib/screens/canvas/widgets/brush_panel.dart lib/widgets/custom_automation_manager_sheet.dart test/pressure_hardness_test.dart
      - name: Static analysis
        run: flutter analyze --no-fatal-infos lib/models/pressure_hardness.dart lib/screens/canvas/widgets/brush_panel.dart lib/widgets/custom_automation_manager_sheet.dart test/pressure_hardness_test.dart
      - name: Pressure hardness tests
        run: flutter test test/pressure_hardness_test.dart --reporter expanded
      - name: Custom automation regression tests
        run: flutter test test/custom_automation_service_test.dart --reporter expanded
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add pressure hardness control and simplify automation cards'
          git push origin HEAD:feature/pressure-hardness-custom-automation
