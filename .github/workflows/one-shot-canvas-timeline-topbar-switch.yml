name: one-shot canvas timeline topbar switch

on:
  push:
    branches: [dev_branch]
    paths:
      - .github/workflows/one-shot-canvas-timeline-topbar-switch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - name: Add paired timeline switch to canvas top bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/canvas/canvas_screen.dart')
          s = p.read_text()
          old = '''          _topBarIconButton(
            context,
            Icons.home_outlined,
            onPressed: _confirmBackToProjectList,
            tooltip: l10n.timelineBackToProjectListTooltip,
          ),
        ],'''
          new = '''          _topBarIconButton(
            context,
            Icons.home_outlined,
            onPressed: _confirmBackToProjectList,
            tooltip: l10n.timelineBackToProjectListTooltip,
          ),
          // タイムライン画面の「← + キャンバス」ボタンと対になる、
          // キャンバス→タイムラインの常設モード切替。フレーム追加ボタンと
          // 競合しないよう、右上メニューの一番右へ置く。
          _topBarIconButton(
            context,
            Icons.movie_filter_outlined,
            trailingIcon: Icons.arrow_forward,
            onPressed: () => _runAutomationBlockedAction(
              () => context.go('/timeline/${widget.projectId}'),
            ),
            tooltip: 'Timeline',
          ),
        ],'''
          if old not in s:
              raise SystemExit('target top-bar block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Extend top bar icon helper for paired mode icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/canvas/canvas_screen.dart')
          s = p.read_text()
          old = '''  Widget _topBarIconButton(
    BuildContext context,
    IconData icon, {
    required VoidCallback? onPressed,
    required String tooltip,
  }) {'''
          new = '''  Widget _topBarIconButton(
    BuildContext context,
    IconData icon, {
    IconData? trailingIcon,
    required VoidCallback? onPressed,
    required String tooltip,
  }) {'''
          if old not in s:
              raise SystemExit('top-bar helper signature not found')
          s = s.replace(old, new, 1)
          old2 = '''      icon: Icon(icon),'''
          new2 = '''      icon: trailingIcon == null
          ? Icon(icon)
          : Row(
              mainAxisSize: MainAxisSize.min,
              children: [
                Icon(icon, size: 18),
                const SizedBox(width: 1),
                Icon(trailingIcon, size: 18),
              ],
            ),'''
          idx = s.find(old2, s.find(new))
          if idx < 0:
              raise SystemExit('top-bar helper icon line not found')
          s = s[:idx] + s[idx:].replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Format and commit
        run: |
          dart format lib/screens/canvas/canvas_screen.dart || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/canvas/canvas_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat: add canvas timeline topbar switch"
          git push origin HEAD:dev_branch