name: One-shot Direct Service Coverage

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/one-shot-direct-service-coverage.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Run direct service coverage batches with retry
        shell: bash
        run: |
          set +e
          for attempt in 1 2; do
            timeout 1200s flutter test \
              test/direct_service_coverage_batch01_test.dart \
              test/direct_service_coverage_batch02_test.dart \
              test/direct_service_coverage_batch03_test.dart \
              test/direct_service_coverage_batch04_test.dart \
              test/direct_service_coverage_batch05_test.dart \
              test/direct_service_coverage_batch06_test.dart \
              test/direct_service_coverage_batch07_test.dart \
              test/direct_service_coverage_batch08_test.dart \
              --reporter expanded
            rc=$?
            if [ $rc -eq 0 ]; then exit 0; fi
            echo "direct service coverage attempt $attempt failed rc=$rc"
            sleep 10
          done
          exit 1
