name: Audit Continuous Queue

on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/audit-continuous-queue.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: audit-continuous-queue-dev
  cancel-in-progress: false

env:
  DASHBOARD_WORKFLOW: audit-live-dashboard.yml

jobs:
  strict-visual:
    name: '01 以前に確認済みの描画機能を、より厳しい基準でもう一度確認'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev_branch }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: gh workflow run "$DASHBOARD_WORKFLOW" --ref dev_branch || true
        env: { GH_TOKEN: '${{ github.token }}' }
      - run: flutter test test/strict_visual_evidence_audit_test.dart --reporter expanded
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: queue-01-strict-visual, path: build/strict-visual-evidence, if-no-files-found: warn, retention-days: 14 }

  real-operation:
    name: '02 各機能へ実操作相当の入力を与えて結果を確認'
    needs: strict-visual
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev_branch }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: gh workflow run "$DASHBOARD_WORKFLOW" --ref dev_branch || true
        env: { GH_TOKEN: '${{ github.token }}' }
      - shell: bash
        run: |
          set +e
          mkdir -p build/functional-visual build/audit-logs
          failures=0
          for n in $(seq 27 38); do
            t="test/functional_audit_batch${n}_test.dart"
            echo "===== $t ====="
            if [ ! -f "$t" ]; then echo "MISSING $t" | tee "build/audit-logs/batch${n}.log"; failures=$((failures+1)); continue; fi
            timeout 300s flutter test "$t" --reporter expanded 2>&1 | tee "build/audit-logs/batch${n}.log"
            rc=${PIPESTATUS[0]}; [ "$rc" -eq 0 ] || failures=$((failures+1))
          done
          echo "$failures" > build/audit-logs/failure-count.txt
          test "$failures" -eq 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-02-real-operation
          path: |
            build/**/*.png
            build/audit-logs/*
          if-no-files-found: warn
          retention-days: 14

  canvas-panels:
    name: '03 Canvas画面の主要パネルを開閉・操作して見た目を確認'
    needs: real-operation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev_branch }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: gh workflow run "$DASHBOARD_WORKFLOW" --ref dev_branch || true
        env: { GH_TOKEN: '${{ github.token }}' }
      - run: flutter test test/canvas_panel_screenshot_audit_test.dart --reporter expanded
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: queue-03-canvas-panels, path: build/**/*.png, if-no-files-found: warn, retention-days: 14 }

  routes-and-filters:
    name: '04 全主要画面と全フィルターが意図した見た目か確認'
    needs: canvas-panels
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev_branch }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: gh workflow run "$DASHBOARD_WORKFLOW" --ref dev_branch || true
        env: { GH_TOKEN: '${{ github.token }}' }
      - run: flutter test test/all_routes_screenshot_audit_test.dart --reporter expanded
      - run: flutter test test/visual_reaudit_filters_test.dart --reporter expanded
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: queue-04-routes-filters, path: build/**/*.png, if-no-files-found: warn, retention-days: 14 }

  coverage:
    name: '05 アプリ全体の自動テストと検証範囲を確認'
    needs: routes-and-filters
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev_branch }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: gh workflow run "$DASHBOARD_WORKFLOW" --ref dev_branch || true
        env: { GH_TOKEN: '${{ github.token }}' }
      - run: flutter test --coverage --reporter compact
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: queue-05-coverage, path: coverage/lcov.info, if-no-files-found: warn, retention-days: 14 }

  final-regression:
    name: '06 監査や修正で別機能を壊していないか全体を最終確認'
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev_branch }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: gh workflow run "$DASHBOARD_WORKFLOW" --ref dev_branch || true
        env: { GH_TOKEN: '${{ github.token }}' }
      - shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          if grep -Eq '^[[:space:]]*error[[:space:]]' analyze.log; then exit 1; fi
          exit 0
      - run: flutter test --reporter compact

  continue-if-needed:
    name: '07 未確認項目が残っていれば待たずに次の監査を開始'
    needs: [strict-visual, real-operation, canvas-panels, routes-and-filters, coverage, final-regression]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev_branch }
      - name: 台帳の未確認項目数を確認
        id: remaining
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('audit-dashboard/feature-audit-manifest.json'))
          fs=[f for f in d['features'] if not (f.get('device_required') and not f.get('final_pass'))]
          remaining=sum(not f.get('final_pass',False) for f in fs)
          print(f'remaining={remaining}')
          print(f'total={len(fs)}')
          PY
      - name: ダッシュボードを最新状態へ更新
        run: gh workflow run "$DASHBOARD_WORKFLOW" --ref dev_branch || true
        env: { GH_TOKEN: '${{ github.token }}' }
      - name: 未確認が残っていれば連続監査を即再起動
        if: steps.remaining.outputs.remaining != '0'
        run: |
          echo "未確認 ${{ steps.remaining.outputs.remaining }} 件。待機せず次の監査サイクルを開始します。"
          gh workflow run audit-continuous-queue.yml --ref dev_branch
        env: { GH_TOKEN: '${{ github.token }}' }
      - name: 全件確認済み
        if: steps.remaining.outputs.remaining == '0'
        run: echo "AI/CIで確認可能な全 ${{ steps.remaining.outputs.total }} 項目が最終確認済みです。"
