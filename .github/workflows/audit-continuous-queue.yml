name: Audit Continuous Queue

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/audit-continuous-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: '連続監査キューの起動確認'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - run: echo 'Audit Continuous Queue is running.'
