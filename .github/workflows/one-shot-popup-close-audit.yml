name: One-shot Popup Close Audit

on:
  push:
    branches: [dev_branch]
    paths: ['.github/workflows/one-shot-popup-close-audit.yml']
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inventory popup close controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          popup_tokens=('showDialog','showModalBottomSheet','AlertDialog(','Dialog(')
          for p in Path('lib').rglob('*.dart'):
              s=p.read_text(encoding='utf-8')
              if not any(t in s for t in popup_tokens): continue
              lines=s.splitlines()
              matches=[]
              for i,line in enumerate(lines,1):
                  if any(t in line for t in ('commonClose','commonCancel','Icons.close','barrierDismissible:')):
                      matches.append((i,line.strip()))
              if matches:
                  print(f'CLOSE_FILE {p}')
                  for i,line in matches:
                      print(f'  L{i}: {line[:220]}')
          PY
