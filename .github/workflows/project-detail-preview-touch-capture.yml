name: Project detail preview touch-target captures

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/project-detail-preview-touch-capture.yml'
      - 'lib/screens/project/project_detail_screen.dart'
      - 'test/project_detail_audit_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib/screens/project/project_detail_screen.dart test/project_detail_audit_test.dart
      - name: Compact preview touch-target test and captures
        run: flutter test test/project_detail_audit_test.dart --plain-name "fullscreen preview control keeps a 48dp hit target on compact screens" --reporter expanded
      - name: Analyze changed Dart files
        run: flutter analyze --no-pub lib/screens/project/project_detail_screen.dart test/project_detail_audit_test.dart --no-fatal-infos --no-fatal-warnings
      - name: Confirm preview captures were produced
        run: test -n "$(find build/project-detail-ui-captures -type f -name '*.png' -print -quit)"
      - name: Upload compact preview captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-detail-preview-captures-${{ github.sha }}
          path: build/project-detail-ui-captures/*.png
          retention-days: 7
          if-no-files-found: warn
