name: TMP Brush Pressure Settings Patch

on:
  push:
    branches:
      - feature/brush-pressure-profiles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brush-pressure-profiles
      - name: Patch global pen pressure setting
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/services/settings_service.dart')
          text = path.read_text()

          replacements = [
              (
                  "  bool _palmRejectionEnabled = true;\n  PenPressureCurve _penPressureCurve = PenPressureCurve.normal;",
                  "  bool _palmRejectionEnabled = true;\n  // App-wide pressure activation. Brushes always store both ON/OFF profiles;\n  // this flag selects which profile is active while drawing.\n  bool _penPressureEnabled = true;\n  PenPressureCurve _penPressureCurve = PenPressureCurve.normal;",
              ),
              (
                  "  bool get palmRejectionEnabled => _palmRejectionEnabled;\n  PenPressureCurve get penPressureCurve => _penPressureCurve;",
                  "  bool get palmRejectionEnabled => _palmRejectionEnabled;\n  bool get penPressureEnabled => _penPressureEnabled;\n  PenPressureCurve get penPressureCurve => _penPressureCurve;",
              ),
              (
                  "  Future<void> setPenPressureCurve(PenPressureCurve curve) async {",
                  "  Future<void> setPenPressureEnabled(bool value) async {\n    _penPressureEnabled = value;\n    final prefs = await SharedPreferences.getInstance();\n    await prefs.setBool('pen_pressure_enabled', value);\n    notifyListeners();\n  }\n\n  Future<void> setPenPressureCurve(PenPressureCurve curve) async {",
              ),
              (
                  "    _palmRejectionEnabled = prefs.getBool('palm_rejection_enabled') ?? true;\n    _penPressureCurve =",
                  "    _palmRejectionEnabled = prefs.getBool('palm_rejection_enabled') ?? true;\n    _penPressureEnabled = prefs.getBool('pen_pressure_enabled') ?? true;\n    _penPressureCurve =",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/services/settings_service.dart
          git diff --cached --check
          git commit -m "feat: add global pen pressure setting"
          git push origin HEAD:feature/brush-pressure-profiles
