name: Audit Repair And Resume

on:
  workflow_run:
    workflows: ["Audit Continuous Queue"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: audit-repair-resume-dev
  cancel-in-progress: false

jobs:
  repair-and-resume:
    name: '失敗原因を修復し、通過確認後に監査を再開'
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: 既知のタイムライン縦オーバーフローを安全に修復
        id: timeline_fix
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens/timeline/timeline_screen.dart')
          s=p.read_text()
          old='                      _buildPreviewWithHandle(outerConstraints.maxHeight),'
          if old not in s:
              print('既知の旧レイアウトではありません。既に修正済み、または別原因です。')
              raise SystemExit(0)

          s=s.replace(old, '''                      Flexible(
                        flex: 3,
                        fit: FlexFit.loose,
                        child: _buildPreviewWithHandle(
                          outerConstraints.maxHeight,
                        ),
                      ),''', 1)

          marker='  Widget _buildPreviewWithHandle(double maxAvailableHeight) {'
          start=s.index(marker)
          end=s.index('\n  /// プレビューと再生バーの間のシークバー。', start)
          block=s[start:end]
          old_return='    return Column(\n      mainAxisSize: MainAxisSize.min,\n'
          if old_return not in block:
              raise SystemExit('既知修復パターンと一致しません。未知の失敗として停止します。')

          block=block.replace(old_return, '''    return LayoutBuilder(
      builder: (context, constraints) {
        final allocatedPreviewHeight = constraints.hasBoundedHeight
            ? math.max(0.0, constraints.maxHeight - 22.0)
            : maxPreviewHeight;
        final visiblePreviewHeight = math.min(
          previewHeight,
          allocatedPreviewHeight,
        );
        return Column(
          mainAxisSize: MainAxisSize.min,
''', 1)
          if '          height: previewHeight,' not in block:
              raise SystemExit('既知修復パターンと一致しません。未知の失敗として停止します。')
          block=block.replace('          height: previewHeight,','          height: visiblePreviewHeight,',1)
          trimmed=block.rstrip()
          if not trimmed.endswith('    );'):
              raise SystemExit('既知修復パターンと一致しません。未知の失敗として停止します。')
          trimmed=trimmed[:-len('    );')]+'        );\n      },\n    );'
          s=s[:start]+trimmed+'\n'+s[end:]
          p.write_text(s)
          PY
          dart format lib/screens/timeline/timeline_screen.dart

      - name: 直前に失敗した既知3ケースを再確認
        shell: bash
        run: |
          flutter test test/timeline_no_overflow_test.dart --reporter expanded
          flutter test test/app_web_reference_export_exact_test.dart --reporter expanded
          flutter test test/app_web_reference_capture_exact_test.dart --reporter expanded

      - name: 修正がある場合だけdev_branchへ反映
        shell: bash
        run: |
          git config user.name "NIARIM Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/timeline/timeline_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m "監査失敗からタイムライン縦オーバーフローを自動修復"
            git pull --rebase origin dev_branch
            git push origin HEAD:dev_branch
          else
            echo 'コード変更不要。現HEADで再確認テストは通過しました。'
          fi

      - name: 修復後の全テストを確認
        run: flutter test --reporter compact

      - name: 修復確認済みなので連続監査を即再開
        run: gh workflow run audit-continuous-queue.yml --ref dev_branch
        env:
          GH_TOKEN: ${{ github.token }}

      - name: ダッシュボード更新
        if: always()
        run: gh workflow run audit-live-dashboard.yml --ref dev_branch || true
        env:
          GH_TOKEN: ${{ github.token }}
