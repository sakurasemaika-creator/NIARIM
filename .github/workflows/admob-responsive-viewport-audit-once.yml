# One-shot screen-size matrix for phone portrait/landscape and Galaxy DeX.
name: NIARIM AdMob SP and PC width matrix (one shot)
# Updated after nullability lint fix
on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/admob-responsive-viewport-audit-once.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Analyze all changed placement and viewport files
        run: |
          flutter analyze --no-pub --no-fatal-infos \
            lib/app.dart \
            lib/router.dart \
            lib/widgets/ad_banner_mock_widget.dart \
            lib/widgets/ad_live_slot_widget.dart \
            lib/widgets/progress_dialog.dart \
            lib/services/ad_placement_policy.dart \
            lib/services/ad_modal_visibility_observer.dart \
            test/ad_mock_layout_test.dart
      - name: Run 15-width smartphone and PC matrix
        run: flutter test --no-pub test/ad_mock_layout_test.dart --reporter expanded
