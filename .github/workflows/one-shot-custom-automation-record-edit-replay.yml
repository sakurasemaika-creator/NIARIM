name: One-shot Custom Automation Record Edit Replay

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-custom-automation-record-edit-replay.yml'

permissions:
  contents: write

jobs:
  rewrite-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Rewrite production proof to condition-based waits and exact UI sequence
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('test/custom_automation_production_surface_visual_test.dart')
          s = p.read_text()

          start = s.find("  testWidgets(\n    'production automation surfaces record a real Aurora filter and replay it'")
          end = s.find("\n  testWidgets(\n    'three starter automations execute through the production manager'", start)
          if start < 0 or end < 0:
              raise SystemExit('record/replay proof anchors changed')

          proof = r'''  testWidgets(
            'production UI records a real Canvas change, edits, saves, replays, and changes PNG pixels',
            (tester) async {
              final harness = await _SurfaceHarness.create(tester, out);
              await harness.createProject('record-replay');
              final automation = harness.automationService;
              final l10n = harness.l10n;

              await harness.captureCanvas('01_canvas_before_recording');
              final originalPixels = harness.activeLayerPixels();

              harness.showManager();
              await tester.pump();
              expect(find.text(l10n.customAutomationAdd), findsOneWidget);
              await tester.tap(find.text(l10n.customAutomationAdd));
              await tester.pump();
              expect(find.byType(TextField), findsOneWidget);
              await tester.enterText(find.byType(TextField), 'record-edit-replay-proof');
              await tester.tap(find.text(l10n.customAutomationStartRecording));
              await harness.waitUntil(
                () => automation.isRecording,
                label: 'recording start',
              );

              harness.filterService.selectFilter('Filter0019');
              harness.showFilterPanel();
              await tester.pump();
              expect(find.byType(FilterPanel), findsOneWidget);
              await harness.capture('02_filter_panel_while_recording');

              final beforeFirstApply = harness.activeLayerPixels();
              await tester.tap(find.text(l10n.filterApplyButton));
              await harness.waitUntil(
                () =>
                    automation.draft?.steps.length == 1 &&
                    _changedBytes(beforeFirstApply, harness.activeLayerPixels()) > 100,
                label: 'first recorded Canvas filter change',
              );
              final afterFirstApply = harness.activeLayerPixels();
              final firstChanged = _changedBytes(beforeFirstApply, afterFirstApply);
              expect(firstChanged, greaterThan(100));
              expect(automation.draft!.steps.single.command, 'canvas.filterApply');
              await harness.captureCanvas('03_canvas_after_recorded_change');

              // Record a second real Canvas change so the draft editor has a meaningful
              // edit to perform. The edit below removes this second step before save.
              harness.filterService.selectFilter('Filter0019');
              harness.showFilterPanel();
              await tester.pump();
              final beforeSecondApply = harness.activeLayerPixels();
              await tester.tap(find.text(l10n.filterApplyButton));
              await harness.waitUntil(
                () =>
                    automation.draft?.steps.length == 2 &&
                    _changedBytes(beforeSecondApply, harness.activeLayerPixels()) > 100,
                label: 'second recorded Canvas filter change',
              );

              harness.showRecordingStop();
              await tester.pump();
              expect(find.byType(CustomAutomationRecordingStopButton), findsOneWidget);
              await harness.capture('04_recording_stop_ui');
              await tester.tap(find.text(l10n.customAutomationStopRecording));
              await harness.waitUntil(
                () => !automation.isRecording,
                label: 'recording stop',
              );

              harness.showDraftEditor();
              await tester.pump();
              expect(automation.draft, isNotNull);
              expect(automation.draft!.steps, hasLength(2));
              expect(find.text('canvas.filterApply'), findsNWidgets(2));
              await harness.capture('05_draft_editor_before_edit');
              await tester.tap(find.byIcon(Icons.delete_outline).last);
              await harness.waitUntil(
                () => automation.draft?.steps.length == 1,
                label: 'draft edit',
              );
              await harness.capture('06_draft_editor_after_edit');

              await tester.tap(find.text(l10n.commonSave).last);
              await harness.waitUntil(
                () =>
                    automation.draft == null &&
                    automation.items.any(
                      (item) => item.name == 'record-edit-replay-proof',
                    ),
                label: 'draft save',
              );
              final saved = automation.items
                  .where((item) => item.name == 'record-edit-replay-proof')
                  .single;
              expect(saved.steps, hasLength(1));
              expect(saved.steps.single.command, 'canvas.filterApply');

              // Replay against a fresh canvas so pixel evidence cannot be explained by
              // the two changes that happened during recording.
              await harness.createProject('record-replay-fresh-target');
              expect(
                _changedBytes(originalPixels, harness.activeLayerPixels()),
                0,
                reason: 'fresh replay target must start from the same deterministic pixels',
              );
              final beforeReplay = harness.activeLayerPixels();
              await harness.captureCanvas('07_canvas_before_saved_replay');

              harness.showManager();
              await tester.pump();
              expect(find.text('record-edit-replay-proof'), findsOneWidget);
              await harness.capture('08_manager_saved_item');
              await tester.tap(find.text('record-edit-replay-proof'));
              await tester.pump();
              expect(find.text(l10n.customAutomationRunConfirmTitle), findsOneWidget);
              await harness.capture('09_replay_confirmation');
              await tester.tap(find.text(l10n.customAutomationYes));
              await harness.waitUntil(
                () => _changedBytes(beforeReplay, harness.activeLayerPixels()) > 100,
                label: 'saved automation replay pixel change',
              );
              final afterReplay = harness.activeLayerPixels();
              final replayChanged = _changedBytes(beforeReplay, afterReplay);
              expect(replayChanged, greaterThan(100));
              await harness.captureCanvas('10_canvas_after_saved_replay');

              File('${out.path}/pixel-proof.txt').writeAsStringSync(
                'recorded_changed_bytes=$firstChanged\n'
                'replay_changed_bytes=$replayChanged\n'
                'saved_steps=${saved.steps.length}\n'
                'saved_command=${saved.steps.single.command}\n',
              );
              expect(tester.takeException(), isNull);
            },
            timeout: const Timeout(Duration(minutes: 3)),
          );
          '''
          s = s[:start] + proof + s[end:]

          old_wait = re.compile(
              r"  Future<void> waitForProductionAsync\(\{int extraMilliseconds = 1500\}\) async \{.*?\n  \}\n",
              re.S,
          )
          new_wait = r'''  Future<void> waitUntil(
            bool Function() condition, {
            required String label,
            Duration timeout = const Duration(seconds: 20),
          }) async {
            final deadline = DateTime.now().add(timeout);
            while (!condition()) {
              if (DateTime.now().isAfter(deadline)) {
                fail('Timed out waiting for $label');
              }
              await tester.pump(const Duration(milliseconds: 16));
              await tester.runAsync(() => Future<void>.delayed(Duration.zero));
            }
            await tester.pump();
          }

          Future<void> captureCanvas(String name) async {
            final tm = projectService.tileManagerOf(projectId);
            final key = projectService.tileKeyFor(
              projectId,
              sceneId,
              frameIndex,
              layerId,
            );
            final png = await tester.runAsync(() async {
              final image = await tm.compositeLayerToImage(key);
              final data = await image.toByteData(format: ui.ImageByteFormat.png);
              image.dispose();
              return data!.buffer.asUint8List();
            });
            File('${out.path}/$name.png').writeAsBytesSync(png!);
          }
          '''
          s, n = old_wait.subn(new_wait, s, count=1)
          if n != 1:
              raise SystemExit('fixed wait helper anchor changed')

          old_starter_wait = '        await harness.waitForProductionAsync(extraMilliseconds: 2200);'
          if old_starter_wait not in s:
              raise SystemExit('starter fixed wait anchor changed')
          s = s.replace(
              old_starter_wait,
              '''        await harness.waitUntil(
                  () => entry.$3
                      ? harness.normalLayerIds().difference(beforeLayers).isNotEmpty
                      : _changedBytes(beforePixels, harness.activeLayerPixels()) > 100,
                  label: '${entry.$1} production execution',
                );''',
              1,
          )
          if 'waitForProductionAsync' in s:
              raise SystemExit('fixed production wait remains')
          p.write_text(s)

          wf = Path('.github/workflows/custom-automation-production-visual-proof.yml')
          w = wf.read_text()
          w = w.replace("      - 'tool/patch_custom_automation_surface_interactions.py'\n", '')
          w = w.replace(
              "      - name: Apply production-surface harness isolation\n        run: python3 tool/patch_custom_automation_surface_interactions.py\n      - name: Format patched test\n        run: dart format test/custom_automation_production_surface_visual_test.dart\n",
              "      - name: Verify production proof formatting\n        run: dart format --output=none --set-exit-if-changed test/custom_automation_production_surface_visual_test.dart\n",
          )
          if 'patch_custom_automation_surface_interactions.py' in w:
              raise SystemExit('production proof still applies patch harness')
          wf.write_text(w)
          PY
      - name: Format rewritten proof
        run: dart format test/custom_automation_production_surface_visual_test.dart
      - name: Analyze rewritten proof
        run: flutter analyze test/custom_automation_production_surface_visual_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Run rewritten record-edit-save-replay proof
        run: flutter test test/custom_automation_production_surface_visual_test.dart --plain-name 'production UI records a real Canvas change, edits, saves, replays, and changes PNG pixels' --reporter expanded
      - name: Commit proven rewrite and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-custom-automation-record-edit-replay.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/custom_automation_production_surface_visual_test.dart .github/workflows/custom-automation-production-visual-proof.yml .github/workflows/one-shot-custom-automation-record-edit-replay.yml
          git commit -m 'test: make automation proof condition-driven'
          git push origin HEAD:dev_branch
