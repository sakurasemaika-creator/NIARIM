name: One-shot Premium Disabled Lander

on:
  push:
    branches:
      - dev_branch
    paths:
      - ".github/workflows/one-shot-premium-disabled-lander.yml"

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Apply exact Premium disabled-state replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))
              print(f'patched {path}')

          # Settings: keep Watermark visible with lock, but disable the row for free users.
          replace_exact(
              'lib/screens/settings/settings_screen.dart',
              '        onTap: _showWatermarkSetting,\n',
              '        onTap: isPremium ? _showWatermarkSetting : null,\n',
          )
          replace_exact(
              'lib/screens/settings/settings_screen.dart',
              '    VoidCallback onTap,\n',
              '    VoidCallback? onTap,\n',
          )
          replace_exact(
              'lib/screens/settings/settings_screen.dart',
              "    if (!context.read<PremiumService>().isPremium) {\n      showPremiumBanner(context);\n      return;\n    }\n    context.push('/settings/watermark');\n",
              "    if (!context.read<PremiumService>().isPremium) return;\n    context.push('/settings/watermark');\n",
          )

          # Workspace: lock icon stays visible, Switch itself is disabled.
          replace_exact(
              'lib/screens/settings/workspace_settings_screen.dart',
              '                onChanged: premium.isPremium\n                    ? (v) => settings.setEndCardDefaultHiddenForPremium(v)\n                    : (_) => showPremiumBanner(context),\n',
              '                onChanged: premium.isPremium\n                    ? (v) => settings.setEndCardDefaultHiddenForPremium(v)\n                    : null,\n',
          )

          # Timeline Watermark: retain visible watermark+lock row, remove tap target entirely.
          replace_exact(
              'lib/screens/timeline/timeline_screen.dart',
              '''    // 無料会員：lockアイコン付きで表示、タップで共通Premiumバナー
    return GestureDetector(
      onTap: () => showPremiumBanner(context),
      child: Padding(
        padding: const EdgeInsets.symmetric(horizontal: 4),
        child: Row(
          mainAxisSize: MainAxisSize.min,
          children: [
            Icon(
              Icons.branding_watermark,
              size: 18,
              color: Theme.of(context).colorScheme.onSurfaceVariant,
            ),
            SizedBox(width: 2),
            Icon(
              Icons.lock,
              size: 12,
              color: ThemeService.activeColorScheme.tertiary,
            ),
          ],
        ),
      ),
    );
''',
              '''    // 無料会員：項目は表示したままlockアイコン付き・操作不能。
    return Padding(
      padding: const EdgeInsets.symmetric(horizontal: 4),
      child: Row(
        mainAxisSize: MainAxisSize.min,
        children: [
          Icon(
            Icons.branding_watermark,
            size: 18,
            color: Theme.of(context).colorScheme.onSurfaceVariant,
          ),
          SizedBox(width: 2),
          Icon(
            Icons.lock,
            size: 12,
            color: ThemeService.activeColorScheme.tertiary,
          ),
        ],
      ),
    );
''',
          )

          # Timeline EndCard: track remains visible/locked but has no free-user tap action.
          replace_exact(
              'lib/screens/timeline/timeline_screen.dart',
              '          onTap: premium.isPremium ? null : () => showPremiumBanner(context),\n',
              '          onTap: null,\n',
          )

          # Canvas custom automation: visible title+lock remains, ListTile becomes disabled.
          replace_exact(
              'lib/screens/canvas/canvas_screen.dart',
              '''                onTap: () {
                  Navigator.pop(ctx);
                  _showCustomAutomationManager();
                },
''',
              '''                onTap:
                    context.read<PremiumService>().isFeatureAvailable(
                      PremiumFeature.customAutomation,
                    )
                    ? () {
                        Navigator.pop(ctx);
                        _showCustomAutomationManager();
                      }
                    : null,
''',
          )

          # Defensive guards never open an upsell from a locked control.
          guard_old = '''    if (!premium.isFeatureAvailable(PremiumFeature.customAutomation)) {
      showPremiumBanner(context);
      return;
    }
'''
          guard_new = '''    if (!premium.isFeatureAvailable(PremiumFeature.customAutomation)) return;
'''
          replace_exact('lib/screens/canvas/canvas_screen.dart', guard_old, guard_new)
          replace_exact('lib/screens/timeline/timeline_screen.dart', guard_old, guard_new)

          print('\nAutomation manager references after patch:')
          for path in ['lib/screens/canvas/canvas_screen.dart', 'lib/screens/timeline/timeline_screen.dart']:
              lines = Path(path).read_text().splitlines()
              for i, line in enumerate(lines):
                  if '_showCustomAutomationManager' in line:
                      lo, hi = max(0, i-6), min(len(lines), i+7)
                      print(f'--- {path}:{i+1} ---')
                      print('\n'.join(f'{j+1}: {lines[j]}' for j in range(lo, hi)))
          PY
      - name: Format and analyze affected Premium surfaces
        shell: bash
        run: |
          dart format \
            lib/screens/settings/settings_screen.dart \
            lib/screens/settings/workspace_settings_screen.dart \
            lib/screens/timeline/timeline_screen.dart \
            lib/screens/canvas/canvas_screen.dart
          flutter analyze \
            lib/widgets/premium_lock_widget.dart \
            lib/screens/settings/settings_screen.dart \
            lib/screens/settings/workspace_settings_screen.dart \
            lib/screens/timeline/timeline_screen.dart \
            lib/screens/canvas/canvas_screen.dart \
            test/premium_lock_widget_test.dart \
            --no-fatal-warnings --no-fatal-infos
      - name: Prove common lock behavior
        run: flutter test test/premium_lock_widget_test.dart --reporter expanded
      - name: Verify no old Premium upsell callback remains on patched controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'lib/screens/settings/settings_screen.dart': [
                  'onTap: isPremium ? _showWatermarkSetting : null,',
                  'VoidCallback? onTap,',
              ],
              'lib/screens/settings/workspace_settings_screen.dart': [
                  ': null,',
              ],
              'lib/screens/timeline/timeline_screen.dart': [
                  '// 無料会員：項目は表示したままlockアイコン付き・操作不能。',
                  'onTap: null,',
              ],
              'lib/screens/canvas/canvas_screen.dart': [
                  'PremiumFeature.customAutomation,',
              ],
          }
          for path, needles in checks.items():
              text = Path(path).read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing invariant {needle!r}')
          print('Premium disabled-state invariants present')
          PY
      - name: Commit and fast-forward push verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NIARIM Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lib/screens/settings/settings_screen.dart \
            lib/screens/settings/workspace_settings_screen.dart \
            lib/screens/timeline/timeline_screen.dart \
            lib/screens/canvas/canvas_screen.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m "fix: disable locked Premium controls"
          git fetch origin dev_branch
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/dev_branch)" || {
            echo 'dev_branch moved concurrently; refusing non-fast-forward landing'
            exit 1
          }
          git push origin HEAD:dev_branch
