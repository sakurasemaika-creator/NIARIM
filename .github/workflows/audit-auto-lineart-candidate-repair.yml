name: Audit Auto Lineart Candidate Verification

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/audit-auto-lineart-candidate-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTO_LINEART_SOURCES: >-
        lib/services/project_service.dart
        lib/services/recorded_filter_apply_service.dart
        lib/screens/canvas/widgets/filter_panel.dart
        lib/screens/canvas/widgets/auto_lineart_control_overlay.dart
        test/auto_lineart_canvas_e2e_test.dart
        test/auto_lineart_bulk_isolation_test.dart
        test/auto_lineart_panel_state_test.dart
        test/generated_filter_redo_test.dart
        test/helpers/pump_real_async.dart
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply preserved candidate exactly
        shell: bash
        run: |
          git apply --check docs/product-audit/pending/auto-lineart-repairs.patch
          git apply docs/product-audit/pending/auto-lineart-repairs.patch
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze candidate sources
        run: flutter analyze --no-pub $AUTO_LINEART_SOURCES
      - name: Verify Canvas, bulk isolation, manual controls, and generated-filter Redo
        run: >-
          flutter test --no-pub --reporter expanded
          test/auto_lineart_canvas_e2e_test.dart
          test/auto_lineart_bulk_isolation_test.dart
          test/auto_lineart_panel_state_test.dart
          test/generated_filter_redo_test.dart
          test/auto_lineart_filter_test.dart
          test/auto_lineart_control_overlay_test.dart
      - name: Land the exact verified candidate
        shell: bash
        run: |
          rm docs/product-audit/pending/auto-lineart-repairs.patch
          git config user.name 'NIARIM Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/services/project_service.dart \
            lib/services/recorded_filter_apply_service.dart \
            lib/screens/canvas/widgets/filter_panel.dart \
            test/auto_lineart_canvas_e2e_test.dart \
            test/auto_lineart_bulk_isolation_test.dart \
            test/auto_lineart_panel_state_test.dart \
            test/generated_filter_redo_test.dart \
            docs/product-audit/pending/auto-lineart-repairs.patch
          git commit -m '[audit-state] fix: land verified auto-lineart undo repairs'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
