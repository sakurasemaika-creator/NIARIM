name: One-shot Canvas Tool Coordinate Fix

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-canvas-tool-coordinate-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Patch mesh hit testing to use full canvas-to-screen scale
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/screens/canvas/widgets/canvas_area.dart')
          s = p.read_text(encoding='utf-8')
          old = '''    final scale = _transformController.value.getMaxScaleOnAxis();
              final radius = _meshHandleHitRadius / (scale > 0 ? scale : 1);'''
          new = '''    final scale = _canvasToScreenScale;
              final radius = _meshHandleHitRadius / (scale > 0 ? scale : 1);'''
          if old not in s:
              raise SystemExit('mesh hit-test target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Add source regression guard
        shell: python
        run: |
          from pathlib import Path
          p = Path('test/canvas_mesh_handle_scale_contract_test.dart')
          p.write_text(r'''import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('mesh handle hit testing uses the full canvas-to-screen scale', () {
    final source = File('lib/screens/canvas/widgets/canvas_area.dart').readAsStringSync();
    final start = source.indexOf('int? _hitTestMeshPoint');
    expect(start, greaterThanOrEqualTo(0));
    final end = source.indexOf('\n  /// 確定', start);
    expect(end, greaterThan(start));
    final body = source.substring(start, end);
    expect(body, contains('final scale = _canvasToScreenScale;'));
    expect(body, isNot(contains('getMaxScaleOnAxis()')),
        reason: 'zoom only ignores the project-to-widget fit scale');
  });
}
''', encoding='utf-8')
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/canvas_mesh_handle_scale_contract_test.dart test/canvas_rotated_coordinate_mapping_test.dart test/canvas_extended_drawing_rotation_contract_test.dart test/canvas_pinch_gesture_test.dart --reporter expanded
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "NIARIM Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/canvas/widgets/canvas_area.dart test/canvas_mesh_handle_scale_contract_test.dart
          git commit -m "fix: keep mesh handle hit area screen-stable"
          git push origin HEAD:dev_branch
