name: One-shot Persist Custom Automation Proof

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-persist-custom-automation-proof.yml'

permissions:
  contents: write

jobs:
  persist-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate permanent sleep-free proof
        run: |
          python3 tool/patch_custom_automation_surface_interactions.py
          python3 tool/patch_custom_automation_direct_runner_proof.py
          dart format test/custom_automation_production_surface_visual_test.dart
      - name: Analyze permanent proof
        run: flutter analyze test/custom_automation_production_surface_visual_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Prove permanent record edit save replay pixels
        run: flutter test test/custom_automation_production_surface_visual_test.dart --reporter expanded
      - name: Simplify permanent proof workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/custom-automation-production-visual-proof.yml')
          s = p.read_text()
          s = s.replace("      - 'tool/patch_custom_automation_surface_interactions.py'\n", '')
          s = s.replace("      - 'tool/patch_custom_automation_direct_runner_proof.py'\n", '')
          s = s.replace("      - name: Apply production-surface harness isolation\n        run: python3 tool/patch_custom_automation_surface_interactions.py\n", '')
          s = s.replace("      - name: Replace fixed-sleep proof with direct production runner proof\n        run: python3 tool/patch_custom_automation_direct_runner_proof.py\n", '')
          p.write_text(s)
          PY
          rm tool/patch_custom_automation_surface_interactions.py
          rm tool/patch_custom_automation_direct_runner_proof.py
          rm -f .github/workflows/one-shot-custom-automation-record-edit-replay.yml
          rm -f .github/workflows/one-shot-custom-automation-condition-wait-repair.yml
          rm .github/workflows/one-shot-persist-custom-automation-proof.yml
      - name: Commit permanent proof
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: persist sleep-free automation PNG proof'
          git push origin HEAD:dev_branch
