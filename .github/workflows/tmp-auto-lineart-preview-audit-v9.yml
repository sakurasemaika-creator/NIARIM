name: TMP Auto Lineart Preview Audit v9
on:
  push:
    branches: [dev_branch]
    paths: ['.github/workflows/tmp-auto-lineart-preview-audit-v9.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {ref: dev_branch, fetch-depth: 0}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Patch audit tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('test/auto_lineart_filter_panel_visual_audit_test.dart')
          s=p.read_text()
          marker='void main() {\n  TestWidgetsFlutterBinding.ensureInitialized();'
          replacement="const runAutoLineartVisualAudit = bool.fromEnvironment('NIARIM_AUTO_LINEART_VISUAL_AUDIT');\n\nvoid main() {\n  TestWidgetsFlutterBinding.ensureInitialized();"
          assert marker in s
          s=s.replace(marker,replacement,1)
          for name in ['auto_lineart_sp_45.png','auto_lineart_sp_85.png','auto_lineart_desktop_45.png']:
            old=f"      golden: 'goldens/{name}',\n    );\n  }});"
            new=f"      golden: 'goldens/{name}',\n    );\n  }}, skip: !runAutoLineartVisualAudit);"
            assert old in s, name
            s=s.replace(old,new,1)
          preview=base64.b64decode('').decode()
          idx=s.rfind('\n}')
          assert idx!=-1
          s=s[:idx]+preview+s[idx:]
          p.write_text(s)

          p=Path('test/auto_lineart_control_overlay_test.dart')
          s=p.read_text()
          anchor="  testWidgets('SP-sized transparent hit target reaches 20px from a control point', (tester) async {"
          assert anchor in s
          dense=base64.b64decode('').decode()
          s=s.replace(anchor,dense+'\n'+anchor,1)
          p.write_text(s)
          PY
          dart format test/auto_lineart_filter_panel_visual_audit_test.dart test/auto_lineart_control_overlay_test.dart
      - name: Validate normal suite behavior
        run: |
          flutter pub get
          flutter analyze test/auto_lineart_filter_panel_visual_audit_test.dart test/auto_lineart_control_overlay_test.dart
          flutter test test/auto_lineart_control_overlay_test.dart
          flutter test test/auto_lineart_filter_panel_visual_audit_test.dart
      - name: Generate visual evidence
        run: flutter test --dart-define=NIARIM_AUTO_LINEART_VISUAL_AUDIT=true --update-goldens test/auto_lineart_filter_panel_visual_audit_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-lineart-preview-audit-v9
          path: test/goldens/*.png
          if-no-files-found: warn
      - name: Land regression-safe audit tests
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/auto_lineart_filter_panel_visual_audit_test.dart test/auto_lineart_control_overlay_test.dart
          git commit -m 'test: isolate auto lineart visual audit and verify dense touch selection'
          git reset --hard HEAD
          git clean -fd
          git fetch origin dev_branch
          git rebase origin/dev_branch
          git push origin HEAD:dev_branch
