name: One-shot Canvas Boundary Visual Operation Final

# trigger: independent scenarios
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-canvas-boundary-visual-operation-final.yml'

permissions:
  contents: read

jobs:
  visual-operation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build independent real-operation scenarios
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src = Path('.github/workflows/one-shot-canvas-boundary-visual-operation.yml').read_text(encoding='utf-8')
          start = "cat > test/canvas_boundary_visual_operation_test.dart <<'DART'\n"
          body = textwrap.dedent(src.split(start, 1)[1].split("\n          DART", 1)[0])
          body = body.replace('writeAsBytes(bytes),', 'writeAsBytes(bytes!),')
          old = """              await capture('00_initial');
              await pinchToMinScale();
              await capture('01_min_scale_center');
              await rotateAtMinScale();
              await capture('02_min_scale_rotated');
              await middleDrag(const Offset(5000, 0), 41);
              await capture('03_min_scale_drag_far_right');
              await middleDrag(const Offset(-10000, -10000), 42);
              await capture('04_min_scale_drag_far_left_top');
              await middleDrag(const Offset(5000, 10000), 43);
              await capture('05_min_scale_drag_far_right_bottom');
              await zoomIn();
              await middleDrag(const Offset(10000, 10000), 44);
              await capture('06_zoomed_drag_far_right_bottom');
              await middleDrag(const Offset(-20000, -20000), 45);
              await capture('07_zoomed_drag_far_left_top');

              expect(out.listSync().whereType<File>().length, 8);"""
          new = """              Future<void> resetCanvas() async {
                appRouter.go('/home');
                await tester.pump(const Duration(milliseconds: 100));
                appRouter.go('/canvas/${project.id}');
                for (var i = 0; i < 8; i++) {
                  await tester.pump(const Duration(milliseconds: 100));
                  await tester.runAsync(
                    () => Future<void>.delayed(const Duration(milliseconds: 60)),
                  );
                }
                expect(find.byType(CanvasArea), findsOneWidget);
              }

              await capture('00_initial');

              await resetCanvas();
              await pinchToMinScale();
              await capture('01_min_scale_center');

              await resetCanvas();
              await pinchToMinScale();
              await rotateAtMinScale();
              await capture('02_min_scale_rotated');

              await resetCanvas();
              await pinchToMinScale();
              await rotateAtMinScale();
              await middleDrag(const Offset(5000, 0), 41);
              await capture('03_min_scale_drag_far_right');

              await resetCanvas();
              await pinchToMinScale();
              await rotateAtMinScale();
              await middleDrag(const Offset(-5000, -5000), 41);
              await capture('04_min_scale_drag_far_left_top');

              await resetCanvas();
              await pinchToMinScale();
              await rotateAtMinScale();
              await middleDrag(const Offset(5000, 5000), 41);
              await capture('05_min_scale_drag_far_right_bottom');

              await resetCanvas();
              await zoomIn();
              await middleDrag(const Offset(5000, 5000), 41);
              await capture('06_zoomed_drag_far_right_bottom');

              await resetCanvas();
              await zoomIn();
              await middleDrag(const Offset(-5000, -5000), 41);
              await capture('07_zoomed_drag_far_left_top');

              expect(out.listSync().whereType<File>().length, 8);"""
          assert old in body, 'capture sequence not found'
          body = body.replace(old, new, 1)
          Path('test/canvas_boundary_visual_operation_test.dart').write_text(body, encoding='utf-8')
          PY
          dart format test/canvas_boundary_visual_operation_test.dart
      - name: Run independent real-operation visual audit
        run: flutter test test/canvas_boundary_visual_operation_test.dart --reporter expanded
      - name: Verify captures are not accidentally identical
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(Path('build/canvas-boundary-visual').glob('*.png'))
          assert len(files) == 8, len(files)
          hashes = {f.name: hashlib.sha256(f.read_bytes()).hexdigest() for f in files}
          print('\n'.join(f'{k} {v}' for k,v in hashes.items()))
          assert len(set(hashes.values())) >= 6, 'too many identical captures: input scenarios did not execute independently'
          PY
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-boundary-visual-operation-final
          path: build/canvas-boundary-visual/*.png
          if-no-files-found: error
