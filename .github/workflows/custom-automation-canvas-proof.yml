name: Custom Automation Canvas Proof

on:
  push:
    branches:
      - audit/aurora-automation-proof
    paths:
      - 'test/custom_automation_canvas_real_visual_proof_test.dart'
      - '.github/workflows/custom-automation-canvas-proof.yml'

jobs:
  canvas-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - run: flutter analyze test/custom_automation_canvas_real_visual_proof_test.dart --no-fatal-warnings --no-fatal-infos
      - run: flutter test test/custom_automation_canvas_real_visual_proof_test.dart --reporter expanded
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-canvas-proof
          path: build/custom-automation-canvas-proof
          if-no-files-found: warn
          retention-days: 7
