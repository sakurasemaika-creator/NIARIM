name: Temporary Merge Pixel Refresh To Dev
on:
  push:
    branches: [dev_branch]
    paths: [.github/workflows/tmp-merge-pixel-refresh-to-dev.yml]
permissions:
  contents: write
jobs:
  merge-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Merge feature history without discarding dev changes
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feature/pixel-filter-blend-refresh
          git merge --no-ff --no-edit origin/feature/pixel-filter-blend-refresh || {
            echo 'MERGE_CONFLICTS'
            git status --short
            exit 1
          }
      - name: Verify merged pixel/filter contracts
        run: |
          set -euxo pipefail
          flutter pub get
          tests=()
          for t in \
            test/engine/pixel_art_engine_test.dart \
            test/engine/pixel_art_filter_engine_test.dart \
            test/engine/filter_engine_pixel_art_contract_test.dart \
            test/engine/stamp_pixel_art_route_test.dart \
            test/engine/mosaic_filter_contract_test.dart \
            test/models/mosaic_filter_def_contract_test.dart \
            test/mosaic_filter_test.dart \
            test/engine/noise_filter_distinction_test.dart \
            test/engine/analog_filter_distinction_test.dart; do
            [ -f "$t" ] && tests+=("$t")
          done
          if [ ${#tests[@]} -gt 0 ]; then flutter test "${tests[@]}"; fi
          flutter analyze lib/models/filter_def.dart lib/engine/pixel_art_engine.dart lib/engine/filter_engine.dart lib/services/filter_service.dart lib/screens/canvas/widgets/filter_panel.dart
      - name: Remove temporary workflow and push verified merge
        run: |
          set -euxo pipefail
          git rm .github/workflows/tmp-merge-pixel-refresh-to-dev.yml
          git commit -m 'ci: remove temporary pixel refresh merge workflow'
          git push origin HEAD:dev_branch
