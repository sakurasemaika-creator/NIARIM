name: Normal Task Final Residual Fix

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/normal-task-final-residual-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run verified residual repair
        run: bash tool/normal_task_final_residual_fix.sh
