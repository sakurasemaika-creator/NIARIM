name: Custom Automation Production Proof

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/fix-custom-automation-production-seed.yml'
      - 'test/custom_automation_production_surface_visual_test.dart'
      - 'lib/engine/custom_automation_executor.dart'
      - 'lib/engine/custom_automation_filter_runner.dart'
      - 'lib/models/custom_automation_presets.dart'
      - 'lib/services/custom_automation_service.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Format check
        run: dart format --output=none --set-exit-if-changed test/custom_automation_production_surface_visual_test.dart lib/engine/custom_automation_executor.dart lib/engine/custom_automation_filter_runner.dart lib/models/custom_automation_presets.dart lib/services/custom_automation_service.dart
      - name: Analyze affected production and proof files
        run: flutter analyze --no-fatal-warnings --no-fatal-infos test/custom_automation_production_surface_visual_test.dart lib/engine/custom_automation_executor.dart lib/engine/custom_automation_filter_runner.dart lib/models/custom_automation_presets.dart lib/services/custom_automation_service.dart
      - name: Run recording replay and all current built-in presets
        run: flutter test test/custom_automation_production_surface_visual_test.dart --reporter expanded
      - name: Upload production visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-production-evidence
          path: build/visual-reaudit/custom-automation-production
          if-no-files-found: warn
          retention-days: 14
