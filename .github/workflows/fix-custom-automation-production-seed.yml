name: Repair Custom Automation Visual Canvas Seed

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/fix-custom-automation-production-seed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Seed the full 320px Canvas across all 256px tiles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/custom_automation_production_visual_test.dart')
          s = p.read_text()
          old = '''    final tile = tm.getOrCreateTile(key, 0, 0);
    tile.fillRange(0, tile.length, 0);
    for (var y = 36; y < 284; y++) {
      for (var x = 36; x < 284; x++) {
        final i = (y * TileManager.tileSize + x) * 4;
        var shade = 20 + ((x - 36) * 225 ~/ 247);
        if ((x > 92 && x < 118) || (y > 148 && y < 174)) {
          shade = 18;
        }
        if (x > 188 && x < 242 && y > 78 && y < 132) {
          shade = 235;
        }
        tile[i] = shade;
        tile[i + 1] = shade;
        tile[i + 2] = shade;
        tile[i + 3] = 255;
      }
    }
    tm.invalidateTile(key, 0, 0);
'''
          new = '''    for (var ty = 0; ty < tm.tilesY; ty++) {
      for (var tx = 0; tx < tm.tilesX; tx++) {
        final tile = tm.getOrCreateTile(key, tx, ty);
        tile.fillRange(0, tile.length, 0);
        for (var localY = 0; localY < TileManager.tileSize; localY++) {
          final y = ty * TileManager.tileSize + localY;
          if (y >= tm.canvasHeight) continue;
          for (var localX = 0; localX < TileManager.tileSize; localX++) {
            final x = tx * TileManager.tileSize + localX;
            if (x >= tm.canvasWidth) continue;
            if (x < 36 || x >= 284 || y < 36 || y >= 284) continue;
            final i = (localY * TileManager.tileSize + localX) * 4;
            var shade = 20 + ((x - 36) * 225 ~/ 247);
            if ((x > 92 && x < 118) || (y > 148 && y < 174)) {
              shade = 18;
            }
            if (x > 188 && x < 242 && y > 78 && y < 132) {
              shade = 235;
            }
            tile[i] = shade;
            tile[i + 1] = shade;
            tile[i + 2] = shade;
            tile[i + 3] = 255;
          }
        }
        tm.invalidateTile(key, tx, ty);
      }
    }
'''
          if old not in s:
              raise SystemExit('canvas seed anchor changed')
          s = s.replace(old, new, 1)
          s = s.replace("import 'dart:typed_data';\n", '')
          s = s.replace('handleCanvasStateCommand: (_, __) async {},', 'handleCanvasStateCommand: (_, _) async {},')
          p.write_text(s)
          PY
      - run: dart format test/custom_automation_production_visual_test.dart
      - run: flutter analyze test/custom_automation_production_visual_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Run production Canvas automation visual flow
        run: flutter test test/custom_automation_production_visual_test.dart --reporter expanded
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-production-seed-evidence
          path: build/visual-reaudit/custom-automation-production
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified seed repair
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-custom-automation-production-seed.yml
          git add test/custom_automation_production_visual_test.dart
          git commit -m 'test: seed automation visual canvas across tiles'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
