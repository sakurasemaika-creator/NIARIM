# One-shot, dev_branch-only lock refresh for newly added Firebase packages.
# This workflow must be removed after it has updated pubspec.lock.
name: FCM dependency lockfile refresh (dev_branch only)
on:
  push:
    branches: [dev_branch]
    paths: [".github/workflows/fcm-lockfile-once.yml"]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/dev_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - name: Resolve and verify lockfile
        run: |
          flutter pub get
          flutter pub get --enforce-lockfile
      - name: Commit lockfile to dev_branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "pubspec.lock already current"
            exit 0
          fi
          git commit -m "chore(fcm): lock compatible Firebase Flutter packages"
          git pull --rebase origin dev_branch
          git push origin HEAD:refs/heads/dev_branch
