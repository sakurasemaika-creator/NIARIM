name: Drawing Engine Brush Extension Green

on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/drawing-engine-brush-extension-green.yml'

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Integrate BrushStampPlan into DrawingEngine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/engine/drawing_engine.dart')
          s = p.read_text()
          if "import 'brush_render_plan.dart';" not in s:
            s = s.replace("import 'brush_texture_cache.dart';\n", "import 'brush_texture_cache.dart';\nimport 'brush_render_plan.dart';\n")

          old_call = '''    _renderCircleStamp(
              stampX,
              stampY,
              radius,
              alphaInt,
              tilt,
              layerId,
              brush.pixelMode,
              resolvedPressure.blur,
              customTexture,
              stylusTiltMagnitude: stylusTiltMagnitude,
              edgeJitter: resolvedPressure.edgeJitterEnabled,
              edgeJitterStrength: resolvedPressure.edgeJitterStrength,
              mixingMode: resolvedPressure.mixingMode,
              mixingRate: resolvedPressure.mixingRate,
              hexagon: isGlitterHexagon,
              particleRotation: particleRotation,
              chainLink: isChainLink,
              chainAspect: chainAspect,
              chainThickness: chainThickness,
              ballChain: isBallChain,
            );'''.replace('              ', '      ', 1)
          # Use the exact source block instead of indentation tricks.
          old_call = '''    _renderCircleStamp(
      stampX,
      stampY,
      radius,
      alphaInt,
      tilt,
      layerId,
      brush.pixelMode,
      resolvedPressure.blur,
      customTexture,
      stylusTiltMagnitude: stylusTiltMagnitude,
      edgeJitter: resolvedPressure.edgeJitterEnabled,
      edgeJitterStrength: resolvedPressure.edgeJitterStrength,
      mixingMode: resolvedPressure.mixingMode,
      mixingRate: resolvedPressure.mixingRate,
      hexagon: isGlitterHexagon,
      particleRotation: particleRotation,
      chainLink: isChainLink,
      chainAspect: chainAspect,
      chainThickness: chainThickness,
      ballChain: isBallChain,
    );'''
          new_call = '''    final extensionPlan = buildBrushStampPlan(
      brush: brush,
      center: ui.Offset(stampX, stampY),
      pathAngle: pathAngle,
      effectiveSize: size,
    );
    final usesExtensionRaster =
        brush.lateralRepeatEnabled ||
        brush.outlineEnabled ||
        extensionPlan.hollowSquare;
    final centers = usesExtensionRaster
        ? extensionPlan.centers
        : <ui.Offset>[ui.Offset(stampX, stampY)];
    for (final center in centers) {
      final outlineRadius = extensionPlan.outlineRadius;
      if (usesExtensionRaster && outlineRadius != null) {
        _renderCircleStamp(
          center.dx,
          center.dy,
          outlineRadius,
          alphaInt,
          tilt,
          layerId,
          brush.pixelMode,
          resolvedPressure.blur,
          customTexture,
          stylusTiltMagnitude: stylusTiltMagnitude,
          edgeJitter: resolvedPressure.edgeJitterEnabled,
          edgeJitterStrength: resolvedPressure.edgeJitterStrength,
          mixingMode: resolvedPressure.mixingMode,
          mixingRate: resolvedPressure.mixingRate,
          hexagon: isGlitterHexagon,
          particleRotation: particleRotation,
          chainLink: isChainLink,
          chainAspect: chainAspect,
          chainThickness: chainThickness,
          ballChain: isBallChain,
          hollowSquare: extensionPlan.hollowSquare,
          hollowSquareInnerRatio: extensionPlan.hollowSquareInnerRatio,
          colorOverride: ui.Color(brush.outlineColor),
          coverageNamespace: 'outline',
        );
      }
      _renderCircleStamp(
        center.dx,
        center.dy,
        extensionPlan.fillRadius,
        alphaInt,
        tilt,
        layerId,
        brush.pixelMode,
        resolvedPressure.blur,
        customTexture,
        stylusTiltMagnitude: stylusTiltMagnitude,
        edgeJitter: resolvedPressure.edgeJitterEnabled,
        edgeJitterStrength: resolvedPressure.edgeJitterStrength,
        mixingMode: resolvedPressure.mixingMode,
        mixingRate: resolvedPressure.mixingRate,
        hexagon: isGlitterHexagon,
        particleRotation: particleRotation,
        chainLink: isChainLink,
        chainAspect: chainAspect,
        chainThickness: chainThickness,
        ballChain: isBallChain,
        hollowSquare: usesExtensionRaster && extensionPlan.hollowSquare,
        hollowSquareInnerRatio: extensionPlan.hollowSquareInnerRatio,
        coverageNamespace: usesExtensionRaster ? 'fill' : 'legacy',
      );
    }'''
          if old_call not in s:
            raise SystemExit('render call marker not found')
          s = s.replace(old_call, new_call, 1)

          old_sig = '''    bool ballChain = false,
  }) {
    final r = currentColor.r;
    final g = currentColor.g;
    final b = currentColor.b;'''
          new_sig = '''    bool ballChain = false,
    bool hollowSquare = false,
    double hollowSquareInnerRatio = 0.5,
    ui.Color? colorOverride,
    String coverageNamespace = 'legacy',
  }) {
    final paintColor = colorOverride ?? currentColor;
    final r = paintColor.r;
    final g = paintColor.g;
    final b = paintColor.b;'''
          if old_sig not in s:
            raise SystemExit('signature marker not found')
          s = s.replace(old_sig, new_sig, 1)
          s = s.replace("final coverageKey = '$layerId:$tx:$ty';", "final coverageKey = '$coverageNamespace:$layerId:$tx:$ty';", 1)

          marker = '''            } else if (chainLink) {
              // 中抜き楕円リンク。'''
          hollow = '''            } else if (hollowSquare) {
              // Hollow-square brush tip: outer square coverage minus a centered
              // square opening. Keep AA on both boundaries and scale the opening
              // with the pressure-resolved effective radius.
              final outerDistance = math.max(ux.abs(), uy.abs());
              final innerRadius = radius *
                  hollowSquareInnerRatio.clamp(0.0, 0.95).toDouble();
              final outerAa = (radius + 0.5 - outerDistance).clamp(0.0, 1.0);
              final innerAa = (outerDistance - innerRadius + 0.5).clamp(0.0, 1.0);
              pixelAlpha = math.min(outerAa, innerAa);
            } else if (chainLink) {
              // 中抜き楕円リンク。'''
          if marker not in s:
            raise SystemExit('hollow-square insertion marker not found')
          s = s.replace(marker, hollow, 1)
          p.write_text(s)
          PY
      - name: Verify GREEN
        run: |
          dart format lib/engine/drawing_engine.dart test/engine/drawing_engine_brush_extensions_test.dart
          flutter test test/engine/drawing_engine_brush_extensions_test.dart --reporter expanded
          flutter test test/engine/brush_render_plan_test.dart --reporter expanded
          flutter test test/engine/brush_stroke_geometry_test.dart --reporter expanded
          flutter test test/engine/outlined_stroke_compositor_test.dart --reporter expanded
          flutter analyze lib/engine/drawing_engine.dart lib/engine/brush_render_plan.dart test/engine/drawing_engine_brush_extensions_test.dart --no-fatal-infos
      - name: Persist verified DrawingEngine integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/engine/drawing_engine.dart test/engine/drawing_engine_brush_extensions_test.dart
          git diff --cached --quiet && exit 0
          git commit -m 'feat: rasterize brush extensions in drawing engine'
          git fetch origin dev_branch
          git rebase origin/dev_branch
          git push origin HEAD:dev_branch
