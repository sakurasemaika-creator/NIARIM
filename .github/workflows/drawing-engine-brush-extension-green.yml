name: Drawing Engine Brush Extension Green

on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/drawing-engine-brush-extension-green.yml'
      - '.github/scripts/complete_screen_space_fold_integration.py'
      - '.github/scripts/complete_canvas_fold_screen_input.py'
      - 'lib/engine/drawing_engine.dart'
      - 'lib/engine/brush_stroke_geometry.dart'
      - 'lib/screens/canvas/widgets/canvas_area.dart'
      - 'test/engine/drawing_engine_brush_extensions_test.dart'
      - 'test/engine/brush_stroke_geometry_test.dart'

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Complete explicit screen-space fold integration
        run: |
          python3 .github/scripts/complete_screen_space_fold_integration.py
          python3 .github/scripts/complete_canvas_fold_screen_input.py
          dart format lib/engine/drawing_engine.dart lib/screens/canvas/widgets/canvas_area.dart
      - name: Verify GREEN
        run: |
          flutter test test/engine/drawing_engine_brush_extensions_test.dart --reporter expanded
          flutter test test/engine/brush_stroke_geometry_test.dart --reporter expanded
          flutter test test/engine/brush_render_plan_test.dart --reporter expanded
          flutter test test/engine/outlined_stroke_compositor_test.dart --reporter expanded
          flutter analyze lib/engine/drawing_engine.dart lib/engine/brush_stroke_geometry.dart lib/engine/brush_render_plan.dart lib/screens/canvas/widgets/canvas_area.dart test/engine/drawing_engine_brush_extensions_test.dart test/engine/brush_stroke_geometry_test.dart --no-fatal-infos --no-fatal-warnings
      - name: Persist verified screen-space integration
        run: |
          if git diff --quiet -- lib/engine/drawing_engine.dart lib/screens/canvas/widgets/canvas_area.dart; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/engine/drawing_engine.dart lib/screens/canvas/widgets/canvas_area.dart
          git commit -m 'fix: use explicit screen-space fold samples from canvas input'
          git fetch origin dev_branch
          git rebase origin/dev_branch
          git push origin HEAD:dev_branch
