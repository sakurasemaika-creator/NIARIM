name: Entry Exit Taper Green

on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - 'lib/models/brush.dart'
      - 'lib/engine/drawing_engine.dart'
      - 'lib/**/brush*.dart'
      - 'lib/l10n/app_*.arb'
      - 'test/**/brush*.dart'
      - 'test/**/stroke*.dart'
      - 'test/**/taper*.dart'
      - '.github/chat-integration-trigger.txt'
      - '.github/workflows/entry-exit-taper-red.yml'

jobs:
  verify-entry-exit-taper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify no legacy shared fade structure remains
        run: |
          ! grep -R --line-number --exclude-dir=.git --exclude='entry-exit-taper-red.yml' -E 'fadeCustom|distancePx' lib test
      - name: Run brush stroke and taper tests
        run: |
          set -e
          flutter test test/creative_asset_persistence_test.dart test/niatra_asset_bundle_test.dart test/functional_audit_batch12_test.dart test/functional_audit_batch13_test.dart test/final_remaining_strict_evidence_test.dart
      - name: Analyze affected production code
        run: flutter analyze lib/models/brush.dart lib/engine/drawing_engine.dart lib/screens/canvas/widgets/brush_panel.dart lib/screens/canvas/widgets/canvas_area.dart lib/screens/help/help_screen.dart
