name: One-shot real PNG export audit

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/one-shot-export-audit.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Dependencies
        run: flutter pub get
      - name: Real PNG export functional test
        run: flutter test test/functional_audit_batch21_test.dart --reporter expanded
      - name: Analyze test scope
        run: flutter analyze --no-fatal-infos --no-fatal-warnings test/functional_audit_batch21_test.dart
