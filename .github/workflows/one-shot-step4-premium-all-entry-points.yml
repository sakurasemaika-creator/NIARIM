name: One-shot Step4 Premium All Entry Points

on:
  push:
    branches:
      - dev_branch
    paths:
      - ".github/workflows/one-shot-step4-premium-all-entry-points.yml"

permissions:
  contents: write

jobs:
  premium-all-entry-points:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Normalize direct Premium gates to PremiumFeature contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}: {old!r}')
              p.write_text(text.replace(old, new))

          replace(
              'lib/screens/settings/settings_screen.dart',
              "if (!context.read<PremiumService>().isPremium) {",
              "if (!context.read<PremiumService>().isFeatureAvailable(PremiumFeature.watermark)) {",
          )

          replace(
              'lib/screens/export/export_screen.dart',
              'if (!premiumService.isPremium) {',
              'if (!premiumService.isFeatureAvailable(PremiumFeature.unlimitedDuration)) {',
          )
          replace(
              'lib/screens/export/export_screen.dart',
              '!premiumService.isPremium &&',
              '!premiumService.isFeatureAvailable(PremiumFeature.endCardEdit) &&',
          )

          replace(
              'lib/services/premium_service.dart',
              'int get maxProjectDurationSeconds => isPremium ? 999999 : 90;',
              'int get maxProjectDurationSeconds =>\n      isFeatureAvailable(PremiumFeature.unlimitedDuration) ? 999999 : 90;',
          )

          replace(
              'lib/screens/timeline/timeline_screen.dart',
              'final isPremium = context.watch<PremiumService>().isPremium;',
              'final canUseWatermark = context\n        .watch<PremiumService>()\n        .isFeatureAvailable(PremiumFeature.watermark);',
          )
          replace(
              'lib/screens/timeline/timeline_screen.dart',
              '_buildWatermarkButton(isPremium),',
              '_buildWatermarkButton(canUseWatermark),',
          )
          replace(
              'lib/screens/timeline/timeline_screen.dart',
              'Widget _buildWatermarkButton(bool isPremium) {\n    final l10n = AppLocalizations.of(context)!;\n    if (isPremium) {',
              'Widget _buildWatermarkButton(bool canUseWatermark) {\n    final l10n = AppLocalizations.of(context)!;\n    if (canUseWatermark) {',
          )
          replace(
              'lib/screens/timeline/timeline_screen.dart',
              'final isPremium = context.read<PremiumService>().isPremium;\n    final ps = context.read<ProjectService>();\n    final maxSeconds = isPremium ? 7200 : 90;',
              'final hasUnlimitedDuration = context\n        .read<PremiumService>()\n        .isFeatureAvailable(PremiumFeature.unlimitedDuration);\n    final ps = context.read<ProjectService>();\n    final maxSeconds = hasUnlimitedDuration ? 7200 : 90;',
          )
          replace(
              'lib/screens/timeline/timeline_screen.dart',
              'isPremium\n              ? l10n.timelineDurationLimitBodyPremium',
              'hasUnlimitedDuration\n              ? l10n.timelineDurationLimitBodyPremium',
          )
          replace(
              'lib/screens/timeline/timeline_screen.dart',
              "final l10n = AppLocalizations.of(context)!;\n        final defaultHidden =\n            premium.isPremium && settings.endCardDefaultHiddenForPremium;",
              "final l10n = AppLocalizations.of(context)!;\n        final canEditEndCard = premium.isFeatureAvailable(\n          PremiumFeature.endCardEdit,\n        );\n        final defaultHidden =\n            canEditEndCard && settings.endCardDefaultHiddenForPremium;",
          )
          replace(
              'lib/screens/timeline/timeline_screen.dart',
              'onTap: premium.isPremium ? null : () => showPremiumBanner(context),',
              'onTap: canEditEndCard ? null : () => showPremiumBanner(context),',
          )
          replace(
              'lib/screens/timeline/timeline_screen.dart',
              'if (!premium.isPremium)\n                  Icon(',
              'if (!canEditEndCard)\n                  Icon(',
          )
          PY
          dart format lib/services/premium_service.dart lib/screens/settings/settings_screen.dart lib/screens/export/export_screen.dart lib/screens/timeline/timeline_screen.dart

      - name: Assert all six PremiumFeature gates are live
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/step4-premium
          : > build/step4-premium/inventory.txt
          for feature in endCardEdit watermark toneCurve levelAdjustment unlimitedDuration customAutomation; do
            echo "## PremiumFeature.${feature}" | tee -a build/step4-premium/inventory.txt
            grep -RIn --include='*.dart' "PremiumFeature\.${feature}" lib \
              | grep -v 'enum PremiumFeature' \
              | tee -a build/step4-premium/inventory.txt \
              | grep -q .
          done
          grep -RIn --include='*.dart' -E "(push|go)\('/premium'\)|showPremiumBanner\(" lib \
            | tee -a build/step4-premium/inventory.txt \
            | grep -q .

      - name: Add persistent Step 4 contract and UI proof
        shell: bash
        run: |
          cat > test/premium_all_entry_points_test.dart <<'DART'
          import 'dart:io';
          import 'dart:ui' as ui;

          import 'package:flutter/material.dart';
          import 'package:flutter/rendering.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:go_router/go_router.dart';
          import 'package:niarim/l10n/app_localizations.dart';
          import 'package:niarim/screens/home/widgets/home_drawer.dart';
          import 'package:niarim/screens/settings/settings_screen.dart';
          import 'package:niarim/services/premium_service.dart';
          import 'package:niarim/widgets/premium_lock_widget.dart';
          import 'package:provider/provider.dart';

          class _FreePremiumService extends PremiumService {
            @override
            bool get isPremium => false;

            @override
            bool get isLaunchCampaignActive => false;

            @override
            bool isFeatureAvailable(PremiumFeature feature) => false;
          }

          Future<void> _capture(GlobalKey key, String name) async {
            final boundary =
                key.currentContext!.findRenderObject()! as RenderRepaintBoundary;
            final image = await boundary.toImage(pixelRatio: 1.0);
            final data = await image.toByteData(format: ui.ImageByteFormat.png);
            image.dispose();
            final dir = Directory(
              Platform.environment['STEP4_EVIDENCE_DIR'] ??
                  'build/step4-premium/png',
            );
            await dir.create(recursive: true);
            await File('${dir.path}/$name.png').writeAsBytes(
              data!.buffer.asUint8List(),
            );
          }

          Widget _routerApp(GoRouter router, GlobalKey boundaryKey) =>
              RepaintBoundary(
                key: boundaryKey,
                child: MaterialApp.router(
                  routerConfig: router,
                  locale: const Locale('en'),
                  localizationsDelegates: AppLocalizations.localizationsDelegates,
                  supportedLocales: AppLocalizations.supportedLocales,
                ),
              );

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            test('every PremiumFeature remains independently addressable', () {
              expect(PremiumFeature.values.toSet(), {
                PremiumFeature.endCardEdit,
                PremiumFeature.watermark,
                PremiumFeature.toneCurve,
                PremiumFeature.levelAdjustment,
                PremiumFeature.unlimitedDuration,
                PremiumFeature.customAutomation,
              });
            });

            testWidgets(
              'shared Premium lock blocks feature, opens upsell, and reaches /premium',
              (tester) async {
                final boundaryKey = GlobalKey();
                final premium = _FreePremiumService();
                addTearDown(premium.dispose);
                final router = GoRouter(
                  initialLocation: '/',
                  routes: [
                    GoRoute(
                      path: '/',
                      builder: (context, state) =>
                          ChangeNotifierProvider<PremiumService>.value(
                            value: premium,
                            child: Scaffold(
                              body: Center(
                                child: PremiumLockWidget(
                                  feature: PremiumFeature.toneCurve,
                                  child: FilledButton(
                                    onPressed: () => fail(
                                      'locked child action must not execute',
                                    ),
                                    child: const Text('LOCKED ACTION'),
                                  ),
                                ),
                              ),
                            ),
                          ),
                    ),
                    GoRoute(
                      path: '/premium',
                      builder: (context, state) => const Scaffold(
                        body: Text('PREMIUM DESTINATION'),
                      ),
                    ),
                  ],
                );
                addTearDown(router.dispose);

                await tester.pumpWidget(_routerApp(router, boundaryKey));
                await tester.pump();
                expect(find.byIcon(Icons.lock), findsOneWidget);
                await tester.tap(find.text('LOCKED ACTION'));
                await tester.pumpAndSettle();
                expect(find.byType(Dialog), findsOneWidget);
                await _capture(boundaryKey, 'shared-lock-upsell');

                final register = find.descendant(
                  of: find.byType(Dialog),
                  matching: find.byType(FilledButton),
                );
                expect(register, findsOneWidget);
                await tester.tap(register);
                await tester.pumpAndSettle();
                expect(find.text('PREMIUM DESTINATION'), findsOneWidget);
                expect(tester.takeException(), isNull);
              },
            );

            testWidgets('Home drawer Premium entry reaches /premium directly', (
              tester,
            ) async {
              final boundaryKey = GlobalKey();
              final router = GoRouter(
                initialLocation: '/',
                routes: [
                  GoRoute(
                    path: '/',
                    builder: (context, state) => Scaffold(
                      appBar: AppBar(),
                      drawer: const HomeDrawer(),
                      body: const SizedBox.expand(),
                    ),
                  ),
                  GoRoute(
                    path: '/premium',
                    builder: (context, state) => const Scaffold(
                      body: Text('PREMIUM DESTINATION'),
                    ),
                  ),
                ],
              );
              addTearDown(router.dispose);

              await tester.pumpWidget(_routerApp(router, boundaryKey));
              await tester.pumpAndSettle();
              await tester.tap(find.byTooltip('Open navigation menu'));
              await tester.pumpAndSettle();
              expect(find.byIcon(Icons.workspace_premium_outlined), findsOneWidget);
              await _capture(boundaryKey, 'home-drawer-premium-entry');
              await tester.tap(find.byIcon(Icons.workspace_premium_outlined));
              await tester.pumpAndSettle();
              expect(find.text('PREMIUM DESTINATION'), findsOneWidget);
              expect(tester.takeException(), isNull);
            });

            testWidgets(
              'Settings watermark entry stays locked for a free user and opens upsell',
              (tester) async {
                final boundaryKey = GlobalKey();
                final premium = _FreePremiumService();
                addTearDown(premium.dispose);
                final router = GoRouter(
                  initialLocation: '/',
                  routes: [
                    GoRoute(
                      path: '/',
                      builder: (context, state) =>
                          ChangeNotifierProvider<PremiumService>.value(
                            value: premium,
                            child: const SettingsScreen(),
                          ),
                    ),
                    GoRoute(
                      path: '/premium',
                      builder: (context, state) => const Scaffold(
                        body: Text('PREMIUM DESTINATION'),
                      ),
                    ),
                    GoRoute(
                      path: '/settings/watermark',
                      builder: (context, state) => const Scaffold(
                        body: Text('WATERMARK SETTINGS'),
                      ),
                    ),
                  ],
                );
                addTearDown(router.dispose);

                await tester.pumpWidget(_routerApp(router, boundaryKey));
                await tester.pumpAndSettle();
                expect(find.byIcon(Icons.lock_outline), findsOneWidget);
                await tester.tap(find.byIcon(Icons.lock_outline));
                await tester.pumpAndSettle();
                expect(find.byType(Dialog), findsOneWidget);
                expect(find.text('WATERMARK SETTINGS'), findsNothing);
                await _capture(boundaryKey, 'settings-watermark-upsell');
                expect(tester.takeException(), isNull);
              },
            );
          }
          DART
          dart format test/premium_all_entry_points_test.dart

      - name: Analyze Step 4 changes
        run: flutter analyze test/premium_all_entry_points_test.dart lib/services/premium_service.dart lib/widgets/premium_lock_widget.dart lib/screens/home/widgets/home_drawer.dart lib/screens/settings/settings_screen.dart lib/screens/export/export_screen.dart lib/screens/timeline/timeline_screen.dart lib/screens/canvas/widgets/filter_panel.dart --no-fatal-warnings --no-fatal-infos

      - name: Run existing Premium regressions
        run: flutter test test/premium_lock_widget_test.dart test/premium_comparison_table_test.dart --reporter expanded

      - name: Run fresh Step 4 Premium UI proof
        env:
          STEP4_EVIDENCE_DIR: build/step4-premium/png
        run: flutter test test/premium_all_entry_points_test.dart --reporter expanded | tee build/step4-premium/widget-proof.txt

      - name: Verify PNG evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s build/step4-premium/png/shared-lock-upsell.png
          test -s build/step4-premium/png/home-drawer-premium-entry.png
          test -s build/step4-premium/png/settings-watermark-upsell.png
          file build/step4-premium/png/*.png | tee build/step4-premium/png-files.txt

      - name: Upload Step 4 Premium evidence
        uses: actions/upload-artifact@v4
        with:
          name: step4-premium-all-entry-points-evidence
          path: build/step4-premium
          if-no-files-found: error
          retention-days: 14

      - name: Persist verified Step 4 changes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/premium_service.dart \
            lib/screens/settings/settings_screen.dart \
            lib/screens/export/export_screen.dart \
            lib/screens/timeline/timeline_screen.dart \
            test/premium_all_entry_points_test.dart
          git rm .github/workflows/one-shot-step4-premium-all-entry-points.yml
          git commit -m "fix: unify Premium feature gates"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
