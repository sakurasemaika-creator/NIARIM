name: One-shot Custom Automation Checkpoint

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-custom-automation-checkpoint.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Reuse current completion transformation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/one-shot-custom-automation-completion.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          ns = {'__name__': '__main__'}
          exec(compile(body, '<completion-transform>', 'exec'), ns, ns)
          PY

      - name: Inject proof checkpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('test/custom_automation_production_visual_test.dart')
          s = p.read_text()
          checkpoints = [
            (
              "      await harness.createAndShowProject('record-replay');\n",
              "      await harness.createAndShowProject('record-replay');\n      debugPrint('PROOF checkpoint 01 project-ready');\n",
            ),
            (
              "      harness.showManager();\n      await tester.pump(const Duration(milliseconds: 300));\n",
              "      debugPrint('PROOF checkpoint 02 before-manager');\n      harness.showManager();\n      debugPrint('PROOF checkpoint 03 manager-set');\n      await tester.pump(const Duration(milliseconds: 300));\n      debugPrint('PROOF checkpoint 04 manager-pumped');\n",
            ),
            (
              "      await tester.tap(find.text(l10n.customAutomationAdd));\n      await tester.pump(const Duration(milliseconds: 200));\n",
              "      debugPrint('PROOF checkpoint 05 before-add');\n      await tester.tap(find.text(l10n.customAutomationAdd));\n      await tester.pump(const Duration(milliseconds: 200));\n      debugPrint('PROOF checkpoint 06 add-dialog-pumped');\n",
            ),
            (
              "      await tester.tap(find.text(l10n.customAutomationStartRecording));\n      await tester.pump(const Duration(milliseconds: 300));\n",
              "      await tester.tap(find.text(l10n.customAutomationStartRecording));\n      await tester.pump(const Duration(milliseconds: 300));\n      debugPrint('PROOF checkpoint 07 recording-started');\n",
            ),
            (
              "      harness.showFilterPanel();\n      await tester.pump(const Duration(milliseconds: 300));\n",
              "      debugPrint('PROOF checkpoint 08 before-filter-panel');\n      harness.showFilterPanel();\n      await tester.pump(const Duration(milliseconds: 300));\n      debugPrint('PROOF checkpoint 09 filter-panel-pumped');\n",
            ),
            (
              "      await tester.tap(find.text(l10n.filterApplyButton));\n      await harness.waitForPixelChange(\n",
              "      debugPrint('PROOF checkpoint 10 before-filter-apply');\n      await tester.tap(find.text(l10n.filterApplyButton));\n      debugPrint('PROOF checkpoint 11 filter-apply-tapped');\n      await harness.waitForPixelChange(\n",
            ),
            (
              "      final afterApply = harness.activeLayerPixels();\n",
              "      debugPrint('PROOF checkpoint 12 filter-pixels-changed');\n      final afterApply = harness.activeLayerPixels();\n",
            ),
            (
              "      harness.showRecordingStop();\n      await tester.pump(const Duration(milliseconds: 200));\n",
              "      debugPrint('PROOF checkpoint 13 before-stop-ui');\n      harness.showRecordingStop();\n      await tester.pump(const Duration(milliseconds: 200));\n      debugPrint('PROOF checkpoint 14 stop-ui-pumped');\n",
            ),
            (
              "      harness.showDraftEditor();\n      await tester.pump(const Duration(milliseconds: 250));\n",
              "      debugPrint('PROOF checkpoint 15 before-editor');\n      harness.showDraftEditor();\n      await tester.pump(const Duration(milliseconds: 250));\n      debugPrint('PROOF checkpoint 16 editor-pumped');\n",
            ),
            (
              "      await tester.tap(find.text(l10n.commonSave).last);\n      await tester.pump(const Duration(milliseconds: 350));\n",
              "      debugPrint('PROOF checkpoint 17 before-save');\n      await tester.tap(find.text(l10n.commonSave).last);\n      await tester.pump(const Duration(milliseconds: 350));\n      debugPrint('PROOF checkpoint 18 saved');\n",
            ),
            (
              "      harness.showManager();\n      await tester.pump(const Duration(milliseconds: 250));\n",
              "      debugPrint('PROOF checkpoint 19 before-replay-manager');\n      harness.showManager();\n      await tester.pump(const Duration(milliseconds: 250));\n      debugPrint('PROOF checkpoint 20 replay-manager-pumped');\n",
            ),
            (
              "      await tester.tap(find.text('visual-audit-automation'));\n      await tester.pump(const Duration(milliseconds: 200));\n",
              "      await tester.tap(find.text('visual-audit-automation'));\n      await tester.pump(const Duration(milliseconds: 200));\n      debugPrint('PROOF checkpoint 21 replay-confirmation-pumped');\n",
            ),
            (
              "      await tester.tap(find.text(l10n.customAutomationYes));\n      await harness.waitForPixelChange(\n",
              "      debugPrint('PROOF checkpoint 22 before-replay-confirm');\n      await tester.tap(find.text(l10n.customAutomationYes));\n      debugPrint('PROOF checkpoint 23 replay-confirmed');\n      await harness.waitForPixelChange(\n",
            ),
            (
              "      final afterReplay = harness.activeLayerPixels();\n",
              "      debugPrint('PROOF checkpoint 24 replay-pixels-changed');\n      final afterReplay = harness.activeLayerPixels();\n",
            ),
          ]
          for old, new in checkpoints:
            if old not in s:
              raise SystemExit('checkpoint anchor changed:\n' + old)
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - run: dart format test/custom_automation_production_visual_test.dart
      - run: flutter analyze test/custom_automation_production_visual_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Run checkpointed production proof
        run: flutter test test/custom_automation_production_visual_test.dart --plain-name 'real Custom Automation widgets record -> apply -> stop -> edit -> save -> replay with PNG evidence' --reporter expanded
