name: One-shot Step4 Premium All Entry Points V2

on:
  push:
    branches:
      - dev_branch
    paths:
      - ".github/workflows/one-shot-step4-premium-all-entry-points-v2.yml"

permissions:
  contents: write

jobs:
  premium-all-entry-points-bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Apply PremiumFeature gate normalization and bounded UI proof
        run: |
          python3 tool/step4_premium_all_entry_points.py
          dart format lib/services/premium_service.dart \
            lib/screens/settings/settings_screen.dart \
            lib/screens/export/export_screen.dart \
            lib/screens/timeline/timeline_screen.dart \
            test/premium_all_entry_points_test.dart

      - name: Assert all six PremiumFeature gates are live
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/step4-premium
          : > build/step4-premium/inventory.txt
          for feature in endCardEdit watermark toneCurve levelAdjustment unlimitedDuration customAutomation; do
            echo "## PremiumFeature.${feature}" | tee -a build/step4-premium/inventory.txt
            grep -RIn --include='*.dart' "PremiumFeature\.${feature}" lib \
              | grep -v 'enum PremiumFeature' \
              | tee -a build/step4-premium/inventory.txt \
              | grep -q .
          done
          grep -RIn --include='*.dart' -E "(push|go)\('/premium'\)|showPremiumBanner\(" lib \
            | tee -a build/step4-premium/inventory.txt \
            | grep -q .

      - name: Analyze Step 4 changes
        run: flutter analyze test/premium_all_entry_points_test.dart lib/services/premium_service.dart lib/widgets/premium_lock_widget.dart lib/screens/home/widgets/home_drawer.dart lib/screens/settings/settings_screen.dart lib/screens/export/export_screen.dart lib/screens/timeline/timeline_screen.dart lib/screens/canvas/widgets/filter_panel.dart --no-fatal-warnings --no-fatal-infos

      - name: Run existing Premium regressions
        run: flutter test test/premium_lock_widget_test.dart test/premium_comparison_table_test.dart --reporter expanded

      - name: Run bounded fresh Step 4 Premium UI proof
        env:
          STEP4_EVIDENCE_DIR: build/step4-premium/png
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s flutter test test/premium_all_entry_points_test.dart --reporter expanded \
            | tee build/step4-premium/widget-proof.txt

      - name: Verify PNG evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s build/step4-premium/png/shared-lock-upsell.png
          test -s build/step4-premium/png/home-drawer-premium-entry.png
          test -s build/step4-premium/png/settings-watermark-upsell.png
          file build/step4-premium/png/*.png | tee build/step4-premium/png-files.txt

      - name: Upload Step 4 Premium evidence
        uses: actions/upload-artifact@v4
        with:
          name: step4-premium-all-entry-points-evidence
          path: build/step4-premium
          if-no-files-found: error
          retention-days: 14

      - name: Persist verified Step 4 changes and cleanup proof helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/premium_service.dart \
            lib/screens/settings/settings_screen.dart \
            lib/screens/export/export_screen.dart \
            lib/screens/timeline/timeline_screen.dart \
            test/premium_all_entry_points_test.dart
          git rm -f .github/workflows/one-shot-step4-premium-all-entry-points.yml \
            .github/workflows/one-shot-step4-premium-all-entry-points-v2.yml \
            tool/step4_premium_all_entry_points.py
          git commit -m "fix: unify Premium feature gates"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch

# PNG capture runs inside tester.runAsync to avoid fake-async raster stalls.
