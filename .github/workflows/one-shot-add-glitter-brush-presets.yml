name: One-shot Add Glitter Brush Presets

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-add-glitter-brush-presets.yml'
      - '.github/scripts/add_glitter_brush_presets.py'
      - 'test/services/glitter_brush_presets_test.dart'
  workflow_dispatch:

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply presets
        run: python3 .github/scripts/add_glitter_brush_presets.py
      - name: Format changed files
        run: dart format lib/services/brush_service.dart test/services/glitter_brush_presets_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze lib/services/brush_service.dart test/services/glitter_brush_presets_test.dart
      - name: Run glitter preset tests
        run: flutter test test/services/glitter_brush_presets_test.dart
      - name: Verify preset contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('lib/services/brush_service.dart').read_text(encoding='utf-8')
          for token in ["id: 'Brush0016'", "name: 'グリッターペン'", "id: 'Brush0017'", "name: 'ラメペン'"]:
              assert token in s, token
          assert s.count("name: 'グリッターペン'") == 1
          assert s.count("name: 'ラメペン'") == 1
          # Existing-user migration already appends missing bundled defaults by ID.
          assert 'final missing = _defaultBrushes().where' in s
          assert '_brushes.addAll(missing);' in s
          PY
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/brush_service.dart test/services/glitter_brush_presets_test.dart
          git commit -m 'feat: add glitter and lame brush presets'
          git push
