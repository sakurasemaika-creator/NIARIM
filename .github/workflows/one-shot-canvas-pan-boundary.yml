name: One-shot Canvas Pan Boundary Fix

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-canvas-pan-boundary.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply bounded canvas pan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/canvas/widgets/canvas_area.dart')
          s = path.read_text(encoding='utf-8')

          marker = """double boundedCanvasScaleFactor(double currentScale, double requestedFactor) {\n  if (currentScale <= 0 ||\n      !currentScale.isFinite ||\n      !requestedFactor.isFinite) {\n    return 1.0;\n  }\n  final target = (currentScale * requestedFactor).clamp(\n    kCanvasMinScale,\n    kCanvasMaxScale,\n  );\n  return target / currentScale;\n}\n"""
          addition = marker + """\n/// キャンバスの表示変換を背景（＝CanvasAreaの表示領域）内へ拘束する。\n///\n/// 回転後の[drawingRect]の外接矩形を使い、縮小時はキャンバス全体が背景内から\n/// はみ出さないようにする。拡大時は逆に、片側へ動かしすぎて反対側から背景の\n/// 外へ抜けられないようにする。これにより背景の端より先へドラッグできない。\nMatrix4 constrainCanvasViewTransform(\n  Size viewportSize,\n  Rect drawingRect,\n  Matrix4 candidate,\n) {\n  if (viewportSize.width <= 0 || viewportSize.height <= 0) return candidate;\n  final viewport = Offset.zero & viewportSize;\n  final bounds = MatrixUtils.transformRect(candidate, drawingRect);\n\n  double correction(double min, double max, double viewMin, double viewMax) {\n    final extent = max - min;\n    final viewExtent = viewMax - viewMin;\n    if (extent <= viewExtent) {\n      if (min < viewMin) return viewMin - min;\n      if (max > viewMax) return viewMax - max;\n      return 0;\n    }\n    if (min > viewMin) return viewMin - min;\n    if (max < viewMax) return viewMax - max;\n    return 0;\n  }\n\n  final dx = correction(bounds.left, bounds.right, viewport.left, viewport.right);\n  final dy = correction(bounds.top, bounds.bottom, viewport.top, viewport.bottom);\n  if (dx == 0 && dy == 0) return candidate;\n  return (Matrix4.identity()..translateByDouble(dx, dy, 0, 1)) * candidate;\n}\n"""
          assert marker in s, 'scale helper marker not found'
          s = s.replace(marker, addition, 1)

          # Insert state helper before pointer signal handler.
          marker2 = """  /// マウスホイールでのズーム（Galaxy DeXモード・マウス入力）。\n  /// カーソル位置を中心に拡大縮小する。\n  void _handlePointerSignal(PointerSignalEvent event) {"""
          replacement2 = """  Matrix4 _constrainViewMatrix(Matrix4 candidate) {\n    final size = context.size;\n    if (size == null) return candidate;\n    final drawingRect = canvasDrawingRectFor(size, widget.project);\n    return constrainCanvasViewTransform(size, drawingRect, candidate);\n  }\n\n  /// マウスホイールでのズーム（Galaxy DeXモード・マウス入力）。\n  /// カーソル位置を中心に拡大縮小する。\n  void _handlePointerSignal(PointerSignalEvent event) {"""
          assert marker2 in s, 'pointer signal marker not found'
          s = s.replace(marker2, replacement2, 1)

          s = s.replace(
              "_transformController.value = zoomMatrix * _transformController.value;",
              "_transformController.value = _constrainViewMatrix(\n      zoomMatrix * _transformController.value,\n    );",
              1,
          )
          s = s.replace(
              "_transformController.value = transform * _transformController.value;",
              "_transformController.value = _constrainViewMatrix(\n      transform * _transformController.value,\n    );",
              1,
          )

          old_pan = """        _transformController.value =\n            (Matrix4.identity()..translateByDouble(delta.dx, delta.dy, 0, 1)) *\n            _transformController.value;"""
          new_pan = """        final candidate =\n            (Matrix4.identity()..translateByDouble(delta.dx, delta.dy, 0, 1)) *\n            _transformController.value;\n        _transformController.value = _constrainViewMatrix(candidate);"""
          count = s.count(old_pan)
          assert count >= 2, f'expected at least 2 pan assignments, got {count}'
          s = s.replace(old_pan, new_pan, 2)

          path.write_text(s, encoding='utf-8')
          PY

          cat > test/canvas_pan_boundary_test.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:niarim/screens/canvas/widgets/canvas_area.dart';

          Rect transformed(Rect rect, Matrix4 matrix) =>
              MatrixUtils.transformRect(matrix, rect);

          void main() {
            const viewport = Size(1000, 700);
            const drawing = Rect.fromLTWH(100, 100, 800, 500);

            group('キャンバス背景端のパン制限', () {
              test('縮小キャンバスは背景の右端より先へドラッグできない', () {
                final candidate = Matrix4.identity()
                  ..scaleByDouble(0.5, 0.5, 1, 1)
                  ..translateByDouble(2000, 0, 0, 1);
                final fixed = constrainCanvasViewTransform(
                  viewport,
                  drawing,
                  candidate,
                );
                final b = transformed(drawing, fixed);
                expect(b.right, lessThanOrEqualTo(viewport.width + 1e-6));
                expect(b.left, greaterThanOrEqualTo(-1e-6));
              });

              test('縮小キャンバスは背景の左上端より先へドラッグできない', () {
                final candidate = Matrix4.identity()
                  ..scaleByDouble(0.2, 0.2, 1, 1)
                  ..translateByDouble(-5000, -5000, 0, 1);
                final fixed = constrainCanvasViewTransform(
                  viewport,
                  drawing,
                  candidate,
                );
                final b = transformed(drawing, fixed);
                expect(b.left, greaterThanOrEqualTo(-1e-6));
                expect(b.top, greaterThanOrEqualTo(-1e-6));
              });

              test('回転＋最小倍率でも外接矩形は背景からはみ出さない', () {
                final candidate = Matrix4.identity()
                  ..translateByDouble(900, 600, 0, 1)
                  ..rotateZ(0.7)
                  ..scaleByDouble(kCanvasMinScale, kCanvasMinScale, 1, 1);
                final fixed = constrainCanvasViewTransform(
                  viewport,
                  drawing,
                  candidate,
                );
                final b = transformed(drawing, fixed);
                expect(b.left, greaterThanOrEqualTo(-1e-6));
                expect(b.top, greaterThanOrEqualTo(-1e-6));
                expect(b.right, lessThanOrEqualTo(viewport.width + 1e-6));
                expect(b.bottom, lessThanOrEqualTo(viewport.height + 1e-6));
              });

              test('拡大キャンバスは反対側の端まで抜けられない', () {
                final candidate = Matrix4.identity()
                  ..scaleByDouble(2, 2, 1, 1)
                  ..translateByDouble(2000, 1500, 0, 1);
                final fixed = constrainCanvasViewTransform(
                  viewport,
                  drawing,
                  candidate,
                );
                final b = transformed(drawing, fixed);
                expect(b.left, lessThanOrEqualTo(1e-6));
                expect(b.right, greaterThanOrEqualTo(viewport.width - 1e-6));
                expect(b.top, lessThanOrEqualTo(1e-6));
                expect(b.bottom, greaterThanOrEqualTo(viewport.height - 1e-6));
              });
            });
          }
          DART

          dart format lib/screens/canvas/widgets/canvas_area.dart test/canvas_pan_boundary_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Targeted regression tests
        run: |
          flutter test test/canvas_pan_boundary_test.dart --reporter expanded
          flutter test test/canvas_viewport_transform_test.dart --reporter expanded
          flutter test test/canvas_drawing_rect_test.dart --reporter expanded
      - name: Commit fix to dev_branch
        run: |
          git config user.name "NIARIM Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/canvas/widgets/canvas_area.dart test/canvas_pan_boundary_test.dart
          git diff --cached --check
          git commit -m "fix: constrain canvas pan to background bounds"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
