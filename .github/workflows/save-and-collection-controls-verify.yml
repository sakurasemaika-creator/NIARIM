name: Save snapshot and collection action controls verification

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/save-and-collection-controls-verify.yml'
      - '.github/scripts/build_save_ui_capture_pdf.py'
      - 'lib/services/save_tree_service.dart'
      - 'lib/screens/save_tree/**'
      - 'lib/screens/home/home_screen.dart'
      - 'lib/screens/home/widgets/project_list_widget.dart'
      - 'lib/widgets/collection_action_controls.dart'
      - 'test/save_slot_visual_audit_test.dart'
      - 'test/save_thumbnail_accuracy_test.dart'
      - 'test/project_grid_actions_test.dart'
      - 'test/save_slot_action_buttons_test.dart'
      - 'test/save_slot_action_success_visual_test.dart'
      - 'test/shared_collection_controls_capture_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Static analysis
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
            lib/services/save_tree_service.dart \
            lib/screens/save_tree \
            lib/screens/home/home_screen.dart \
            lib/screens/home/widgets/project_list_widget.dart \
            lib/widgets/collection_action_controls.dart
      - name: Save and collection UI regressions
        run: |
          flutter test --no-pub --reporter expanded \
            test/save_slot_action_buttons_test.dart \
            test/save_slot_visual_audit_test.dart \
            test/save_thumbnail_accuracy_test.dart \
            test/project_grid_actions_test.dart \
            test/save_slot_action_success_visual_test.dart \
            test/shared_collection_controls_capture_test.dart
      - name: Prepare Python PDF generator
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle all actual Flutter save captures into a PDF
        if: always()
        run: |
          python -m pip install --quiet reportlab Pillow
          python .github/scripts/build_save_ui_capture_pdf.py \
            --output build/save-slot-visual-audit/NIARIM_save_UI_captures.pdf
      - name: Upload actual Flutter screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save-project-ui-captures
          path: build/save-slot-visual-audit/*.png
          if-no-files-found: warn
          retention-days: 7
