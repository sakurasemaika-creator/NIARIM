name: Apply Popup Close Source Repair

on:
  push:
    branches:
      - fix/popup-close-frame-mode-20260914
    paths:
      - '.github/workflows/popup-close-source-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/popup-close-frame-mode-20260914
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Apply bounded source repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/popup-close-frame-mode-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          exec(textwrap.dedent(workflow[start:end]), {'__name__': '__main__'})
          PY
      - name: Format changed Dart files
        run: dart format lib/screens/canvas/widgets test/panel_close_bar_position_test.dart
      - name: Verify focused regression
        run: flutter test --no-pub --reporter expanded test/panel_close_bar_position_test.dart
      - name: Verify bounded analyzer scope
        run: flutter analyze --no-pub lib/screens/canvas/widgets
      - name: Commit source repair
        shell: bash
        run: |
          git config user.name 'NIARIM UI Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/screens/canvas/widgets test/panel_close_bar_position_test.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: move tool popup close affordances to bottom'
          git push origin HEAD:fix/popup-close-frame-mode-20260914
