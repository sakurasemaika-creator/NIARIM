name: TMP Source Offset Serializer

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-source-offset-serializer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Patch serializer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/engine/niapro_serializer.dart')
          s = p.read_text()
          old = "            'fadeOut': a.fadeOut,\n            'trackRow': a.trackRow,"
          new = "            'fadeOut': a.fadeOut,\n            'sourceStartFrame': a.sourceStartFrame,\n            'trackRow': a.trackRow,"
          assert old in s and "'sourceStartFrame': a.sourceStartFrame" not in s
          s = s.replace(old, new, 1)
          old = "          fadeOut: (m['fadeOut'] as num?)?.toDouble() ?? 0.0,\n          trackRow: m['trackRow'] as int? ?? 0,"
          new = "          fadeOut: (m['fadeOut'] as num?)?.toDouble() ?? 0.0,\n          sourceStartFrame: m['sourceStartFrame'] as int? ?? 0,\n          trackRow: m['trackRow'] as int? ?? 0,"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: dart format lib/engine/niapro_serializer.dart test/audio_source_offset_serializer_regression_test.dart
      - run: flutter test test/audio_source_offset_serializer_regression_test.dart
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/engine/niapro_serializer.dart test/audio_source_offset_serializer_regression_test.dart
          git commit -m 'fix: persist audio source offsets'
          git push origin HEAD:dev_branch
