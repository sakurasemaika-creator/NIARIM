name: TMP Automation Executor Fix
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-automation-executor-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch Canvas automation executor
        env:
          OLD_BLOCK: 
          NEW_BLOCK: 
        run: python3 -c "import os,base64,pathlib; p=pathlib.Path('lib/screens/canvas/canvas_screen.dart'); s=p.read_text(); d=lambda k:base64.b64decode(os.environ[k]).decode(); assert d('OLD_BLOCK') in s; p.write_text(s.replace(d('OLD_BLOCK'),d('NEW_BLOCK'),1))"
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/canvas/canvas_screen.dart
          git commit -m 'fix: execute final automation recipes correctly'
          git push origin HEAD:dev_branch
