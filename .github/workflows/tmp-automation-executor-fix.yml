name: TMP Automation Executor Fix
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-automation-executor-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch Canvas automation executor
        env:
          OLD_IMPORT: aW1wb3J0ICcuLi8uLi9lbmdpbmUvdGV4dF9yZW5kZXIuZGFydCc7Cg==
          NEW_IMPORT: aW1wb3J0ICcuLi8uLi9lbmdpbmUvdGV4dF9yZW5kZXIuZGFydCc7CmltcG9ydCAnLi4vLi4vZW5naW5lL3RpbGVfbWFuYWdlci5kYXJ0JyBzaG93IGZyYW1lTGF5ZXJLZXk7Cg==
          OLD_CALL: ICAgICAgICBhd2FpdCBSZWNvcmRlZEZpbHRlckFwcGx5U2VydmljZS5hcHBseSgK
          NEW_CALL: ICAgICAgICBmaW5hbCBnZW5lcmF0ZWRMYXllcklkID0gYXdhaXQgUmVjb3JkZWRGaWx0ZXJBcHBseVNlcnZpY2UuYXBwbHkoCg==
          OLD_TAIL: ICAgICAgICApOwogICAgICAgIHJldHVybjsKICAgICAgY2FzZSAnY2FudmFzLmZyYW1lLnNldCc6Cg==
          NEW_TAIL: 
        run: python3 -c "import os,base64,pathlib; p=pathlib.Path('lib/screens/canvas/canvas_screen.dart'); s=p.read_text(); d=lambda k:base64.b64decode(os.environ[k]).decode(); assert s.count(d('OLD_CALL'))==1; assert s.count(d('OLD_TAIL'))==1; s=s.replace(d('OLD_IMPORT'),d('NEW_IMPORT'),1) if 'tile_manager.dart' not in s else s; s=s.replace(d('OLD_CALL'),d('NEW_CALL'),1).replace(d('OLD_TAIL'),d('NEW_TAIL'),1); p.write_text(s)"
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/canvas/canvas_screen.dart
          git commit -m 'fix: execute final automation recipes correctly'
          git push origin HEAD:dev_branch
