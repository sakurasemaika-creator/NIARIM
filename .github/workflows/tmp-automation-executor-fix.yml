name: TMP Automation Executor Fix
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-automation-executor-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch Canvas automation executor
        env:
          OLD_IMPORT: aW1wb3J0ICcuLi8uLi9lbmdpbmUvdGV4dF9yZW5kZXIuZGFydCc7Cg==
          NEW_IMPORT: aW1wb3J0ICcuLi8uLi9lbmdpbmUvdGV4dF9yZW5kZXIuZGFydCc7CmltcG9ydCAnLi4vLi4vZW5naW5lL3RpbGVfbWFuYWdlci5kYXJ0JyBzaG93IGZyYW1lTGF5ZXJLZXk7Cg==
          OLD_BLOCK: 
          NEW_BLOCK: 
        run: python3 -c "import os,base64,pathlib; p=pathlib.Path('lib/screens/canvas/canvas_screen.dart'); s=p.read_text(); oi=base64.b64decode(os.environ['OLD_IMPORT']).decode(); ni=base64.b64decode(os.environ['NEW_IMPORT']).decode(); ob=base64.b64decode(os.environ['OLD_BLOCK']).decode(); nb=base64.b64decode(os.environ['NEW_BLOCK']).decode(); assert ob in s; s=s.replace(oi,ni,1) if 'tile_manager.dart' not in s else s; s=s.replace(ob,nb,1); p.write_text(s)"
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/canvas/canvas_screen.dart
          git commit -m 'fix: execute final automation recipes correctly'
          git push origin HEAD:dev_branch
