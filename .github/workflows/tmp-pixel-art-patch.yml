name: Temporary Pixel Art Patch
on:
  push:
    branches: [dev_branch]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
      - name: Patch applyPixelate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/engine/filter_engine.dart')
          s = p.read_text()
          old = '''  /// モザイク化（[mosaicSize]）＋配色処理（[colorMode]）を組み合わせた
  /// ドット絵化。配色の実際の処理は[quantizeColors]（モザイク化と分離した
  /// 純粋な減色関数。ブラシのピクセルモードのストローク確定直後の色スナップ
  /// でも共用する）に委譲する。
  Uint8List applyPixelate(
    Uint8List data,
    int width,
    int height, {
    int mosaicSize = 8,
    PixelColorMode colorMode = PixelColorMode.count,
    int colorLevels = 6,
    List<int> paletteColors = const [],
  }) {
    final mosaic = applyMosaic(data, width, height, mosaicSize);
    return quantizeColors(
      mosaic,
      colorMode: colorMode,
      colorLevels: colorLevels,
      paletteColors: paletteColors,
    );
  }
'''
          new = '''  /// ドット絵化：セルごとに代表RGBを求めて色面をフラット化するが、
  /// alphaは各キャンバス画素の元値をそのまま保持する。従来のように
  /// applyMosaicを先に通すと透明境界まで平均されて半透明の四角いにじみが
  /// 生じるため、モザイクとは明確に分離する。
  Uint8List applyPixelate(
    Uint8List data,
    int width,
    int height, {
    int mosaicSize = 8,
    PixelColorMode colorMode = PixelColorMode.count,
    int colorLevels = 6,
    List<int> paletteColors = const [],
  }) {
    final size = mosaicSize.clamp(1, 64);
    final result = Uint8List.fromList(data);
    for (int y = 0; y < height; y += size) {
      for (int x = 0; x < width; x += size) {
        int weightedR = 0, weightedG = 0, weightedB = 0, alphaWeight = 0;
        for (int dy = 0; dy < size && y + dy < height; dy++) {
          for (int dx = 0; dx < size && x + dx < width; dx++) {
            final i = ((y + dy) * width + (x + dx)) * 4;
            final a = data[i + 3];
            if (a == 0) continue;
            weightedR += data[i] * a;
            weightedG += data[i + 1] * a;
            weightedB += data[i + 2] * a;
            alphaWeight += a;
          }
        }
        if (alphaWeight == 0) continue;
        final cell = Uint8List(4)
          ..[0] = (weightedR / alphaWeight).round().clamp(0, 255)
          ..[1] = (weightedG / alphaWeight).round().clamp(0, 255)
          ..[2] = (weightedB / alphaWeight).round().clamp(0, 255)
          ..[3] = 255;
        final quantized = quantizeColors(
          cell,
          colorMode: colorMode,
          colorLevels: colorLevels,
          paletteColors: paletteColors,
        );
        for (int dy = 0; dy < size && y + dy < height; dy++) {
          for (int dx = 0; dx < size && x + dx < width; dx++) {
            final i = ((y + dy) * width + (x + dx)) * 4;
            if (data[i + 3] == 0) continue;
            result[i] = quantized[0];
            result[i + 1] = quantized[1];
            result[i + 2] = quantized[2];
            // result[i + 3] intentionally remains the source alpha.
          }
        }
      }
    }
    return result;
  }
'''
          if old not in s:
              raise SystemExit('expected applyPixelate block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/engine/filter_engine.dart
          git commit -m 'fix: separate true pixel art from mosaic'
          git push origin HEAD:dev_branch
