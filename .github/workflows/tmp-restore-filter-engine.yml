name: Temporary Restore Filter Engine
on:
  push:
    branches: [dev_branch]
permissions:
  contents: write
jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - run: |
          git checkout d78ac4caa34594c9687ffcf73f1bd1f95daa27b4 -- lib/engine/filter_engine.dart
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/engine/filter_engine.dart
          git commit -m 'fix: restore filter engine'
          git push origin HEAD:dev_branch
