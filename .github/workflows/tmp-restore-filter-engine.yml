name: Temporary Pixel Art Patch Green
on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
      - name: Patch true pixel art
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/engine/filter_engine.dart')
          s=p.read_text()
          old='''    final mosaic = applyMosaic(data, width, height, mosaicSize);\n    return quantizeColors(\n      mosaic,\n      colorMode: colorMode,\n      colorLevels: colorLevels,\n      paletteColors: paletteColors,\n    );'''
          new='''    final size = mosaicSize.clamp(1, 64);\n    final result = Uint8List.fromList(data);\n    for (int y = 0; y < height; y += size) {\n      for (int x = 0; x < width; x += size) {\n        int weightedR = 0, weightedG = 0, weightedB = 0, alphaWeight = 0;\n        for (int dy = 0; dy < size && y + dy < height; dy++) {\n          for (int dx = 0; dx < size && x + dx < width; dx++) {\n            final i = ((y + dy) * width + (x + dx)) * 4;\n            final a = data[i + 3];\n            if (a == 0) continue;\n            weightedR += data[i] * a;\n            weightedG += data[i + 1] * a;\n            weightedB += data[i + 2] * a;\n            alphaWeight += a;\n          }\n        }\n        if (alphaWeight == 0) continue;\n        final cell = Uint8List.fromList([\n          (weightedR / alphaWeight).round().clamp(0, 255),\n          (weightedG / alphaWeight).round().clamp(0, 255),\n          (weightedB / alphaWeight).round().clamp(0, 255),\n          255,\n        ]);\n        final quantized = quantizeColors(\n          cell,\n          colorMode: colorMode,\n          colorLevels: colorLevels,\n          paletteColors: paletteColors,\n        );\n        for (int dy = 0; dy < size && y + dy < height; dy++) {\n          for (int dx = 0; dx < size && x + dx < width; dx++) {\n            final i = ((y + dy) * width + (x + dx)) * 4;\n            if (data[i + 3] == 0) continue;\n            result[i] = quantized[0];\n            result[i + 1] = quantized[1];\n            result[i + 2] = quantized[2];\n          }\n        }\n      }\n    }\n    return result;'''
          if old not in s: raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/engine/pixel_art_filter_engine_test.dart --reporter expanded
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/engine/filter_engine.dart
          git commit -m 'fix: separate true pixel art from mosaic'
          git push origin HEAD:dev_branch
