name: Custom Automation Production Visual Proof

on:
  push:
    branches: [dev_branch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Align stale visual proof with current built-in presets
        env:
          REPLACEMENT_B64: 
        run: python3 -c "import base64,os,pathlib; p=pathlib.Path('test/custom_automation_production_surface_visual_test.dart'); s=p.read_text(); old=\"  testWidgets(\\n    'Aurora line extraction line creation and Prism produce actual PNG output',\"; replacement=base64.b64decode(os.environ['REPLACEMENT_B64']).decode(); p.write_text(s if old not in s else s[:s.index(old)]+replacement+s[s.index('\\n}\\n\\nclass _SurfaceHarness',s.index(old)):])"
      - run: dart format test/custom_automation_production_surface_visual_test.dart
      - name: Analyze production visual proof
        run: flutter analyze test/custom_automation_production_surface_visual_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Run complete production visual proof
        run: flutter test test/custom_automation_production_surface_visual_test.dart --reporter expanded
      - name: Persist verified visual proof
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/custom_automation_production_surface_visual_test.dart
          git diff --cached --quiet && exit 0
          git commit -m 'test: align automation visual proof with production presets'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
      - name: Upload production visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-production-visual-evidence
          path: build/visual-reaudit/custom-automation-production
          if-no-files-found: warn
          retention-days: 7
