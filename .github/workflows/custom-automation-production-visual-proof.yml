name: Custom Automation Production Visual Proof

on:
  workflow_dispatch:
  push:
    branches:
      - dev_branch
    paths:
      - "lib/features/custom_automation/**"
      - "lib/features/editor/**"
      - "test/custom_automation_production_surface_visual_test.dart"
      - ".github/workflows/custom-automation-production-visual-proof.yml"

permissions:
  contents: read

concurrency:
  group: custom-automation-production-visual-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Format proof surface
        run: dart format --output=none --set-exit-if-changed test/custom_automation_production_surface_visual_test.dart

      - name: Analyze proof surface
        run: flutter analyze test/custom_automation_production_surface_visual_test.dart

      - name: Run production custom automation visual proof
        run: xvfb-run -a flutter test test/custom_automation_production_surface_visual_test.dart -r expanded

      - name: Upload production visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-production-visual-proof-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/custom_automation_visual_proof/**
            build/custom_automation_visual_proof_log.jsonl
