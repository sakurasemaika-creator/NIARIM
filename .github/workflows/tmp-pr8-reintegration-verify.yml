name: TMP PR8 Reintegration Verify
on:
  push:
    branches: [work/pr8-reintegration-20260915]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib/utils/timeline_clip_split.dart lib/models/audio_clip.dart lib/engine/audio_waveform_service.dart test/timeline_clip_split_test.dart
      - run: flutter test test/timeline_clip_split_test.dart --reporter expanded
      - run: flutter analyze --no-fatal-infos lib/utils/timeline_clip_split.dart lib/models/audio_clip.dart lib/engine/audio_waveform_service.dart
