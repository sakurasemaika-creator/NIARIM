name: One-shot Fix Known Scope Analyzer Residuals

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-fix-known-scope-analyzer-residuals.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
      - run: python3 .github/scripts/fix_known_scope_analyzer_residuals.py
      - name: Commit targeted repairs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib test
          if git diff --cached --quiet; then
            echo 'No residual changes needed.'
            exit 0
          fi
          git commit -m 'fix: clear known-scope analyzer residuals'
          git push origin HEAD:dev_branch
