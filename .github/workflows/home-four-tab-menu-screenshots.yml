name: Home four-tab menu screenshots

on:
  push:
    branches: [dev_branch]
    paths:
      - 'test/home_four_tab_menu_capture_test.dart'
      - '.github/workflows/home-four-tab-menu-screenshots.yml'
      # Only home four-tab UI and its data/actions should auto-trigger this 16-screen capture.
      - 'lib/screens/home/home_screen.dart'
      - 'lib/screens/home/widgets/project_list_widget.dart'
      - 'lib/screens/home/widgets/exported_work_card.dart'
      - 'lib/services/project_service.dart'
      - 'lib/services/work_folder_service.dart'
      - 'lib/services/local_file_trash_service.dart'
  workflow_dispatch:

# Keep only the newest capture during rapid UI iterations.
concurrency:
  group: home-four-tab-captures-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify and capture all four production tabs
        run: flutter test --no-pub --reporter expanded test/home_four_tab_menu_capture_test.dart
      - name: Verify all 16 captured PNGs and identical dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          names = [
              '01_projects', '02_projects_menu', '03_works', '04_works_menu',
              '05_shared', '06_shared_menu', '07_trash',
              '08_trash_restore_confirmation', '09_projects_selected',
              '10_works_selected', '11_shared_selected', '12_trash_selected',
              '13_projects_folder_selected', '14_works_folder_selected',
              '15_shared_folder_selected', '16_trash_folder_selected',
          ]
          folder = Path('build/home-four-tab-captures')
          actual = sorted(folder.glob('*.png'))
          expected = {folder / (name + '.png') for name in names}
          assert set(actual) == expected, (
              f'Expected exactly 16 PNGs: missing={sorted(map(str, expected - set(actual)))}, '
              f'unexpected={sorted(map(str, set(actual) - expected))}'
          )
          sizes = set()
          for path in actual:
              with path.open('rb') as stream:
                  header = stream.read(24)
              assert header[:8] == bytes.fromhex('89504e470d0a1a0a'), f'Invalid PNG: {path}'
              dimensions = unpack('>II', header[16:24])
              assert all(n > 0 for n in dimensions), f'Invalid dimensions: {path}'
              sizes.add(dimensions)
              print(f'{path.name}: {dimensions[0]}x{dimensions[1]}')
          assert len(sizes) == 1, f'Capture dimensions disagree: {sizes}'
          print('Validated all 16 real Flutter captures with identical dimensions.')
          PY
      - name: Preserve real Flutter screenshots even when a later step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-four-tab-menu-actual-flutter-screenshots
          path: build/home-four-tab-captures/*.png
          if-no-files-found: warn
          retention-days: 14
