name: Aurora and Automation Proof V2

on:
  push:
    branches:
      - audit/aurora-automation-proof
    paths:
      - 'test/aurora_hologram_visual_proof_test.dart'
      - 'test/custom_automation_ui_visual_proof_test.dart'
      - '.github/workflows/aurora-automation-proof-v2.yml'

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Analyze proof tests
        run: |
          flutter analyze \
            test/aurora_hologram_visual_proof_test.dart \
            test/custom_automation_ui_visual_proof_test.dart \
            --no-fatal-warnings --no-fatal-infos
      - name: Run aurora proof
        run: flutter test test/aurora_hologram_visual_proof_test.dart --reporter expanded
      - name: Run custom automation UI proof
        run: flutter test test/custom_automation_ui_visual_proof_test.dart --reporter expanded
      - name: Upload aurora proof PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-hologram-proof
          path: build/aurora-hologram-proof
          if-no-files-found: warn
          retention-days: 7
      - name: Upload custom automation UI proof PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-ui-proof
          path: build/custom-automation-ui-proof
          if-no-files-found: warn
          retention-days: 7
