name: Requested UI All Captures
on:
  workflow_dispatch:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/requested-ui-all-captures.yml'
      - 'test/requested_ui_all_captures_test.dart'
      - 'lib/screens/canvas/**'
      - 'lib/screens/timeline/**'
      - 'lib/screens/home/widgets/project_list_widget.dart'
      - 'lib/screens/project/project_detail_screen.dart'
      - 'lib/screens/settings/**'
      - 'lib/services/settings_service.dart'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Produce verified real-Flutter UI captures from sample projects
        run: flutter test test/requested_ui_all_captures_test.dart --reporter expanded
      - name: Upload all requested screenshots and failure manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niarim-requested-ui-all-captures
          path: build/requested-ui-all-captures/*
          if-no-files-found: warn
          retention-days: 14
