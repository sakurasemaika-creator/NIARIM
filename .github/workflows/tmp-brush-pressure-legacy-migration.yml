name: TMP Brush Pressure Legacy Migration

on:
  push:
    branches:
      - feature/brush-pressure-profiles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brush-pressure-profiles
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Confirm RED then patch migration
        shell: bash
        run: |
          set +e
          flutter pub get
          flutter test test/models/brush_pressure_legacy_migration_test.dart --reporter expanded
          red_status=$?
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo 'Expected legacy migration test to fail before implementation.' >&2
            exit 1
          fi
      - name: Implement legacy migration
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/models/brush.dart')
          s = p.read_text()
          old = """    pressureOn: BrushPressureOnSettings.fromJson(\n      j['pressureOn'] as Map<String, dynamic>,\n    ),\n    pressureOff: BrushPressureOffSettings.fromJson(\n      j['pressureOff'] as Map<String, dynamic>,\n    ),"""
          new = """    pressureOn: j['pressureOn'] is Map\n        ? BrushPressureOnSettings.fromJson(\n            (j['pressureOn'] as Map).cast<String, dynamic>(),\n          )\n        : _legacyPressureOn(j),\n    pressureOff: j['pressureOff'] is Map\n        ? BrushPressureOffSettings.fromJson(\n            (j['pressureOff'] as Map).cast<String, dynamic>(),\n          )\n        : _legacyPressureOff(j),"""
          if s.count(old) != 1:
              raise SystemExit(f'fromJson profile marker count={s.count(old)}')
          s = s.replace(old, new, 1)
          marker = """    tags: parseTags(j['tags']),\n  );\n}"""
          helpers = r"""    tags: parseTags(j['tags']),
  );

  static BrushPressureOnSettings _legacyPressureOn(Map<String, dynamic> j) {
    final mode = PressureMode.values.firstWhere(
      (e) => e.name == j['pressureMode'],
      orElse: () => PressureMode.off,
    );
    final strength = (j['pressureStrength'] as int? ?? 100).clamp(0, 100);
    final weak = 100 - strength;
    final blur = (j['blurRadius'] as int? ?? 0).clamp(0, 100);
    final edgeEnabled = j['edgeJitter'] as bool? ?? false;
    final edgeStrength = (j['edgeJitterStrength'] as int? ?? 50).clamp(0, 100);
    final mixingMode = BrushMixingMode.values.firstWhere(
      (e) => e.name == j['mixingMode'],
      orElse: () => BrushMixingMode.off,
    );
    final mixingRate = (j['mixingRate'] as int? ?? 0).clamp(0, 100);
    return BrushPressureOnSettings(
      size: PressureRangeSetting(
        enabled: mode == PressureMode.size || mode == PressureMode.sizeAndOpacity,
        weak: weak,
        strong: 100,
      ),
      opacity: PressureRangeSetting(
        enabled: mode == PressureMode.opacity || mode == PressureMode.sizeAndOpacity,
        weak: weak,
        strong: 100,
      ),
      blur: PressureRangeSetting(
        enabled: blur > 0,
        weak: blur,
        strong: blur,
      ),
      edgeJitter: PressureRangeSetting(
        enabled: edgeEnabled,
        weak: edgeStrength,
        strong: edgeStrength,
      ),
      mixing: PressureMixingOnSetting(
        enabled: mixingMode != BrushMixingMode.off,
        mode: mixingMode == BrushMixingMode.off ? BrushMixingMode.simple : mixingMode,
        weakRate: mixingRate,
        strongRate: mixingRate,
      ),
    );
  }

  static BrushPressureOffSettings _legacyPressureOff(Map<String, dynamic> j) {
    final blur = (j['blurRadius'] as int? ?? 0).clamp(0, 100);
    final edgeEnabled = j['edgeJitter'] as bool? ?? false;
    final edgeStrength = (j['edgeJitterStrength'] as int? ?? 50).clamp(0, 100);
    final mixingMode = BrushMixingMode.values.firstWhere(
      (e) => e.name == j['mixingMode'],
      orElse: () => BrushMixingMode.off,
    );
    final mixingRate = (j['mixingRate'] as int? ?? 0).clamp(0, 100);
    return BrushPressureOffSettings(
      blur: FixedBrushSetting(enabled: blur > 0, value: blur),
      edgeJitter: FixedBrushSetting(enabled: edgeEnabled, value: edgeStrength),
      mixing: PressureMixingOffSetting(
        enabled: mixingMode != BrushMixingMode.off,
        mode: mixingMode == BrushMixingMode.off ? BrushMixingMode.simple : mixingMode,
        rate: mixingRate,
      ),
    );
  }
}"""
          if s.count(marker) != 1:
              raise SystemExit(f'class end marker count={s.count(marker)}')
          p.write_text(s.replace(marker, helpers, 1))
      - run: dart format lib/models/brush.dart test/models/brush_pressure_legacy_migration_test.dart
      - run: flutter analyze --no-fatal-infos lib/models/brush.dart test/models/brush_pressure_legacy_migration_test.dart
      - run: flutter test test/models/brush_pressure_legacy_migration_test.dart test/models/brush_pressure_profiles_test.dart test/services/brush_pressure_profile_lifecycle_test.dart --reporter expanded
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/models/brush.dart test/models/brush_pressure_legacy_migration_test.dart
          git diff --cached --check
          git commit -m "fix: migrate legacy brush pressure settings"
          git push origin HEAD:feature/brush-pressure-profiles
