name: TMP Auto Lineart Smoothing 0-10

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-auto-lineart-smoothing-0-10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply 0-10 smoothing specification
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # Engine: levels 0..9 remove 0..90% of INTERIOR controls; level 10
          # is special and leaves exactly the two path endpoints.
          p = Path('lib/engine/auto_lineart_engine.dart')
          s = p.read_text()
          start = s.index('  /// Converts an analyzed topology graph into the temporary editable control')
          end = s.index('  /// Moves one preview control point.', start)
          new_method = '''  /// Converts an analyzed topology graph into the temporary editable control
          /// polygon used by the preview. [smoothingLevel] is discrete (0..10).
          /// Levels 1..9 remove roughly 10%..90% of each path's interior controls;
          /// level 10 is intentionally special and leaves only the two endpoints,
          /// making every path a straight segment. Junction/end anchors remain exact.
          static AutoLineartGraph prepareEditableGraph(
            AutoLineartGraph source, {
            required int smoothingLevel,
          }) {
            final level = smoothingLevel.clamp(0, 10);
            if (level == 0 || source.paths.isEmpty) return source;

            final paths = <AutoLineartPath>[];
            for (final path in source.paths) {
              final original = path.points;
              if (original.length <= 2) {
                paths.add(path);
                continue;
              }

              // Level 10 means exactly two controls per path: start + end.
              if (level == 10) {
                paths.add(
                  AutoLineartPath(
                    points: [original.first, original.last],
                    startIsJunction: path.startIsJunction,
                    endIsJunction: path.endIsJunction,
                    persistence: path.persistence,
                  ),
                );
                continue;
              }

              var work = List<AutoLineartPoint>.from(original);
              final passes = math.max(1, level);
              final amount = 0.12 + level * 0.025;
              for (var pass = 0; pass < passes; pass++) {
                final next = List<AutoLineartPoint>.from(work);
                for (var i = 1; i < work.length - 1; i++) {
                  final prev = work[i - 1];
                  final cur = work[i];
                  final after = work[i + 1];
                  next[i] = AutoLineartPoint(
                    cur.x + (((prev.x + after.x) * 0.5) - cur.x) * amount,
                    cur.y + (((prev.y + after.y) * 0.5) - cur.y) * amount,
                  );
                }
                next[0] = original.first;
                next[next.length - 1] = original.last;
                work = next;
              }

              // Endpoints are not part of the percentage calculation. This makes
              // the UI literal: level N removes about N*10% of INTERIOR controls.
              final interiorCount = original.length - 2;
              final keepInterior =
                  (interiorCount * (1.0 - level / 10.0)).round().clamp(
                    0,
                    interiorCount,
                  );
              final keepCount = keepInterior + 2;
              final reduced = <AutoLineartPoint>[work.first];
              for (var i = 1; i <= keepInterior; i++) {
                final index = (i * (work.length - 1) / (keepInterior + 1)).round();
                final point = work[index.clamp(1, work.length - 2)];
                if (reduced.last.x != point.x || reduced.last.y != point.y) {
                  reduced.add(point);
                }
              }
              reduced.add(work.last);

              // Rounding/duplicate removal can only reduce the requested count;
              // endpoints always survive and level 10 is handled above explicitly.
              assert(reduced.length <= keepCount);
              paths.add(
                AutoLineartPath(
                  points: reduced,
                  startIsJunction: path.startIsJunction,
                  endIsJunction: path.endIsJunction,
                  persistence: path.persistence,
                ),
              );
            }

            return AutoLineartGraph(
              width: source.width,
              height: source.height,
              paths: paths,
              analysisWidth: source.analysisWidth,
              analysisHeight: source.analysisHeight,
            );
          }

'''
          p.write_text(s[:start] + new_method + s[end:])

          # UI/cache now speaks 0..10 directly.
          replace('lib/screens/canvas/widgets/filter_panel.dart',
                  'filter.autoLineartSmoothing.round().clamp(0, 100)',
                  'filter.autoLineartSmoothing.round().clamp(0, 10)')
          replace('lib/screens/canvas/widgets/filter_panel.dart',
                  'current.autoLineartSmoothing.round().clamp(0, 100),\n              0,\n              100,',
                  'current.autoLineartSmoothing.round().clamp(0, 10),\n              0,\n              10,')

          # Defaults use the new scale. A midpoint-ish default keeps the previous intent.
          replace('lib/models/filter_def.dart',
                  'this.autoLineartSmoothing = 50,',
                  'this.autoLineartSmoothing = 5,')
          replace('lib/services/filter_service.dart',
                  'autoLineartSmoothing: 45,',
                  'autoLineartSmoothing: 5,')

          # Migrate persisted 0..100 values once on load. Values >10 can only be
          # legacy values; new values are always 0..10.
          p = Path('lib/services/filter_service.dart')
          s = p.read_text()
          old = '''      _filters.addAll(\n        raw.map(\n          (s) => FilterDef.fromJson(jsonDecode(s) as Map<String, dynamic>),\n        ),\n      );'''
          new = '''      var migratedAutoLineartSmoothing = false;\n      _filters.addAll(\n        raw.map((s) {\n          var filter = FilterDef.fromJson(jsonDecode(s) as Map<String, dynamic>);\n          if (filter.kind == FilterKind.autoLineart &&\n              filter.autoLineartSmoothing > 10) {\n            filter = filter.copyWith(\n              autoLineartSmoothing:\n                  (filter.autoLineartSmoothing / 10).round().clamp(0, 10).toDouble(),\n            );\n            migratedAutoLineartSmoothing = true;\n          }\n          return filter;\n        }),\n      );'''
          if old not in s:
              raise SystemExit('filter service load anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('''      if (missing.isNotEmpty) {\n        _filters.addAll(missing);\n        await _persist();\n      }''', '''      if (missing.isNotEmpty) {\n        _filters.addAll(missing);\n      }\n      if (missing.isNotEmpty || migratedAutoLineartSmoothing) {\n        await _persist();\n      }''', 1)
          p.write_text(s)

          # Replace old reduction test and add exact per-path semantics.
          p = Path('test/auto_lineart_filter_test.dart')
          s = p.read_text()
          s = s.replace("test('100-level smoothing reduces editable control points', () {", "test('0-10 smoothing progressively reduces editable control points', () {")
          s = s.replace('''      final low = AutoLineartEngine.prepareEditableGraph(\n        base,\n        smoothingLevel: 10,\n      );\n      final high = AutoLineartEngine.prepareEditableGraph(\n        base,\n        smoothingLevel: 100,\n      );''', '''      final low = AutoLineartEngine.prepareEditableGraph(\n        base,\n        smoothingLevel: 1,\n      );\n      final high = AutoLineartEngine.prepareEditableGraph(\n        base,\n        smoothingLevel: 9,\n      );''', 1)
          insert = '''\n    test('level 10 leaves exactly two endpoints on every path', () {\n      final graph = AutoLineartGraph(\n        width: 100,\n        height: 100,\n        paths: const [\n          AutoLineartPath(\n            points: [\n              AutoLineartPoint(10, 10), AutoLineartPoint(20, 18),\n              AutoLineartPoint(35, 30), AutoLineartPoint(50, 50),\n            ],\n            startIsJunction: false, endIsJunction: true, persistence: 1,\n          ),\n          AutoLineartPath(\n            points: [\n              AutoLineartPoint(50, 50), AutoLineartPoint(65, 34),\n              AutoLineartPoint(80, 20), AutoLineartPoint(90, 10),\n            ],\n            startIsJunction: true, endIsJunction: false, persistence: 1,\n          ),\n        ],\n      );\n      final straight = AutoLineartEngine.prepareEditableGraph(\n        graph, smoothingLevel: 10,\n      );\n      expect(straight.paths, hasLength(2));\n      expect(straight.paths.every((path) => path.points.length == 2), isTrue);\n      expect(straight.paths[0].points.last.x, 50);\n      expect(straight.paths[0].points.last.y, 50);\n      expect(straight.paths[1].points.first.x, 50);\n      expect(straight.paths[1].points.first.y, 50);\n    });\n\n    test('levels 1-9 remove about 10%-90% of interior controls', () {\n      final points = List<AutoLineartPoint>.generate(12, (i) => AutoLineartPoint(i.toDouble(), (i % 3).toDouble()));\n      final graph = AutoLineartGraph(\n        width: 20, height: 20,\n        paths: [AutoLineartPath(points: points, startIsJunction: false, endIsJunction: false, persistence: 1)],\n      );\n      final level1 = AutoLineartEngine.prepareEditableGraph(graph, smoothingLevel: 1);\n      final level9 = AutoLineartEngine.prepareEditableGraph(graph, smoothingLevel: 9);\n      // 10 interior controls -> level 1 keeps 9 + endpoints; level 9 keeps 1 + endpoints.\n      expect(level1.paths.single.points.length, 11);\n      expect(level9.paths.single.points.length, 3);\n    });\n'''
          marker = "    test(\n      'dragging a shared junction keeps coincident branch endpoints joined',"
          if marker not in s:
              raise SystemExit('test insertion anchor not found')
          s = s.replace(marker, insert + '\n' + marker, 1)
          p.write_text(s)
      - name: Format
        run: dart format lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/filter_panel.dart lib/models/filter_def.dart lib/services/filter_service.dart test/auto_lineart_filter_test.dart
      - name: Analyze changed production files
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/filter_panel.dart lib/models/filter_def.dart lib/services/filter_service.dart
      - name: Test auto line art
        run: flutter test test/auto_lineart_filter_test.dart test/auto_lineart_control_overlay_test.dart
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/filter_panel.dart lib/models/filter_def.dart lib/services/filter_service.dart test/auto_lineart_filter_test.dart
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make auto lineart smoothing levels intuitive'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
