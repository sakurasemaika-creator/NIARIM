name: TMP Auto Lineart Smoothing 0-10

on:
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/tmp-auto-lineart-smoothing-0-10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-test-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply specification
        run: python3 scripts/tmp_auto_lineart_smoothing_0_10.py
      - name: Format
        run: dart format lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/filter_panel.dart lib/models/filter_def.dart lib/services/filter_service.dart test/auto_lineart_filter_test.dart
      - name: Analyze changed production files
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/filter_panel.dart lib/models/filter_def.dart lib/services/filter_service.dart
      - name: Test auto line art
        run: flutter test test/auto_lineart_filter_test.dart test/auto_lineart_control_overlay_test.dart
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/engine/auto_lineart_engine.dart lib/screens/canvas/widgets/filter_panel.dart lib/models/filter_def.dart lib/services/filter_service.dart test/auto_lineart_filter_test.dart
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make auto lineart smoothing levels intuitive'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
