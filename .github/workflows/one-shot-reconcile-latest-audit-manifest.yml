name: One-shot Reconcile Latest Audit Manifest

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-reconcile-latest-audit-manifest.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - name: Reconcile 18 latest-HEAD verified non-device items
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit-dashboard/feature-audit-manifest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          verified={
            'brush.opacity','brush.pressure.opacity','brush.pressure.size','brush.fade','brush.mix','brush.color_extension',
            'effect.blur','tone.all','stamp.all','filter.all','autofill','layer.opacity','layer.blendmodes','layer.mesh',
            'animation.onion','animation.camera','animation.keyframe','animation.fade'
          }
          found=set()
          note=('Latest HEAD final audit 2026-09-04: Functional Visual Audit #50 passed batches 1-26 plus strict_visual_evidence and final_remaining_strict; '
                'Gap Deep Diagnostics #3 passed batches 33-38; Current HEAD Unique Reaudit passed strict visual, route screenshots and regressions. '
                'Feature-specific latest-HEAD evidence therefore satisfies strict-v2 for this non-device item.')
          for item in data.get('features',[]):
            if item.get('id') in verified:
              if item.get('device_required'):
                raise SystemExit(f"Refusing to auto-close device item {item['id']}")
              item['visual']=True
              item['final_pass']=True
              item['evidence_note']=note
              found.add(item['id'])
          missing=verified-found
          if missing:
            raise SystemExit(f'Missing manifest IDs: {sorted(missing)}')
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('RECONCILED',len(found),sorted(found))
          remaining=[x['id'] for x in data.get('features',[]) if not x.get('final_pass',False)]
          print('REMAINING_FALSE',len(remaining),remaining)
          PY
      - name: Commit manifest reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-dashboard/feature-audit-manifest.json
          git commit -m 'audit: reconcile latest verified manifest evidence'
          git push origin HEAD:dev_branch
