name: One-shot timeline media fix v2

on:
  push:
    branches:
      - dev_branch
    paths:
      - .github/workflows/one-shot-timeline-media-fix-v2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev_branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev_branch
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Write regression contract test
        shell: bash
        run: |
          cat > test/timeline_media_contract_test.dart <<'DART'
          import 'dart:io';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('audio import accepts video containers as audio-only sources', () {
              final s = File('lib/screens/timeline/timeline_screen.dart').readAsStringSync();
              expect(s, contains('_ClipTrackType.audio => FileType.custom'));
              expect(s, contains("'mp4'"));
              expect(s, contains("'mov'"));
              expect(s, contains('allowedExtensions: allowedExtensions'));
            });

            test('timeline video is preview-only and muted', () {
              final s = File('lib/screens/timeline/timeline_screen.dart').readAsStringSync();
              final c = File('lib/engine/layer_compositor.dart').readAsStringSync();
              expect(s, contains('VideoPlayer(controller)'));
              expect(s, contains('await controller.setVolume(0.0);'));
              expect(c, isNot(contains('  LayerType.timelineVideo,\n')));
            });

            test('clip detail keeps play pause available during trim', () {
              final s = File('lib/screens/timeline/timeline_screen.dart').readAsStringSync();
              expect(s, contains('final ValueGetter<bool> isPlaying;'));
              expect(s, contains('final VoidCallback onTogglePlay;'));
              expect(s, contains('widget.onTogglePlay();'));
              expect(s, contains('_syncMediaPlayback();\n  }\n\n  void _maybeCenterCurrentFrame'));
            });
          }
          DART

      - name: Verify RED before production changes
        shell: bash
        run: |
          set +e
          flutter test test/timeline_media_contract_test.dart
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected regression test to fail before patch.'
            exit 1
          fi
          echo 'RED confirmed.'

      - name: Apply timeline media fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/screens/timeline/timeline_screen.dart')
          s = p.read_text()

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          one(
          """    final fileType = switch (trackType) {
                _ClipTrackType.audio => FileType.audio,
                _ClipTrackType.video => FileType.video,
                _ClipTrackType.image => FileType.image,
              };
              final result = await FilePicker.platform.pickFiles(type: fileType);
          """.replace('              ', '    ', 0),
          """    final allowedExtensions = trackType == _ClipTrackType.audio
                  ? const <String>[
                      'mp3', 'wav', 'm4a', 'aac', 'flac', 'ogg', 'opus', 'aiff', 'wma',
                      'mp4', 'm4v', 'mov', 'mkv', 'webm',
                    ]
                  : null;
              final fileType = switch (trackType) {
                _ClipTrackType.audio => FileType.custom,
                _ClipTrackType.video => FileType.video,
                _ClipTrackType.image => FileType.image,
              };
              final result = await FilePicker.platform.pickFiles(
                type: fileType,
                allowedExtensions: allowedExtensions,
              );
          """.replace('              ', '    ', 0),
          'audio picker')

          one(
          """  void _onCurrentFrameChanged() {
              if (!mounted) return;
              _maybeCenterCurrentFrame();
            }
          """.replace('            ', '  ', 0),
          """  void _onCurrentFrameChanged() {
              if (!mounted) return;
              _maybeCenterCurrentFrame();
              _syncMediaPlayback();
            }
          """.replace('            ', '  ', 0),
          'frame sync')

          # Playback timer no longer needs a second explicit media-sync call because
          # assigning _currentFrame notifies _onCurrentFrameChanged.
          one(
          """          _currentFrame = (_currentFrame + 1) % total;
                    _syncMediaPlayback();
          """.replace('                    ', '          ', 0),
          """          _currentFrame = (_currentFrame + 1) % total;
          """.replace('                    ', '          ', 0),
          'timer duplicate sync')

          one(
          """                  if (newClip != null && mounted) {
                            setState(() => clips.add(newClip));
                          }
          """.replace('                          ', '                  ', 0),
          """                  if (newClip != null && mounted) {
                            setState(() => clips.add(newClip));
                            _syncMediaPlayback();
                          }
          """.replace('                          ', '                  ', 0),
          'new clip sync')

          one(
          '    await controller.setVolume(clip.volume.clamp(0.0, 1.0));\n',
          '    await controller.setVolume(0.0);\n',
          'video mute')

          # Persist video track as silent metadata.
          s = s.replace('videoVolume: clip.volume.clamp(0.0, 1.0),', 'videoVolume: 0.0,')
          old_loaded = """          volume: layer.type == LayerType.timelineVideo
                      ? layer.videoVolume.clamp(0.0, 1.0)
                      : 1.0,
          """
          if old_loaded not in s:
              raise SystemExit('loaded video volume pattern missing')
          s = s.replace(old_loaded, '          volume: 1.0,\n', 1)

          one(
          """    setState(() {
              _audioClips
                ..clear()
                ..addAll(audio);
              _videoClips
                ..clear()
                ..addAll(video);
              _imageClips
                ..clear()
                ..addAll(image);
            });
          """.replace('            ', '    ', 0),
          """    setState(() {
              _audioClips
                ..clear()
                ..addAll(audio);
              _videoClips
                ..clear()
                ..addAll(video);
              _imageClips
                ..clear()
                ..addAll(image);
            });
            WidgetsBinding.instance.addPostFrameCallback((_) {
              if (mounted) _syncMediaPlayback();
            });
          """.replace('            ', '    ', 0),
          'load preview sync')

          marker = '  /// プレビュー本体（プレビュー画像＋全画面化ボタン）。PC/DeXモードでは\n'
          if s.count(marker) != 1:
              raise SystemExit('preview marker mismatch')
          helper = """  Widget _buildPreviewFrame(
              ProjectService ps,
              String sceneId,
              int frameIndex,
            ) {
              final base = _TimelinePreview(
                tileManager: ps.tileManagerOf(widget.projectId),
                layers: ps.layersOf(widget.projectId, sceneId, frameIndex),
                sceneId: sceneId,
                frameIndex: frameIndex,
                cameraKeyframes: ps.cameraKeyframesOf(widget.projectId, sceneId),
                effectFilters: ps.effectFiltersOf(widget.projectId, sceneId),
                layerHomes: ps.layerHomesOf(widget.projectId),
                groups: ps.layerGroupsOf(widget.projectId, sceneId),
              );
              final overlays = <Widget>[];
              for (final clip in _videoClips) {
                if (frameIndex < clip.startFrame ||
                    frameIndex >= clip.startFrame + clip.lengthFrames) {
                  continue;
                }
                final controller = _videoControllers[clip.id];
                if (controller == null || !controller.value.isInitialized) continue;
                overlays.add(
                  Positioned.fill(
                    child: IgnorePointer(
                      child: Opacity(
                        opacity: clip.videoOpacity.clamp(0.0, 1.0),
                        child: Center(
                          child: AspectRatio(
                            aspectRatio: controller.value.aspectRatio > 0
                                ? controller.value.aspectRatio
                                : 1.0,
                            child: VideoPlayer(controller),
                          ),
                        ),
                      ),
                    ),
                  ),
                );
              }
              if (overlays.isEmpty) return base;
              return Stack(fit: StackFit.expand, children: [base, ...overlays]);
            }

          """
          # Normalize helper indentation by dart format later.
          s = s.replace(marker, helper + marker, 1)

          old_preview = """                    builder: (context, frameIndex, _) => _TimelinePreview(
                      tileManager: ps.tileManagerOf(widget.projectId),
                      layers: ps.layersOf(
                        widget.projectId,
                        sceneId,
                        frameIndex,
                      ),
                      sceneId: sceneId,
                      frameIndex: frameIndex,
                      cameraKeyframes: ps.cameraKeyframesOf(
                        widget.projectId,
                        sceneId,
                      ),
                      effectFilters: ps.effectFiltersOf(
                        widget.projectId,
                        sceneId,
                      ),
                      layerHomes: ps.layerHomesOf(widget.projectId),
                      groups: ps.layerGroupsOf(widget.projectId, sceneId),
                    ),
          """
          one(old_preview,
              '                    builder: (context, frameIndex, _) =>\n                        _buildPreviewFrame(ps, sceneId, frameIndex),\n',
              'preview builder')

          one(
          """        onDuplicate: () => _duplicateClip(clip),
              onChanged: () => setState(() {}),
          """,
          """        onDuplicate: () => _duplicateClip(clip),
              onChanged: () => setState(() {}),
              isPlaying: () => _isPlaying,
              onTogglePlay: _togglePlay,
          """,
          'sheet callbacks')

          one(
          """  final VoidCallback onDuplicate;
            final VoidCallback onChanged;
            const _ClipDetailSheet({
              required this.clip,
              required this.totalFrames,
              required this.onDelete,
              required this.onDuplicate,
              required this.onChanged,
            });
          """.replace('            ', '  ', 0),
          """  final VoidCallback onDuplicate;
            final VoidCallback onChanged;
            final ValueGetter<bool> isPlaying;
            final VoidCallback onTogglePlay;
            const _ClipDetailSheet({
              required this.clip,
              required this.totalFrames,
              required this.onDelete,
              required this.onDuplicate,
              required this.onChanged,
              required this.isPlaying,
              required this.onTogglePlay,
            });
          """.replace('            ', '  ', 0),
          'sheet fields')

          one(
          """                IconButton(
                  icon: const Icon(Icons.copy),
          """,
          """                if (_c.trackType == _ClipTrackType.audio ||
                    _c.trackType == _ClipTrackType.video)
                  IconButton(
                    icon: Icon(
                      widget.isPlaying() ? Icons.pause : Icons.play_arrow,
                    ),
                    tooltip: widget.isPlaying()
                        ? l10n.commonPause
                        : l10n.commonPlay,
                    onPressed: () {
                      widget.onTogglePlay();
                      setState(() {});
                    },
                  ),
                IconButton(
                  icon: const Icon(Icons.copy),
          """,
          'sheet play button')

          # Video track has no volume control: its embedded audio is intentionally ignored.
          video_block = """                if (_c.trackType == _ClipTrackType.video) ...[
                  _row(
                    l10n.timelineClipVolumeLabel,
                    _c.volume,
                    0,
                    1,
                    100,
                    (v) {
                      _c.volume = v;
                      _notify();
                    },
                    '${(_c.volume * 100).round()}%',
                    step: 0.01,
                  ),
          """
          one(video_block,
              """                if (_c.trackType == _ClipTrackType.video) ...[
          """,
              'remove video volume UI')

          p.write_text(s)

          cp = Path('lib/engine/layer_compositor.dart')
          c = cp.read_text()
          token = '  LayerType.timelineVideo,\n'
          if c.count(token) != 1:
              raise SystemExit(f'compositor video token expected once, got {c.count(token)}')
          c = c.replace(token, '', 1)
          cp.write_text(c)
          PY

      - name: Format changed Dart files
        run: dart format lib/screens/timeline/timeline_screen.dart lib/engine/layer_compositor.dart test/timeline_media_contract_test.dart

      - name: Verify GREEN regression test
        run: flutter test test/timeline_media_contract_test.dart

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Diff sanity check
        run: git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-timeline-media-fix.yml
          rm -f .github/workflows/one-shot-timeline-media-fix-v2.yml
          git config user.name 'NIARIM automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: improve timeline media import and preview'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
