name: Aurora and Automation Proof

on:
  push:
    branches:
      - audit/aurora-automation-proof
    paths:
      - 'test/aurora_hologram_visual_proof_test.dart'
      - '.github/workflows/aurora-automation-proof.yml'
      - 'test/custom_automation_ui_visual_proof_test.dart'

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Analyze proof tests
        run: |
          flutter analyze test/aurora_hologram_visual_proof_test.dart --no-fatal-warnings --no-fatal-infos
      - name: Run aurora proof
        run: flutter test test/aurora_hologram_visual_proof_test.dart --reporter expanded
      - name: Upload aurora proof PNGs
        uses: actions/upload-artifact@v4
        with:
          name: aurora-hologram-proof
          path: build/aurora-hologram-proof
          if-no-files-found: error
          retention-days: 7
