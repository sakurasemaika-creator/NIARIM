name: TMP Custom Automation Format Verify

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/tmp-custom-automation-format-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format automation core
        run: dart format lib/models/custom_automation.dart lib/services/custom_automation_service.dart lib/engine/custom_automation_filter_runner.dart lib/engine/custom_automation_executor.dart lib/models/shortcut_binding.dart test/custom_automation_service_test.dart
      - name: Analyze automation core
        run: flutter analyze lib/models/custom_automation.dart lib/services/custom_automation_service.dart lib/engine/custom_automation_filter_runner.dart lib/engine/custom_automation_executor.dart lib/models/shortcut_binding.dart test/custom_automation_service_test.dart
      - name: Service/model tests
        run: flutter test test/custom_automation_service_test.dart --reporter expanded
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/models/custom_automation.dart lib/services/custom_automation_service.dart lib/engine/custom_automation_filter_runner.dart lib/engine/custom_automation_executor.dart lib/models/shortcut_binding.dart test/custom_automation_service_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format custom automation core'
          git reset --hard HEAD
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
