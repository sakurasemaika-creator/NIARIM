name: One-shot Close Blockers And Full Suite

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-close-blockers-and-full-suite.yml'

permissions:
  contents: write

jobs:
  close-blockers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply guarded verified audit corrections and ruler pipeline
        shell: python
        run: |
          from pathlib import Path

          # batch33: image codecs must run on real async.
          p=Path('test/functional_audit_batch33_test.dart')
          s=p.read_text(encoding='utf-8')
          for old,new in [
            ("await _save(r.after, 96, 80, '${out.path}/canvas_blur_real.png');", "await tester.runAsync(() => _save(r.after, 96, 80, '${out.path}/canvas_blur_real.png'));") ,
            ("await _save(r.after, 96, 80, '${out.path}/canvas_mosaic_real.png');", "await tester.runAsync(() => _save(r.after, 96, 80, '${out.path}/canvas_mosaic_real.png'));")]:
            if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='\n')

          # batch37: persistence/capture use real async; project already starts with fps*duration frames.
          p=Path('test/functional_audit_batch37_test.dart')
          s=p.read_text(encoding='utf-8')
          s=s.replace("    await ps.init();", "    await tester.runAsync(() => ps.init());",1)
          s=s.replace("    ps.addFrame(p.id, sceneId);\n    ps.addFrame(p.id, sceneId);\n    expect(ps.frameCount(p.id, sceneId), 3);", "    // createProject(fps:3,durationSeconds:1) already creates three frames.\n    expect(ps.frameCount(p.id, sceneId), 3);",1)
          s=s.replace("final off = await _capture(boundaryKey);", "final off = (await tester.runAsync(() => _capture(boundaryKey)))!;",1)
          s=s.replace("final on = await _capture(boundaryKey);", "final on = (await tester.runAsync(() => _capture(boundaryKey)))!;",1)
          s=s.replace("await File('${out.path}/onion_canvas_real.png').writeAsBytes(on.png);", "await tester.runAsync(() => File('${out.path}/onion_canvas_real.png').writeAsBytes(on.png));",1)
          p.write_text(s,encoding='utf-8',newline='\n')

          # DrawingEngine: optional final coordinate constraint after stabilization.
          p=Path('lib/engine/drawing_engine.dart')
          s=p.read_text(encoding='utf-8')
          if 'ui.Offset Function(ui.Offset)? pointConstraint;' not in s:
            anchor="  bool isEraser = false;\n\n  // 手ブレ補正用：直近の平滑化済み座標（ON/OFF・強度調整）\n"
            repl="  bool isEraser = false;\n\n  // 定規など、手ブレ補正より後に必ず満たすべき最終座標制約。\n  ui.Offset Function(ui.Offset)? pointConstraint;\n\n  // 手ブレ補正用：直近の平滑化済み座標（ON/OFF・強度調整）\n"
            if anchor not in s: raise SystemExit('drawing field anchor missing')
            s=s.replace(anchor,repl,1)
            start=s.index('  void beginStroke(StrokePoint point, String layerId) {')
            end=s.index('\n  void continueStroke(StrokePoint point, String layerId) {',start)
            begin="""  void beginStroke(StrokePoint point, String layerId) {
    _currentStroke.clear();
    _strokeCoverageByTile.clear();
    _smoothed = point;
    final effective = _applyPointConstraint(point);
    _activeLayerId = layerId;
    _distanceSinceLastBrushStamp = 0.0;
    _hasStampedCurrentStroke = false;
    _scatterRng = math.Random(0);
    _currentStroke.add(effective);

    final brush = currentBrush;
    final needsDirection = brush != null && (brush.rotation || brush.scatter > 0.0);
    if (!needsDirection) {
      _stampBrush(
        effective.x,
        effective.y,
        effective.pressure,
        effective.tiltX,
        effective.tiltY,
        layerId,
        strokeLengthOverride: 0.0,
      );
      _hasStampedCurrentStroke = true;
    }
  }
"""
            s=s[:start]+begin+s[end:]
            old="    final effective = _applyStabilization(point);\n    final from = _currentStroke.last;\n"
            if old not in s: raise SystemExit('continue stabilization anchor missing')
            s=s.replace(old,"    final effective = _applyPointConstraint(_applyStabilization(point));\n    final from = _currentStroke.last;\n",1)
            marker='  /// 手ブレ補正：入力座標を直近の平滑化済み座標へ指数移動平均で追従させる。\n'
            helper="""  StrokePoint _applyPointConstraint(StrokePoint point) {
    final constraint = pointConstraint;
    if (constraint == null) return point;
    final constrained = constraint(ui.Offset(point.x, point.y));
    return StrokePoint(
      x: constrained.dx,
      y: constrained.dy,
      pressure: point.pressure,
      tiltX: point.tiltX,
      tiltY: point.tiltY,
      inputType: point.inputType,
    );
  }

"""
            if marker not in s: raise SystemExit('stabilization marker missing')
            s=s.replace(marker,helper+marker,1)
          p.write_text(s,encoding='utf-8',newline='\n')

          # CanvasArea: raw input -> stabilization -> ruler constraint.
          p=Path('lib/screens/canvas/widgets/canvas_area.dart')
          s=p.read_text(encoding='utf-8')
          if '..pointConstraint = _rulerEngine.snapToRuler;' not in s:
            old="    _drawingEngine = DrawingEngine(tileManager: _tileManager);\n"
            if old not in s: raise SystemExit('canvas engine init anchor missing')
            s=s.replace(old,"    _drawingEngine = DrawingEngine(tileManager: _tileManager)\n      ..pointConstraint = _rulerEngine.snapToRuler;\n",1)
            old="    final snapped = _applyRulerSnap(_toCanvasPoint(_rawToStrokePoint(event)));\n    _beginTileUndo();\n    _drawingEngine.beginStroke(snapped, _tileKeyFor(_layerId));\n"
            if old not in s: raise SystemExit('canvas down anchor missing')
            s=s.replace(old,"    final point = _toCanvasPoint(_rawToStrokePoint(event));\n    _beginTileUndo();\n    _drawingEngine.beginStroke(point, _tileKeyFor(_layerId));\n",1)
            old="    final snapped = _applyRulerSnap(_toCanvasPoint(_rawToStrokePoint(event)));\n    _drawingEngine.continueStroke(snapped, _tileKeyFor(_layerId));\n"
            if old not in s: raise SystemExit('canvas move anchor missing')
            s=s.replace(old,"    final point = _toCanvasPoint(_rawToStrokePoint(event));\n    _drawingEngine.continueStroke(point, _tileKeyFor(_layerId));\n",1)
          p.write_text(s,encoding='utf-8',newline='\n')

          # batch36 must exercise production order rather than pre-snapping inputs.
          p=Path('test/functional_audit_batch36_test.dart')
          s=p.read_text(encoding='utf-8')
          old="""      final tm = TileManager(canvasWidth: w, canvasHeight: h);
      final draw = DrawingEngine(tileManager: tm)
        ..currentBrush = baseBrush
        ..currentColor = const ui.Color(0xFFDB3F2E);
      final re = RulerEngine()..setActiveRuler(c.ruler);
      re.beginStroke();
      final snapped = c.raw.map(re.snapToRuler).toList();
      draw.beginStroke(StrokePoint(x: snapped.first.dx, y: snapped.first.dy, pressure: 1), 'paint');
      for (final p in snapped.skip(1)) {
        draw.continueStroke(StrokePoint(x: p.dx, y: p.dy, pressure: 1), 'paint');
      }
"""
          if old in s:
            new="""      final tm = TileManager(canvasWidth: w, canvasHeight: h);
      final re = RulerEngine()..setActiveRuler(c.ruler);
      re.beginStroke();
      final draw = DrawingEngine(tileManager: tm)
        ..currentBrush = baseBrush
        ..currentColor = const ui.Color(0xFFDB3F2E)
        ..pointConstraint = re.snapToRuler;
      final first = c.raw.first;
      draw.beginStroke(StrokePoint(x: first.dx, y: first.dy, pressure: 1), 'paint');
      for (final p in c.raw.skip(1)) {
        draw.continueStroke(StrokePoint(x: p.dx, y: p.dy, pressure: 1), 'paint');
      }
"""
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='\n')

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - run: dart format lib/engine/drawing_engine.dart lib/screens/canvas/widgets/canvas_area.dart test/functional_audit_batch33_test.dart test/functional_audit_batch36_test.dart test/functional_audit_batch37_test.dart

      - name: Existing drawing regressions
        run: flutter test test/brush_rotation_density_scatter_test.dart test/custom_texture_loading_test.dart test/pixel_color_mode_test.dart --reporter expanded
      - name: Ruler engine regressions
        run: flutter test test/ruler_engine_test.dart --reporter expanded
      - name: Real CanvasArea line ruler
        run: flutter test test/functional_audit_batch32_test.dart --reporter expanded
      - name: All seven rulers after stabilization
        run: flutter test test/functional_audit_batch36_test.dart --reporter expanded
      - name: Blur and mosaic real CanvasArea
        run: flutter test test/functional_audit_batch33_test.dart --reporter expanded
      - name: Onion skin real CanvasArea
        run: flutter test test/functional_audit_batch37_test.dart --reporter expanded

      - name: Commit verified blocker fixes
        run: |
          git config user.name "sakurasemaika-creator"
          git config user.email "sakurasemaika@gmail.com"
          git add lib/engine/drawing_engine.dart lib/screens/canvas/widgets/canvas_area.dart test/functional_audit_batch33_test.dart test/functional_audit_batch36_test.dart test/functional_audit_batch37_test.dart
          git commit -m "fix: close ruler and async functional audit gaps" || true
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch

  full-suite:
    needs: close-blockers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Run every existing test
        run: flutter test --reporter expanded
