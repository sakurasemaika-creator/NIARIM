name: Project, canvas and plan usability
on:
  push:
    branches: [dev_branch]
    paths:
      - 'lib/screens/home/widgets/project_list_widget.dart'
      - 'lib/widgets/korean_words_text.dart'
      - 'test/korean_words_text_long_latin_test.dart'
      - 'lib/screens/premium/premium_screen.dart'
      - 'lib/widgets/empty_state_placeholder.dart'
      - 'lib/widgets/background_color_picker.dart'
      - 'lib/screens/project/new_project_screen.dart'
      - 'test/new_project_inputs_test.dart'
      - 'test/background_color_picker_test.dart'
      - 'lib/screens/canvas/widgets/canvas_icon_button.dart'
      - 'lib/screens/canvas/widgets/toolbar_widget.dart'
      - 'lib/widgets/collection_action_controls.dart'
      - 'test/project_grid_view_size_test.dart'
      - 'test/project_selection_clipboard_test.dart'
      - 'test/quick_tool_panel_landscape_fit_test.dart'
      - 'lib/screens/export/export_screen.dart'
      - 'lib/screens/export/widgets/export_complete_dialog.dart'
      - 'test/export_share_notice_test.dart'
      - 'lib/engine/export_filename.dart'
      - 'test/export_filename_test.dart'
      - 'test/app_web_reference_export_exact_test.dart'
      - 'lib/screens/help/help_screen.dart'
      - 'test/help_topic_search_text_test.dart'
      - 'lib/widgets/qr_import_dialog.dart'
      - 'lib/widgets/theme_rescue_button.dart'
      - 'lib/screens/rewards/reward_unlock_screen.dart'
      - 'test/l10n_locales_not_left_in_english_test.dart'
      - 'test/visual/project_and_plan_capture_test.dart'
      - 'lib/services/premium_service.dart'
      - 'test/premium_checkout_retry_test.dart'
      - 'test/premium_screen_price_test.dart'
      - '.github/workflows/project-and-plan-usability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: >
          flutter analyze --no-pub
          lib/screens/home/widgets/project_list_widget.dart lib/screens/premium/premium_screen.dart
          lib/widgets/empty_state_placeholder.dart lib/widgets/background_color_picker.dart
          lib/widgets/korean_words_text.dart
          lib/screens/help/help_screen.dart lib/screens/project/new_project_screen.dart lib/screens/export/export_screen.dart
          lib/screens/export/widgets/export_complete_dialog.dart lib/screens/canvas/widgets/canvas_icon_button.dart
          lib/screens/canvas/widgets/toolbar_widget.dart lib/widgets/collection_action_controls.dart
      - name: Verify choosing a format and opening export help from the timeline
        run: flutter test --no-pub --reporter expanded test/export_filename_test.dart test/export_share_notice_test.dart test/export_video_failure_cleanup_test.dart test/app_web_reference_export_exact_test.dart
      - run: >
          flutter test --no-pub --reporter expanded
          test/home_a003_visual_findings_test.dart test/home_small_fixes_test.dart
          test/home_filtered_empty_states_test.dart test/empty_state_placeholder_test.dart
          test/premium_screen_price_test.dart test/premium_comparison_table_test.dart test/premium_checkout_retry_test.dart
          test/new_project_inputs_test.dart test/background_color_picker_test.dart
          test/l10n_locales_not_left_in_english_test.dart test/help_topic_search_text_test.dart
      - name: Verify project selection, card hit targets and quick tool controls
        run: >
          flutter test --no-pub --reporter expanded
          test/project_grid_view_size_test.dart test/project_selection_clipboard_test.dart
          test/shared_empty_folder_widget_test.dart test/quick_tool_panel_landscape_fit_test.dart
      - name: Verify long Latin folder names at narrow widths and large text scales (DISC145)
        run: flutter test --no-pub --reporter expanded test/korean_words_text_long_latin_test.dart
      - name: Verify localized controls, dialog fonts and keyboard space
        run: >
          flutter test --no-pub --reporter expanded
          test/rewards_tabs_fit_test.dart test/theme_button_font_test.dart
          test/theme_rescue_dialog_chinese_font_test.dart test/typing_dialog_keyboard_room_test.dart
          test/canvas_pc_dock_labels_fit_test.dart test/transfer_copy_names_test.dart
          test/brush_management_test.dart test/shared_asset_card_language_test.dart
          test/niatra_transfer_saved_keys_test.dart test/niatra_transfer_keeps_this_device_test.dart
      - run: flutter test --no-pub --reporter expanded test/startup_unreadable_projects_folder_test.dart --name 'Home'
      - name: Capture Japanese project and plan screens on mobile and desktop
        run: flutter test --no-pub --dart-define=NIARIM_CAPTURE_PROJECT_AND_PLAN=true test/visual/project_and_plan_capture_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-and-plan-screens
          path: build/project-and-plan/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: export-settings-screen
          path: |
            build/visual-smoke/webref_exact_07_export.png
            build/visual-smoke/webref_export_complete.png
            build/visual-smoke/webref_project_export_search.png
          if-no-files-found: error
          retention-days: 14
