name: TMP Timeline Cut UI

on:
  push:
    branches:
      - feat/timeline-media-cut-waveform
    paths:
      - '.github/workflows/tmp-timeline-cut-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/timeline-media-cut-waveform
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Scope and harden clip cut patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('tool/tmp_patch_timeline_cut_ui.py')
          s = p.read_text()
          old = '''    "    required this.totalFrames,\\n    required this.onDelete,",
              "    required this.totalFrames,\\n"'''
          new = '''    "    required this.clip,\\n    required this.totalFrames,\\n    required this.onDelete,",
              "    required this.clip,\\n"
              "    required this.totalFrames,\\n"'''
          if old not in s:
              raise SystemExit('constructor patch pattern missing')
          s = s.replace(old, new, 1)
          old_service = '''    final project = _projectService.projects
                  .where((project) => project.id == widget.projectId)
                  .firstOrNull;'''
          new_service = '''    final project = context.read<ProjectService>().projects
                  .where((project) => project.id == widget.projectId)
                  .firstOrNull;'''
          if old_service not in s:
              raise SystemExit('project service patch pattern missing')
          s = s.replace(old_service, new_service, 1)
          p.write_text(s)
      - run: python tool/tmp_patch_timeline_cut_ui.py
      - run: flutter pub get
      - run: dart format lib/screens/timeline/timeline_screen.dart lib/utils/timeline_clip_split.dart test/timeline_clip_split_test.dart
      - run: flutter analyze --no-fatal-infos lib/screens/timeline/timeline_screen.dart lib/utils/timeline_clip_split.dart test/timeline_clip_split_test.dart
      - run: flutter test test/timeline_clip_split_test.dart --reporter expanded
      - run: flutter test test/audio_waveform_service_test.dart --reporter expanded
      - name: Commit cut UI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/timeline/timeline_screen.dart lib/utils/timeline_clip_split.dart test/timeline_clip_split_test.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: add fixed-cursor and range timeline cuts"
            git push origin HEAD:feat/timeline-media-cut-waveform
          fi
