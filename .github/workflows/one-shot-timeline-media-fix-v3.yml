name: One-shot timeline media fix v4

on:
  push:
    branches: [dev_branch]
    paths:
      - .github/workflows/one-shot-timeline-media-fix-v3.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev_branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev_branch
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Write regression contract test
        run: |
          cat > test/timeline_media_contract_test.dart <<'DART'
          import 'dart:io';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('audio import accepts video containers but keeps audio track semantics', () {
              final s = File('lib/screens/timeline/timeline_screen.dart').readAsStringSync();
              expect(s, contains('_ClipTrackType.audio => FileType.custom'));
              expect(s, contains("'mp4'"));
              expect(s, contains("'mov'"));
              expect(s, contains("'mkv'"));
              expect(s, contains('allowedExtensions: allowedExtensions'));
              expect(s, contains('trackType: trackType'));
            });

            test('video material keeps embedded audio and visual video semantics', () {
              final s = File('lib/screens/timeline/timeline_screen.dart').readAsStringSync();
              expect(s, contains('_ClipTrackType.video => FileType.video'));
              expect(s, contains('await controller.setVolume(clip.volume.clamp(0.0, 1.0));'));
              expect(s, contains('videoVolume: clip.trackType == _ClipTrackType.video'));
            });

            test('audio and video clip editing keeps play pause available', () {
              final s = File('lib/screens/timeline/timeline_screen.dart').readAsStringSync();
              expect(s, contains('final ValueGetter<bool> isPlaying;'));
              expect(s, contains('final VoidCallback onTogglePlay;'));
              expect(s, contains('widget.onTogglePlay();'));
              expect(s, contains('isPlaying: () => _isPlaying'));
              expect(s, contains('onTogglePlay: _togglePlay'));
            });
          }
          DART

      - name: Verify RED before production changes
        shell: bash
        run: |
          set +e
          flutter test test/timeline_media_contract_test.dart
          status=$?
          set -e
          test "$status" -ne 0
          echo 'RED confirmed.'

      - name: Apply source patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/screens/timeline/timeline_screen.dart')
          s = path.read_text()

          # Audio import accepts both ordinary audio formats and common video
          # containers. The requested trackType remains audio, so a selected
          # movie is persisted/rendered exactly like an audio material: waveform
          # only, no video layer/thumbnail path.
          picker_pattern = re.compile(
              r"(?P<indent>\s*)final fileType = switch \(trackType\) \{\s*"
              r"_ClipTrackType\.audio => FileType\.audio,\s*"
              r"_ClipTrackType\.video => FileType\.video,\s*"
              r"_ClipTrackType\.image => FileType\.image,\s*"
              r"\};\s*"
              r"final result = await FilePicker\.platform\.pickFiles\(type: fileType\);"
          )
          m = picker_pattern.search(s)
          if not m:
              raise SystemExit('audio picker block not found')
          i = m.group('indent')
          replacement = f"""{i}final allowedExtensions = trackType == _ClipTrackType.audio
          ? const <String>[
              'mp3', 'wav', 'm4a', 'aac', 'flac', 'ogg', 'opus', 'aiff', 'wma',
              'mp4', 'm4v', 'mov', 'mkv', 'webm',
            ]
          : null;
      final fileType = switch (trackType) {{
        _ClipTrackType.audio => FileType.custom,
        _ClipTrackType.video => FileType.video,
        _ClipTrackType.image => FileType.image,
      }};
      final result = await FilePicker.platform.pickFiles(
        type: fileType,
        allowedExtensions: allowedExtensions,
      );"""
          s = s[:m.start()] + replacement + s[m.end():]

          # Keep the normal video path untouched: a video imported as video
          # continues to use its image stream and embedded audio/volume.

          # Add play/pause to the clip detail sheet. This makes both split/range
          # cut setup audibly/visually previewable without dismissing the editor.
          callback_pattern = re.compile(
              r"(?P<i>\s*)onDuplicate: \(\) => _duplicateClip\(clip\),\s*"
              r"onChanged: \(\) => setState\(\(\) \{\}\),"
          )
          m = callback_pattern.search(s)
          if not m:
              raise SystemExit('clip detail callback block not found')
          i = m.group('i')
          callback_replacement = (
              f"{i}onDuplicate: () => _duplicateClip(clip),\n"
              f"{i}onChanged: () {{\n"
              f"{i}  setState(() {{}});\n"
              f"{i}  _syncMediaPlayback();\n"
              f"{i}}},\n"
              f"{i}isPlaying: () => _isPlaying,\n"
              f"{i}onTogglePlay: _togglePlay,"
          )
          s = s[:m.start()] + callback_replacement + s[m.end():]

          sheet_at = s.find('class _ClipDetailSheet extends StatefulWidget')
          if sheet_at < 0:
              raise SystemExit('clip detail sheet class not found')
          head, tail = s[:sheet_at], s[sheet_at:]

          if 'final ValueGetter<bool> isPlaying;' not in tail:
              tail, n = re.subn(
                  r"(\s*final VoidCallback onChanged;)",
                  r"\1\n  final ValueGetter<bool> isPlaying;\n  final VoidCallback onTogglePlay;",
                  tail,
                  count=1,
              )
              if n != 1:
                  raise SystemExit('sheet fields insertion failed')

          if 'required this.isPlaying,' not in tail:
              tail, n = re.subn(
                  r"(\s*required this\.onChanged,\s*\n\s*\}\);)",
                  lambda m: m.group(1).replace(
                      'required this.onChanged,',
                      'required this.onChanged,\n    required this.isPlaying,\n    required this.onTogglePlay,',
                  ),
                  tail,
                  count=1,
              )
              if n != 1:
                  raise SystemExit('sheet constructor insertion failed')

          if 'widget.onTogglePlay();' not in tail:
              icon_marker = re.search(
                  r"(?P<i>\s*)IconButton\(\s*icon: const Icon\(Icons\.copy\),",
                  tail,
              )
              if not icon_marker:
                  raise SystemExit('copy icon marker not found')
              i = icon_marker.group('i')
              play = f"""{i}if (_c.trackType == _ClipTrackType.audio ||
          _c.trackType == _ClipTrackType.video)
        IconButton(
          icon: Icon(widget.isPlaying() ? Icons.pause : Icons.play_arrow),
          tooltip: widget.isPlaying() ? l10n.commonPause : l10n.commonPlay,
          onPressed: () {{
            widget.onTogglePlay();
            setState(() {{}});
          }},
        ),
"""
              tail = tail[:icon_marker.start()] + play + tail[icon_marker.start():]

          s = head + tail
          path.write_text(s)
          PY

      - name: Format changed Dart files
        run: dart format lib/screens/timeline/timeline_screen.dart test/timeline_media_contract_test.dart

      - name: Verify GREEN regression test
        run: flutter test test/timeline_media_contract_test.dart

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Diff sanity check
        run: git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-timeline-media-fix.yml
          rm -f .github/workflows/one-shot-timeline-media-fix-v2.yml
          rm -f .github/workflows/one-shot-timeline-media-fix-v3.yml
          git config user.name 'NIARIM automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: support video as audio-only timeline material'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
