name: Hair Fold Production Green

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/hair-fold-production-green.yml'
      - '.github/scripts/complete_screen_space_fold_integration.py'
      - 'lib/models/brush.dart'
      - 'lib/engine/drawing_engine.dart'
      - 'lib/engine/brush_stroke_geometry.dart'
      - 'lib/engine/hair_fold_raster.dart'
      - 'lib/screens/canvas/widgets/brush_extension_settings.dart'
      - 'lib/l10n/**'
      - 'test/brush_extension_settings_test.dart'
      - 'test/services/brush_fold_mode_lifecycle_test.dart'
      - 'test/engine/drawing_engine_wave_fold_contract_test.dart'
      - 'test/engine/brush_texture_cache_test.dart'
      - 'assets/brushes/**'
      - 'pubspec.yaml'
  workflow_dispatch:

concurrency:
  group: hair-fold-production-green
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Hair fold tests
        run: |
          flutter test test/engine/drawing_engine_wave_fold_contract_test.dart test/engine/brush_stroke_geometry_test.dart test/brush_extension_settings_test.dart test/hair_fold_settings_model_test.dart test/models/brush_extension_presets_test.dart test/services/brush_fold_mode_lifecycle_test.dart test/services/brush_service_extension_presets_test.dart --reporter expanded
      - name: Targeted analyze
        run: flutter analyze lib/models/brush.dart lib/engine/brush_stroke_geometry.dart lib/engine/hair_fold_raster.dart lib/engine/drawing_engine.dart test/engine/drawing_engine_wave_fold_contract_test.dart

# production-chain trigger
