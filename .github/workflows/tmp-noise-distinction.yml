name: Temporary Noise Distinction
on:
  push:
    branches: [feature/pixel-filter-blend-refresh]
    paths: [.github/workflows/tmp-noise-distinction.yml]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pixel-filter-blend-refresh
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Implement generic noise and film grain distinction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/services/filter_service.dart'); s=p.read_text()
          s=s.replace("  static const mosaicFilterId = 'Filter0026';", "  static const mosaicFilterId = 'Filter0026';\n  static const genericNoiseFilterId = 'Filter0027';")
          anchor="    FilterDef(id: mosaicFilterId, name: 'モザイク', kind: FilterKind.mosaic, strength: 8),"
          s=s.replace(anchor, anchor+"\n    FilterDef(id: genericNoiseFilterId, name: 'ノイズ', kind: FilterKind.noise, strength: 15),")
          p.write_text(s)

          p=Path('lib/engine/filter_engine_legacy.dart'); s=p.read_text()
          anchor='''  Uint8List applyNoise(\n    Uint8List data,\n    int width,\n    int height,\n    double strength,\n    NoiseType type,\n  ) {'''
          if s.count(anchor)!=1: raise SystemExit('noise anchor mismatch')
          methods='''  /// Film grain is neutral-luminance grain: one random sample is applied\n  /// equally to R/G/B, preserving hue and alpha. A seed makes previews/tests stable.\n  Uint8List applyFilmGrain(\n    Uint8List data,\n    int width,\n    int height,\n    double strength, {\n    int? seed,\n  }) {\n    final result = Uint8List.fromList(data);\n    final rng = seed == null ? math.Random() : math.Random(seed);\n    final s = (strength.clamp(0.0, 1.0) * 255).round();\n    for (int i = 0; i < result.length; i += 4) {\n      if (result[i + 3] == 0) continue;\n      final n = (_gaussianRandom(rng) * s).round().clamp(-s, s);\n      result[i] = (result[i] + n).clamp(0, 255);\n      result[i + 1] = (result[i + 1] + n).clamp(0, 255);\n      result[i + 2] = (result[i + 2] + n).clamp(0, 255);\n    }\n    return result;\n  }\n\n  /// General RGB noise: each colour channel receives an independent Gaussian\n  /// sample. This is intentionally distinct from neutral film grain.\n  Uint8List applyColorNoise(\n    Uint8List data,\n    int width,\n    int height,\n    double strength, {\n    int? seed,\n  }) {\n    final result = Uint8List.fromList(data);\n    final rng = seed == null ? math.Random() : math.Random(seed);\n    final s = (strength.clamp(0.0, 1.0) * 255).round();\n    for (int i = 0; i < result.length; i += 4) {\n      if (result[i + 3] == 0) continue;\n      for (int c = 0; c < 3; c++) {\n        final n = (_gaussianRandom(rng) * s).round().clamp(-s, s);\n        result[i + c] = (result[i + c] + n).clamp(0, 255);\n      }\n    }\n    return result;\n  }\n\n'''
          s=s.replace(anchor, methods+anchor,1)
          old='''    FilterKind.noise => engine.applyNoise(\n      data,\n      width,\n      height,\n      (filter.strength / 100).clamp(0.0, 1.0),\n      NoiseType.gaussian,\n    ),'''
          new='''    FilterKind.noise => filter.id == 'Filter0027'\n        ? engine.applyColorNoise(\n            data,\n            width,\n            height,\n            (filter.strength / 100).clamp(0.0, 1.0),\n          )\n        : engine.applyFilmGrain(\n            data,\n            width,\n            height,\n            (filter.strength / 100).clamp(0.0, 1.0),\n          ),'''
          if s.count(old)!=1: raise SystemExit('dispatch anchor mismatch')
          s=s.replace(old,new,1); p.write_text(s)

          p=Path('lib/screens/canvas/widgets/filter_panel.dart'); s=p.read_text()
          old='''      case FilterKind.noise:\n        return _engine.applyNoise(\n          data,\n          width,\n          height,\n          (filter.strength / 100).clamp(0.0, 1.0),\n          NoiseType.gaussian,\n        );'''
          new='''      case FilterKind.noise:\n        return filter.id == FilterService.genericNoiseFilterId\n            ? _engine.applyColorNoise(\n                data,\n                width,\n                height,\n                (filter.strength / 100).clamp(0.0, 1.0),\n              )\n            : _engine.applyFilmGrain(\n                data,\n                width,\n                height,\n                (filter.strength / 100).clamp(0.0, 1.0),\n              );'''
          if s.count(old)!=1: raise SystemExit('preview anchor mismatch')
          s=s.replace(old,new,1); p.write_text(s)
          PY
          dart format lib/services/filter_service.dart lib/engine/filter_engine_legacy.dart lib/screens/canvas/widgets/filter_panel.dart test/engine/noise_filter_distinction_test.dart
      - name: Verify
        run: |
          flutter test test/engine/noise_filter_distinction_test.dart test/mosaic_filter_test.dart test/engine/pixel_art_engine_test.dart test/engine/pixel_art_filter_engine_test.dart
          flutter analyze lib/services/filter_service.dart lib/engine/filter_engine.dart lib/engine/filter_engine_legacy.dart lib/screens/canvas/widgets/filter_panel.dart test/engine/noise_filter_distinction_test.dart
      - name: Commit and clean temporary workflow
        run: |
          rm .github/workflows/tmp-noise-distinction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/filter_service.dart lib/engine/filter_engine_legacy.dart lib/screens/canvas/widgets/filter_panel.dart test/engine/noise_filter_distinction_test.dart .github/workflows/tmp-noise-distinction.yml
          git commit -m 'feat: separate film grain from generic noise'
          git push origin HEAD:feature/pixel-filter-blend-refresh
