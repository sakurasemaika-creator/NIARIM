name: Stage AdMob report bundle
on:
  push:
    branches: [dev_branch]
    paths: [.github/workflows/stage-admob-report-bundle.yml]
permissions:
  contents: read
  id-token: write
jobs:
  stage:
    if: github.ref == 'refs/heads/dev_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Test and synthesize the report collector
        run: |
          set -euo pipefail
          npm run build
          npx vitest run test/reward-ad-revenue.test.ts
          npx cdk synth --quiet -c googleClientId=ci-dummy -c youtubeApiKey=ci-dummy \
            -c rewardedAdCountryLayerArn=arn:aws:lambda:ap-northeast-1:368601349794:layer:niarim-reward-country-data:1 \
            -c admobReportOAuthSecretArn=arn:aws:secretsmanager:ap-northeast-1:368601349794:secret:niarim/admob/report-oauth-fixtur
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Publish the collector package to the private CDK bucket
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = '368601349794'
          creds="$(aws sts assume-role \
            --role-arn arn:aws:iam::368601349794:role/cdk-hnb659fds-file-publishing-role-368601349794-ap-northeast-1 \
            --role-session-name niarim-admob-report-assets --query Credentials --output json)"
          export AWS_ACCESS_KEY_ID="$(jq -r .AccessKeyId <<<"$creds")"
          export AWS_SECRET_ACCESS_KEY="$(jq -r .SecretAccessKey <<<"$creds")"
          export AWS_SESSION_TOKEN="$(jq -r .SessionToken <<<"$creds")"
          unset creds
          template=cdk.out/NiarimBackendStack.template.json
          report="$(jq -ce '.Resources | with_entries(select(.key | startswith("RewardAdRevenue")))' "$template")"
          key="$(jq -er '.Resources[] | select(.Type == "AWS::Lambda::Function" and .Properties.FunctionName == "niarim-reward-ad-revenue") | .Properties.Code.S3Key' "$template")"
          [[ "$key" =~ ^[a-f0-9]{64}\.zip$ ]]
          source="$(realpath "cdk.out/asset.${key%.zip}")"
          archive="$RUNNER_TEMP/$key"
          (cd "$source" && zip -Xqr "$archive" .)
          aws s3 cp --only-show-errors "$archive" "s3://cdk-hnb659fds-assets-368601349794-ap-northeast-1/$key"
          printf 'REPORT_ASSET %s %s\n' "$key" "$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf 'REPORT_TEMPLATE %s\n' "$report"
