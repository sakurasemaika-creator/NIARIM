name: Custom Automation Targeted Verification

on:
  push:
    branches:
      - dev_branch
    paths:
      - 'lib/models/custom_automation_presets.dart'
      - 'lib/services/custom_automation_service.dart'
      - 'lib/engine/custom_automation_executor.dart'
      - 'lib/engine/custom_automation_filter_runner.dart'
      - 'lib/screens/canvas/widgets/filter_panel.dart'
      - 'lib/widgets/custom_automation_manager_sheet.dart'
      - 'test/custom_automation_presets_test.dart'
      - 'test/custom_automation_service_test.dart'
      - 'test/custom_automation_production_visual_test.dart'
      - 'test/custom_automation_favorite_visual_test.dart'
      - '.github/workflows/custom-automation-targeted.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Custom Automation production and tests
        run: flutter analyze lib/models/custom_automation_presets.dart lib/services/custom_automation_service.dart lib/engine/custom_automation_executor.dart lib/engine/custom_automation_filter_runner.dart lib/screens/canvas/widgets/filter_panel.dart lib/widgets/custom_automation_manager_sheet.dart test/custom_automation_presets_test.dart test/custom_automation_service_test.dart test/custom_automation_production_visual_test.dart test/custom_automation_favorite_visual_test.dart --no-fatal-warnings --no-fatal-infos
      - run: flutter test test/custom_automation_presets_test.dart test/custom_automation_service_test.dart --reporter expanded
      - name: Run production Canvas automation visual flow
        run: flutter test test/custom_automation_production_visual_test.dart --reporter expanded
      - name: Run favorite lifecycle UI and capture every requested state
        run: flutter test test/custom_automation_favorite_visual_test.dart --reporter expanded
      - name: Upload custom automation PNG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-automation-production-evidence
          path: |
            build/visual-reaudit/custom-automation-production
            build/visual-reaudit/custom-automation-favorites
          if-no-files-found: error
          retention-days: 7