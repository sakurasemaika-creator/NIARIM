name: Auto Line Art Control Points v2

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/auto-lineart-control-points-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  land-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 .github/scripts/add_auto_lineart_control_points.py
      - run: dart format lib/engine/auto_lineart_engine.dart lib/models/filter_def.dart lib/screens/canvas/widgets/filter_panel.dart lib/screens/canvas/widgets/auto_lineart_control_overlay.dart test/auto_lineart_filter_test.dart test/auto_lineart_control_overlay_test.dart
      - name: Verify implementation
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos lib
          flutter test test/auto_lineart_filter_test.dart --reporter expanded
          flutter test test/auto_lineart_control_overlay_test.dart --reporter expanded
          flutter test test/filter_engine_aurora_hologram_test.dart --reporter expanded
          flutter test test/ink_pool_filter_test.dart --reporter expanded
          flutter test test/final_remaining_strict_evidence_test.dart --reporter expanded
      - name: Commit and rebase before push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add lib/engine/auto_lineart_engine.dart lib/models/filter_def.dart lib/screens/canvas/widgets/filter_panel.dart lib/screens/canvas/widgets/auto_lineart_control_overlay.dart test/auto_lineart_filter_test.dart test/auto_lineart_control_overlay_test.dart
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit'
          else
            git commit -m 'feat: edit auto lineart preview control points'
            git pull --rebase origin dev_branch
            git push origin HEAD:dev_branch
          fi
