name: Account deletion DynamoDB Local
on:
  push:
    branches: [dev_branch]
    paths:
      - ".github/workflows/account-erasure-dynamodb-local.yml"
      - "backend/src/api/routes/accountDeletion.ts"
      - "backend/src/batch/accountErasure.ts"
      - "backend/src/lib/auth.ts"
      - "backend/src/lib/dynamo.ts"
      - "backend/test/account-erasure-dynamodb-local.test.ts"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  erasure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:2.6.1
        ports:
          - 8000:8000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Verify real transactions in a disposable local table
        env:
          NIARIM_DYNAMODB_LOCAL_TESTS: "1"
          AWS_EC2_METADATA_DISABLED: "true"
        run: npx vitest run test/account-erasure-dynamodb-local.test.ts --reporter verbose
