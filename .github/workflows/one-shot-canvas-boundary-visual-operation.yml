name: One-shot Canvas Boundary Visual Operation

# trigger: real-operation capture audit
on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-canvas-boundary-visual-operation.yml'

permissions:
  contents: read

jobs:
  visual-operation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Create real-operation visual audit test
        run: |
          cat > test/canvas_boundary_visual_operation_test.dart <<'DART'
          import 'dart:io';
          import 'dart:ui' as ui;

          import 'package:flutter/gestures.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/rendering.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:niarim/app.dart';
          import 'package:niarim/app_bootstrap.dart';
          import 'package:niarim/router.dart';
          import 'package:niarim/screens/canvas/widgets/canvas_area.dart';
          import 'package:niarim/services/project_service.dart';
          import 'package:provider/provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import 'helpers/load_app_fonts.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            testWidgets('キャンバス境界を実操作し複数パターンをPNG監査する', (tester) async {
              SharedPreferences.setMockInitialValues({});
              final tempDir = Directory.systemTemp.createTempSync('niarim_canvas_boundary_visual_');
              const pathChannel = MethodChannel('plugins.flutter.io/path_provider');
              TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                  .setMockMethodCallHandler(pathChannel, (call) async => tempDir.path);
              addTearDown(() {
                TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                    .setMockMethodCallHandler(pathChannel, null);
                if (tempDir.existsSync()) tempDir.deleteSync(recursive: true);
              });

              tester.view.physicalSize = const Size(1080, 1920);
              tester.view.devicePixelRatio = 2.5;
              addTearDown(tester.view.resetPhysicalSize);
              addTearDown(tester.view.resetDevicePixelRatio);

              await loadAppFonts(tester);
              final providers = await tester.runAsync(buildAppProviders);
              final boundaryKey = GlobalKey();
              await tester.pumpWidget(
                RepaintBoundary(
                  key: boundaryKey,
                  child: MultiProvider(providers: providers!, child: const NiarimApp()),
                ),
              );
              await tester.pumpAndSettle();

              final context = tester.element(find.byType(MaterialApp).first);
              final ps = context.read<ProjectService>();
              final project = await tester.runAsync(
                () => ps.createProject(
                  name: 'canvas-boundary-visual-audit',
                  fps: 12,
                  durationSeconds: 1,
                  backgroundColor: 0xFFFFFFFF,
                  exportWidth: 640,
                  exportHeight: 480,
                ),
              );
              expect(project, isNotNull);
              appRouter.go('/canvas/${project!.id}');
              for (var i = 0; i < 12; i++) {
                await tester.pump(const Duration(milliseconds: 100));
                await tester.runAsync(
                  () => Future<void>.delayed(const Duration(milliseconds: 80)),
                );
              }
              expect(find.byType(CanvasArea), findsOneWidget);

              final out = Directory('build/canvas-boundary-visual')
                ..createSync(recursive: true);

              Future<void> capture(String name) async {
                await tester.pump(const Duration(milliseconds: 100));
                final exception = tester.takeException();
                expect(exception, isNull, reason: '$name でFlutter例外');
                final boundary = boundaryKey.currentContext!.findRenderObject()
                    as RenderRepaintBoundary;
                final bytes = await tester.runAsync(() async {
                  final image = await boundary.toImage(pixelRatio: 1);
                  final data = await image.toByteData(format: ui.ImageByteFormat.png);
                  image.dispose();
                  return data!.buffer.asUint8List();
                });
                await tester.runAsync(
                  () => File('${out.path}/$name.png').writeAsBytes(bytes),
                );
              }

              Offset canvasCenter() => tester.getCenter(find.byType(CanvasArea));

              Future<void> pinchToMinScale() async {
                final c = canvasCenter();
                final g1 = await tester.startGesture(c + const Offset(-160, 0), pointer: 11);
                final g2 = await tester.startGesture(c + const Offset(160, 0), pointer: 12);
                await tester.pump();
                await g1.moveTo(c + const Offset(-32, 0));
                await g2.moveTo(c + const Offset(32, 0));
                await tester.pump();
                await g1.up();
                await g2.up();
                await tester.pump();
              }

              Future<void> rotateAtMinScale() async {
                final c = canvasCenter();
                final g1 = await tester.startGesture(c + const Offset(-35, 0), pointer: 21);
                final g2 = await tester.startGesture(c + const Offset(35, 0), pointer: 22);
                await tester.pump();
                await g2.moveTo(c + const Offset(0, 35));
                await tester.pump();
                await g1.up();
                await g2.up();
                await tester.pump();
              }

              Future<void> middleDrag(Offset delta, int pointer) async {
                final c = canvasCenter();
                final g = await tester.startGesture(
                  c,
                  pointer: pointer,
                  kind: PointerDeviceKind.mouse,
                  buttons: kMiddleMouseButton,
                );
                await tester.pump();
                await g.moveTo(c + delta);
                await tester.pump();
                await g.up();
                await tester.pump();
              }

              Future<void> zoomIn() async {
                final c = canvasCenter();
                final g1 = await tester.startGesture(c + const Offset(-35, 0), pointer: 31);
                final g2 = await tester.startGesture(c + const Offset(35, 0), pointer: 32);
                await tester.pump();
                await g1.moveTo(c + const Offset(-220, 0));
                await g2.moveTo(c + const Offset(220, 0));
                await tester.pump();
                await g1.up();
                await g2.up();
                await tester.pump();
              }

              await capture('00_initial');
              await pinchToMinScale();
              await capture('01_min_scale_center');
              await rotateAtMinScale();
              await capture('02_min_scale_rotated');
              await middleDrag(const Offset(5000, 0), 41);
              await capture('03_min_scale_drag_far_right');
              await middleDrag(const Offset(-10000, -10000), 42);
              await capture('04_min_scale_drag_far_left_top');
              await middleDrag(const Offset(5000, 10000), 43);
              await capture('05_min_scale_drag_far_right_bottom');
              await zoomIn();
              await middleDrag(const Offset(10000, 10000), 44);
              await capture('06_zoomed_drag_far_right_bottom');
              await middleDrag(const Offset(-20000, -20000), 45);
              await capture('07_zoomed_drag_far_left_top');

              expect(out.listSync().whereType<File>().length, 8);
            });
          }
          DART
          dart format test/canvas_boundary_visual_operation_test.dart
      - name: Run real-operation visual audit
        run: flutter test test/canvas_boundary_visual_operation_test.dart --reporter expanded
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-boundary-visual-operation
          path: build/canvas-boundary-visual/*.png
          if-no-files-found: error
