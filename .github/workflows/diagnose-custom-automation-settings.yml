name: Diagnose Custom Automation Settings

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/diagnose-custom-automation-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - name: Patch only custom automation visual test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/custom_automation_visual_audit_test.dart')
          s=p.read_text()
          s=s.replace("import 'dart:typed_data';\n", '')
          old='''      Future<void> openCanvasSettings() async {\n        final settingsButton = find.byWidgetPredicate(\n          (widget) => widget is CanvasIconButton && widget.icon == Icons.settings,\n          description: 'Canvas production settings button',\n        );\n        expect(settingsButton, findsOneWidget);\n        tester.widget<CanvasIconButton>(settingsButton).onPressed!();\n        await tester.pump(const Duration(milliseconds: 350));\n      }\n'''
          new='''      Future<void> openCanvasSettings() async {\n        stage('settings-helper:find');\n        final settingsButton = find.byWidgetPredicate(\n          (widget) => widget is CanvasIconButton && widget.icon == Icons.settings,\n          description: 'Canvas production settings button',\n        );\n        expect(settingsButton, findsOneWidget);\n        stage('settings-helper:before-onPressed');\n        tester.widget<CanvasIconButton>(settingsButton).onPressed!();\n        stage('settings-helper:after-onPressed');\n        await tester.pump();\n        stage('settings-helper:after-pump');\n      }\n'''
          if old not in s:
              raise SystemExit('openCanvasSettings anchor not found')
          p.write_text(s.replace(old,new))
          PY
          dart format test/custom_automation_visual_audit_test.dart
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run focused visual test
        run: flutter test test/custom_automation_visual_audit_test.dart --reporter expanded
      - name: Commit focused fix
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-custom-automation-settings.yml
          git add test/custom_automation_visual_audit_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: isolate custom automation settings transition'
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
