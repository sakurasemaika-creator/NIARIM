# Default-branch registration ONLY. The real APK build workflow is on dev_branch.
# GitHub Actions requires the manual trigger to be present on the default branch.
# Never build or publish development APKs from main.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: "ビルド種別"
        type: choice
        options:
          - debug
          - release
        default: debug
        required: true
      connect_backend:
        description: "デバッグAPKを開発用AWSバックエンドへ接続する（既定オフ）"
        type: boolean
        default: false
        required: true
      connect_google_auth:
        description: "Googleログインを有効化する（既定オフ）"
        type: boolean
        default: false
        required: true

permissions: {}

jobs:
  main-branch-safety:
    name: Select dev_branch in the Run workflow menu
    runs-on: ubuntu-latest
    steps:
      - name: Do not build from main
        run: |
          echo "::error::NIARIM APK must be built from dev_branch. Choose dev_branch in Run workflow."
          exit 1
