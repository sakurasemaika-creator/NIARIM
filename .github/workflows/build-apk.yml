name: Build APK

# 手動実行のみ。GitHubの画面/アプリの「Actions」タブから「Run workflow」で起動する。
on:
  workflow_dispatch:
    inputs:
      build-type:
        description: "ビルド種別"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub Releaseへapkを添付するために書き込み権限が必要
    # （Actions Storageの上限に達している間の代替配布経路。下記
    # 「APKをGitHub Releaseへ公開」ステップ参照）。
    permissions:
      contents: write
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: JDK 17 セットアップ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Gradle依存関係（~/.gradle/caches・~/.gradle/wrapper）を
          # android/配下のGradleファイルのハッシュ単位でキャッシュする。
          # キャッシュが無いと毎回全依存関係をゼロからダウンロードし直し、
          # ビルドが遅くなる・ネットワーク詰まりでハングしやすくなる原因になる。
          cache: gradle

      - name: Flutter セットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依存関係取得
        run: flutter pub get

      - name: 静的解析
        run: flutter analyze
        continue-on-error: true

      - name: APKビルド（debug）
        if: ${{ inputs.build-type == 'debug' }}
        run: flutter build apk --debug

      - name: APKビルド（release）
        if: ${{ inputs.build-type == 'release' }}
        run: flutter build apk --release

      # Actions Storage（無料枠0.5GB）の上限に達っていると、このステップ
      # だけが失敗してジョブ全体が失敗扱いになる（ビルド自体は成功済み）。
      # そのため下の「GitHub Releaseへ公開」ステップを代替配布経路として
      # 追加し、こちらは失敗してもジョブを止めないようにした。
      - name: APKをArtifactsへアップロード
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: niarim-${{ inputs.build-type }}-apk
          path: build/app/outputs/flutter-apk/app-${{ inputs.build-type }}.apk
          # APK本体は1回あたり100〜160MB超と大きく、Actions Storage（無料枠
          # 0.5GB）をすぐ圧迫する。14日→3日へ短縮した後も、GitHub側の使用量
          # 再計算が6〜12時間おきにしか走らないため蓄積分が反映されにくく、
          # 結局ストレージ上限エラーで書き出しに失敗する事態が発生したため、
          # 1日へさらに短縮した。
          retention-days: 1

      # リリースビルドのR8マッピング/使用状況レポート（難読化後のクラス名
      # から元の名前を復元する際や、将来の同種の不具合調査に備えて保存
      # しておく）。R8有効時（isMinifyEnabled=true）のみ生成される。
      - name: R8マッピング/使用状況レポートをArtifactsへアップロード
        if: ${{ inputs.build-type == 'release' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: niarim-release-r8-reports
          path: |
            build/app/outputs/mapping/release/mapping.txt
            build/app/outputs/mapping/release/seeds.txt
            build/app/outputs/mapping/release/usage.txt
          retention-days: 1
          if-no-files-found: warn

      # Actions Storageの上限とは別枠のGitHub Releaseへapkを添付する代替
      # 配布経路。実機での動作確認用に、Actions Storageの上限に達っていても
      # 確実にapkを取得できるようにするための保険。ビルド種別ごとに
      # 固定タグ（build-debug-latest／build-release-latest）を使い回し、
      # 実行のたびに前回分を上書きする（Release自体をアーティファクト置き場
      # 代わりに使う設計のため、古いRelease履歴を積み上げない）。
      - name: APKをGitHub Releaseへ公開（Actions Storage逼迫時の代替配布）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ inputs.build-type }}-latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "build/app/outputs/flutter-apk/app-${{ inputs.build-type }}.apk" \
            --title "NIARIM ${{ inputs.build-type }} 最新ビルド（実機確認用）" \
            --notes "コミット ${{ github.sha }} からの自動ビルド。Actions Storage逼迫時の代替配布用のため、古いRelease履歴は残さず毎回上書きする。" \
            --prerelease
