name: Build APK

# 手動実行のみ。GitHubの画面/アプリの「Actions」タブから「Run workflow」で起動する。
on:
  workflow_dispatch:
    inputs:
      build-type:
        description: "ビルド種別"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: JDK 17 セットアップ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Gradle依存関係（~/.gradle/caches・~/.gradle/wrapper）を
          # android/配下のGradleファイルのハッシュ単位でキャッシュする。
          # キャッシュが無いと毎回全依存関係をゼロからダウンロードし直し、
          # ビルドが遅くなる・ネットワーク詰まりでハングしやすくなる原因になる。
          cache: gradle

      - name: Flutter セットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依存関係取得
        run: flutter pub get

      - name: 静的解析
        run: flutter analyze
        continue-on-error: true

      - name: APKビルド（debug）
        if: ${{ inputs.build-type == 'debug' }}
        run: flutter build apk --debug

      - name: APKビルド（release）
        if: ${{ inputs.build-type == 'release' }}
        run: flutter build apk --release

      - name: APKをArtifactsへアップロード
        uses: actions/upload-artifact@v4
        with:
          name: miranima-${{ inputs.build-type }}-apk
          path: build/app/outputs/flutter-apk/app-${{ inputs.build-type }}.apk
          retention-days: 14

      # リリースビルドの起動時クラッシュ切り分け用（実機ログが取得できない
      # ため、R8が実際に何を除去したかをmapping/usageファイルから直接
      # 確認する）。R8有効時（isMinifyEnabled=true）のみ生成される。
      - name: R8マッピング/使用状況レポートをArtifactsへアップロード
        if: ${{ inputs.build-type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: miranima-release-r8-reports
          path: |
            build/app/outputs/mapping/release/mapping.txt
            build/app/outputs/mapping/release/seeds.txt
            build/app/outputs/mapping/release/usage.txt
          retention-days: 14
          if-no-files-found: warn

      # Artifactのダウンロードが環境によっては行えないため、ジョブログ
      # からも直接確認できるよう、注目パッケージに関するusage.txtの
      # 該当件数・冒頭数行のみをログへ出力する（診断用、一時的。
      # ログ取得側の切り詰め対策として、パッケージごとの出力を厳しく
      # 制限し、最重要のものを先頭に置く）。
      - name: usage.txtの注目パッケージ該当行を出力
        if: ${{ inputs.build-type == 'release' }}
        run: |
          F=build/app/outputs/mapping/release/usage.txt
          if [ -f "$F" ]; then
            echo "TOTAL_LINES=$(wc -l < "$F")"
            for PKG in \
              "com.miranima.miranima" \
              "com.antonkarpenko" \
              "dev.fluttercommunity.plus.share" \
              "com.mr.flutter.plugin.filepicker" \
              "com.google.android.gms.ads" \
              "com.google.ads" \
              "com.android.billingclient" \
              "GeneratedPluginRegistrant" \
              "androidx.media3" \
              "io.flutter.plugin.common.MethodChannel"; do
              COUNT=$(grep -F -c "$PKG" "$F" || true)
              echo "### $PKG : ${COUNT:-0}件"
              grep -F "$PKG" "$F" | head -8 || true
            done
          else
            echo "usage.txt が見つかりません（R8が実行されていない可能性）"
          fi
