name: Build APK

# 通常は手動実行。今回の実機確認用ビルドを起動するためdev_branchへの
# このworkflowファイル自身のpushでもdebugビルドを1回起動できるようにする。
on:
  workflow_dispatch:
    inputs:
      build-type:
        description: "ビルド種別"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
  push:
    branches:
      - dev_branch
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ inputs.build-type || 'debug' }}
    permissions:
      contents: write
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v6

      - name: JDK 17 セットアップ
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter セットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: 依存関係取得
        run: flutter pub get

      - name: 静的解析
        run: flutter analyze
        continue-on-error: true

      - name: APKビルド（debug）
        if: ${{ env.BUILD_TYPE == 'debug' }}
        run: flutter build apk --debug

      - name: APKビルド（release）
        if: ${{ env.BUILD_TYPE == 'release' }}
        run: flutter build apk --release

      - name: APKをArtifactsへアップロード
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: niarim-${{ env.BUILD_TYPE }}-apk
          path: build/app/outputs/flutter-apk/app-${{ env.BUILD_TYPE }}.apk
          retention-days: 1

      - name: R8マッピング/使用状況レポートをArtifactsへアップロード
        if: ${{ env.BUILD_TYPE == 'release' }}
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: niarim-release-r8-reports
          path: |
            build/app/outputs/mapping/release/mapping.txt
            build/app/outputs/mapping/release/seeds.txt
            build/app/outputs/mapping/release/usage.txt
          retention-days: 1
          if-no-files-found: warn

      - name: APKをGitHub Releaseへ公開（Actions Storage逼迫時の代替配布）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${BUILD_TYPE}-latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "build/app/outputs/flutter-apk/app-${BUILD_TYPE}.apk" \
            --title "NIARIM ${BUILD_TYPE} 最新ビルド（実機確認用）" \
            --notes "コミット ${{ github.sha }} からの自動ビルド。Actions Storage逼迫時の代替配布用のため、古いRelease履歴は残さず毎回上書きする。" \
            --prerelease
