name: Build APK

# Final manual APK verification plus targeted dev_branch validation for the
# approved hair-fold production integration.
on:
  workflow_dispatch:
    inputs:
      build-type:
        description: "ビルド種別"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/build-apk.yml'
      - '.github/scripts/connect_hair_fold_rendering.py'
      - 'lib/engine/brush_stroke_geometry.dart'
      - 'lib/engine/hair_fold_render_resolver.dart'
      - 'lib/engine/wave_hair_fold_geometry.dart'
      - 'test/engine/straight_hair_fold_geometry_test.dart'
      - 'test/engine/wave_hair_fold_geometry_test.dart'
      - 'test/engine/hair_fold_render_resolver_test.dart'
      - 'test/engine/drawing_engine_wave_fold_contract_test.dart'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hair-fold-verify:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev_branch
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Connect production fold renderer
        run: |
          python3 .github/scripts/connect_hair_fold_rendering.py
          dart format lib/engine/drawing_engine.dart lib/engine/hair_fold_render_resolver.dart lib/engine/wave_hair_fold_geometry.dart
      - name: Verify approved hair-fold geometry and production contract
        run: |
          flutter test test/engine/straight_hair_fold_geometry_test.dart --reporter expanded
          flutter test test/engine/wave_hair_fold_geometry_test.dart --reporter expanded
          flutter test test/engine/hair_fold_render_resolver_test.dart --reporter expanded
          flutter test test/engine/drawing_engine_wave_fold_contract_test.dart --reporter expanded
      - name: Analyze production fold path
        run: flutter analyze lib/engine/brush_stroke_geometry.dart lib/engine/hair_fold_render_resolver.dart lib/engine/wave_hair_fold_geometry.dart lib/engine/drawing_engine.dart test/engine/drawing_engine_wave_fold_contract_test.dart --no-fatal-infos --no-fatal-warnings
      - name: Persist verified DrawingEngine integration
        run: |
          if git diff --quiet -- lib/engine/drawing_engine.dart; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/engine/drawing_engine.dart
          git commit -m 'feat: connect straight and wave hair fold rendering'
          git fetch origin dev_branch
          git rebase origin/dev_branch
          git push origin HEAD:dev_branch

  build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: JDK 17 セットアップ
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Flutter セットアップ
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: false
      - name: 依存関係取得
        run: flutter pub get
      - name: 静的解析
        run: flutter analyze --no-fatal-infos
      - name: APKビルド（debug）
        if: ${{ inputs.build-type == 'debug' }}
        run: flutter build apk --debug
      - name: APKビルド（release）
        if: ${{ inputs.build-type == 'release' }}
        run: flutter build apk --release
      - name: APKをArtifactsへアップロード
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        continue-on-error: true
        with:
          name: niarim-${{ inputs.build-type }}-apk
          path: build/app/outputs/flutter-apk/app-${{ inputs.build-type }}.apk
          retention-days: 1
      - name: R8マッピング/使用状況レポートをArtifactsへアップロード
        if: ${{ inputs.build-type == 'release' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        continue-on-error: true
        with:
          name: niarim-release-r8-reports
          path: |
            build/app/outputs/mapping/release/mapping.txt
            build/app/outputs/mapping/release/seeds.txt
            build/app/outputs/mapping/release/usage.txt
          retention-days: 1
          if-no-files-found: warn
      - name: APKをGitHub Releaseへ公開（Actions Storage逼迫時の代替配布）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ inputs.build-type }}-latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "build/app/outputs/flutter-apk/app-${{ inputs.build-type }}.apk" \
            --title "NIARIM ${{ inputs.build-type }} 最新ビルド（実機確認用）" \
            --notes "コミット ${{ github.sha }} からの最終確認ビルド。Actions Storage逼迫時の代替配布用のため、古いRelease履歴は残さず毎回上書きする。" \
            --prerelease
