name: Build APK

# 通常は手動実行。現在のdev_branchを1回ビルドするためpushも一時的に許可する。
on:
  workflow_dispatch:
    inputs:
      build-type:
        description: "ビルド種別"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
  push:
    branches:
      - dev_branch

env:
  BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build-type || 'debug' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: JDK 17 セットアップ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Flutter セットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依存関係取得
        run: flutter pub get

      - name: 静的解析
        run: flutter analyze
        continue-on-error: true

      - name: APKビルド（debug）
        if: ${{ env.BUILD_TYPE == 'debug' }}
        run: flutter build apk --debug

      - name: APKビルド（release）
        if: ${{ env.BUILD_TYPE == 'release' }}
        run: flutter build apk --release

      - name: APKをArtifactsへアップロード
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: niarim-${{ env.BUILD_TYPE }}-apk
          path: build/app/outputs/flutter-apk/app-${{ env.BUILD_TYPE }}.apk
          retention-days: 1

      - name: R8マッピング/使用状況レポートをArtifactsへアップロード
        if: ${{ env.BUILD_TYPE == 'release' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: niarim-release-r8-reports
          path: |
            build/app/outputs/mapping/release/mapping.txt
            build/app/outputs/mapping/release/seeds.txt
            build/app/outputs/mapping/release/usage.txt
          retention-days: 1
          if-no-files-found: warn

      - name: APKをGitHub Releaseへ公開（Actions Storage逼迫時の代替配布）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ env.BUILD_TYPE }}-latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "build/app/outputs/flutter-apk/app-${{ env.BUILD_TYPE }}.apk" \
            --title "NIARIM ${{ env.BUILD_TYPE }} 最新ビルド（実機確認用）" \
            --notes "コミット ${{ github.sha }} からの自動ビルド。Actions Storage逼迫時の代替配布用のため、古いRelease履歴は残さず毎回上書きする。" \
            --prerelease
