name: Build APK

# 手動実行のみ。GitHubの画面/アプリの「Actions」タブから「Run workflow」で起動する。
on:
  workflow_dispatch:
    inputs:
      build-type:
        description: "ビルド種別"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: JDK 17 セットアップ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Gradle依存関係（~/.gradle/caches・~/.gradle/wrapper）を
          # android/配下のGradleファイルのハッシュ単位でキャッシュする。
          # キャッシュが無いと毎回全依存関係をゼロからダウンロードし直し、
          # ビルドが遅くなる・ネットワーク詰まりでハングしやすくなる原因になる。
          cache: gradle

      - name: Flutter セットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依存関係取得
        run: flutter pub get

      - name: 静的解析
        run: flutter analyze
        continue-on-error: true

      - name: APKビルド（debug）
        if: ${{ inputs.build-type == 'debug' }}
        run: flutter build apk --debug

      - name: APKビルド（release）
        if: ${{ inputs.build-type == 'release' }}
        run: flutter build apk --release

      - name: APKをArtifactsへアップロード
        uses: actions/upload-artifact@v4
        with:
          name: miranima-${{ inputs.build-type }}-apk
          path: build/app/outputs/flutter-apk/app-${{ inputs.build-type }}.apk
          retention-days: 14

      # リリースビルドのR8マッピング/使用状況レポート（難読化後のクラス名
      # から元の名前を復元する際や、将来の同種の不具合調査に備えて保存
      # しておく）。R8有効時（isMinifyEnabled=true）のみ生成される。
      - name: R8マッピング/使用状況レポートをArtifactsへアップロード
        if: ${{ inputs.build-type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: miranima-release-r8-reports
          path: |
            build/app/outputs/mapping/release/mapping.txt
            build/app/outputs/mapping/release/seeds.txt
            build/app/outputs/mapping/release/usage.txt
          retention-days: 14
          if-no-files-found: warn
