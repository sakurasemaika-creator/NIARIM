name: One-shot Add Ink Pool Filter

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/scripts/add_ink_pool_filter.py'
      - '.github/workflows/one-shot-add-ink-pool-filter.yml'

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev_branch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply ink pooling implementation
        run: python3 .github/scripts/add_ink_pool_filter.py
      - name: Regenerate localization
        run: flutter gen-l10n
      - name: Format changed Dart files
        run: dart format lib/models/filter_def.dart lib/services/filter_service.dart lib/engine/filter_engine.dart lib/screens/canvas/widgets/filter_panel.dart lib/screens/timeline/timeline_screen.dart test/ink_pool_filter_test.dart
      - name: Analyze production code
        run: flutter analyze lib
      - name: Ink pooling strict tests
        run: flutter test test/ink_pool_filter_test.dart --reporter expanded
      - name: Existing strict regressions
        run: |
          flutter test test/final_remaining_strict_evidence_test.dart --reporter expanded
          flutter test test/time_change_strict_evidence_test.dart --reporter expanded
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit'
          else
            git commit -m 'feat: add ink pooling draw and effect filter'
            git push origin HEAD:dev_branch
          fi
