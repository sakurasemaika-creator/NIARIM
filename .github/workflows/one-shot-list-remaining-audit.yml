name: One-shot Apply Existing Visual Evidence 2

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-list-remaining-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - name: スタンプとトーンをfinal_passへ反映
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('audit-dashboard/feature-audit-manifest.json')
          data=json.loads(path.read_text())
          confirmed={'stamp.all','tone.all'}
          found=set()
          for f in data['features']:
              if f.get('id') in confirmed:
                  found.add(f['id'])
                  for k in ['interaction','output','screenshot','visual','final_pass']:
                      f[k]=True
                  f['evidence_note']='Audit Continuous Queue #24 real-operation artifact visually reviewed; all built-in variants are rendered with distinct intended appearances.'
          missing=confirmed-found
          if missing: raise SystemExit(f'missing ids: {sorted(missing)}')
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print('confirmed',sorted(found))
          print('final_pass',sum(bool(f.get('final_pass')) for f in data['features']))
          PY
      - name: dev_branchへ反映
        run: |
          git config user.name "NIARIM Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit-dashboard/feature-audit-manifest.json
          git commit -m "全7スタンプと全25トーンを最終確認済みに更新"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
