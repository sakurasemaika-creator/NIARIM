name: One-shot Apply Existing Service Evidence

on:
  push:
    branches: [dev_branch]
    paths:
      - '.github/workflows/one-shot-list-remaining-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_branch
          fetch-depth: 0
      - name: 設定永続化とツールバー設定をfinal_passへ反映
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('audit-dashboard/feature-audit-manifest.json')
          data=json.loads(path.read_text())
          confirmed={'settings.persistence','settings.toolbar'}
          found=set()
          for f in data['features']:
              if f.get('id') in confirmed:
                  found.add(f['id'])
                  f['interaction']=True
                  f['output']=True
                  f['final_pass']=True
                  f['evidence_note']='direct_service_coverage_batch10_test.dart verifies write, reset/reorder/visibility/dock behavior and fresh SettingsService round-trip restoration; full suite passed in Audit Continuous Queue #24.'
          missing=confirmed-found
          if missing: raise SystemExit(f'missing ids: {sorted(missing)}')
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print('confirmed',sorted(found))
          eligible=[f for f in data['features'] if not (f.get('device_required') and not f.get('final_pass'))]
          print('final_pass_eligible',sum(bool(f.get('final_pass')) for f in eligible),'/',len(eligible))
          PY
      - name: dev_branchへ反映
        run: |
          git config user.name "NIARIM Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit-dashboard/feature-audit-manifest.json
          git commit -m "設定永続化とツールバー設定を最終確認済みに更新"
          git pull --rebase origin dev_branch
          git push origin HEAD:dev_branch
