name: Community post responsive layout captures

on:
  push:
    branches: [dev_branch]
    paths:
      - 'lib/screens/community/community_post_screen.dart'
      - 'lib/screens/rewards/creator_missions_screen.dart'
      - 'test/creator_mission_claim_ui_policy_test.dart'
      - 'test/visual/community_post_responsive_capture_test.dart'
      - '.github/workflows/community-post-responsive-captures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - name: Analyze community post layout and capture tests
        run: >-
          flutter analyze --no-pub
          lib/screens/community/community_post_screen.dart
          test/visual/community_post_responsive_capture_test.dart
          lib/screens/rewards/creator_missions_screen.dart
          test/creator_mission_claim_ui_policy_test.dart
      - name: Verify community post and creator mission action targets
        run: >-
          flutter test --no-pub --reporter expanded
          test/visual/community_post_responsive_capture_test.dart
          test/creator_mission_claim_ui_policy_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-post-responsive-captures
          path: build/community-post-captures/*.png
          if-no-files-found: warn
          retention-days: 14
