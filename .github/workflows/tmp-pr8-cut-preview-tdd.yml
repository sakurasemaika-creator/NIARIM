name: TMP PR8 Cut Preview TDD

on:
  push:
    branches: [feat/timeline-media-cut-waveform]

permissions:
  contents: write

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/timeline-media-cut-waveform
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Confirm RED before implementation
        shell: bash
        run: |
          set +e
          flutter test test/timeline_clip_split_test.dart --reporter expanded
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED before implementation."
            exit 1
          fi
          echo "Confirmed RED."
      - name: Apply implementation
        run: python .github/scripts/tmp_pr8_cut_preview_patch.py
      - run: dart format lib/utils/timeline_clip_split.dart lib/screens/timeline/timeline_screen.dart test/timeline_clip_split_test.dart
      - name: GREEN focused tests
        run: flutter test test/timeline_clip_split_test.dart test/engine/audio_waveform_service_test.dart --reporter expanded
      - name: Analyze affected production code
        run: flutter analyze --no-fatal-infos lib/utils/timeline_clip_split.dart lib/screens/timeline/timeline_screen.dart lib/engine/audio_waveform_service.dart lib/models/audio_clip.dart lib/engine/niapro_serializer.dart
      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/utils/timeline_clip_split.dart lib/screens/timeline/timeline_screen.dart test/timeline_clip_split_test.dart
          git diff --cached --check
          git commit -m "feat: preview media from cut positions [skip ci]"
          git push origin HEAD:feat/timeline-media-cut-waveform
