name: Canvas color layer compact dock and live adjustment screenshots
on:
  push:
    branches: [dev_branch]
    paths:
      - "test/canvas_color_layer_snap_evidence_capture_test.dart"
      - "test/canvas_edit_menu_walkthrough_test.dart"
      - ".github/workflows/canvas-color-layer-snap-evidence.yml"
      - "lib/screens/canvas/widgets/color_picker_panel.dart"
      - "lib/screens/canvas/widgets/layer_panel.dart"
      - "lib/screens/canvas/canvas_screen.dart"
      - "lib/screens/canvas/widgets/color_adjust_sheet.dart"
      - "lib/screens/canvas/widgets/brush_panel.dart"
      - "lib/screens/canvas/widgets/desktop_dock_content_viewport.dart"
      - "lib/utils/desktop_dock_column_fit.dart"
      - "lib/widgets/docked_panel_scope.dart"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze capture and modified UI components
        run: flutter analyze --no-fatal-infos test/canvas_color_layer_snap_evidence_capture_test.dart lib/screens/canvas/widgets/color_picker_panel.dart lib/screens/canvas/widgets/layer_panel.dart lib/screens/canvas/widgets/color_adjust_sheet.dart lib/screens/canvas/canvas_screen.dart lib/widgets/docked_panel_scope.dart
      - name: Capture real Flutter widgets at desktop resolution
        run: flutter test test/canvas_color_layer_snap_evidence_capture_test.dart --reporter expanded
      - name: Capture actual bottom color-adjust controls and live pixel apply
        run: |
          flutter test test/canvas_edit_menu_walkthrough_test.dart --plain-name "色調調整 opens without errors" --reporter expanded
          flutter test test/canvas_edit_menu_walkthrough_test.dart --plain-name "color adjustment previews live on canvas; cancel restores, apply saves" --reporter expanded
      - name: Upload screenshot PNGs even if test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niarim-color-layer-snap-screenshots
          path: |
            build/canvas-color-layer-snap-evidence/*.png
            build/canvas-edit-menu/*.png
          if-no-files-found: warn
          retention-days: 30
