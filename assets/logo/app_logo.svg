<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="NIARIM monogram">
<g transform="translate(-48.0000 -48.0000) scale(1.080000)">
  <g transform="translate(600 600) scale(1.85) translate(-600 -600)">
  <g fill="#4A4636" fill-rule="evenodd"> 
 
    <defs> 
      <mask id="penClearance" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="1200"> 
        <rect width="1200" height="1200" fill="white"/> 
 
        <!-- 斜めのペン本体：先端側の境界を1本の直線に修正 --> 
        <path 
          d="M 521 377 
             L 456 411 
             L 693 845 
             L 758.21301666 809.38828353 
             Z" 
          fill="black" 
          stroke="black" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
        /> 
 
        <!-- 斜めのペン中央：楕円形ボタンの抜き --> 
        <ellipse 
          cx="690.5" 
          cy="763.5" 
          rx="31" 
          ry="17" 
          transform="rotate(61.4 690.5 763.5)" 
          fill="black" 
        /> 
 
        <!-- 
          ペン上部：
          元の底辺はそのまま。
          左右の辺の角度と幅を維持したまま長さだけ短縮。
          上辺と、それを直径とする半円を一体で下方向へ移動。
        --> 
        <path 
          d="M 447 394 
             L 513 360 
             L 495.64 328.63 
             A 36.91205765 36.91205765 0 0 0 430.01 362.44
             Z" 
          fill="black" 
          stroke="black" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
        /> 
 
        <!-- 
          右下パーツ：先端の四角形部分。
          本体側の辺を中央に角のない1本の直線に変更。
          本体側の境界線と平行になるよう調整。
        --> 
        <path 
          d="M 765.86070378 823.32837144
             L 700.62053982 858.95491259
             L 759.37 889.78
             Z" 
          fill="black" 
          stroke="black" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
        /> 
 
        <!-- 右下パーツ：細い突起部分 --> 
        <path 
          d="M 747 881 
             L 757 897 
             L 767 893 
             L 761 880 
             Z" 
          fill="black" 
          stroke="black" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
        /> 
      </mask> 

      <!--
        ペン本体専用のボタンくり抜きマスク。
        白部分＝ペン本体を表示、
        黒い楕円部分＝ペン本体を透明化。
      -->
      <mask id="buttonClearance" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="1200">
        <rect width="1200" height="1200" fill="white"/>
        <ellipse 
          cx="690.5" 
          cy="763.5" 
          rx="31" 
          ry="17" 
          transform="rotate(61.4 690.5 763.5)" 
          fill="black"
        />
      </mask>
    </defs> 
 
    <g mask="url(#penClearance)"> 
 
      <!-- 左側の縦長フレーム：変更なし --> 
      <path 
        d="M 416 377 H 496 Q 513 377 513 394 V 806 Q 513 823 496 823 H 416 Q 399 823 399 806 V 394 Q 399 377 416 377 Z M 434.000000 431.000000 H 470.000000 Q 476.000000 431.000000 476.000000 437.000000 V 467.000000 Q 476.000000 473.000000 470.000000 473.000000 H 440.000000 Q 434.000000 473.000000 434.000000 467.000000 V 437.000000 Q 434.000000 431.000000 440.000000 431.000000 Z M 434.000000 505.000000 H 470.000000 Q 476.000000 505.000000 476.000000 511.000000 V 541.000000 Q 476.000000 547.000000 470.000000 547.000000 H 440.000000 Q 434.000000 547.000000 434.000000 541.000000 V 511.000000 Q 434.000000 505.000000 440.000000 505.000000 Z M 434.000000 579.000000 H 470.000000 Q 476.000000 579.000000 476.000000 585.000000 V 615.000000 Q 476.000000 621.000000 470.000000 621.000000 H 440.000000 Q 434.000000 621.000000 434.000000 615.000000 V 585.000000 Q 434.000000 579.000000 440.000000 579.000000 Z M 434.000000 653.000000 H 470.000000 Q 476.000000 653.000000 476.000000 659.000000 V 689.000000 Q 476.000000 695.000000 470.000000 695.000000 H 440.000000 Q 434.000000 695.000000 434.000000 689.000000 V 659.000000 Q 434.000000 653.000000 440.000000 653.000000 Z M 434.000000 727.000000 H 470.000000 Q 476.000000 727.000000 476.000000 733.000000 V 763.000000 Q 476.000000 769.000000 470.000000 769.000000 H 440.000000 Q 434.000000 769.000000 434.000000 763.000000 V 733.000000 Q 434.000000 727.000000 440.000000 727.000000 Z" 
      /> 
 
      <!-- 右側の縦長フレーム：変更なし --> 
      <path 
        d="M 705 377 H 784 Q 801 377 801 394 V 806 Q 801 823 784 823 H 705 Q 688 823 688 806 V 394 Q 688 377 705 377 Z M 722.000000 431.000000 H 758.000000 Q 764.000000 431.000000 764.000000 437.000000 V 467.000000 Q 764.000000 473.000000 758.000000 473.000000 H 728.000000 Q 722.000000 473.000000 722.000000 467.000000 V 437.000000 Q 722.000000 431.000000 728.000000 431.000000 Z M 722.000000 505.000000 H 758.000000 Q 764.000000 505.000000 764.000000 511.000000 V 541.000000 Q 764.000000 547.000000 758.000000 547.000000 H 728.000000 Q 722.000000 547.000000 722.000000 541.000000 V 511.000000 Q 722.000000 505.000000 728.000000 505.000000 Z M 722.000000 579.000000 H 758.000000 Q 764.000000 579.000000 764.000000 585.000000 V 615.000000 Q 764.000000 621.000000 758.000000 621.000000 H 728.000000 Q 722.000000 621.000000 722.000000 615.000000 V 585.000000 Q 722.000000 579.000000 728.000000 579.000000 Z M 722.000000 653.000000 H 758.000000 Q 764.000000 653.000000 764.000000 659.000000 V 689.000000 Q 764.000000 695.000000 758.000000 695.000000 H 728.000000 Q 722.000000 695.000000 722.000000 689.000000 V 659.000000 Q 722.000000 653.000000 728.000000 653.000000 Z M 722.000000 727.000000 H 758.000000 Q 764.000000 727.000000 764.000000 733.000000 V 763.000000 Q 764.000000 769.000000 758.000000 769.000000 H 728.000000 Q 722.000000 769.000000 722.000000 763.000000 V 733.000000 Q 722.000000 727.000000 728.000000 727.000000 Z" 
      /> 
 
    </g> 
 
    <!--
      斜めのペン本体：
      ボタン位置だけ透明にくり抜く。
      それ以外の形状・座標は変更なし。
    -->
    <path 
      d="M 521 377 
         L 456 411 
         L 693 845 
         L 758.21301666 809.38828353 
         Z" 
      mask="url(#buttonClearance)"
    /> 
 
    <!--
      ボタンはここでは描画しない。
      buttonClearance によってペン本体そのものが透明にくり抜かれている。
    -->

    <!-- 
      ペン上部：
      四角形を短縮し、
      底辺と完全に平行な上辺＋正確な半円を連動して移動。
    --> 
    <path 
      d="M 447 394 
         L 513 360 
         L 495.64 328.63 
         A 36.91205765 36.91205765 0 0 0 430.01 362.44
         Z" 
    /> 
 
    <!-- 
      右下パーツ：先端の四角形部分。
      本体との境界を中央に角のない直線に変更。
      ペン本体側の境界と平行、かつペンの長手方向に垂直。
    --> 
    <path 
      d="M 765.86070378 823.32837144
         L 700.62053982 858.95491259
         L 759.37 889.78
         Z" 
    /> 
 
    <!-- 右下パーツ：細い突起部分 --> 
    <path 
      d="M 747 881 
         L 757 897 
         L 767 893 
         L 761 880 
         Z" 
    /> 
 
  </g> 

  </g>
</g>
</svg>